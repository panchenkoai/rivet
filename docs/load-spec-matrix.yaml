# Load-spec matrix (ADR-0034) — `load.partition` form × granularity × warehouse target.
# Columns are the ExportTarget variants: `bigquery` and `snowflake` load; `duckdb` and
# `clickhouse` are not load targets and carry `na` on every row. Cell = { test } | { na } | { gap }.
#
# What this guards: rivet writes the warehouse partition expression from the column type
# the metabase recorded (D3), so every (type × granularity) pair has one expression, one
# refusal, or one warehouse-specific mapping — and each is a cell here. The BigQuery
# `test:` cells for the forms are LIVE (a run + load per cell on the test project, the
# metadata read back through `tables.get`); the Snowflake ones are SQL-text proofs, since
# Snowflake is not live-run from this stand. Validation rows are target-agnostic config
# checks and cite the same test in both load columns.

engines: [bigquery, snowflake, duckdb, clickhouse]

scenarios:
  - id: timestamp_hour
    what: "a TIMESTAMP column by hour → TIMESTAMP_TRUNC(c, HOUR); Snowflake a leading DATE_TRUNC('HOUR', c) clustering expression"
    bigquery:   { test: bigquery_timestamp_partitions_land_at_every_granularity }
    snowflake:  { test: snowflake_partition_is_a_leading_date_trunc_and_refuses_bigquery_only_forms }
    duckdb:     { na: "not a load target" }
    clickhouse: { na: "not a load target" }

  - id: timestamp_day
    what: "a TIMESTAMP column by day → TIMESTAMP_TRUNC(c, DAY) (BigQuery renders it DATE(c); compared as metadata, not text)"
