# Load-mode behavior matrix — how `rivet load` writes to the warehouse per
# export mode. Columns are the three load modes (LoadMode in src/load/plan.rs),
# NOT source engines. Cell = { test } | { na } | { gap }.
#
# The bug class this guards: each mode has a DIFFERENT write contract, and mixing
# them silently loses or duplicates data. The state DB (ledger) is the source of
# truth for what is loaded; the bucket listing is a fallback; cleanup is safe in
# every mode. This matrix codifies + guards the four real data bugs found here:
#   1. incremental + cleanup_source OVERWROTE and lost prior deltas (source 200
#      rows → warehouse 100). Fixed: incremental APPENDs + a cursor-ordered view.
#   2. full without cleanup loaded every accumulated snapshot → duplicate rows.
#      Fixed: full loads the LATEST run only.
#   3. full's ledger-skip defeated its self-heal guarantee — a drifted target on
#      re-load was skipped, never repaired. Fixed: full re-materializes ALWAYS.
#   4. a FAILED load marked its runs loaded → the next load skipped their
#      never-loaded data. Fixed: only a successful load marks runs loaded.
#
# Coverage note: all three modes are live-verified end-to-end on the devbox —
# full (warehouse_cell_smoke_batch_mysql), cdc (cdc_backfill_snapshot_{mysql,pg,mongo}), and
# incremental (warehouse_cell_incremental_dedup_mysql: no-loss + cursor dedup + never-tombstones
# + staging wiped), backed by the dedup-view + ledger unit tests. `na` marks a
# contract that mode does not have (full has no dedup view; incremental/cdc never
# OVERWRITE, so never truncate).

engines: [full, incremental, cdc]

scenarios:
  - id: overwrite_latest_snapshot_only
    what: "full OVERWRITEs with the LATEST run only — loading every accumulated snapshot would duplicate rows"
    full:        { test: latest_full_picks_the_newest_snapshot_not_all }
    incremental: { na: "incremental APPENDs every new delta — it never overwrites" }
    cdc:         { na: "cdc APPENDs every new run to the change log — it never overwrites" }

  - id: full_self_heals_on_reload
    what: "full re-materializes the snapshot on EVERY load (never ledger-skipped) — a re-load repairs a drifted target and stays resilient to hidden in-place source updates"
    full:        { test: latest_full_re_materializes_even_when_the_latest_is_already_loaded }
    incremental: { na: "append is additive — a re-load cannot self-heal by overwrite; correctness comes from the change log, not re-materialization" }
    cdc:         { na: "append is additive — the change log + view are the source of truth, not a re-overwrite" }

  - id: empty_staging_never_truncates
    what: "an empty staging (cleaned, no fresh extract) is a no-op — full must NOT truncate the target to empty"
    full:        { test: latest_full_of_no_staged_runs_is_empty_so_the_caller_no_ops_without_truncating }
    incremental: { na: "append never issues a truncate, so an empty delta set is inherently a no-op" }
    cdc:         { na: "append never issues a truncate, so an empty run set is inherently a no-op" }

  - id: append_selects_only_unloaded_runs
    what: "append modes load ONLY the runs the ledger has not yet loaded — resolved from manifest parts, with the bucket listing as fallback"
    full:        { na: "full selects the single latest run, not an unloaded set" }
    incremental: { test: select_load_keys_picks_only_the_new_runs_parts }
    cdc:         { test: select_load_keys_picks_only_the_new_runs_parts }

  - id: current_state_dedup_view
    what: "append modes expose a deduplicated current-state view — latest row per primary key"
    full:        { na: "the full table IS current state — no view is needed" }
    incremental: { test: inc_dedup_view_orders_by_cursor_and_never_tombstones_on_every_dialect }
    cdc:         { test: snapshot_backfill_rows_are_live_and_rank_oldest_on_every_dialect }

  - id: dedup_ordering_key
    what: "which key orders latest-per-PK: incremental by cursor_column, cdc by the (__pos,__seq) log position"
    full:        { na: "no view, no ordering key" }
    incremental: { test: inc_dedup_view_quotes_identifiers_per_dialect }
    cdc:         { test: every_warehouse_and_engine_orders_by_seq_last_and_drops_meta_columns }

  - id: soft_delete_tombstone
    what: "a delete: cdc keeps a flagged tombstone (__is_deleted=true); incremental cannot observe deletes and never tombstones"
    full:        { na: "a full snapshot mirrors the source — a deleted row is simply absent next run" }
    incremental: { test: inc_dedup_view_orders_by_cursor_and_never_tombstones_on_every_dialect }
    cdc:         { test: warehouse_cell_mongo_cdc_delete_flag_bigquery }

  - id: ledger_skips_already_loaded_runs
    what: "the state DB records each load and skips extraction runs already loaded into a target — the incremental step is DB-driven, not file-driven"
    full:        { na: "full re-materializes regardless of the ledger — it is audit-only for full, never a skip" }
    incremental: { test: store_load_records_run_and_marks_source_runs }
    cdc:         { test: store_load_records_run_and_marks_source_runs }

  - id: failed_load_stays_retryable
    what: "a failed load records `failed` and marks NO runs loaded, so the next load retries them (no silent data loss)"
    full:        { na: "full re-materializes every load; a failed full simply re-overwrites next time" }
    incremental: { test: failed_load_leaves_its_source_runs_retryable }
    cdc:         { test: failed_load_leaves_its_source_runs_retryable }

  - id: initial_snapshot_backfill
    what: "cdc.initial: snapshot backfills preexisting rows into the change log, then streams — the view keeps every backfilled row live"
    full:        { na: "full IS a snapshot — no separate backfill step" }
    incremental: { na: "incremental has no snapshot phase — the first run exports all rows above the empty cursor" }
    cdc:         { test: warehouse_cell_cdc_backfill_snapshot_mysql }

  - id: snapshot_completion_survives_cleanup
    what: "snapshot completion is recorded in the state DB (not a bucket marker), so cleanup can wipe the bucket without triggering a full re-snapshot"
    full:        { na: "full has no persistent snapshot anchor to protect" }
    incremental: { na: "incremental resumes from its cursor in the state DB, not a snapshot marker" }
    cdc:         { test: snapshot_plan_all_done_snapshots_nothing_but_keeps_resume_evidence }

  - id: multiplex_tables_one_plan_per_table
    what: "a multiplex `tables:` export (N source tables through ONE stream) builds one LoadPlan per TABLE — own warehouse table, own `<prefix>/<table>/` sub-prefix — not one per export"
    full:        { na: "`tables:` is refused at config-load outside `mode: cdc` — a batch export is always one unit" }
    incremental: { na: "`tables:` is refused at config-load outside `mode: cdc` — an incremental export is always one unit" }
    cdc:         { test: build_plans_fans_a_multiplex_tables_export_out_to_one_plan_per_table }

  - id: adopt_full_load_table
    what: "the first delta over a `<table>` a whole-table load created renames it to `<table>__changes` (its rows, partitioning and clustering kept, meta columns added); a table rivet did not load, a column mismatch or an existing changelog beside it is refused untouched (ADR-0033 MT7)"
    full:        { test: a_full_load_overwrites_its_own_table_and_refuses_the_rest }
    incremental: { test: a_full_load_table_becomes_the_changelog_before_the_first_append }
    cdc:         { test: a_full_load_table_is_adopted_on_the_cdc_path_too }

  - id: cleanup_source_safe_end_to_end
    what: "cleanup_source: true wipes the staged Parquet after a recorded load without losing data — proven live end to end"
    full:        { test: warehouse_cell_smoke_batch_mysql }
    incremental: { test: warehouse_cell_incremental_dedup_mysql }
    cdc:         { test: warehouse_cell_cdc_backfill_snapshot_mysql }

  - id: per_run_spec_pin
    what: "a load is typed from the spec of the RUN it consumes (export_load_spec_run, state v28), not the by-name row: on a state DB shared by two configs whose exports share a name, the by-name row is last-writer-wins and the other config's run retyped this table between the run and its load (measured: a `_id` key on a PostgreSQL `users`). `pin_plan_to_its_run` runs inside the per-table closure for every mode; a run older than v28 or an unlistable prefix keeps the by-name spec and says so."
    full:        { test: a_load_is_typed_from_its_own_run_not_from_the_last_writer_of_its_name }
    incremental: { na: "shared seam: the pin runs in the per-table closure before the mode dispatch; the per-run row itself is pinned by each_run_keeps_its_own_spec_while_the_by_name_row_follows_the_last_writer" }
    cdc:         { na: "shared seam (same closure); the init-recorded key a run cannot see is borrowed by the_run_spec_borrows_an_init_recorded_key_but_never_another_runs" }

  - id: per_table_load_override
    what: "a multiplex `tables:` stream's `load:` takes `tables: { <table>: {…} }` — each captured table's block layers over the export's, over the top-level `load:`, so six tables through one stream no longer share one partition column and one key"
    full:        { na: "a batch export has one table; its per-table block IS the export's `load:`" }
    incremental: { na: "one table per export, as full" }
    cdc:         { test: a_multiplex_export_takes_per_table_load_overrides }

  - id: load_lease
    what: "ONE `rivet load` per warehouse table at a time: two concurrent loads both read the ledger before either wrote it and appended the same runs twice. The lease is a Postgres session advisory lock on a shared state, an `flock` sidecar beside a SQLite state — released by the OS when the holder dies, no clock, no cleanup command. Taken in `execute_load` before `prepare_load`, so every mode passes through it."
    full:        { test: a_second_load_of_the_same_table_waits_for_the_first_to_release }
    incremental: { na: "shared seam (execute_load), one lease call for every mode" }
    cdc:         { na: "shared seam (execute_load)" }

  - id: by_name_plan_fit_deferred_until_pin
    what: "the plan `rivet load` builds from the BY-NAME spec is provisional: on a shared state DB that row may be another config's same-named export (measured live: MySQL's `users` load refused `pk: id` against Mongo's `_id` spec before the pin could run). `pk` / `cluster_by` / `partition` column existence is DEFERRED at plan time (`SpecFit::Deferred`), checked strictly by the pin's rebuild from the run's own spec, and by `check_spec_fit` on every path that keeps the by-name plan."
    full:        { test: a_by_name_plan_defers_its_key_fit_to_the_pin_and_still_owes_it }
    incremental: { na: "shared seam: plan_loads builds every mode's plan with the same fit" }
    cdc:         { na: "shared seam (plan_loads / pin_plan_to_its_run)" }

  - id: base_and_buffer_layout
    what: "a `backfill:` stream's baseline OVERWRITES a physical base (`<table>`: source columns + `__is_deleted` written as data by the leg — BigQuery fills an absent column with NULL, never its DEFAULT, measured) and its changes APPEND into a partition-less buffer `<table>__changes`; no view, no MT7 adoption, no re-baseline refusal (a new baseline replaces the base). Live: run → load → base TABLE of 5 rows, no NULL flag; the changes land in the buffer while the base waits"
    full:        { na: "a batch export has no baseline leg / change stream" }
    incremental: { test: a_generated_config_drives_run_load_compact_into_the_warehouse_postgres }
    cdc:         { test: base_and_buffer_cycle_run_load_compact_keeps_deletes_as_flags }

  - id: compact_merges_the_buffer_and_drops_it
    what: "`rivet compact`: one MERGE per table (per ≤4,000-partition window) upserts the latest change per key into the base, flags a tombstone instead of deleting, un-flags a re-insert, then DROPs the buffer; both MERGE sides are bounded by the same constants so the base prunes; a crash between MERGE and DROP re-merges idempotently. Live: 8 rows / 7 live / 1 flagged with its last values, buffer gone, second compact a no-op, crash-and-retry merges once"
    full:        { na: "nothing to compact" }
    incremental: { test: a_generated_config_drives_run_load_compact_into_the_warehouse_postgres }
    cdc:         { test: compact_merge_flags_deletes_and_prunes_both_sides_by_constants }

  - id: whole_table_pass_over_a_buffered_base_is_refused
    what: "under `layout: base_buffer` a whole-table pass (a CDC re-baseline, an incremental run with no cursor to resume from) REPLACES the base — and a buffer still holding rows from before it would, at the next `rivet compact`, merge OLDER values over the new base (a re-snapshot after a gap restored exactly the pre-gap rows it existed to fix). Refused by name when `<table>__changes` holds rows, naming the two recoveries (compact first if the buffer belongs to the current base, drop it if the pass re-snapshots past them); nothing consumed. The `incremental` cell is the same predicate the CDC leg calls — one function, two callers."
    full:        { na: "a full load has no buffer" }
    incremental: { test: a_whole_table_pass_over_a_buffered_base_is_refused_until_the_buffer_is_dealt_with }
    cdc:         { test: a_whole_table_pass_over_a_buffered_base_is_refused_until_the_buffer_is_dealt_with }

  - id: pin_listing_consistency
    what: "the pin lists the prefix and types the plan from the newest run WITH a spec; `prepare_load` lists again — a run that finishes between the two listings would be loaded with the older spec's columns. A run in the load's listing that finished AFTER the pinned run is refused for this cycle (`late_runs_refusal`, pure) and named; the next load pins it."
    full:        { test: a_run_that_finished_after_the_pinned_one_is_refused_this_cycle }
    incremental: { na: "shared seam: the check runs in prepare_load on the selected runs of every mode" }
    cdc:         { na: "shared seam (prepare_load)" }
