# Cross config × database coverage matrix — cross-cutting config options /
# behaviours, is each proven per engine? Same shape + drift-guard as the other
# matrices. Cell = { test } | { gap } | { na }.
#
# Many gaps here are honest holes (cloud destinations, codec parity, csv, tuning
# profile) on the non-PostgreSQL engines — PG has the deepest coverage, the others
# ride the shared matrix/differential harness for the happy path. The ratchet makes
# the holes visible and un-growable; fill them by writing the per-engine test.

engines: [postgres, mysql, mssql, mongo, oracle]

scenarios:
  # ── destinations ──────────────────────────────────────────────────────────
  - id: dest_local
    what: "destination: local — one/many parquet parts with all rows"
    postgres: { test: local_destination_produces_one_parquet_with_all_rows }
    mysql:    { test: mysql_full_mode_repeated_run_accumulates_manifest_entries }
    mssql:    { test: mssql_full_mode_repeated_run_accumulates_manifest_entries }
    mongo:    { test: mongo_batch_keyset_no_loss_or_dup }
    oracle:   { test: every_seeded_oracle_table_exports_every_row }

  - id: dest_gcs
    what: "destination: gcs — fake-GCS round-trip, all rows"
    postgres: { test: gcs_fake_destination_produces_one_parquet_with_all_rows }
    mysql:    { test: stand_dest_gcs_mysql }
    mssql:    { test: stand_dest_gcs_mssql }
    mongo:    { test: stand_dest_gcs_mongo }
    oracle:   { test: stand_dest_gcs_oracle }

  - id: dest_s3
    what: "destination: s3 — MinIO round-trip, all rows"
    postgres: { test: s3_minio_destination_produces_one_parquet_with_all_rows }
    mysql:    { test: stand_dest_s3_mysql }
    mssql:    { test: stand_dest_s3_mssql }
    mongo:    { test: stand_dest_s3_mongo }
    oracle:   { test: stand_dest_s3_oracle }

  # ── format / compression ──────────────────────────────────────────────────
  - id: format_parquet
    what: "format: parquet — the default, exercised by every matrix export"
    postgres: { test: pg_golden_full_type_matrix_schema_coverage }
    mysql:    { test: mysql_golden_full_type_matrix_schema_coverage }
    mssql:    { test: duckdb_validates_mssql_type_matrix_parquet }
    mongo:    { test: mongo_batch_keyset_no_loss_or_dup }
    oracle:   { test: oracle_full_export_matches_the_databases_own_rendering_for_every_type }

  - id: format_csv
    what: "format: csv — decimal-as-text, unicode/newline escaping"
    postgres: { test: postgres_type_matrix_csv_decimal_and_row_count }
    mysql:    { test: mysql_type_matrix_csv_decimal_text_preserved }
    mssql:    { test: stand_format_csv_mssql }
    mongo:    { test: stand_format_csv_mongo }
    oracle:   { test: stand_format_csv_oracle }

  - id: compression_codecs
    what: "compression: full codec matrix (zstd/snappy/gzip/none) reads back correctly"
    postgres: { test: duckdb_validates_postgres_parquet_compression_codecs }
    mysql:    { test: stand_compression_codecs_mysql }
    mssql:    { test: stand_compression_codecs_mssql }
    mongo:    { test: stand_compression_codecs_mongo }
    oracle:   { test: stand_compression_codecs_oracle }

  # ── enrichment / verification / tuning ────────────────────────────────────
  - id: meta_columns
    what: "meta_columns — _rivet_exported_at + _rivet_row_hash land in the output"
    postgres: { test: stand_meta_columns_postgres }
    mysql:    { na: "engine-agnostic post-read enrichment (src/enrich.rs); one e2e test covers every engine" }
    mssql:    { na: "engine-agnostic — see the postgres cell" }
    mongo:    { na: "engine-agnostic — see the postgres cell" }
    oracle:   { na: "engine-agnostic — see the postgres cell" }

  - id: reconcile
    what: "--reconcile — destination count matches source (exit 0), mismatch exits nonzero"
    postgres: { test: reconcile_all_match_exits_zero_with_pretty_output }
    mysql:    { test: mysql_reconcile_all_match_exits_zero_with_pretty_output }
    mssql:    { test: mssql_reconcile_all_match_exits_zero_with_pretty_output }
    mongo:    { test: mongo_run_reconcile_matches_source_count }
    oracle:   { test: reconcile_counts_the_source_on_both_paths }

  - id: parallel_n
    what: "parallel: N — concurrent workers, no loss or dup"
    postgres: { test: task_9_2_chunked_parallelism_exports_all_rows_without_duplicates }
    mysql:    { test: mysql_parallel_chunked_crash_after_chunk_complete_resume_finishes_with_no_duplicates }
    mssql:    { test: mssql_parallel_chunked_crash_after_chunk_complete_resume_finishes_with_no_duplicates }
    mongo:    { test: mongo_batch_parallel_integer_id_no_loss_or_dup }
    oracle:   { test: parallel_keyset_reads_every_row_once }

  - id: environment_tuning_profile
    what: "source.environment → tuning profile default (local → fast)"
    postgres: { test: source_environment_local_runs_fast_profile_by_default }
    mysql:    { test: stand_environment_profile_mysql }
    mssql:    { test: stand_environment_profile_mssql }
    mongo:    { na: "the profile-DEFAULT label this scenario checks is computed engine-agnostically in plan::build (config.source.environment.map(default_profile), src/plan/build.rs:49-59) BEFORE any engine dispatch, and carried into RunSummary — a shared SourceConfig→summary path, identical for Mongo (same as the meta_columns `engine-agnostic — see postgres` na's). (The SQL-only Log-Flush-Waits RUNTIME governor is a different mechanism and not what this row tests.)" }
    oracle:   { na: "the profile-DEFAULT label is computed engine-agnostically in plan::build before engine dispatch — see the mongo cell" }

  - id: cross_db_parity
    what: "same seed on two engines → equal row count + equal PK id-set + identical empty-export behaviour"
    postgres: { test: pg_and_mysql_full_exports_agree_on_row_count_and_id_set }
    mysql:    { test: pg_and_mysql_chunked_exports_agree_on_row_count_and_id_set }
    mssql:    { test: pg_and_mssql_full_exports_agree_on_row_count_and_id_set }
    mongo:    { na: "Mongo's JSON-blob model has no row-for-row SQL parity to compare against" }
    oracle:   { test: oracle_and_mysql_exports_agree_on_every_row }

  # ── entry points ──────────────────────────────────────────────────────────
  - id: partition_by_every_entry_point
    what: "`rivet apply <config>` (waves, `--pool`, `--parallel-export-processes`) delivers the per-partition tree `rivet run` delivers — every in-process entry point takes its exports from pipeline::run_set::RunSet; before, apply wrote the whole table under a directory literally named `{partition}`, exit 0"
    postgres: { test: apply_config_partitions_like_run_postgres }
    mysql:    { test: apply_forms_partition_like_run_mysql }
    mssql:    { test: apply_forms_partition_like_run_mssql }
    mongo:    { na: "partition_by is refused for a MongoDB source at config load (the bucket probes are SQL)" }
    oracle:   { test: apply_forms_partition_like_run_oracle }

  - id: sealed_plan_of_partition_by_refused
    what: "`rivet apply <plan.json>` of a `partition_by` export is refused before any write, naming `rivet apply <config.yaml>` as the remedy, and the remedy delivers the tree; the refusal is in the shared executor, which reads the plan and no engine"
    postgres: { test: a_sealed_plan_of_a_partitioned_export_is_refused_and_its_remedy_works_postgres }
    mysql:    { test: a_plan_with_an_unexpanded_partition_token_is_refused_before_any_write }
    mssql:    { test: a_plan_with_an_unexpanded_partition_token_is_refused_before_any_write }
    mongo:    { na: "partition_by is refused for a MongoDB source at config load (the bucket probes are SQL)" }
    oracle:   { test: a_plan_with_an_unexpanded_partition_token_is_refused_before_any_write }

  - id: stdout_under_child_processes
    what: "`destination: stdout` with `--parallel-export-processes` delivers what the serial run delivers (CSV: its bytes; Parquet: its rows), each run graded against the source from the stdout the rig captured: the run set keeps a stdout export in-process, because a child's stdout is its event channel; before, the parent dropped every data byte, exit 0"
    postgres: { test: stdout_survives_child_processes_postgres }
    mysql:    { test: stdout_survives_child_processes_mysql }
    mssql:    { test: stdout_survives_child_processes_mssql }
    mongo:    { test: stdout_survives_child_processes_mongo }
    oracle:   { test: stdout_survives_child_processes_oracle }
