# Cycle matrix — the same config on the same state, three times: the whole source, then an
# unchanged source, then a delta. Row = pipeline mode x warehouse (every `ExportMode` variant x
# every `ExportTarget` variant, derived from the enums by the drift guard), column = source engine.
#
# Why it exists: the harness graded `first pass + delta` (upgrade continuity, mode transitions,
# init delta) and `idle` (CDC full cycle into BigQuery) in separate bodies, batch and CDC apart,
# and no cell asked all three questions of one config: does an unchanged source leave the
# warehouse, the cursor and the load ledger alone, and does the delta then travel exactly once?
# The four field defects of 2026 in this class (cursor inherited across a column change, a whole
# pass overwriting an adopted table, a refusal turning into ownership on the next cycle, a
# 0-row idle run read as `nothing to load`) all live between cycles.
#
# The cells of one row share ONE body (tests/live/live_three_cycles.rs): `three_batch_cycles`
# for the SQL engines, `three_mongo_full_cycles` for MongoDB's whole-collection export,
# `three_cdc_cycles` for every CDC engine. The warehouse is asked for metadata between cycles
# (object kinds, row counts, modification stamps) and read for values ONCE, after the last cycle,
# through a client the loader does not use (tests/common/warehouse.rs).
#
# A cell is EXACTLY one of:
#   test: <fn>  — the live cell for this engine.
#   na:   <why> — the combination has no meaning for this engine.
#   gap:  <why> — it should be graded here and is not yet.

engines: [postgres, mysql, mssql, mongo, oracle]

scenarios:
  - id: cycle_full_duckdb
    what: "every cycle takes the whole table: cycle 2 lands the same rows again, cycle 3 the source as it is then; the warehouse holds exactly the source and the load ledger counts each pass. Target: LOCAL Parquet graded by DuckDB over the parts the manifests declare."
    postgres: { test: full_into_duckdb_three_cycles_postgres }
    mysql:   { test: full_into_duckdb_three_cycles_mysql }
    mssql:   { test: full_into_duckdb_three_cycles_mssql }
    mongo:   { test: full_into_duckdb_three_cycles_mongo }
    oracle:  { test: full_into_duckdb_three_cycles_oracle }

