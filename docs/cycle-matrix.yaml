    postgres: { test: incremental_into_duckdb_three_cycles_postgres }
    mysql:   { test: incremental_into_duckdb_three_cycles_mysql }
    mssql:   { test: incremental_into_duckdb_three_cycles_mssql }
    mongo:   { na: "a Mongo export accepts only mode: full or cdc (validate_non_sql_source_modes)" }
    oracle:  { test: incremental_into_duckdb_three_cycles_oracle }

