  - id: cycle_cdc_duckdb
    what: "cycle 1 anchors and snapshots the rows that are there; cycle 2 (no change) captures nothing, loads nothing (a 0-row success, warehouse metadata unchanged); cycle 3 carries five inserts, one update and one delete: the live view equals the source and the log holds the snapshot plus seven changes, nothing twice. Target: LOCAL Parquet graded by DuckDB over the parts the manifests declare."
    postgres: { test: cdc_into_duckdb_three_cycles_postgres }
    mysql:   { test: cdc_into_duckdb_three_cycles_mysql }
    mssql:   { test: cdc_into_duckdb_three_cycles_mssql }
    mongo:   { test: cdc_into_duckdb_three_cycles_mongo }
