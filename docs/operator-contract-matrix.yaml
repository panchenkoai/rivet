  - id: cdc_stdout_never_advances_the_slot
    what: "RESULTS 16: `rivet cdc` to stdout advances the PostgreSQL slot it drained (3, 3, 3 events today)"
    postgres: { gap: "no rig entry point drives `rivet cdc` NDJSON to stdout three times against one slot; not written" }
    mysql:    { gap: "no rig entry point drives `rivet cdc` NDJSON to stdout three times against one slot; not written" }
    mssql:    { gap: "no rig entry point drives `rivet cdc` NDJSON to stdout three times against one slot; not written" }
