    mssql:    { na: "SQL Server rejects TRUNCATE on a captured table (Msg 4711)" }
    mongo:    { test: open_defect_a_cdc_collection_drop_is_refused_by_code_mongo }
    oracle:   { test: a_cdc_truncate_is_refused_by_code_oracle }

  - id: log_gone_before_the_first_changes_run
    what: "RESULTS 6, 17: retained changes removed past a checkpoint no changes run has advanced are refused as RIVET_SOURCE_CDC_LOG_GAP (exit 5)"
    postgres: { test: open_defect_a_dropped_slot_is_refused_by_code_postgres }
    mysql:    { test: open_defect_binlogs_purged_past_the_checkpoint_before_the_first_changes_run_are_refused_by_code_mysql }
    mssql:    { test: open_defect_a_change_table_cleaned_past_the_checkpoint_before_the_first_changes_run_is_refused_by_code_mssql }
    mongo:    { gap: "the stand's replica set cannot lose oplog under a resume token without affecting every other change-stream cell: it needs a dedicated replica set started with a minimal `--oplogSize` and filler writes past it" }
    oracle:   { gap: "the stand cannot lose an Oracle archived log without SYSDBA inside the container (RMAN `delete archivelog` after log switches), which the test user does not hold; the fabricated-low-water twin is live_cdc_oracledb::oracle_cdc_resume_past_log_retention_fails_loudly. Needs: a SYSDBA handle for the harness, run under the oracle_cdc serial group" }

  - id: log_gone_after_a_changes_run
