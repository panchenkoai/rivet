# Operator-contract matrix. What rivet's exit code, refusal text and advice commands promise an
# operator, from the 2026-10-07 CLI sweep by hand (RESULTS.md and the two sweep reports). Each
# cell asserts the correct behaviour (tests/live/live_operator_contract.rs); an `open_defect_*`
# cell fails today and is acknowledged in dev/release_oracle/known_red.py with the symptom it shows.
# Patterns: (a) exit 0 over a wrong destination, (b) a failure before the first write, (c) refusal
# then remedy (Rig::refuses_twice_then), (d) the exit-code contract, (e) advice parity, (f) single rows.

engines: [postgres, mysql, mssql, mongo, oracle]

scenarios:
  - id: stale_chunk_checkpoint
    what: "RESULTS 1: a run without the checkpoint beside an unfinished checkpointed run is refused by code, and both named remedies deliver"
    postgres: { test: a_run_without_the_checkpoint_beside_an_unfinished_run_is_refused_postgres }
    mysql:    { test: a_run_without_the_checkpoint_beside_an_unfinished_run_is_refused_mysql }
    mssql:    { test: a_run_without_the_checkpoint_beside_an_unfinished_run_is_refused_mssql }
    mongo:    { na: "a MongoDB export is `mode: full` or `cdc` only; any other mode is refused when the config is read (validate_non_sql_source_modes, RIVET_CONFIG_SOURCE_MODE_UNSUPPORTED), so it has no range-chunk checkpoint" }
    oracle:   { test: a_run_without_the_checkpoint_beside_an_unfinished_run_is_refused_oracle }

  - id: run_validate_exit
    what: "RESULTS 2: `run --validate` over a failed verification exits 3 (RIVET_VALIDATE_FAILED) on every run, as `rivet validate` does on that prefix"
    postgres: { test: run_validate_fails_the_run_over_a_failed_validation_postgres }
    mysql:    { test: run_validate_fails_the_run_over_a_failed_validation_mysql }
    mssql:    { test: run_validate_fails_the_run_over_a_failed_validation_mssql }
    mongo:    { test: run_validate_fails_the_run_over_a_failed_validation_mongo }
    oracle:   { test: run_validate_fails_the_run_over_a_failed_validation_oracle }

  - id: read_only_state
    what: "RESULTS 3: a run over a state it cannot write is refused before it exports (RIVET_STATE_NOT_WRITABLE, exit 1), and runs once the state is writable"
    postgres: { test: a_run_over_a_read_only_state_is_refused_and_runs_once_it_is_writable_postgres }
    mysql:    { test: a_run_over_a_read_only_state_is_refused_and_runs_once_it_is_writable_mysql }
    mssql:    { test: a_run_over_a_read_only_state_is_refused_and_runs_once_it_is_writable_mssql }
    mongo:    { test: a_run_over_a_read_only_state_is_refused_and_runs_once_it_is_writable_mongo }
    oracle:   { test: a_run_over_a_read_only_state_is_refused_and_runs_once_it_is_writable_oracle }

  - id: cursor_write_fails
    what: "RESULTS 3 (the write after the manifest): a run whose cursor write fails delivers its rows once, keeps the stored cursor and exits 1 (RIVET_STATE_CURSOR_NOT_STORED)"
    postgres: { test: a_run_whose_cursor_write_fails_delivers_and_does_not_exit_0_postgres }
    mysql:    { test: a_run_whose_cursor_write_fails_delivers_and_does_not_exit_0_mysql }
    mssql:    { test: a_run_whose_cursor_write_fails_delivers_and_does_not_exit_0_mssql }
    mongo:    { na: "a MongoDB export is `mode: full` or `cdc` only; any other mode is refused when the config is read (validate_non_sql_source_modes, RIVET_CONFIG_SOURCE_MODE_UNSUPPORTED), so it has no incremental cursor to store" }
    oracle:   { test: a_run_whose_cursor_write_fails_delivers_and_does_not_exit_0_oracle }

  - id: concurrent_full_runs
    what: "RESULTS 4: a second concurrent `full` run is refused, or the prefix holds each key once"
    postgres: { test: open_defect_a_second_concurrent_full_run_does_not_double_the_prefix_postgres }
    mysql:    { test: open_defect_a_second_concurrent_full_run_does_not_double_the_prefix_mysql }
    mssql:    { test: open_defect_a_second_concurrent_full_run_does_not_double_the_prefix_mssql }
    mongo:    { test: open_defect_a_second_concurrent_full_run_does_not_double_the_prefix_mongo }
    oracle:   { test: open_defect_a_second_concurrent_full_run_does_not_double_the_prefix_oracle }

  - id: failed_before_first_write
    what: "RESULTS 8: a run that never connected writes nothing over an earlier run's record, twice: before the first export it leaves its failed manifest (the only record there; `validate` exits 1) and the next one leaves that byte for byte; after a complete export it leaves the whole export (`_SUCCESS`, manifest), which `validate` still passes"
    postgres: { test: a_run_that_never_connected_keeps_the_export_complete_postgres }
    mysql:    { test: a_run_that_never_connected_keeps_the_export_complete_mysql }
    mssql:    { test: a_run_that_never_connected_keeps_the_export_complete_mssql }
    mongo:    { test: a_run_that_never_connected_keeps_the_export_complete_mongo }
    oracle:   { test: a_run_that_never_connected_keeps_the_export_complete_oracle }

  - id: failed_before_first_write_s3
    what: "RESULTS 8 on MinIO: the same, read back through the store; the run's `running` marker is gone too"
    postgres: { test: a_run_that_never_connected_keeps_the_export_complete_s3 }
    mysql:    { na: "the marker is written by the destination store whatever the source reads; the engine cells of `failed_before_first_write` export to a local destination" }
    mssql:    { na: "the marker is written by the destination store whatever the source reads; the engine cells of `failed_before_first_write` export to a local destination" }
    mongo:    { na: "the marker is written by the destination store whatever the source reads; the engine cells of `failed_before_first_write` export to a local destination" }
    oracle:   { na: "the marker is written by the destination store whatever the source reads; the engine cells of `failed_before_first_write` export to a local destination" }

  - id: failed_before_first_write_gcs
    what: "RESULTS 8 on fake-gcs: the same, read back through the store; the run's `running` marker is gone too"
    postgres: { test: a_run_that_never_connected_keeps_the_export_complete_gcs }
    mysql:    { na: "the marker is written by the destination store whatever the source reads; the engine cells of `failed_before_first_write` export to a local destination" }
    mssql:    { na: "the marker is written by the destination store whatever the source reads; the engine cells of `failed_before_first_write` export to a local destination" }
    mongo:    { na: "the marker is written by the destination store whatever the source reads; the engine cells of `failed_before_first_write` export to a local destination" }
    oracle:   { na: "the marker is written by the destination store whatever the source reads; the engine cells of `failed_before_first_write` export to a local destination" }

  - id: failed_before_first_write_azure
    what: "RESULTS 8 on Azurite: the same, read back through the store; the run's `running` marker is gone too"
    postgres: { test: a_run_that_never_connected_keeps_the_export_complete_azure }
    mysql:    { na: "the marker is written by the destination store whatever the source reads; the engine cells of `failed_before_first_write` export to a local destination" }
    mssql:    { na: "the marker is written by the destination store whatever the source reads; the engine cells of `failed_before_first_write` export to a local destination" }
    mongo:    { na: "the marker is written by the destination store whatever the source reads; the engine cells of `failed_before_first_write` export to a local destination" }
    oracle:   { na: "the marker is written by the destination store whatever the source reads; the engine cells of `failed_before_first_write` export to a local destination" }

  - id: failed_after_a_part
    what: "RESULTS 8, the other side: a run that wrote a part and then failed withdraws `_SUCCESS` and leaves a failed manifest naming the part; the complete export's parts stay"
    postgres: { test: a_run_that_failed_after_a_part_withdraws_the_marker_postgres }
    mysql:    { test: a_run_that_failed_after_a_part_withdraws_the_marker_mysql }
    mssql:    { test: a_run_that_failed_after_a_part_withdraws_the_marker_mssql }
    mongo:    { na: "a MongoDB export is `mode: full` or `cdc` only; any other mode is refused when the config is read (validate_non_sql_source_modes, RIVET_CONFIG_SOURCE_MODE_UNSUPPORTED), so it has no range-chunk run to fail at its second chunk or to resume" }
    oracle:   { test: a_run_that_failed_after_a_part_withdraws_the_marker_oracle }

  - id: resume_failed_before_first_write
    what: "RESULTS 8 on a resume: a `--resume` that never connected leaves the prefix of the run that failed after its first chunk byte for byte: its parts and the failed manifest that names them"
    postgres: { test: a_resume_that_never_connected_leaves_the_unfinished_run_as_it_was_postgres }
    mysql:    { test: a_resume_that_never_connected_leaves_the_unfinished_run_as_it_was_mysql }
    mssql:    { test: a_resume_that_never_connected_leaves_the_unfinished_run_as_it_was_mssql }
    mongo:    { na: "a MongoDB export is `mode: full` or `cdc` only; any other mode is refused when the config is read (validate_non_sql_source_modes, RIVET_CONFIG_SOURCE_MODE_UNSUPPORTED), so it has no range-chunk run to fail at its second chunk or to resume" }
    oracle:   { test: a_resume_that_never_connected_leaves_the_unfinished_run_as_it_was_oracle }

  - id: forced_resume_beside
    what: "RESULTS 12, the refusal's own words: `--resume --force` over a complete prefix runs as a plain run does (the table again, or on MongoDB `resume` the delta past the stored `_id`), the old parts stay byte for byte, and manifest.json names only the new ones"
    postgres: { test: a_forced_resume_over_a_complete_prefix_lands_beside_it_postgres }
    mysql:    { test: a_forced_resume_over_a_complete_prefix_lands_beside_it_mysql }
    mssql:    { test: a_forced_resume_over_a_complete_prefix_lands_beside_it_mssql }
    mongo:    { test: a_forced_resume_over_a_complete_prefix_lands_beside_it_mongo }
    oracle:   { test: a_forced_resume_over_a_complete_prefix_lands_beside_it_oracle }

  - id: forced_resume_over_a_marker
    what: "docs/cloud-destinations.md, Resume: over a prefix that holds `_SUCCESS`, a `--resume --force` that never connected leaves the marker and manifest byte for byte; one that wrote a part and then failed withdraws the marker and leaves a failed manifest"
    postgres: { test: a_forced_resume_keeps_the_marker_until_it_writes_postgres }
    mysql:    { test: a_forced_resume_keeps_the_marker_until_it_writes_mysql }
    mssql:    { test: a_forced_resume_keeps_the_marker_until_it_writes_mssql }
    mongo:    { na: "a MongoDB export is `mode: full` or `cdc` only; any other mode is refused when the config is read (validate_non_sql_source_modes, RIVET_CONFIG_SOURCE_MODE_UNSUPPORTED), so it has no range-chunk run to fail at its second chunk or to resume" }
    oracle:   { test: a_forced_resume_keeps_the_marker_until_it_writes_oracle }

  - id: wave_retry_after_failed_before_first_write
    what: "RESULTS 8 and `apply --resume`: the wave retry runs again the export whose last run never connected (the marker at its prefix is an earlier run's; the journal says the last run failed)"
    postgres: { test: a_wave_retry_reruns_the_export_whose_last_run_never_connected_postgres }
    mysql:    { test: a_wave_retry_reruns_the_export_whose_last_run_never_connected_mysql }
    mssql:    { test: a_wave_retry_reruns_the_export_whose_last_run_never_connected_mssql }
    mongo:    { test: a_wave_retry_reruns_the_export_whose_last_run_never_connected_mongo }
    oracle:   { test: a_wave_retry_reruns_the_export_whose_last_run_never_connected_oracle }

  - id: resume_force_remedy
    what: "RESULTS 12: `--resume` over a complete prefix is refused as RIVET_DEST_ALREADY_COMPLETE (exit 5); `--resume --force` then runs as a plain run does, beside the complete export, as the refusal says, and `state reset-chunks` leaves the refusal"
    postgres: { test: resume_force_runs_over_a_complete_prefix_postgres }
    mysql:    { test: resume_force_runs_over_a_complete_prefix_mysql }
    mssql:    { test: resume_force_runs_over_a_complete_prefix_mssql }
    mongo:    { test: resume_force_runs_over_a_complete_prefix_mongo }
    oracle:   { test: resume_force_runs_over_a_complete_prefix_oracle }

  - id: run_in_progress_code
    what: "RESULTS 11: a second run beside a live checkpointed run is refused as RIVET_STATE_RUN_IN_PROGRESS (exit 5)"
    postgres: { test: open_defect_a_second_run_beside_a_live_checkpointed_run_is_refused_by_code_postgres }
    mysql:    { test: open_defect_a_second_run_beside_a_live_checkpointed_run_is_refused_by_code_mysql }
    mssql:    { test: open_defect_a_second_run_beside_a_live_checkpointed_run_is_refused_by_code_mssql }
    mongo:    { test: open_defect_a_second_run_beside_a_live_resumable_run_is_refused_by_code_mongo }
    oracle:   { test: open_defect_a_second_run_beside_a_live_checkpointed_run_is_refused_by_code_oracle }

  - id: plan_unreadable_source
    what: "RESULTS 10: `plan` over a table that does not exist fails as RIVET_PLAN_SOURCE_UNREADABLE (exit 1) and seals no artifact"
    postgres: { test: plan_refuses_a_table_that_does_not_exist_postgres }
    mysql:    { test: plan_refuses_a_table_that_does_not_exist_mysql }
    mssql:    { test: plan_refuses_a_table_that_does_not_exist_mssql }
    mongo:    { test: plan_refuses_a_collection_that_does_not_exist_mongo }
    oracle:   { test: plan_refuses_a_table_that_does_not_exist_oracle }

  - id: plan_wrong_password
    what: "RESULTS 10 (hand sweep): `plan` with a password the source rejects fails as RIVET_PLAN_SOURCE_UNREADABLE (exit 1) and seals no artifact"
    postgres: { test: plan_refuses_a_password_the_source_rejects_postgres }
    mysql:    { test: plan_refuses_a_password_the_source_rejects_mysql }
    mssql:    { test: plan_refuses_a_password_the_source_rejects_mssql }
    mongo:    { na: "the stand's MongoDB runs without access control, so it has no password to reject; the code path is the one plan_refuses_a_collection_that_does_not_exist_mongo takes (the preflight's error)" }
    oracle:   { test: plan_refuses_a_password_the_source_rejects_oracle }

  - id: check_refuses_what_run_refuses_missing_collection
    what: "`check` fails as RIVET_SOURCE_COLLECTION_NOT_FOUND (exit 1) over a MongoDB collection that does not exist, which `run` refuses"
    postgres: { na: "a missing SQL table already failed `check` (the preflight's schema error); the absent-collection guard is MongoDB's" }
    mysql:    { na: "a missing SQL table already failed `check` (the preflight's schema error); the absent-collection guard is MongoDB's" }
    mssql:    { na: "a missing SQL table already failed `check` (the preflight's schema error); the absent-collection guard is MongoDB's" }
    mongo:    { test: check_refuses_a_collection_that_does_not_exist_as_run_does_mongo }
    oracle:   { na: "a missing SQL table already failed `check` (the preflight's schema error); the absent-collection guard is MongoDB's" }

  - id: unusable_state_url
    what: "RESULTS 9: a `RIVET_STATE_URL` rivet cannot use is refused (RIVET_STATE_URL_SCHEME_UNSUPPORTED, exit 1); unsetting it runs on SQLite, and the corrected URL runs on PostgreSQL state (the postgres cell, which has the state server)"
    postgres: { test: an_unusable_state_url_is_refused_and_each_remedy_runs_postgres }
    mysql:    { test: an_unusable_state_url_is_refused_and_each_remedy_runs_mysql }
    mssql:    { test: an_unusable_state_url_is_refused_and_each_remedy_runs_mssql }
    mongo:    { test: an_unusable_state_url_is_refused_and_each_remedy_runs_mongo }
    oracle:   { test: an_unusable_state_url_is_refused_and_each_remedy_runs_oracle }

  - id: corrupt_checkpoint_remedy
    what: "RESULTS 13: deleting a corrupt CDC checkpoint accepts a new anchor, as the refusal says"
    postgres: { na: "deleting the checkpoint works on PostgreSQL: the slot is the anchor (Mac sweep F1)" }
    mysql:    { test: open_defect_deleting_a_corrupt_cdc_checkpoint_accepts_a_new_anchor_mysql }
    mssql:    { test: open_defect_deleting_a_corrupt_cdc_checkpoint_accepts_a_new_anchor_mssql }
    mongo:    { test: open_defect_deleting_a_corrupt_cdc_checkpoint_accepts_a_new_anchor_mongo }
    oracle:   { test: open_defect_deleting_a_corrupt_cdc_checkpoint_accepts_a_new_anchor_oracle }

  - id: corrupt_checkpoint_code
    what: "a corrupt CDC checkpoint is refused as RIVET_SOURCE_CDC_CHECKPOINT_INVALID (exit 5)"
    postgres: { test: open_defect_a_corrupt_cdc_checkpoint_is_refused_by_code_postgres }
    mysql:    { test: open_defect_a_corrupt_cdc_checkpoint_is_refused_by_code_mysql }
    mssql:    { test: open_defect_a_corrupt_cdc_checkpoint_is_refused_by_code_mssql }
    mongo:    { test: open_defect_a_corrupt_cdc_checkpoint_is_refused_by_code_mongo }
    oracle:   { test: open_defect_a_corrupt_cdc_checkpoint_is_refused_by_code_oracle }

  - id: cdc_truncate_code
    what: "a TRUNCATE inside the stream is refused as RIVET_SOURCE_CDC_TRUNCATED (exit 5)"
    postgres: { test: open_defect_a_cdc_truncate_is_refused_by_code_postgres }
    mysql:    { test: open_defect_a_cdc_truncate_is_refused_by_code_mysql }
    mssql:    { na: "SQL Server rejects TRUNCATE on a captured table (Msg 4711)" }
    mongo:    { test: open_defect_a_cdc_collection_drop_is_refused_by_code_mongo }
    oracle:   { test: a_cdc_truncate_is_refused_by_code_oracle }

  - id: log_gone_before_the_first_changes_run
    what: "RESULTS 6, 17: retained changes removed past a checkpoint no changes run has advanced are refused as RIVET_SOURCE_CDC_LOG_GAP (exit 5)"
    postgres: { test: open_defect_a_dropped_slot_is_refused_by_code_postgres }
    mysql:    { test: open_defect_binlogs_purged_past_the_checkpoint_before_the_first_changes_run_are_refused_by_code_mysql }
    mssql:    { test: a_change_table_cleaned_past_the_checkpoint_before_the_first_changes_run_is_refused_by_code_mssql }
    mongo:    { test: open_defect_an_oplog_rolled_past_the_checkpoint_before_the_first_changes_run_is_refused_by_code_mongo }
    oracle:   { gap: "attempted again 2026-10-08 with a throwaway container of the cell's own (the image is on the machine): gvenzl/oracle-free:23-slim-faststart with dev/oracle/init/01-grants.sql and 02-logminer.sh mounted is ready in 26 s, and against it rivet init --mode cdc, the anchor run and one changes run exit 0, a further change is pending, and three log switches leave 4 archived logs, 4 present (V$ARCHIVED_LOG). The last step was not run: the image ships no rman, so the redo can only be lost by deleting the files under /opt/oracle/oradata/archive inside the container, and the agent session's safety check denied that removal (Permission for this command was denied by a built-in Claude Code safety check); it was not routed around. Needs a person to run the removal step once, or an image with rman. The fabricated-low-water twin is live_cdc_oracledb::oracle_cdc_resume_past_log_retention_fails_loudly" }

  - id: log_gone_after_a_changes_run
    what: "RESULTS 17: retained changes removed past a checkpoint a changes run advanced are refused as RIVET_SOURCE_CDC_LOG_GAP (exit 5)"
    postgres: { test: open_defect_a_dropped_slot_after_a_changes_run_is_refused_by_code_postgres }
    mysql:    { test: open_defect_binlogs_purged_past_the_checkpoint_after_a_changes_run_are_refused_by_code_mysql }
    mssql:    { test: a_change_table_cleaned_past_the_checkpoint_after_a_changes_run_is_refused_by_code_mssql }
    mongo:    { test: open_defect_an_oplog_rolled_past_the_checkpoint_after_a_changes_run_is_refused_by_code_mongo }
    oracle:   { gap: "attempted again 2026-10-08 with a throwaway container of the cell's own (the image is on the machine): gvenzl/oracle-free:23-slim-faststart with dev/oracle/init/01-grants.sql and 02-logminer.sh mounted is ready in 26 s, and against it rivet init --mode cdc, the anchor run and one changes run exit 0, a further change is pending, and three log switches leave 4 archived logs, 4 present (V$ARCHIVED_LOG). The last step was not run: the image ships no rman, so the redo can only be lost by deleting the files under /opt/oracle/oradata/archive inside the container, and the agent session's safety check denied that removal (Permission for this command was denied by a built-in Claude Code safety check); it was not routed around. Needs a person to run the removal step once, or an image with rman. The fabricated-low-water twin is live_cdc_oracledb::oracle_cdc_resume_past_log_retention_fails_loudly" }

  - id: refused_cdc_run_leaves_a_slot
    what: "RESULTS 15: a PostgreSQL CDC run refused for a missing table (RIVET_SOURCE_CDC_PREREQUISITE) leaves no replication slot, and creating the table then runs"
    postgres: { test: a_refused_cdc_run_on_a_missing_table_leaves_no_slot_postgres }
    mysql:    { na: "a replication slot is PostgreSQL's server-side anchor; this engine's anchor is its checkpoint file, and a refused run that writes one fails the default refusal grade (tests/common/refusal.rs) of every CDC refusal cell, as on doctor_cdc_prerequisite below" }
    mssql:    { na: "a replication slot is PostgreSQL's server-side anchor; this engine's anchor is its checkpoint file, and a refused run that writes one fails the default refusal grade (tests/common/refusal.rs) of every CDC refusal cell, as on doctor_cdc_prerequisite below" }
    mongo:    { na: "a replication slot is PostgreSQL's server-side anchor; this engine's anchor is its checkpoint file, and a refused run that writes one fails the default refusal grade (tests/common/refusal.rs) of every CDC refusal cell, as on doctor_cdc_prerequisite below" }
    oracle:   { na: "a replication slot is PostgreSQL's server-side anchor; this engine's anchor is its checkpoint file, and a refused run that writes one fails the default refusal grade (tests/common/refusal.rs) of every CDC refusal cell, as on doctor_cdc_prerequisite below" }

  - id: refused_changes_only_cdc_run_leaves_a_slot
    what: "RESULTS 15: the changes-only twin of RESULTS 15 (no baseline leg, so the capture open itself is the first writer): refused for a missing table, it leaves no replication slot, and creating the table then runs"
    postgres: { test: a_refused_changes_only_cdc_run_on_a_missing_table_leaves_no_slot_postgres }
    mysql:    { na: "a replication slot is PostgreSQL's server-side anchor; this engine's anchor is its checkpoint file, and a refused run that writes one fails the default refusal grade (tests/common/refusal.rs) of every CDC refusal cell, as on doctor_cdc_prerequisite below" }
    mssql:    { na: "a replication slot is PostgreSQL's server-side anchor; this engine's anchor is its checkpoint file, and a refused run that writes one fails the default refusal grade (tests/common/refusal.rs) of every CDC refusal cell, as on doctor_cdc_prerequisite below" }
    mongo:    { na: "a replication slot is PostgreSQL's server-side anchor; this engine's anchor is its checkpoint file, and a refused run that writes one fails the default refusal grade (tests/common/refusal.rs) of every CDC refusal cell, as on doctor_cdc_prerequisite below" }
    oracle:   { na: "a replication slot is PostgreSQL's server-side anchor; this engine's anchor is its checkpoint file, and a refused run that writes one fails the default refusal grade (tests/common/refusal.rs) of every CDC refusal cell, as on doctor_cdc_prerequisite below" }

  - id: doctor_cdc_prerequisite
    what: "`doctor` is not green for a CDC export whose prerequisite the run refuses (wal_level, a replica that does not relog, no capture instance, a standalone, no all-column logging)"
    postgres: { test: doctor_is_not_green_where_the_cdc_run_refuses_wal_level_postgres }
    mysql:    { test: doctor_is_not_green_where_the_cdc_run_refuses_a_replica_that_does_not_relog_mysql }
    mssql:    { test: doctor_is_not_green_where_the_cdc_run_refuses_a_table_with_no_capture_instance_mssql }
    mongo:    { test: doctor_is_not_green_where_the_cdc_run_refuses_a_standalone_mongo }
    oracle:   { test: doctor_is_not_green_where_the_cdc_run_refuses_a_table_without_all_column_logging_oracle }

  - id: mongo_page_size_remedy
    what: "RESULTS 14: removing `page_size` after the heterogeneous-`_id` refusal runs the full scan"
