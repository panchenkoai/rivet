# Runner-coverage matrix — every PER-EXPORT feature must be applied on EVERY export
# runner, not just the single-batch path. The columns below collapse to FIVE runner
# FAMILIES (four until the 2026-08-16 split recorded below), but the code actually has
# ~EIGHT distinct commit loops: single;
# chunked_sequential / chunked_parallel / sequential_checkpoint / parallel_checkpoint;
# keyset_sequential / keyset_parallel (feat/parallel-keyset); mongo_parallel. Each
# family here stands for its variants — so a feature marked `test` on `keyset` may be
# proven only on keyset_SEQUENTIAL while keyset_PARALLEL silently lacks it (iteration 1
# of parallel-keyset shipped exactly that: the drift gate, wired into keyset_sequential,
# was absent on keyset_parallel; a human caught it, not this ledger — see below).
#
# ADR-0028 (2026-08-21): the tail APPLICATION is now ONE seam. `finalize::
# finalize_export`, called by the dispatcher between the runner returning and
# `finalize_manifest`, applies the fingerprint pin, the on_schema_drift gate,
# the Form-B harvest and the shape-drift warn from `summary.ledger` — the
# CommitLedger the runners FEED as they commit. No runner applies any of those
# itself any more, so the drift/Form-B rows below grade the runner's FEED (and
# the seam end-to-end), not a per-runner re-application; the class this ledger
# exists to catch is structurally reduced to "a runner fed nothing", which the
# telltale backstop below turns RED (proven 2026-08-21: seam call removed ->
# 2 live tests FAIL + the finalize panic fires; keyset feed removed -> the
# telltale names the runner-bypass class in its message).
#
# STRUCTURAL BACKSTOP (feat/parallel-keyset, candidate A): two of the recurring
# scenarios below — `schema_drift_gate` and value-checksum Form B — are now guarded
# STRUCTURALLY by `RunSummary::check_post_run_invariants` (a debug/test panic in
# finalize_manifest), independent of this ledger. Each facade leaves a telltale on the
# summary when it runs (schema_changed = Some(_); column_checksums populated or
# ..._incomplete set); any `state_backed` success that committed parts with a telltale
# ABSENT panics in tests — so a drift/Form-B bypass on ANY batch runner (every variant,
# including keyset_parallel) fails RED regardless of whether it has a cell here. This
# ledger stays the map for the OTHER per-runner features (part stamp, cursor range,
# durability ordering) that have no such telltale; splitting the collapsed families into
# real per-variant columns is a tracked follow-up.
#
# PER-VARIANT VERIFICATION PASS, 2026-08-04. The follow-up above was DISCHARGED as an
# audit rather than as new columns: all EIGHT commit loops were read individually
# against all thirteen scenarios below (single; chunked_{sequential,parallel};
# {sequential,parallel}_checkpoint; keyset_{sequential,parallel}; mongo_parallel), and
# every claimed absence was then handed to an independent agent instructed to REFUTE it.
# Result: no collapsed family was hiding a divergence — zero new gaps. The columns stayed
# at four because 96 cells of prose would restate one fact (the families agree today)
# while adding a second ledger to keep in sync; the pass is recorded here instead.
#
# COLUMN SPLIT, 2026-08-16 — `chunked` → `chunked` + `chunked_checkpoint`. The audit
# above chose prose over columns; one row then proved prose is not enough. The
# `adaptive_concurrency_governor` cell read `test` for a runner whose OWN cell text
# admitted the checkpoint twin's end-to-end shed was unproven — an admission no guard
# reads, next to four green cells a reader scanning the grid would trust. The split is
# along the ONE line job.rs dispatches on (`ExtractionStrategy::is_resumable()` ==
# `chunk_checkpoint: true`, plan/contract.rs:227), so each column is a pair of real
# commit loops:
#   chunked            = chunked/exec.rs      — run_chunked_sequential + run_chunked_parallel
#   chunked_checkpoint = sequential_checkpoint.rs + parallel_checkpoint.rs
# Splitting them surfaced an EVIDENCE INVERSION the collapse hid in both directions:
# four rows (`failed_chunk_fails_the_run` — both of its tests —, `guard_manifest_mode`,
# `durable_manifest_before_advance`, `resume_checkpoint`) named live tests that set
# `chunk_checkpoint: true`, so they graded the CHECKPOINT runners and their cells have
# MOVED one column right — while the governor cell's test sets `parallel: 8` with NO
# checkpoint
# (live_governor.rs:212-221) and graded the PLAIN one. One column, two disjoint bodies
# of evidence, and no way for a reader to tell which. Two honest `gap:` cells fell out
# (governor/chunked_checkpoint, failed-chunk/chunked); the ratchet in
# tests/offline/chunking_matrix_guard.rs moves 0 → 2 and names both.
# NOT split (still collapsed, still tracked by the header above): chunked's own
# sequential-vs-parallel pair inside each column, and keyset_sequential vs
# keyset_parallel.
#
# Three findings that are worth keeping, none of them a gap:
#   * shape_drift_warn reads `absent` on six variants if you ask "is it applied", and
#     `na` if you ask "should it be" — the `na` cells below are the honest answer, but
#     note the distinction is DESIGN, not structure. It is the one row where a future
#     reader could mistake the two.
#   * durable_manifest_before_advance on keyset_parallel LOOKS absent at
#     keyset.rs:716-722 (st.update before the manifest) and is not: the anchor+ranges
#     persist first (keyset.rs:375-377), resume ignores the cursor (keyset.rs:323), and
#     job.rs:1091-1099 keeps the anchor across a manifest gap. Cost one refutation pass
#     to establish; recorded so it does not cost another.
#   * files_committed_on_abort on mongo_parallel is genuinely not applied — the drain
#     bails at `let out = res?` (mongo_parallel.rs:106) ABOVE the record_part calls
#     (:121-131). Harm is bounded to the worker-0 case (a later worker's failure leaves
#     files_committed > 0, so decide_export_retry bails correctly) and to ORPHANS rather
#     than duplicates, because the stamp is re-minted per invocation (:64). That is the
#     defect the `na` cell below already names as tracked-separately, now measured.
#
# Round-8 proved this class is real AND recurring: `on_schema_drift: fail` returned
# exit 0 on keyset + parallel-Mongo because the drift gate lived only in single/chunked.
# Building this ledger then surfaced a bigger one — value-checksum Form B was absent on
# ALL three large-table runners.
#
# COLUMNS ARE DERIVED, 2026-08-21. Every paragraph above argues about the column
# set — the ~8 loops, the collapse to 5, the 2026-08-16 split — and until now the
# `engines:` line below was a hand-written list tied to NOTHING: the generative
# column guard (tests/offline/chunking_matrix_guard.rs #5) only knows enum-keyed
# ledgers (SourceType / ExportTarget / DestinationType), and a runner is not an
# enum variant, so this ledger was the one matrix whose columns nobody derived.
# `runner_matrix_columns_are_derived_from_the_commit_loops` closes that: a
# top-level fn under src/pipeline that drains through `commit::record_part` IS a
# commit loop (ADR-0028's own definition of the seam every runner must call), the
# derivation finds exactly the EIGHT the header above names, and COMMIT_LOOP_COLUMN
# maps each to its column here. It fails in both directions — a ninth loop with no
# column (RED-proven: a new record_part-draining fn; 271 other offline tests stayed
# green), and a column whose loop is gone (RED-proven: the mongo_parallel runner
# deleted; the ledger went on grading its column, cells and ratchet and all).
#
# The ADR-0028 half is graded structurally rather than by more cells: the rows
# below whose `na:` rests on "it runs ONCE at the finalize_export seam"
# (schema_drift_gate, shape_drift_warn, value_checksum_form_b — the guard reads
# that set from THIS file's `what:` prose, it is not hand-listed there) are honest
# only while the seam has exactly one caller.
# `the_export_tail_seam_has_one_caller_and_no_runner_re_applies_it` asserts that,
# and names those rows when it fails — so a runner re-applying the tail is a
# diff-time failure instead of three `na` cells quietly becoming false.

# Columns are the five RUNNER families. A cell is EXACTLY one of:
#   test: <fn>  — the feature is applied on this runner AND a test proves it.
#   na:   <why> — the feature genuinely does not apply to this runner (by design),
#                 OR it is injected at a SHARED seam (the ExportSink) that no runner
#                 can bypass, so there is no per-runner divergence to test.
#   gap:  <why> — the feature is PER-RUNNER wired (a runner can forget it — some did)
#                 and is either ABSENT here, or applied but has no test proving it.
#
# The gap/na split is principled: a feature applied by shared-seam construction
# (meta_columns via ExportSink) is `na` (runner-agnostic, proven once); a feature
# each runner must EXPLICITLY re-apply (schema_drift gate, checksum harvest, part
# stamp) is `gap` when unproven — that is exactly the class that bites.

engines: [single, chunked, chunked_checkpoint, keyset, mongo_parallel]

scenarios:
  - id: failed_chunk_fails_the_run
    what: "a chunk/worker that FAILS (not crashes) must fail the run rather than ship a short export. Measured 2026-08-03: disabling the sequential guard (`pending > 0`) left 14 live tests green while a run shipped 100 of 150 rows as SUCCESS; disabling BOTH parallel-checkpoint guards left 56 green. Every prior test injected a PANIC, and a panic never reaches a guard that only runs once the loop finishes — hence the RIVET_TEST_ERROR_AT=chunk_export:N hook these tests added."
    single:         { na: "no chunk loop to continue past — a failed single export IS the run's failure (run_single_export returns Err); the retry side is decide_export_retry's own matrix" }
    # The SEQUENTIAL half of this column stays `na` by construction — run_chunked_sequential
    # propagates a chunk failure with `?` INSIDE the per-chunk loop (chunked/exec.rs), so there
    # is no keep-going path and no end-of-loop guard to forget. The `test:` grades the PARALLEL
    # half (run_chunked_parallel, exec.rs), and unlike its checkpoint twin it goes RED with its
    # ONE guard disabled — closed 2026-08-16 by wiring maybe_error_at_index("chunk_export", i)
    # into exec.rs's worker, the returning-error hook every other chunked runner already had.
    chunked:        { test: a_failed_chunk_must_fail_the_plain_parallel_run_not_ship_a_short_export }
    # BOTH checkpoint runners are proven; the cell names the sequential one and
    # `a_failed_chunk_must_fail_the_parallel_run_not_ship_a_short_export` covers
    # the parallel twin. The parallel case goes RED only with BOTH its guards
    # disabled — the worker-error bail and the completion count are redundant
    # there, and the test says so in its own body rather than claiming two proofs.
    # Both tests set `chunk_checkpoint: true` (live_chunked_recovery.rs:1070 and
    # :1129), which is why they grade THIS column and not the plain one.
    chunked_checkpoint: { test: a_failed_chunk_must_fail_the_run_not_ship_a_short_export }
    keyset:         { test: parallel_keyset_worker_error_still_counts_the_durable_parts_postgres }
    mongo_parallel: { na: "the drain does `let out = res?` — the FIRST worker error propagates immediately, so there is no keep-going path and therefore no end-of-run guard that can silently fail to fire. The residual risk is the opposite one (a later worker's parts unrecorded because the bail preceded their drain), which is the durable-part-count scenario, not this one" }

  - id: adaptive_concurrency_governor
    what: "OPT-2 governor sheds parallel workers under source pressure (backs off to min_parallel, recovers as pressure eases). Runner-bypass class on the SAFETY knob: it was chunked-only, so a `parallel: N` keyset export on a straining replica adapted batches but never shed workers (#152). Now wired into keyset per-page (permit-per-page semaphore + the same Governor loop + min_parallel floor); the run journal records each ParallelismAdjusted.

      TWO AXES, kept apart on purpose. This ledger's columns are RUNNERS, so the ENGINE
      axis has no cells here and is recorded in prose; the RUNNER axis is what the cells
      below grade. Every claim in one paragraph is evidence about that paragraph's axis
      only — a shed test proves an ENGINE's sampler moves, not that a second runner is
      wired; a wiring pin proves a RUNNER arms the harness, not that an engine's counters
      rise. (Rewritten 2026-08-16, round-6 bughunt: three rounds of appends had left this
      cell asserting the engine axis' three shed tests were `RUNNER-VARIANT AXIS`
      evidence.)

      ENGINE/VERSION AXIS (recorded here, 2026-08-14). The governor's pressure sampler is
      PER ENGINE and, on PostgreSQL, PER SERVER VERSION. PG 17 removed
      pg_stat_bgwriter.checkpoints_req in favour of pg_stat_checkpointer.num_requested, and
      a wrong arm is NOT a quiet None — the batch loop samples inside the export's cursor
      transaction, so the ERROR aborts it and every subsequent FETCH dies (proven on the
      postgres:18 stand: the mutant that disables the modern arm fails the whole export with
      `current transaction is aborted`). The main live stack is postgres:16, where both
      spellings resolve, so the modern arm shipped with zero live coverage; it is covered now
      on two layers — the branch itself by `checkpoints_req_sql_matches_the_servers_catalog`
      (offline, pure fn beside `checkpoints_req_sql` in src/source/postgres/mod.rs) and the
      real catalog by `pg18_governor_samples_the_modern_checkpointer_catalog` (live, skips
      when the optional dev/stand pg18-batch on :5518 is down).
      The SHED half of THIS axis is proven by one live test per engine that has a sampler:
      PostgreSQL `governor_backs_off_under_concurrent_write_pressure`; MySQL
      `mysql_governor_backs_off_under_real_redo_pressure` (innodb_log_buffer_size shrunk to
      its 256 KB minimum plus a foreign blob writer, with an activation guard on the counter
      delta); SQL Server `mssql_governor_backs_off_under_real_log_flush_pressure` (a writer
      committing one ~200 KB row per transaction, which forces a log flush per commit;
      measured 1273 -> 1681 over 400 commits, and unlike the MySQL twin it needs no
      server-wide flip). All three are ENGINE-axis evidence — each says that engine's
      counters really move and the sampler really reads them, whichever runner drove the
      test — and they exist because a must-not-shed assertion cannot tell a working signal
      from a dead one: under a mutant that makes the engine's sampler read permanently flat,
      every pre-existing canary on that engine stays GREEN and only the shed test goes RED
      (verified on MySQL and on SQL Server). MongoDB has no governor (no permit ceiling to
      shrink — see the mongo_parallel cell), so the ENGINE axis is complete: three engines
      proven, one structurally n/a.

      RUNNER-VARIANT AXIS — the hazard this ledger's column collapse warns about in its
      header (found 2026-08-14, round-4 bughunt finding 0), and the row that finally forced
      the `chunked` / `chunked_checkpoint` split. The `chunked` cell below is proven live on
      chunked_PARALLEL (`GovernorHarness::arm` in run_chunked_parallel, chunked/exec.rs); its
      CHECKPOINT twin (parallel_checkpoint.rs,
      which job.rs dispatches only when `requires_parallel_execution() && is_resumable()` —
      a SEQUENTIAL resumable chunked plan goes to run_chunked_sequential_checkpoint via
      single.rs:229 instead) had NO governor at all: no monitoring connection, no arm
      line, no permit ceiling to resize. So `tuning.adaptive: true` was a silent no-op on
      exactly the shape `rivet init` scaffolds (chunk_checkpoint + parallel), and dropping
      `chunk_checkpoint` from an otherwise identical config was the difference between a
      governed run and an ungoverned one, with nothing in the log to tell them apart. It is
      now wired through the same GovernorHarness seam (parallel_checkpoint.rs:178), in the
      POOL shape it needs: one permit per CLAIMED TASK (governor::TaskPermit, taken before the
      claim so a shed parks a worker rather than pinning a chunk_task `running`) plus
      governor::WorkerFinished counting worker exits, since `total` there is the pool size,
      not the task count.
      What is PROVEN on this axis, and what is still OPEN, is now a CELL rather than a
      paragraph: the `chunked_checkpoint` gap below carries it, so the ratchet in
      tests/offline/chunking_matrix_guard.rs holds the admission instead of this prose."
    single:         { na: "single has no worker fan-out to govern (parallel is a multi-part-runner concept)" }
    chunked:        { test: governor_backs_off_under_concurrent_write_pressure }
    chunked_checkpoint: { test: checkpoint_governor_backs_off_under_concurrent_write_pressure, note: "the sequential half is na (no fan-out to govern); this cell grades the PARALLEL half. Was the last `gap:` in this file: the wiring was pinned offline (`the_parallel_checkpoint_runner_arms_spawns_and_drains_the_governor`, a call-site pin over source text) and the pool shed mechanism too (`a_shrunken_permit_ceiling_sheds_pool_workers_without_stranding_a_task`), but neither can catch a run whose SAMPLER never moves under real pressure — the end-to-end shed had only ever been seen in an ad-hoc run (2026-08-14), never committed. Filled to the recipe this cell carried: a checkpoint twin of the `chunked` cells live test (same writer + quiet window, plus `chunk_checkpoint: true`), asserting the RECORDED shed and the full row count. The oracle is the STORED `run_journal.journal_json`, not `rivet journal` — that command renders only files/retries/quality issues and never prints a ParallelismAdjusted, so the first draft read an empty result while stderr showed the shed. RED-proven twice: governor never arming (fails the arm assertion) and `drain_into` dropping its events (fails the RECORD assertion while stderr still says backed off)." }
    keyset:         { test: keyset_governor_backs_off_under_concurrent_write_pressure }
    mongo_parallel: { na: "mongo_parallel spawns one thread per _id range with NO shared permit ceiling — the governor's resize target does not exist there. The reader-level adaptive batch sizing (engine pressure counters) still applies; the concurrency governor is a permit-ceiling mechanism and mongo_parallel has no ceiling to shrink. A future ceiling would take a `test` cell here." }

  - id: schema_drift_gate
    what: "on_schema_drift enforcement — a drifted schema under `fail` aborts (exit 4). Round-8: keyset + mongo_parallel had SILENTLY dropped it (exit 0 on drift) — each runner re-applied the gate by hand then. Since ADR-0028 the gate runs ONCE at the finalize_export seam from the ledger's drift schema; runners only FEED the schema they resolved (chunked feeds none — its gate is pre-chunk via check_from_type_mappings, ADR-0021). The test cells grade the feed + seam end-to-end."
    single:         { test: schema_drift_removed_column_is_detected }
    chunked:        { test: chunked_range_export_enforces_on_schema_drift_fail }
    chunked_checkpoint: { na: "shared CHUNKED preamble, not per-runner: every chunked variant takes the gate through chunked/mod.rs — `prepare_chunk_plan` / `prepare_chunk_plan_fresh` on the Detect path and `check_drift_only(_fresh)` on the Precomputed (apply/resume) path. Call sites, paired by shape rather than by line (a line number drifts on the next merge, a name does not): `run_chunked_sequential_checkpoint` calls the same `prepare_chunk_plan` / `check_drift_only` that `run_chunked_sequential` (chunked/exec.rs) calls, and `run_chunked_parallel_checkpoint` the same `prepare_chunk_plan_fresh` / `check_drift_only_fresh` that `run_chunked_parallel` calls — so the checkpoint runners cannot diverge from the cell to the left. Backstopped structurally as well — check_post_run_invariants rejects a state_backed success that committed parts with schema_changed = None (summary.rs), and finalize.rs panics on it under debug_assertions, the build every live test runs" }
    keyset:         { test: keyset_export_enforces_on_schema_drift_fail }
    mongo_parallel: { na: "the gate IS applied (check_from_sink_schema, mongo_parallel.rs), but a Mongo export's Arrow schema is a FIXED {_id, document, meta} shape — the document is one verbatim extended-JSON blob column, so adding/dropping a document field does NOT change the Arrow schema and cannot drift. The gate is wired defensively; there is no structural drift to trip it (a meta_columns config change is the only mover, covered by the meta cell)" }

  - id: quality_gates
    what: "the `quality:` block's tripwires. `row_count_min`/`max` is the COMPLETENESS gate (Severity::Fail -> exit 3) and must fire on every runner: it was Chunked-only once, so a truncated keyset/parallel extract — the paths auto-selected for LARGE tables, where completeness matters most — exited 0 with the tripwire silently disarmed (`run_chunked_quality_gate`, job.rs). `null_ratio_max` and `unique_columns` are single-batch checks by construction. Added as a row because the feature had none: the tests existed, scattered across three files, with nothing asking whether every runner was among them."
    single:         { test: row_count_min_gate_fails_when_below_threshold }
    chunked:        { test: gremlin_chunked_empty_middle_chunk_does_not_false_fire_row_count_min }
    chunked_checkpoint: { na: "not a per-runner re-application: the gate runs in `run_export_job` AFTER the runner returns, keyed on `plan.strategy` (Chunked | Keyset), so every chunked variant is inside the same arm as the cell to the left — there is no checkpoint-specific code path to bypass it" }
    keyset:         { test: keyset_quality_gate_failure_exits_data_integrity_3 }
    mongo_parallel: { na: "runs UNDER `ExtractionStrategy::Keyset` (single.rs: a Mongo keyset export with parallel > 1 fans _id-range workers), so it takes the Keyset arm of the same match — the cell to the left is the same code. A separate strategy variant would need its own `test` cell here." }

  - id: shape_drift_warn
    what: "detect_shape_drift — advisory warning when a string/binary column's max byte length grows past the factor. Needs the run-wide per-column max-bytes aggregate. Since ADR-0028 the warn is applied at the finalize_export seam wherever a runner fed shape bytes into the ledger (merge_shape, max-merge) — today only the single sink drains them, so the na cells below still hold; a runner that starts feeding gets the warn for free (born na)."
    single:         { test: growth_above_threshold_warns }
    chunked:        { na: "advisory, single-batch-only by design (documented on shape_drift_warn_factor): the multi-part runners write through several sinks and never aggregate the run-wide per-column max bytes, so there is nothing to compare" }
    chunked_checkpoint: { na: "advisory, single-batch-only by design — same reason as the plain chunked cell (several sinks, no run-wide max-bytes aggregate)" }
    keyset:         { na: "advisory, single-batch-only by design — no run-wide max-bytes aggregate across pages" }
    mongo_parallel: { na: "advisory, single-batch-only by design — no run-wide max-bytes aggregate across workers" }

  - id: value_checksum_form_b
    what: "Form B — the sink's per-column value checksums are harvested into summary.column_checksums so finalize_manifest RECORDS them and `rivet validate` can re-read the parts and verify the Arrow→Parquet encode. The sink COMPUTES them for every runner (track_checksum in on_batch); since ADR-0028 every runner FEEDS them into summary.ledger and the HARVEST happens once at the finalize_export seam — no runner calls harvest itself (round-9 had fixed the computed-then-discarded bug per runner; the seam removes the per-runner call entirely). ADR-0029 then made the feed KEYED and the coverage COMPUTED: a runner contributes under a UnitId (its commit unit — Run for single, Chunk for chunked/checkpoint/mongo_parallel, Page for keyset-sequential, Range for keyset-PARALLEL, whose parts publish per page but whose checksums publish per committed range), commit::record_part registers the same UnitId for every manifest part, and the seam compares the two sets — full cover records, any uncovered or hydrated part suppresses. So the cells below grade MORE than before: each asserts its runner RECORDS column_checksums in the destination manifest, and a runner that paired its part and its checksum under different UnitIds now suppresses and turns its cell RED. The structural backstop grew the matching half — check_post_run_invariants rejects a state_backed success carrying column_checksums_short_cover (a part this run recorded whose unit contributed nothing, which on a SUCCESS can only be a mis-pairing), so the fail-safe-but-silent direction is loud on every runner under debug_assertions, the build live tests use."
    single:         { test: pg_type_matrix_value_checksum_guard }
    chunked:        { test: chunked_export_records_form_b_checksums_and_validate_passes }
    # The load-bearing half is that test's BASELINE arm: a clean parallel-checkpoint
    # run (parallel: 4, chunk_checkpoint: true) must record Form B in the destination
    # manifest AND `rivet validate` (Full) must re-read it — the test says so in its
    # own body ("so the suppression below is not vacuous"). The SEQUENTIAL checkpoint
    # runner feeds the ledger inside its per-chunk loop (sequential_checkpoint.rs,
    # contribute_checksums under UnitId::Chunk(chunk_index)) with no dedicated live
    # cell; its backstop is structural (check_post_run_invariants rejects a
    # state_backed parquet success with empty, un-flagged column_checksums, and since
    # ADR-0029 also one carrying column_checksums_short_cover; finalize.rs panics on
    # either under debug_assertions, which is the build live tests run).
    # The RESUME arm of this cell is the one ADR-0029 changed most: the suppression
    # it asserts is no longer a flag resume_m8.rs SETS, it is computed from the
    # hydrated parts having no commit unit — see
    # commit::tests::harvest_flags_a_hydration_only_resume_that_re_ran_nothing_and_has_no_checksums,
    # the unit case the live keyset-crash-recovery tests caught first.
    chunked_checkpoint: { test: chunked_checkpoint_resume_suppresses_form_b_so_validate_does_not_false_fail }
    keyset:         { test: keyset_export_records_form_b_checksums_and_validate_passes }
    mongo_parallel: { test: mongo_parallel_export_records_form_b_checksum }

  - id: files_committed_on_abort
    what: "the retry duplicate guard's ONLY input. `decide_export_retry` bails with BailDuplicateGuard when summary.files_committed > 0 (pipeline/single.rs), and commit::record_part is the sole production site that raises it — so a runner that aborts BEFORE its record_part drain reports ZERO while its successful workers' parts are already durable, and a TRANSIENT failure retries the whole export over them. Found by the third hunt: keyset_parallel bailed above the drain since 0.23.0. Measured pre-fix — 4 parts on disk, `retry 1/2` + `retry 2/2`; with a range whose output SHRANK between attempts (mid-backoff DELETE) the earlier attempt's extra part survived unoverwritten: 751 rows / 750 distinct, id 501 duplicated. NOTE the reason the existing tests missed it, because it generalises: decide_export_retry's unit matrix FEEDS files_committed as a parameter (0/2/5) and is correct on every input, while the keyset worker-error live test DELETES the orphan parts before its clean re-run (a vacuous-oracle guard its own comment explains). Neither observes the VALUE one layer hands the other — this row exists to make that boundary a per-runner obligation."
    # Was a reasoned `na` ("= N by construction — not a cell to prove") until the
    # 2026-08-29 harness round wired maybe_error_at_index("single_part_commit", i)
    # into the commit loop and PROVED the construction at the boundary: the test
    # reads files_committed from the run's own metrics row and goes RED with the
    # record_part increment stubbed (left: Some(0), right: Some(2)).
    single:         { test: single_commit_error_still_counts_the_durable_parts_postgres }
    chunked:        { na: "records INSIDE the per-chunk loop — write_sink_parts then record_part per chunk (run_chunked_sequential, chunked/exec.rs), so an error on chunk N leaves files_committed = the parts of chunks 0..N-1 by construction. The PARALLEL twin drains worker parts through record_part post-join BEFORE its `let errs = …; bail!` (exec.rs), which is the ordering keyset_parallel got wrong — so it too reports the durable count on abort by construction." }
    chunked_checkpoint: { na: "same ordering, verified per runner: sequential_checkpoint.rs records inside the per-chunk loop; parallel_checkpoint.rs drains every worker part through record_part and only THEN evaluates the worker-error bail and the not-completed-task bail (parallel_checkpoint.rs, `let errs = poison::into_recover(errors)` after the drain loop). Nothing aborts above a pending drain." }
    keyset:         { test: parallel_keyset_worker_error_still_counts_the_durable_parts_postgres }
    mongo_parallel: { na: "records inside the collection loop — `for (w, res) in results { let out = res?; ... record_part }` (mongo_parallel.rs:105-132), so workers before the failing index have ALREADY recorded when `?` fires. A worker-0 failure still reports zero, but mongo_parallel re-mints its part stamp per invocation (mongo_parallel.rs:64), so a retry collides with nothing to overwrite and leaves both copies — a DIFFERENT defect (orphan accumulation, not a bypassed guard), tracked separately." }

  - id: guard_manifest_mode
