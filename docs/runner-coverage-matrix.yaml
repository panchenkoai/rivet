    mongo_parallel: { na: "shared-seam (worker plan clones share the Arc)" }

  - id: source_harm_and_diagnosis
    what: >-
      the per-export SOURCE-HARM bracket and the DIAGNOSIS line — harm_snapshot before
      the strategy dispatch and again after it (deltas persisted via record_harm into
      export_harm), pg_temp_bytes_snapshot around the same window (pg_temp_bytes_delta +
      the temp-file spill warning), and run_diagnosis printing the per-export DIAGNOSIS
      that hedges attribution under concurrent siblings and points at the run-level harm
      line. Same shape as open_forensics: taken ONCE in run_export_job around the strategy
      branch, so no runner can bypass it — and, like open_forensics, the real bypass risk
      is the SEPARATE apply entry point. That gap was REAL for the whole 0.24.x series
      (found by the round-3 bughunt, 2026-08-14): run_export_job_with_chunk_source
      (`rivet apply <plan.json>`) re-called capture_open_forensics and the bytes_read
      harvest but had NO harm_snapshot, NO pg_temp_bytes_snapshot and NO run_diagnosis, so
      an apply of a sealed plan recorded zero export_harm rows and never said a word about
      a source it had just spilled to disk. CLOSED: the apply entry point now brackets the
      same window and prints the same line, and the offline gate
      `both_job_entry_points_bracket_the_source_harm_window`
      (tests/offline/runner_frame_gate.rs) fails the build if either entry point loses it.
      This is an ENTRY-POINT axis, not a runner axis — the cells below speak only about
      the four runners.
    single:         { na: "shared seam — harm_snapshot/pg_temp_bytes_snapshot bracket the strategy dispatch inside run_export_job and run_diagnosis prints after it, covering all four runners in one place (like capture_open_forensics); no per-runner divergence on the `rivet run` path. Proven end-to-end by pg_run_persists_source_harm_rows / mysql_run_persists_source_harm_rows / mssql_run_persists_source_harm_rows (the rows land in export_harm) and the pure-fn decisions by run_diagnosis_flags_flaky_link_and_spill_signals_only + pg_temp_bytes_warning_hedges_attribution_under_concurrent_siblings" }
    chunked:        { na: "shared seam (run_export_job brackets the dispatch)" }
    chunked_checkpoint: { na: "shared seam (run_export_job brackets the dispatch — the bracket is taken around the whole strategy branch, so it covers both chunked columns identically)" }
    keyset:         { na: "shared seam (run_export_job brackets the dispatch)" }
    mongo_parallel: { na: "shared seam (run_export_job brackets the dispatch); the one distinct entry point is APPLY (run_export_job_with_chunk_source), which re-applies the SAME bracket (harm_snapshot + pg_temp_bytes_snapshot around the dispatch, run_diagnosis after status resolution — job.rs), guarded by both_job_entry_points_bracket_the_source_harm_window (tests/offline/runner_frame_gate.rs)" }

  - id: throughput_self_check
    what: >
      the run-over-run throughput self-check — every export a run finishes is compared to its
      own previous success and a regression is WARNed with an actionable pointer. Like
      source_harm_and_diagnosis above, this is an ORCHESTRATOR-TAIL axis, not a runner axis,
      and the cells below say so rather than pretending the runner columns grade it. Recording
      it here anyway because the rule is that a per-export feature never goes silently
      unrecorded — and because the tail axis is where it broke, twice. It shipped wired into
      `run()` only (so `apply` and `apply --pool` skipped it), was then fixed into emitting
      TWICE (parent AND re-exec'd child), and round 7 found a FIFTH tail still bypassing it:
      `rivet apply <plan.json>` returned from run_export_job_with_chunk_source without ever
      reaching the seam, so a 2.7x degradation exited 0 in silence and the degraded row
      silently became the next run's baseline. The guard that should have caught it was the
      same defect's twin — a hand-typed 3-anchor list over include_str!("run.rs"), blind to
      any tail in another file. CLOSED: one seam (run::self_check_throughput, which owns the
      re-exec'd-child deferral) and a guard that DERIVES its tail set by walking
      src/pipeline/**, requiring seam calls >= max(1, aggregate::build count) with a single
      machine-checked exemption. CLOSED at the value level too, 2026-08-16:
      apply_warns_when_the_same_export_degrades_run_over_run (tests/live/live_plan_apply.rs)
      drives two real `rivet apply <plan.json>` runs of ONE export and asserts the WARNING on
      the degraded run's stderr. The objection that had left this open — that the comparability
      floors (>=10000 rows AND >=5s wall on BOTH runs) make any fixture machine-speed dependent,
      so a fast host skips the pair and the test passes VACUOUSLY — is answered by taking the
      wall time from the SOURCE rather than the machine: `generate_series(1, 20000) g, (SELECT
      pg_sleep(${sleep_secs})) AS _s`, 6s then 14s over the SAME 20000 rows. Measured
      20000/6454ms then 20000/14415ms, both mode=full, ratio 2.2x against REGRESSION_RATIO 1.5,
      hardware-independent by construction. That is a fixture engineered past a DOCUMENTED
      activation threshold, which this repo requires — not the forbidden sleep that compensates
      for product behaviour; do not "simplify" it away. Non-vacuity is asserted FIRST and from
      the real producer: both runs' export_metrics rows must clear >=10000 rows, >=5000 ms, the
      2x scale bound, a matching mode and distinct run_ids, so a fixture that stops crossing a
      floor FAILS on the activation assertion instead of passing on a skipped pair — RED-proven
      both ways (500 rows -> the TooFewRows assert; sleeps removed, 413 ms -> the TooShort
      assert). RED against the mutant deleting the self_check_throughput call from apply_cmd.rs.
      It also pins the SERIAL attribution (the line must keep "check governor sheds", i.e.
      run_mode_label(1, false), never the source-sharing excuse) and asserts the FIRST apply is
      silent, so the run-2 line is provably the run-over-run comparison. ~23 s wall. Routed
      through the rig's new Rig::plan_json_env / Rig::apply_env — apply takes a PLAN PATH so it
      cannot go through cli_env, and that gap is why every prior plan/apply test hand-rolled
      run_rivet_env; the 6 pre-existing raw sites are a follow-up.
    single:         { na: "tail-level, not runner-level: the seam fires once per RUN in the orchestrator tail, above the strategy dispatch, so no runner can apply or skip it. The axis that CAN forget it is the tail (run/processes, run/in-process, run_waves, run_pool, apply_cmd's plan-artifact replay), and that axis is graded by the derived every_orchestrator_tail_routes_the_self_check_through_one_seam" }
    chunked:        { na: "tail-level — see the single cell; the runner is not a participant" }
    chunked_checkpoint: { na: "tail-level — see the single cell; the runner is not a participant" }
    keyset:         { na: "tail-level — see the single cell; the runner is not a participant" }
    mongo_parallel: { na: "tail-level — see the single cell. Note the apply entry point (run_export_job_with_chunk_source) is the tail that was MISSING the seam until round 7, the same entry point the source_harm_and_diagnosis row above had to re-apply its bracket to — one entry point, two features it had to be taught separately" }

  - id: memory_threshold_throttle
    what: "the `memory_threshold_mb` RSS throttle — pause/back off between chunks when the process RSS crosses the knob. DELIBERATELY chunked-family-only (three semantics: sequential pause-5s-once; plain-parallel block-until-below; checkpoint variants pause-once), and docs/reference/tuning.md documents exactly that scope. Round-4 (governor axis) found the doc claim guarded by NOTHING — the next runner edit could silently un-wire the throttle, or wire it into a runner the doc denies, and every suite stayed green. The cells below cite the wiring pin (tests/offline/memory_throttle_wiring.rs), which is a source-text guard failing BOTH directions: RED when a wired runner loses its check_memory call, RED-downward when a documented-absent runner gains one without this row/doc moving in the same commit. Honest strength: a pin proves wiring, not that the sleep fires — the threshold decision (resource::check_memory) has its own units."
    single:         { na: "documented absent (tuning.md): single-batch holds one batch in flight, so the Arrow batch-size memory model bounds RSS; absence is pinned downward by the_memory_throttle_stays_out_of_the_runners_the_doc_says_lack_it" }
    chunked:        { test: the_memory_throttle_is_wired_into_every_chunked_variant }
    chunked_checkpoint: { test: the_memory_throttle_is_wired_into_every_chunked_variant }
    keyset:         { na: "documented absent (tuning.md): keyset pages are bounded by page_size and the governor sheds workers under source pressure; absence pinned downward by the_memory_throttle_stays_out_of_the_runners_the_doc_says_lack_it" }
    mongo_parallel: { na: "documented absent (tuning.md): worker batches are bounded by page_size; absence pinned downward by the_memory_throttle_stays_out_of_the_runners_the_doc_says_lack_it" }
