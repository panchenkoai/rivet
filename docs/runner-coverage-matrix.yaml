# Runner-coverage matrix — every PER-EXPORT feature must be applied on EVERY export
# runner, not just the single-batch path. The columns below collapse to FOUR runner
# FAMILIES, but the code actually has ~EIGHT distinct commit loops: single;
# chunked_sequential / chunked_parallel / sequential_checkpoint / parallel_checkpoint;
# keyset_sequential / keyset_parallel (feat/parallel-keyset); mongo_parallel. Each
# family here stands for its variants — so a feature marked `test` on `keyset` may be
# proven only on keyset_SEQUENTIAL while keyset_PARALLEL silently lacks it (iteration 1
# of parallel-keyset shipped exactly that: the drift gate, wired into keyset_sequential,
# was absent on keyset_parallel; a human caught it, not this ledger — see below).
#
# STRUCTURAL BACKSTOP (feat/parallel-keyset, candidate A): two of the recurring
# scenarios below — `schema_drift_gate` and value-checksum Form B — are now guarded
# STRUCTURALLY by `RunSummary::check_post_run_invariants` (a debug/test panic in
# finalize_manifest), independent of this ledger. Each facade leaves a telltale on the
# summary when it runs (schema_changed = Some(_); column_checksums populated or
# ..._incomplete set); any `state_backed` success that committed parts with a telltale
# ABSENT panics in tests — so a drift/Form-B bypass on ANY batch runner (every variant,
# including keyset_parallel) fails RED regardless of whether it has a cell here. This
# ledger stays the map for the OTHER per-runner features (part stamp, cursor range,
# durability ordering) that have no such telltale; splitting the collapsed families into
# real per-variant columns is a tracked follow-up.
#
# PER-VARIANT VERIFICATION PASS, 2026-08-04. The follow-up above was DISCHARGED as an
# audit rather than as new columns: all EIGHT commit loops were read individually
# against all thirteen scenarios below (single; chunked_{sequential,parallel};
# {sequential,parallel}_checkpoint; keyset_{sequential,parallel}; mongo_parallel), and
# every claimed absence was then handed to an independent agent instructed to REFUTE it.
# Result: no collapsed family was hiding a divergence — zero new gaps. The columns stayed
# at four because 96 cells of prose would restate one fact (the families agree today)
# while adding a second ledger to keep in sync; the pass is recorded here instead.
#
# Three findings that are worth keeping, none of them a gap:
#   * shape_drift_warn reads `absent` on six variants if you ask "is it applied", and
#     `na` if you ask "should it be" — the `na` cells below are the honest answer, but
#     note the distinction is DESIGN, not structure. It is the one row where a future
#     reader could mistake the two.
#   * durable_manifest_before_advance on keyset_parallel LOOKS absent at
#     keyset.rs:716-722 (st.update before the manifest) and is not: the anchor+ranges
#     persist first (keyset.rs:375-377), resume ignores the cursor (keyset.rs:323), and
#     job.rs:1091-1099 keeps the anchor across a manifest gap. Cost one refutation pass
#     to establish; recorded so it does not cost another.
#   * files_committed_on_abort on mongo_parallel is genuinely not applied — the drain
#     bails at `let out = res?` (mongo_parallel.rs:106) ABOVE the record_part calls
#     (:121-131). Harm is bounded to the worker-0 case (a later worker's failure leaves
#     files_committed > 0, so decide_export_retry bails correctly) and to ORPHANS rather
#     than duplicates, because the stamp is re-minted per invocation (:64). That is the
#     defect the `na` cell below already names as tracked-separately, now measured.
#
# Round-8 proved this class is real AND recurring: `on_schema_drift: fail` returned
# exit 0 on keyset + parallel-Mongo because the drift gate lived only in single/chunked.
# Building this ledger then surfaced a bigger one — value-checksum Form B was absent on
# ALL three large-table runners.
#
# Columns are the four RUNNERS. A cell is EXACTLY one of:
#   test: <fn>  — the feature is applied on this runner AND a test proves it.
#   na:   <why> — the feature genuinely does not apply to this runner (by design),
#                 OR it is injected at a SHARED seam (the ExportSink) that no runner
#                 can bypass, so there is no per-runner divergence to test.
#   gap:  <why> — the feature is PER-RUNNER wired (a runner can forget it — some did)
#                 and is either ABSENT here, or applied but has no test proving it.
#
# The gap/na split is principled: a feature applied by shared-seam construction
# (meta_columns via ExportSink) is `na` (runner-agnostic, proven once); a feature
# each runner must EXPLICITLY re-apply (schema_drift gate, checksum harvest, part
# stamp) is `gap` when unproven — that is exactly the class that bites.

engines: [single, chunked, keyset, mongo_parallel]

scenarios:
  - id: failed_chunk_fails_the_run
    what: "a chunk/worker that FAILS (not crashes) must fail the run rather than ship a short export. Measured 2026-08-03: disabling the sequential guard (`pending > 0`) left 14 live tests green while a run shipped 100 of 150 rows as SUCCESS; disabling BOTH parallel-checkpoint guards left 56 green. Every prior test injected a PANIC, and a panic never reaches a guard that only runs once the loop finishes — hence the RIVET_TEST_ERROR_AT=chunk_export:N hook these tests added."
    single:         { na: "no chunk loop to continue past — a failed single export IS the run's failure (run_single_export returns Err); the retry side is decide_export_retry's own matrix" }
    # BOTH checkpoint runners are proven; the cell names the sequential one and
    # `a_failed_chunk_must_fail_the_parallel_run_not_ship_a_short_export` covers
    # the parallel twin. The parallel case goes RED only with BOTH its guards
    # disabled — the worker-error bail and the completion count are redundant
    # there, and the test says so in its own body rather than claiming two proofs.
    chunked:        { test: a_failed_chunk_must_fail_the_run_not_ship_a_short_export }
    keyset:         { test: parallel_keyset_worker_error_still_counts_the_durable_parts_postgres }
    mongo_parallel: { na: "the drain does `let out = res?` — the FIRST worker error propagates immediately, so there is no keep-going path and therefore no end-of-run guard that can silently fail to fire. The residual risk is the opposite one (a later worker's parts unrecorded because the bail preceded their drain), which is the durable-part-count scenario, not this one" }

  - id: adaptive_concurrency_governor
    what: "OPT-2 governor sheds parallel workers under source pressure (backs off to min_parallel, recovers as pressure eases). Runner-bypass class on the SAFETY knob: it was chunked-only, so a `parallel: N` keyset export on a straining replica adapted batches but never shed workers (#152). Now wired into keyset per-page (permit-per-page semaphore + the same Governor loop + min_parallel floor); the run journal records each ParallelismAdjusted."
    single:         { na: "single has no worker fan-out to govern (parallel is a multi-part-runner concept)" }
    chunked:        { test: governor_backs_off_under_concurrent_write_pressure }
    keyset:         { test: keyset_governor_backs_off_under_concurrent_write_pressure }
    mongo_parallel: { na: "mongo_parallel spawns one thread per _id range with NO shared permit ceiling — the governor's resize target does not exist there. The reader-level adaptive batch sizing (engine pressure counters) still applies; the concurrency governor is a permit-ceiling mechanism and mongo_parallel has no ceiling to shrink. A future ceiling would take a `test` cell here." }

  - id: schema_drift_gate
    what: "on_schema_drift enforcement — a drifted schema under `fail` aborts (exit 4). Each runner bypasses run_single_export, so each must re-apply the gate (check_from_sink_schema / check_from_type_mappings). Round-8: keyset + mongo_parallel had SILENTLY dropped it (exit 0 on drift)."
    single:         { test: schema_drift_removed_column_is_detected }
    chunked:        { test: chunked_range_export_enforces_on_schema_drift_fail }
    keyset:         { test: keyset_export_enforces_on_schema_drift_fail }
    mongo_parallel: { na: "the gate IS applied (check_from_sink_schema, mongo_parallel.rs), but a Mongo export's Arrow schema is a FIXED {_id, document, meta} shape — the document is one verbatim extended-JSON blob column, so adding/dropping a document field does NOT change the Arrow schema and cannot drift. The gate is wired defensively; there is no structural drift to trip it (a meta_columns config change is the only mover, covered by the meta cell)" }

  - id: shape_drift_warn
    what: "detect_shape_drift — advisory warning when a string/binary column's max byte length grows past the factor. Needs the run-wide per-column max-bytes aggregate."
    single:         { test: growth_above_threshold_warns }
    chunked:        { na: "advisory, single-batch-only by design (documented on shape_drift_warn_factor): the multi-part runners write through several sinks and never aggregate the run-wide per-column max bytes, so there is nothing to compare" }
    keyset:         { na: "advisory, single-batch-only by design — no run-wide max-bytes aggregate across pages" }
    mongo_parallel: { na: "advisory, single-batch-only by design — no run-wide max-bytes aggregate across workers" }

  - id: value_checksum_form_b
    what: "Form B — the sink's per-column value checksums are harvested into summary.column_checksums so finalize_manifest RECORDS them and `rivet validate` can re-read the parts and verify the Arrow→Parquet encode. The sink COMPUTES them for every runner (track_checksum in on_batch); the multi-part runners XOR-combine per part run-wide through the shared commit::{accumulate,harvest}_column_checksums seam (round-9 fix — previously computed then discarded)."
    single:         { test: pg_type_matrix_value_checksum_guard }
    chunked:        { test: chunked_export_records_form_b_checksums_and_validate_passes }
    keyset:         { test: keyset_export_records_form_b_checksums_and_validate_passes }
    mongo_parallel: { test: mongo_parallel_export_records_form_b_checksum }

  - id: files_committed_on_abort
    what: "the retry duplicate guard's ONLY input. `decide_export_retry` bails with BailDuplicateGuard when summary.files_committed > 0 (pipeline/single.rs), and commit::record_part is the sole production site that raises it — so a runner that aborts BEFORE its record_part drain reports ZERO while its successful workers' parts are already durable, and a TRANSIENT failure retries the whole export over them. Found by the third hunt: keyset_parallel bailed above the drain since 0.23.0. Measured pre-fix — 4 parts on disk, `retry 1/2` + `retry 2/2`; with a range whose output SHRANK between attempts (mid-backoff DELETE) the earlier attempt's extra part survived unoverwritten: 751 rows / 750 distinct, id 501 duplicated. NOTE the reason the existing tests missed it, because it generalises: decide_export_retry's unit matrix FEEDS files_committed as a parameter (0/2/5) and is correct on every input, while the keyset worker-error live test DELETES the orphan parts before its clean re-run (a vacuous-oracle guard its own comment explains). Neither observes the VALUE one layer hands the other — this row exists to make that boundary a per-runner obligation."
    single:         { na: "no fan-out to abort mid-way: run_single_export records each part as it commits, so an error after N parts leaves files_committed = N by construction. This is the shape the other runners must reproduce, not a cell to prove." }
    chunked:        { na: "records INSIDE the per-chunk loop — write_sink_parts then record_part per chunk (chunked/exec.rs:131-150), so an error on chunk N leaves files_committed = the parts of chunks 0..N-1 by construction. Same shape as single: there is no drain-after-the-fact to abort above." }
    keyset:         { test: parallel_keyset_worker_error_still_counts_the_durable_parts_postgres }
    mongo_parallel: { na: "records inside the collection loop — `for (w, res) in results { let out = res?; ... record_part }` (mongo_parallel.rs:105-132), so workers before the failing index have ALREADY recorded when `?` fires. A worker-0 failure still reports zero, but mongo_parallel re-mints its part stamp per invocation (mongo_parallel.rs:64), so a retry collides with nothing to overwrite and leaves both copies — a DIFFERENT defect (orphan accumulation, not a bypassed guard), tracked separately." }

  - id: guard_manifest_mode
    what: "cross-shape manifest guard — a batch export must REFUSE to overwrite a prior CDC manifest at the same prefix (and vice versa), or the two silently destroy each other's audit trail. HISTORY: round-11 found the TWO chunk-checkpoint runners bypassed the per-runner call (a chunked-checkpoint export clobbered a CDC prefix silently). Since 0.24.4 the guard is welded into RunnerFrame::open — the ONLY door to a batch destination (runner_frame_gate source-lint makes a bypass a diff-time failure) — so the feature moved from the per-runner class to the shared-seam class. The live cells below stay as belt-and-suspenders end-to-end proofs; the LOAD-BEARING guarantees are the frame's unit (open_refuses_a_cdc_prefix_before_any_part, RED-proven against a guard-less frame) and the lint (RED-proven against an injected bare create_destination)."
    single:         { test: cdc_scaffold_gets_its_own_prefix_and_cross_shape_overwrite_is_refused }
    chunked:        { test: chunked_checkpoint_refuses_to_clobber_a_cdc_manifest }
    keyset:         { test: keyset_export_refuses_to_clobber_a_cdc_manifest }
    mongo_parallel: { test: mongo_parallel_export_refuses_to_clobber_a_cdc_manifest }

  - id: meta_columns
    what: "__rivet_* meta columns (plan.meta_columns) injected into the output schema + batches."
    single:         { test: stand_meta_columns_postgres }
    chunked:        { na: "injected at the SHARED ExportSink seam (ExportSink::new copies plan.meta_columns; enrich_schema/enrich_batch inject) — every runner builds an ExportSink, none can bypass it, so injection is runner-agnostic and proven once by the single cell (ExportRequest carries no meta field at all)" }
    keyset:         { na: "shared ExportSink seam — runner-agnostic (keyset's ExportRequest::unwrapped carries no meta; the sink injects downstream)" }
    mongo_parallel: { na: "shared ExportSink seam — runner-agnostic (each worker's sink injects)" }

  - id: row_hash_and_its_contract
    what: "`meta_columns.row_hash` — the `_rivet_row_hash` column AND the `RowHashContract` (covered set + render id) recorded in the run manifest, so a reader can check coverage instead of assuming it. Both halves are `na` by SEAM, and the seams differ: the COLUMN is injected by `ExportSink` (enrich_schema/enrich_batch, like meta_columns); the CONTRACT is derived from the PLAN snapshot (`RunSummary` ← `RowHashContract::of(&plan.meta_columns.row_hash)`), not harvested from the sink — which is what keeps it off the value-checksum `gap` path, where only `single` harvested `sink.column_checksums` into the summary. Recorded here explicitly because 'meta column ⇒ na' is only half the reason: a contract harvested per runner WOULD be a gap, and the next reader needs to see which mechanism it is."
    single:         { test: plan_snapshot_records_the_row_hash_contract_the_run_applies }
    chunked:        { na: "shared seams — the column via ExportSink (no runner builds a batch without one), the contract via the plan snapshot the summary is built from; neither is re-applied per runner, so there is no divergence to test" }
    keyset:         { na: "shared seams — ExportSink for the column, plan snapshot for the contract" }
    mongo_parallel: { na: "shared seams — each worker's sink injects the column; the contract comes from the same plan snapshot" }

  - id: run_unique_part_naming
    what: "two runs into ONE destination prefix must not clobber — part filenames carry a run-unique token (millisecond %3f stamp or a random nonce), never a second-granularity stamp that collides."
    single:         { test: roast_rapid_incremental_runs_into_same_prefix_must_not_clobber_prior_parts }
    chunked:        { test: chunk_part_filename_is_collision_proof_for_same_chunk }
    keyset:         { test: parallel_keyset_two_full_runs_into_same_prefix_no_clobber_postgres }
    mongo_parallel: { test: mongo_parallel_two_rapid_runs_into_same_prefix_do_not_clobber }

  - id: durable_manifest_before_advance
    what: "the destination manifest covering a run's parts is durable BEFORE the delivery position advances past them (the silent-loss ordering) — cross-references docs/durability-ordering-matrix.yaml."
    single:         { test: f2_crash_window_manifest_written_cursor_absent }
    chunked:        { test: chunked_crash_resume_writes_a_complete_destination_manifest }
    keyset:         { test: keyset_checkpoint_crash_resume_writes_a_complete_destination_manifest }
    mongo_parallel: { na: "no mid-run delivery position — mongo_parallel takes a quiescent full scan with no checkpoint/cursor advance; the manifest is written once at finalize and a crash re-runs the whole export (steady-state no-loss/no-dup covered by mongo_batch_parallel_integer_id_no_loss_or_dup)" }

  - id: sparse_chunk_warn
    what: "run-start sparse-key cost warning (sparse_chunk_action) — a key span that divides into far more windows than the row count justifies is flagged at warn level before the windows execute."
    single:         { na: "no chunk windows — single mode issues one query, no BETWEEN-window explosion possible" }
    chunked:        { test: no_estimate_egregious_count_warns_never_bails }
    keyset:         { na: "index seek advances by `col > cursor` — no min/max range windows to explode, so the sparse-key cost class does not exist" }
    mongo_parallel: { na: "$sample-derived _id ranges, not (min..max)/chunk_size BETWEEN windows" }

  - id: resume_checkpoint
    what: "--resume / checkpoint continuation from the last durably-committed position."
    single:         { na: "no checkpoint — `--resume` is rejected for full mode (full_mode_resume_flag_is_rejected); incremental continues via the persisted cursor, not a chunk/page checkpoint" }
    chunked:        { test: chunked_crash_after_first_chunk_complete_resume_finishes_export }
    keyset:         { test: keyset_checkpoint_resume_second_run_captures_only_new_keys }
    mongo_parallel: { na: "no checkpoint/resume — run_mongo_parallel reads no checkpoint state; a crash re-runs the full quiescent scan" }

  - id: open_forensics
    what: "v18 failure forensics captured at run OPEN by capture_open_forensics — server_context_json (source version + limits, so a statement timeout / ERROR 3024 is explainable) + schema-at-open (columns/types via type_mappings LIMIT-0, so a run that fails BEFORE finalize still records its schema; export_schema was success-only, which left the field DB's 43 failures with none). Called once in run_export_job BEFORE the strategy branch, so all four runners share the seam; the runner-bypass risk was the SEPARATE apply entry point (run_export_job_with_chunk_source), now re-calling it explicitly."
    single:         { na: "shared seam — capture_open_forensics runs in run_export_job before the strategy dispatch, covering all four runners in one call (like meta_columns via ExportSink); no per-runner divergence on the `rivet run` path" }
    chunked:        { na: "shared seam (run_export_job pre-dispatch)" }
    keyset:         { test: keyset_export_persists_v18_forensics_columns }
    mongo_parallel: { na: "shared seam (run_export_job pre-dispatch); the one distinct entry point is APPLY (run_export_job_with_chunk_source), which re-calls capture_open_forensics — job.rs, guarding the runner-bypass class this ledger exists for" }

  - id: bytes_read_metric
    what: "the v23 bytes_read metric (decoded Arrow bytes read from the source) must count EVERY runner's reads — a per-runner harvest would be the exact bypass class (a runner that forgets it reports 0). Wired shared-seam instead: the counter is an Arc on the PLAN (plan.bytes_read), every ExportSink::on_batch increments it (per-chunk sinks and plan-cloning workers share the Arc by construction), and run_export_job harvests it ONCE after the runner returns. No runner-specific code exists to forget (#175, 2026-08-09)."
    single:         { na: "shared-seam: the sink increments plan.bytes_read; harvest is the single post-run read in run_export_job — proven once by bytes_read_accumulates_across_sinks_sharing_the_plan_counter (RED against dropping the fetch_add) + build_metric_row_maps_every_summary_and_plan_field (RED against dropping the mapping)" }
    chunked:        { na: "shared-seam (per-chunk sinks share the plan Arc — the two-sink case the unit test exercises)" }
    keyset:         { na: "shared-seam (worker plan clones share the Arc)" }
    mongo_parallel: { na: "shared-seam (worker plan clones share the Arc)" }

  - id: source_harm_and_diagnosis
    what: >-
      the per-export SOURCE-HARM bracket and the DIAGNOSIS line — harm_snapshot before
      the strategy dispatch and again after it (deltas persisted via record_harm into
      export_harm), pg_temp_bytes_snapshot around the same window (pg_temp_bytes_delta +
      the temp-file spill warning), and run_diagnosis printing the per-export DIAGNOSIS
      that hedges attribution under concurrent siblings and points at the run-level harm
      line. Same shape as open_forensics: taken ONCE in run_export_job around the strategy
      branch, so no runner can bypass it — and, like open_forensics, the real bypass risk
      is the SEPARATE apply entry point. That gap was REAL for the whole 0.24.x series
      (found by the round-3 bughunt, 2026-08-14): run_export_job_with_chunk_source
      (`rivet apply <plan.json>`) re-called capture_open_forensics and the bytes_read
      harvest but had NO harm_snapshot, NO pg_temp_bytes_snapshot and NO run_diagnosis, so
      an apply of a sealed plan recorded zero export_harm rows and never said a word about
      a source it had just spilled to disk. CLOSED: the apply entry point now brackets the
      same window and prints the same line, and the offline gate
      `both_job_entry_points_bracket_the_source_harm_window`
      (tests/offline/runner_frame_gate.rs) fails the build if either entry point loses it.
      This is an ENTRY-POINT axis, not a runner axis — the cells below speak only about
      the four runners.
    single:         { na: "shared seam — harm_snapshot/pg_temp_bytes_snapshot bracket the strategy dispatch inside run_export_job and run_diagnosis prints after it, covering all four runners in one place (like capture_open_forensics); no per-runner divergence on the `rivet run` path. Proven end-to-end by pg_run_persists_source_harm_rows / mysql_run_persists_source_harm_rows / mssql_run_persists_source_harm_rows (the rows land in export_harm) and the pure-fn decisions by run_diagnosis_flags_flaky_link_and_spill_signals_only + pg_temp_bytes_warning_hedges_attribution_under_concurrent_siblings" }
    chunked:        { na: "shared seam (run_export_job brackets the dispatch)" }
    keyset:         { na: "shared seam (run_export_job brackets the dispatch)" }
    mongo_parallel: { na: "shared seam (run_export_job brackets the dispatch); the one distinct entry point is APPLY (run_export_job_with_chunk_source), which — unlike open_forensics — does NOT re-apply this bracket: see the KNOWN GAP in `what:` above" }
