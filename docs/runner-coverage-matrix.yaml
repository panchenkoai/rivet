    chunked:        { na: "shared seam since 0.24.4 — the sequential runner opens a GUARDED frame at run start (RunnerFrame::open, in run_chunked_sequential — chunked/exec.rs) and the parallel one through RunnerFrame::open_shared (in run_chunked_parallel), which is `open` + an Arc (frame.rs); the per-chunk writers use open_unguarded on purpose (one manifest GET per run, not per chunk) and the `unguarded_callers_also_guard_at_run_start` lint pins that. Load-bearing proofs are the frame unit (open_refuses_a_cdc_prefix_before_any_part) + the runner_frame_gate lint; the live cell that used to sit here graded the CHECKPOINT runners and has moved one column right." }
