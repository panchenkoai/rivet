  - id: delete_semantics_are_end_to_end
    what: >
      Tombstones and the 'live current state is WHERE NOT __is_deleted' contract must be
      asserted against real rows read back, on every engine that can delete.
    mutant: "invert the __is_deleted flag; a sound cell goes RED on the read-back"
    postgres: { sound: "covered by the delete-capture cells in cdc-matrix" }
    mysql:    { sound: "covered by the delete-capture cells in cdc-matrix" }
    mssql:    { sound: "covered by the delete-capture cells in cdc-matrix" }
    mongo:
      sound: "closed 2026-08-25. The pre-existing test asserts the DEFAULT case (pre-images
        off ⇒ document NULL) and says so, which left rivet's own
        full_document_before_change(WhenAvailable) request — issued on every stream —
        verified by nothing: a silent no-op and a working pre-image are indistinguishable
        from a default collection. mongo_cdc_delete_carries_the_pre_image_when_the_collection_has_one
        (live_cdc_mongo.rs) enables changeStreamPreAndPostImages via the rig's
        MongoTest::enable_pre_images and asserts the delete carries the document AS OF the
        delete (measured {_id:9,v:'doomed'}, not the earlier 'seed'). RED against
        `ChangeOp::Delete => cse.full_document` — and the disagreement is the finding: the
        pre-existing delete test stays GREEN against that same mutant." 

  - id: every_reading_of_one_config_agrees
    what: >
      A CDC export's `table:` is read by MORE THAN ONE subsystem — the event router,
      the schema probe, the `initial: snapshot` baseline, the preflight type report
      that `rivet load` plans the warehouse from, and the manifest's recorded
      identity. Each resolves the string independently. They must all land on ONE
      relation, and where an engine's CATALOG can name it (a SQL Server capture
      instance, a PostgreSQL candidate query) the catalog is what they must follow —
      never the connection's default schema and never a name split by a rule the
      engine does not have.
    mutant: >
      Point any ONE reading back at the raw configured string (drop the resolved pair
      from the schema probe, from the snapshot leg's read, from the preflight query,
      or split a Mongo collection name on the first dot). A sound cell goes RED on
      the CONTENT — wrong columns, a fabricated baseline, a foreign identity in the
      manifest — never on a count, because every count stays plausible.
      MEASURED on SQL Server 2026-08-26: with the schema probe reading the default
      schema, an export ran `status: success`, exit 0, no warning, and the parquet
      carried a decoy table's columns while the captured relation's only data column
      was absent entirely; the `initial: snapshot` leg deposited a row that had never
      existed in the captured table into that table's own prefix.
    postgres:
      sound: "pg_cdc_classification_asks_about_the_resolved_relation_not_the_search_path_one
        (live_cdc.rs) — RED before the fix on a run that printed two contradictory
        sentences: a WARN that the name resolves to deep.vv, then an Error that it is
        a VIEW and to capture the base table it reads — the relation the warning had
        just elected. PostgreSQL's readings are the candidate query, classification
        and the schema probe."
    mysql:
      sound: "roast_mysql_cdc_refuses_a_bare_name_a_second_database_also_holds
        (live_cdc.rs) — MySQL's second reader is the SERVER-WIDE binlog, which the
        privilege-filtered catalog structurally cannot see, so agreement here means
        the catalog precheck and the wire guard refuse the same config. RED against
        removing either half; both postures measured (root sees both databases and
        bails at the precheck; the `rivet` user's filtered catalog passes and the
        wire guard bails on the first foreign event)."
    mssql:
      sound: "mssql_cdc_schema_probe_follows_the_capture_instance_not_the_default_schema
        + mssql_cdc_snapshot_leg_reads_the_captured_relation_not_the_default_schema
        + mssql_cdc_refuses_an_unknown_capture_instance_before_the_snapshot_is_durable
        (live_cdc_mssql.rs). Three readings, three tests: the drain's probe, the
        snapshot baseline, and `rivet check` (whose report `rivet load` plans the
        warehouse schema from — asserted in the first test). Each RED-proven against
        the reading it guards. This engine earned the shape: it is the only one whose
        `table:` is accompanied by a second identifier (`capture_instance:`) that
        settles the question outright, and it was the last to consult it."
    mongo:
      sound: "mongo_cdc_captures_a_dotted_collection_without_swallowing_its_sibling
        (live_cdc_mongo.rs) — Mongo's disagreement is not about schemas but about how
        many READINGS a dotted name has. RED-proven twice on one fixture: with the
        router's split arm restored the capture takes the sibling collection too
        ({dotted, sibling} vs {dotted}), and with finalize's engine-blind split
        restored the snapshot leg's manifest records {schema: <db>, table: orders} —
        a different, existing collection. The database is not a schema."

  - id: spill_crash_mid_tail_atomicity
    what: "with RIVET_CDC_SPILL_DIR set, a transaction past the memory cap keeps its head in memory and its tail on disk — and a CRASH while that tail is being handed out must lose nothing on resume. The framing decides this: only the tail's true last row (per transaction) may carry `committed`, or the sink rolls + checkpoints past a commit whose remaining rows die with the crashed process's spill file"
    mutant: "spill.rs::closes_group -> true (every spilled row closes its group): the sink rolls mid-group, the checkpoint advances past the group's commit, and the resume skips the rows still in the dead process's spill"
    postgres:
      na: "the crash window cannot OPEN here: PostgreSQL spills exactly one transaction, whose only `committed` row is the tail's very end (`close_head_of_group` marks nothing while `tail_len > 0`, `close_tail_event` only `at+1 == len`) — so `should_roll` first fires when the tail is fully drained and the sink cannot act mid-tail. The framing itself is graded offline (`a_split_transaction_closes_on_its_true_last_row`, spill.rs) and the delivery end-to-end by pg_cdc_a_transaction_past_the_memory_cap_spills_rather_than_failing (live_cdc.rs)."
    mysql:
      na: "same structural closure as postgres — one transaction per spill, its single commit at the tail's end, so no sink action is possible mid-tail. The seal-failure ordering (`spill_error` checked before `pending` is popped) keeps a half-transaction from shipping when sealing itself fails; delivery end-to-end by mysql_cdc_a_transaction_past_the_memory_cap_spills_rather_than_failing (live_cdc.rs)."
    mssql:
      sound: "roast_mssql_cdc_a_crash_mid_spilled_tail_loses_no_group_on_resume (live_cdc_mssql.rs) — the ONE engine where the window exists: its tail holds SEVERAL `__$start_lsn` groups, each group's last row a real commit, so the sink can roll + checkpoint + ack between spilled groups and crash before the rest. PER_TX=7 over rollover 5, because at 5 every roll lands on a group boundary and the early-close mutant 'commits' only where the checkpoint is accidentally legal (measured: two mutants green at PER_TX=5). RED: 19 of 21 rows, the checkpoint past a commit whose last two rows died with the process."
    mongo:
      na: "no transaction buffer exists to spill: every change-stream event is its own commit (`single_event_commit`), the sink may roll after any event, and the soak stand asserts the no-spill property as its CONTROL (`assert_cycle_spilled`, soak_spill.rs) — if Mongo ever grows a buffer, that assertion says the control stopped being one."
