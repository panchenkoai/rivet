# CDC EVIDENCE matrix — not "is this contract covered", but "would the coverage BITE".
#
# The three sibling CDC ledgers grade coverage: cdc-matrix asks whether a behaviour
# has a test per engine, cdc-axis-matrix derives the config/hook axes from the product
# and asks the same, cdc-type-fidelity-matrix does it per type. All three are answered
# by a test EXISTING. None of them can see a test that exists, runs, passes, and could
# not fail against the defect it names.
#
# This file grades that second question, per engine, because the 2026-08 CDC audit
# found the failure is not distributed at random — it recurs as a handful of SHAPES,
# and a shape that bit three engines will bite the fourth. Rows are those shapes.
#
# The audit's own headline is the reason this file is not a nicety. `roll_all` writes
# the pre-ack manifest as a cumulative SUPERSET of every part acked so far
# (src/source/cdc/sink.rs:289-299) — that manifest is the only thing that makes a
# crash inside the ack window recoverable by a manifest-authoritative loader. Mutating
# it to publish only the LAST part leaves `cargo test --lib` at 2607 passed, 0 failed.
# Measured by hand 2026-08-23, not inferred. Every ledger in this repo said that
# contract was covered.
#
# ── vocabulary ───────────────────────────────────────────────────────────────
#   sound    the named test would go RED against the named mutant. Say WHICH mutant.
#   vacuous  a test exists and cannot fail against the defect it guards. Sub-kind in
#            the note: self-oracle | below-threshold | absence-only | skip-as-pass |
#            second-cause (an exit-status oracle over a fixture broken twice).
#   absent   nothing covers this shape on this engine.
#   na       structurally inapplicable HERE — and the reason is written out, never
#            "the other engines don't have it". An `na` with no reason is a defect.
#
# A cell may not be promoted to `sound` on an argument. Promote it when the mutant
# has been applied and the test observed to fail — the same bar the mutation gate
# holds product code to.
#
# Guarded by tests/offline/cdc_evidence_matrix_guard.rs, which DERIVES the engine
# columns from `SourceType` rather than reading a list typed in here. That derivation
# is deliberate: the audit found the conformance gate's four engine columns were tied
# to nothing, so a fifth CDC engine would have arrived with no row asking about it.

engines: [postgres, mysql, mssql, mongo]

shapes:

  - id: resume_reads_a_fresh_destination
    what: >
      A crash/resume test must not let the CRASHED run's durable parts satisfy the
      resume leg's oracle. Parts are durable before the panic (sink.rs:269-279 flushes,
      then the hook fires, then save+ack at :302-309), so a resume that captures ZERO
      still passes when both runs share one destination and the oracle globs parquet.
    mutant: >
      Move `p.save(ck)` + `stream.ack(p)` above the flush loop in `roll_all` — i.e. ack
      before the data is durable. A sound cell goes RED; a vacuous one stays green
      because the mutant's entire loss window is exactly the orphan parts it globs.
    postgres: { sound: "resumes into a fresh out2/ — live_cdc.rs:2849-2863" }
    mysql:    { sound: "resumes into a fresh out2/ — live_cdc.rs:474-486" }
    mssql:    { sound: "resumes into a fresh out2/ — live_cdc_mssql.rs:782-795" }
    mongo: { sound: "the resume leg takes its own destination via Rig::resume_into_fresh_dest
        (live_cdc_mongo.rs, mongo_cdc_crash_after_flush_before_ack_re_reads_on_resume).
        RED-proven by deleting the resume run: `id 1 lost across the crash`, where the
        shared-destination version stayed green because the crashed run's orphans satisfied
        it. That seam also had to set the CONTAINER-visible path, not only the host one —
        the DuckDB oracle reads from inside a container and a resume destination it cannot
        see reads zero, which looks like data loss and is a harness bug." }

  - id: configured_identity_is_cross_checked_before_the_first_ack
    what: >
      The config's `table:` is a LABEL; the catalog is truth. An engine whose wire
      identity can differ from the configured string needs that compared AT OPEN,
      because every routing filter here is byte-exact and the commit boundary is
      recorded BEFORE it — so a mismatch drops 100% of the events while the run
      checkpoints and advances the source cursor over them.
    mutant: >
      Delete the open-time cross-check (PG `check_configured_tables_are_routable`,
      MSSQL's `cdc.change_tables` bail). A sound cell goes RED on a 0-row `success`;
      a missing one ships the export green. MEASURED on PostgreSQL 2026-08-24:
      a partitioned parent took 2 committed rows to `rows: 0, status: success`,
      slot 0/AE5F8BB8 -> 0/AE6010D8, peek EMPTY after — and re-running with the
      config corrected recovered NOTHING while the source still held both rows.
    postgres:
      sound: "roast_pg_cdc_refuses_a_partitioned_parent_before_acking_the_slot
        (live_cdc.rs) — RED against three mutants: guard removed, Never downgraded
        to a warn, and the partition names dropped from the message. Asserts the
        slot did NOT move, which is the whole difference between a config error and
        two rows nobody can get back."
    mssql:
      sound: "mssql_cdc_capture_instance_name_must_not_decide_the_table +
        the two-table content variant (live_cdc_mssql.rs:622, :668) — RED against
        the split-once name heuristic that routed 6 of 8 field tables wrong."
    mysql:
      na: "MySQL has no relation that emits under a name other than the configured
        one: partitioning is a storage-engine concern and the binlog's table_map
        carries the LOGICAL table. MEASURED 2026-08-24 rather than assumed — a
        RANGE-partitioned `mpart` captured both inserted rows through a config
        naming the parent, on the rivet-mysql-cdc-1 stand."
    mongo:
      sound: "mongo_cdc_warns_when_a_configured_collection_does_not_exist
        (live_cdc_mongo.rs) — RED against this shape's mutant, MEASURED 2026-08-26:
        with the open-time cross-check disabled (`if false &&`), a config naming a
        collection the database does not hold ran to `status: success, rows: 0` with
        no warning of any kind, and the test failed on the missing name.
        The cell was `na` until 2026-08-25 on a reason that answered a narrower
        question — Mongo has no SECOND identity (a change stream's `ns` is the
        collection the write addressed, no parent/child relation surfaces events
        under another name), so the cross-check compares against the catalog's
        PRESENCE rather than against a rival name. That is the same failure this
        shape grades: a configured table no event can name, shipped green.
        Loud here means a WARNING, not a bail, and the asymmetry is structural: a
        Mongo collection is created by its first write, so refusing an absent name
        would break the legitimate start-the-stream-then-write setup. The SQL
        engines bail because their unroutable relation EXISTS and can never emit
        under the configured name — a permanent error, not a pending one."

  - id: readback_is_manifest_scoped
    what: >
      The read-back oracle must read the parts the run DECLARED, not every parquet under
      the prefix. A glob answers "what does the destination hold"; every consumer
      (`rivet load`, `validate`, reconcile) reads what the manifest names. On a resume
      cell the difference IS the test: a crash leaves parts no manifest declares.
    mutant: >
      Publish a manifest that under-declares (drop the last part from the set written in
      `roll_all`). A manifest-scoped oracle reads short and diverges from the source; a
      glob oracle reads the full set and passes. Proven in the batch oracles 2026-08-23:
      source 1000, glob 1000 PASSED, declared 800 CAUGHT.
    postgres:
      sound: "the_cdc_reader_reads_the_manifest_declared_parts_not_the_directory
        (tests/live/live_cdc.rs) drives a real CDC run, removes one part from the
        manifest while leaving the FILE on disk (the shape a crash leaves), and asserts
        cdc_id_ops reads SHORT of the directory. It is RED against the mutant that
        undoes this whole commit (declared_parquet_parts -> files_with_extension) —
        which the FIRST version of this cell's evidence was not: that test asserted on
        a sibling duckdb helper and never called the reader it claimed to prove, so the
        mutant left it green. read_cdc_changes resolves via declared_parquet_parts — the union over the immutable manifest-<run_id>.json
        copies — so every caller of cdc_id_ops/read_cdc_changes reads what the run
        DECLARED. Proven to bite before it was wired in:
        the_cdc_reader_reads_the_manifest_declared_parts_not_the_directory
        stages two durable parts with one named by no manifest; the glob reads 6, the
        declared reader 3. Whole CDC live suite re-run after the switch: 157/157."
    mysql:
      sound: "same shared reader as postgres (declared_parquet_parts), plus the
        pre-existing manifest_driven_int_ids — live_cdc_mbt.rs:413."
    mssql:
      sound: "same shared reader — live_cdc_mssql.rs's cdc_id_ops/read_cdc_changes
        call sites (:96, :193, :249) are manifest-scoped by construction now."
    mongo:
      sound: "BOTH halves, because an adversarial pass caught the first version of
        this cell asserting something false. (a) read_mongo_cdc_changes
        (tests/common/parquet.rs) resolves through declared_parquet_parts like its SQL
        sibling. (b) The claim that this was 'Mongo's read-back on every crash and
        resume cell' was WRONG — live_cdc_mongo.rs read through the duckdb GLOB
        oracles, so the switch changed nothing for the cells that matter. Those nine
        call sites are now duckdb_declared_distinct_set / duckdb_declared_rows, which
        read the manifest-declared parts; 43 Mongo live tests green across the
        4.4 / 5.0 / 8.0 stands afterwards."
  - id: fold_fixture_crosses_its_threshold
    what: >
      Anything that FOLDS or accumulates across parts must be graded over >= 2 parts.
      Over one element every fold operator is identical (0+s == 0^s == 0|s), and a
      superset over one part is indistinguishable from a last-write.
    mutant: >
      Pre-ack manifest: publish only `&s.parts[len-1..]` instead of the whole slice.
      Form B: `*e = sum` instead of `wrapping_add`. MEASURED: the manifest mutant leaves
      the lib suite at 2607 passed, 0 failed.
    postgres:
      na: >-
        na — the manifest fold lives in the SHARED sink (`build_manifest` over `s.parts`,
        src/source/cdc/sink.rs), not in any engine adapter: no engine can reach a different
        fold, so it is proven once on the fixture that drives it rather than four times. This
        is the shared-seam/gap distinction the runner-coverage matrix draws — a feature applied
        by construction is `na`, a feature each engine must re-apply is a `gap`. The threshold
        rule itself is engine-agnostic for the same reason. Graded on mysql; see that cell.
    mysql:
      sound: >-
        closed 2026-08-25. The fixture inserted 30 rows in ONE autocommit statement at rollover
        10; `should_roll` gates on `committed`, which marks a TRANSACTION boundary, so it
        yielded exactly ONE part while two comments claimed three (MEASURED parts=1). A fold
        over one element makes every fold operator identical. Split into three statements
        (MEASURED parts=3). Proof that the FIXTURE was the defect, not the assertion: with the
        pre-ack manifest mutant (publish only `&s.parts[len-1..]`) applied, the OLD one-INSERT
        fixture stays GREEN and the new three-statement one goes RED — same mutant, same
        assertions, different fixture (tests/live/live_cdc_mbt.rs).
    mssql:
      na: >-
        na — the manifest fold lives in the SHARED sink (`build_manifest` over `s.parts`,
        src/source/cdc/sink.rs), not in any engine adapter: no engine can reach a different
        fold, so it is proven once on the fixture that drives it rather than four times. This
        is the shared-seam/gap distinction the runner-coverage matrix draws — a feature applied
        by construction is `na`, a feature each engine must re-apply is a `gap`. The threshold
        rule itself is engine-agnostic for the same reason. Graded on mysql; see that cell.
    mongo:
      na: >-
        na — the manifest fold lives in the SHARED sink (`build_manifest` over `s.parts`,
        src/source/cdc/sink.rs), not in any engine adapter: no engine can reach a different
        fold, so it is proven once on the fixture that drives it rather than four times. This
        is the shared-seam/gap distinction the runner-coverage matrix draws — a feature applied
        by construction is `na`, a feature each engine must re-apply is a `gap`. The threshold
        rule itself is engine-agnostic for the same reason. Graded on mysql; see that cell.
  - id: runs_the_engine_default_configuration
    what: >
      The stand must exercise the configuration an untuned production server has. A stand
      pinned to a non-default makes the majority code path unreachable by every test.
    mutant: >
      Reverse the positional index at sink.rs:755 (the nameless arm). Only a MINIMAL
      -metadata target can see it.
    postgres: { na: "test_decoding output is not configuration-dependent in this sense; the
        session-state class it DOES have (timezone/datestyle/bytea_output) is pinned on the
        reader's own connection and has its own non-default test" }
    mysql:
      sound: >-
        closed 2026-08-25. docker-compose pins --binlog-row-metadata=FULL while MySQL's
        own default is MINIMAL, so every live MySQL CDC test ran the by-NAME arm and the
        positional arm plus its arity guard were unreachable. Two live tests now flip the
        GLOBAL under a reset guard (`RowMetadata`, live_cdc.rs): under MINIMAL a same-arity
        `MODIFY .. AFTER` across the resume boundary SWAPS the columns (measured a='BBB'
        b='AAA', status success) and the run must warn; under FULL the same reorder maps
        by name and the run must stay quiet. RED-proven both directions against
        `row_metadata_warning` (always-None and always-Some).
    mssql:    { na: "change tables carry a fixed column set from the capture instance; there is
        no server knob that changes the image shape the reader sees" }
    mongo:
      sound: >-
        closed 2026-08-25. `changeStreamPreAndPostImages` is per-COLLECTION and off by default,
        and every Mongo CDC test ran that default — which is the right way round (unlike MySQL,
        where the stack pinned the NON-default). What was missing was the other side:
        rivet issues `full_document_before_change(WhenAvailable)` on every stream, and with the
        setting off that request is a silent no-op indistinguishable from a working one.
        mongo_cdc_delete_carries_the_pre_image_when_the_collection_has_one
        (tests/live/live_cdc_mongo.rs) turns it on via MongoTest::enable_pre_images and asserts
        the delete carries the document AS OF the delete (measured {_id:9,v:'doomed'}, not the
        earlier 'seed'), and self-skips out loud below server 6.0 where there is no pre-image
        to carry. RED against `ChangeOp::Delete => cse.full_document`; the pre-existing delete
        test stays GREEN against that same mutant, which is what made this a gap.
  - id: unknown_input_fails_loud_not_silent
    what: >
      Every "unknown -> default" boundary must warn or bail, never degrade silently. The
      audit found the SAME shape on all four engines, which is why it is a row and not
      four separate notes.
    mutant: >
      Feed the boundary its unknown value and assert a warning/error is produced. A silent
      arm passes today because nothing observes the degradation.
    postgres:
      sound: "TRUNCATE — the one that mattered — now bails: truncate_targets +
        truncate_is_ours + truncate_refusal_message (src/source/postgres/cdc.rs),
        graded offline by a_truncate_is_recognised_across_a_relation_list_and_refused_only_for_ours
        and live by roast_pg_cdc_refuses_a_truncate_instead_of_silently_diverging.
        RED against two mutants on different asserts: the guard removed (back to the
        measured `status: success, rows: 2` over an EMPTY source) and the refusal
        un-addressed (`if true`, which fails a bystander export on the same slot).
        Other non-DML lines stay unhandled and that is deliberate — TRUNCATE is the
        one that removes rows without events, so it is the one that diverges."
    mysql:
      sound: "the Xid-less group is closed by is_commit_statement (COMMIT / XA COMMIT,
        #ebc9d87), and the OTHER silent QUERY-event drop — TRUNCATE — now bails:
        truncate_target + truncate_refusal_message (src/source/mysql/cdc.rs), graded by
        a_mysql_truncate_statement_resolves_the_table_it_names (src/source/mysql/cdc.rs) offline and
        roast_mysql_cdc_refuses_a_truncate_instead_of_silently_diverging live. RED
        against two mutants on different asserts: the guard disabled (back to the
        measured `status: success, rows: 2` over an EMPTY source) and the addressing
        removed (which fails a bystander export reading the same binlog)."
    mssql:
      sound: "closed 2026-08-25 (src/source/mssql/cdc.rs::resume_from_checkpoint). A
        checkpoint that PARSES but carries no 'lsn' yielded None via `.and_then`, which
        fill_sql turns into fn_cdc_get_min_lsn — the entire retained change table re-read
        and re-delivered under a green exit (MEASURED live: ids [1,2,3,4] where [4] was
        owed). The decision moved out of live-only glue into a pure predicate so a mutant
        can grade it; `pinned` stays non-strict beside it, deliberately, because absent
        `pinned` is a supported legacy default whose value is the LOUD direction. RED
        against the exact prior bug (key absent -> Ok(None)) offline, over 5 malformed
        shapes, and live by
        mssql_cdc_checkpoint_without_an_lsn_must_refuse_not_silently_reread_everything."
    mongo:
      sound: "until_current_bound (src/source/mongo/cdc.rs) replaces the `.ok()` that
        swallowed every `hello` failure: a bounded run with no cluster-time ceiling now
        REFUSES. Mongo is the engine where this matters — the SQL engines keep a
        catch-up exit and terminate late without their bound, while past_time_bound is
        false for every event once Mongo's is None, leaving only the empty-poll check
        that sustained writes never trigger. Graded by
        until_current_refuses_when_the_cluster_time_bound_is_unavailable, RED against
        `return Ok(operation_time)` in place of the refusal. HONEST LIMIT: the live
        suite cannot produce the failing input (every stand answers hello correctly;
        faulting it means faulting the server, not the fixture), so the branch is
        pinned from the other direction by the existing
        roast_until_current_terminates_under_sustained_writes_and_keeps_backlog, which
        HANGS at its 30s ceiling when the bound is disabled — the exact state a silent
        None used to reach by accident."

  - id: fault_hook_has_a_crash_test
    what: >
      Each CDC fault hook must have a per-engine crash test. A hook covered on two engines
      of four is a guarantee claimed for four.
    mutant: "remove the hook's handling and see which engines notice"
    postgres:
      sound: >-
        closed 2026-08-25. roast_pg_cdc_crash_between_checkpoint_and_ack_re_reads_and_releases_the_slot
        (tests/live/live_cdc.rs). The DELIVERY half DOCUMENTS — three mutants (ack before the
        checkpoint, ack before the flush, ack to pg_current_wal_lsn) all stay green, because
        the crash fires before run 1's first ack and PG's resume authority is the SLOT, which
        run 1 never moved; the checkpoint file is a boolean (`resume_expected`), never a
        position. The RETENTION half GUARDS: the crash pins 2304 B and the resume releases to
        0, and neutering advance_slot leaves 2480 B pinned (RED). Closes the slot-pinning
        class from the crash side, where empty_transaction_churn covers the row-less side.
    mysql:
      sound: >-
        covered by cdc_fault_point_sweep_every_phase_boundary_recovers (tests/live/live_cdc_mbt.rs),
        which drives this hook among every phase boundary on the mysql-cdc stand. MySQL's ack
        is the trait no-op, so the checkpoint file alone carries resume — the same structural
        argument written out on the mongo cell, verified there against two ordering mutants.
    mssql:
      sound: >-
        covered by the dedicated test at tests/live/live_cdc_mssql.rs (the 12-row single-LSN
        transaction crashed at cdc_after_checkpoint_before_ack). This is the one engine where
        the hook is LOAD-BEARING rather than documentary: the checkpoint IS the only resume
        position and the ack is a no-op, so a checkpoint written mid-transaction skips the
        tail — the bug that test was RED-proven against.
    mongo:
      sound: >-
        closed 2026-08-25. mongo_cdc_crash_after_the_checkpoint_still_delivers_every_change
        (tests/live/live_cdc_mongo.rs), sibling to the cdc_after_flush_before_ack test whose
        vacuity this row used to cite — that one was fixed by resume_into_fresh_dest and is
        sound now. Two ordering mutants stay green for the structural reason stated in the
        test (the hook sits after every durability step; the resume token is per-event and
        consume-free, see TxnFramer::single_event_commit). What it grades is its
        preconditions: an empty resume leg fails outright, RED-proven by deleting the resume
        run. Oracle is the UNION of both legs — crashing AFTER the checkpoint means the
        resume legitimately starts past what leg 1 covered.
