        sentence: "the warehouse object exists and this state DB has no record of rivet loading it: drop or rename it, or load into another table"
    held_by:
      bigquery: { test: bigquery_load_refuses_a_table_it_did_not_load_on_every_attempt, asserts: "no record of rivet loading it" }
      snowflake: { gap: "no Snowflake cell loads over a table this state has no record of" }
      clickhouse: { test: a_range_refusal_claims_nothing_so_a_table_made_after_it_stays_foreign, asserts: "no record of rivet loading it" }

  - id: compact_merges_the_buffer_and_drops_it
    stated:
      - file: README.md
        sentence: "`rivet compact` merges them in with one `MERGE` per table and drops the buffer"
    held_by:
      bigquery: { test: base_and_buffer_cycle_run_load_compact_keeps_deletes_as_flags, asserts: "the buffer is dropped after the merge" }

  # ── Types (docs/type-mapping.md, docs/semantics.md) ──────────────────────────────────────
  - id: decimals_never_become_floats
    stated:
      - file: docs/type-mapping.md
        sentence: "**DECIMAL / NUMERIC** are never silently converted to float."
    held_by:
      contract: { test: contract_decimal_never_maps_to_float, asserts: "{} {} must not become float, got {dt:?}" }
      postgres: { test: golden_decimal_payments_exact_sums_and_decimal128_types, asserts: "SUM(amount)×10² must equal source golden (decoding must stay exact)" }
      mysql: { test: mysql_golden_decimal_payments_exact_sums_and_decimal128_types, asserts: "mysql amount column must not downgrade to {:?}" }
      mssql: { gap: "no golden decimal cell reads the Arrow type and the exact sums on this engine" }
      oracle: { gap: "no golden decimal cell reads the Arrow type and the exact sums on this engine" }

  - id: a_lossy_or_unmapped_type_fails_loud
    stated:
      - file: docs/type-mapping.md
        sentence: "**Rivet fails loud, not silent** — a lossy or unmapped type is named by `rivet check` and aborts the run, never quietly truncated."
    held_by:
      strict: { test: check_strict_and_run_strict_refuse_the_same_config_with_the_same_code, asserts: "run --strict wrote a part" }

      default_policy: { gap: "the refusal cells run under --strict; no cell runs a lossy mapping under the default policy and asserts the run aborts" }
    contradicted_by:
      known_red:
        - "sentinels[rivet_sent_ts9/full]: SUCCEEDED WITH A CHANGED VALUE"
  - id: uuid_and_json_keep_native_types
    stated:
      - file: docs/type-mapping.md
        sentence: "**UUID and JSON keep native types** — Parquet gets native `LogicalType::Uuid` / `LogicalType::Json`, not opaque strings."
    held_by:
      postgres: { test: parquet_schema_pins_postgres_matrix_logical_types, asserts: 'assert_col(&cols, "uid", FIXED_LEN_BYTE_ARRAY, Some(Uuid));' }
      mysql: { test: parquet_schema_pins_mysql_matrix_logical_types, asserts: 'assert_col(&cols, "extras", BYTE_ARRAY, Some(Json));' }
  - id: binary_stays_binary
    stated:
      - file: docs/type-mapping.md
        sentence: "stays Arrow `Binary` in Parquet."
    held_by:
      postgres: { test: golden_bytea_exact_binary_roundtrip, asserts: "DataType::Binary" }

  - id: identical_rows_produce_byte_identical_parts_across_releases
    stated:
      - file: docs/semantics.md
        sentence: "identical rows produce byte-identical parts (and the same fingerprint) across rivet releases, so a duplicate is safely droppable by fingerprint."
    held_by:
      all: { gap: "no cell exports the same rows with the previous release and this build and compares the part bytes" }
