  - id: force_overrides_the_success_gate_on_resume
    stated:
      - file: docs/reference/cli.md
        sentence: "with `--resume`, goes past the refusal to resume into a destination prefix whose `_SUCCESS` marker is already present (`RIVET_DEST_ALREADY_COMPLETE`, exit 5, ADR-0012 M8): the run continues an interrupted run of the export if one is recorded, else it runs as a plain run does. New parts land beside the old ones, nothing is overwritten, and `manifest.json` then describes only the new run"
    held_by:
      postgres: { test: a_forced_resume_over_a_complete_prefix_lands_beside_it_postgres, asserts: "manifest.json describes only the new run, as the refusal says" }
      mysql: { test: a_forced_resume_over_a_complete_prefix_lands_beside_it_mysql, asserts: "manifest.json describes only the new run, as the refusal says" }
      mssql: { test: a_forced_resume_over_a_complete_prefix_lands_beside_it_mssql, asserts: "manifest.json describes only the new run, as the refusal says" }
      mongo: { test: a_forced_resume_over_a_complete_prefix_lands_beside_it_mongo, asserts: "manifest.json describes only the new run, as the refusal says" }
      oracle: { test: a_forced_resume_over_a_complete_prefix_lands_beside_it_oracle, asserts: "manifest.json describes only the new run, as the refusal says" }

