        sentence: "A `completed` chunk is never re-claimed, even after a crash"
    held_by:
      sqlite_state: { test: i5_completed_chunk_task_is_not_reclaimed, asserts: "completed chunk 0 must not be re-claimed" }
      postgres_state: { gap: "the claim-after-complete invariant test opens the SQLite store only" }
    contradicted_by:
      known_red:
