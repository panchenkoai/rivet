# Guarantee matrix: every guarantee rivet states to its users, tied to the sentence that
# states it and to the cells that would fail if the sentence were false.
#
# Owner's rule (2026-10-08): what is not verified is not claimed, and what is claimed must be
# verified. An unproven sentence is answered by writing the check, not by softening the sentence.
#
# A row:
#   id:      stable name.
#   stated:  where the promise is made. `sentence` is VERBATIM (whitespace aside); the guard
#            fails when the file no longer contains it, so a reworded promise is re-tied here.
#   held_by: one cell per column the promise covers (an engine, a store, a destination, or
#            `all` where the promise is engine-independent). A cell is exactly one of
#              { test: <fn>, asserts: "<text copied from the body of that test>" }
#              { gate: <stage fn under dev/release_oracle>, asserts: "<text from its module>" }
#              { gap: "<why no cell holds it here>" }
#            A `test` counts only when its body would fail if the sentence were false; the
#            quoted assertion is the evidence, and the guard fails when the body loses it.
#   contradicted_by: what is known to break the promise today:
#              known_red:  a substring of an entry in dev/release_oracle/known_red.py
#              matrix_gap: "<ledger file>#<text in it>"
#              doc:        "<doc file>#<sentence that says the opposite>"
#
# A row is HELD when it has no `gap` cell and no contradiction. The guard
# (tests/offline/guarantee_matrix_guard.rs) pins the number of rows that are not, and the number
# of gap cells, shrink-only.
#
# `pending:` lists stated guarantees deliberately not tied yet, with the reason.

pending:

guarantees:
  # ── Batch: delivery and crash safety (docs/semantics.md) ─────────────────────────────────
  - id: no_row_silently_skipped
    stated:
      - file: docs/semantics.md
        sentence: "**No row is silently skipped.** The cursor only advances after the corresponding write succeeds (I3)."
    held_by:
      postgres: { test: crash_after_file_write_leaves_file_but_no_manifest_or_cursor, asserts: "recovery must leave every source id (1..=8) at the destination" }
      mysql: { test: mysql_crash_after_file_write_leaves_file_but_no_manifest_or_cursor, asserts: "recovery must leave every source id (1..=8) — a missing id is row LOSS" }
      mssql: { test: mssql_crash_after_file_write_leaves_file_but_no_manifest_or_cursor, asserts: "recovery must leave every source id (1..=8) — a missing id is row LOSS" }
      mongo: { test: mongo_crash_after_file_write_recovers_without_loss, asserts: "recovery after a mid-export crash" }
      oracle: { gap: "no Oracle batch cell crashes a run between the write and the cursor and reads the destination" }
    contradicted_by:
      known_red:
        - "live_sabotage::open_defect_a_cursor_moved_forward_delivers_or_refuses"
        - "chunking_stand::open_defect_a_float_chunk_column_under_query_keeps_its_fractional_keys"

  - id: no_incomplete_file_at_the_destination
    stated:
      - file: docs/semantics.md
        sentence: "**No file at the destination is incomplete.** Writers are finalized before destination upload (I1)."
    held_by:
      local: { test: crash_after_file_write_leaves_file_but_no_manifest_or_cursor, asserts: "recovery must leave every source id (1..=8) at the destination" }
      s3: { gap: "no cell cuts an S3 upload mid-part and lists the prefix" }
      gcs: { test: gremlin_cdc_gcs_upload_cut_fails_loud_then_recovers_without_clobber, asserts: "after healing, the union of GCS parts must hold every row (no gap, no clobber)" }
      azure: { gap: "no cell cuts an Azure upload mid-part and lists the container" }

  - id: at_least_once_at_the_destination
    stated:
      - file: docs/semantics.md
        sentence: "The trade-off is **at-least-once at the destination**: a crash between write and cursor advancement produces a duplicate file."
    held_by:
      postgres: { test: crash_after_file_write_leaves_file_but_no_manifest_or_cursor, asserts: "at-least-once: physical destination rows ({physical}) must be >= source (8)" }
      mysql: { test: mysql_crash_after_file_write_leaves_file_but_no_manifest_or_cursor, asserts: "at-least-once: physical destination rows must be >= source (8)" }
      mssql: { test: mssql_crash_after_file_write_leaves_file_but_no_manifest_or_cursor, asserts: "at-least-once: physical destination rows must be >= source (8)" }
      mongo: { test: mongo_crash_after_file_write_recovers_without_loss, asserts: "duckdb_assert_at_least_once(" }
      oracle: { gap: "no Oracle batch cell crashes a run between the write and the cursor and reads the destination" }
    contradicted_by:
      known_red:
        - "live_operator_contract::open_defect_a_second_concurrent_full_run_does_not_double_the_prefix"

  - id: uncategorized_errors_are_not_retried
    stated:
      - file: docs/semantics.md
        sentence: "**Uncategorized errors default to `Permanent`** (they are *not* retried)"
    held_by:
      all: { test: test_classify_permanent_errors, asserts: "should NOT be transient: {}" }

  - id: cursor_and_manifest_stay_behind_a_crash_after_the_write
    stated:
      - file: docs/semantics.md
        sentence: "| After `dest.write`, before manifest | file present | no entry | not advanced | re-extract → duplicate file at destination |"
    held_by:
      postgres: { test: crash_after_file_write_leaves_file_but_no_manifest_or_cursor, asserts: "after_file_write must leave manifest empty" }
      mysql: { test: mysql_crash_after_file_write_leaves_file_but_no_manifest_or_cursor, asserts: "after_file_write must leave manifest empty" }
      mssql: { test: mssql_crash_after_file_write_leaves_file_but_no_manifest_or_cursor, asserts: "after_file_write must leave manifest empty" }
      mongo: { gap: "the Mongo crash cell reads the destination after recovery, not the manifest and cursor between the crash and the recovery" }
      oracle: { gap: "no Oracle batch cell crashes a run between the write and the cursor" }

  - id: a_plain_run_never_skips_a_finished_run
    stated:
      - file: docs/semantics.md
        sentence: "A **plain** `rivet run` (no `--resume`) never skips the chunks of a run that FINISHED"
    held_by:
      mysql: { test: keyset_checkpoint_without_incremental_rereads_on_a_clean_rerun, asserts: "clean re-run must FULLY re-read (2000 rows across both runs)" }
      postgres: { gap: "no cell re-runs a finished checkpointed export without --resume on this engine and counts the rows of both runs" }
      mssql: { gap: "no cell re-runs a finished checkpointed export without --resume on this engine and counts the rows of both runs" }
      oracle: { gap: "no cell re-runs a finished checkpointed export without --resume on this engine and counts the rows of both runs" }
      mongo: { gap: "no cell re-runs a finished checkpointed export without --resume on this engine and counts the rows of both runs" }

  - id: a_live_run_refuses_a_second_run
    stated:
      - file: docs/semantics.md
        sentence: "**its process is alive** (the lease is held): the run is refused, and so is `--resume`"
    held_by:
      sqlite_state: { gap: "the cells that start a second run beside a live one on a SQLite state are open defects (the refusal carries no code); none is green" }
      postgres_state: { test: two_runs_of_one_export_through_a_transaction_pooler_never_both_proceed, asserts: "one run must proceed and the other be refused by the run lease" }
    contradicted_by:
      known_red:
        - "live_operator_contract::open_defect_a_second_run_beside_a_live_checkpointed_run_is_refused_by_code"
        - "live_operator_contract::open_defect_a_second_run_beside_a_live_resumable_run_is_refused_by_code"
        - "audit_state::open_defect_state_reset_during_an_incremental_read_keeps_the_manifest_honest"

  - id: a_completed_chunk_is_never_reclaimed
    stated:
