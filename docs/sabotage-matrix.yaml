# Sabotage matrix. Deliberate failure as gate cells (tests/live/live_sabotage.rs): after every
# scenario the only acceptable outcomes are (a) exit 0 with the destination equal to the source,
# graded by the default oracle at the rig's seam, or (b) a refusal that repeats and whose named
# remedy leads to (a). "Exit 0 over wrong data" and "a refusal nothing leads out of" are findings:
# an `open_defect_*` cell, acknowledged in dev/release_oracle/known_red.py with its first line.
#
# Row families:
#   refusal_<code>  one row per `refusal` code of the registry (src/error.rs; the guard derives the
#                   set). A `test:` cell enters through `Rig::refuses_twice_and_walks_out`: refuse,
#                   refuse again, each remedy the text names, and one WRONG remedy (a plausible
#                   action the text does not name), which must refuse or deliver, never exit 0 over
#                   wrong data. A refusal other cells already assert but nobody walks is a `gap:`.
#   corrupt_<what>  damage to what a run reads about itself: the manifest, marker and parts of a
#                   complete export (graded by `validate` and the next run), the chunk_run /
#                   chunk_task rows and committed parts of an unfinished range-chunk run, and the
#                   stored cursor of an incremental export (`Rig::damage`, `Rig::edit_state`,
#                   graded by `Rig::delivers_or_refuses`). A `*_resume` row continues the same
#                   damage with `rivet run --resume`, held to the source by the cell (the default
#                   oracle grades an explicit resume on the rows it delivered).
#   takeaway_<what> a resource taken away while the run is alive (`Rig::beside_a_live_run`): the
#                   source session killed on the server, the destination or the SQLite state made
#                   read-only (`Rig::read_only`), a bucket removed, the Postgres state closed, the
#                   reader's SELECT revoked. The run delivers or fails loudly
#                   (`Rig::delivered_or_failed_loudly`: exit 1 to 5 with an `Error:` line, never a
#                   crash), so does every run while the resource is away, and with it back a run
#                   delivers the source and `validate` passes. A resource failure is an environment
#                   error: no registry code is asked of it.
#   beside_<pair>   two processes on one export: a second command beside a live run. Each ends with
#                   exit 0 or a refusal by its registry code (`Rig::delivered_or_refused`), and a
#                   run then delivers the source. A pair another matrix already holds is cited by
#                   its test there.
#
#   kill_<runner>   the process killed at each named point of a runner (`RIVET_TEST_PANIC_AT`): between
#                   the crash and the recovery the state commands answer, then a plain run delivers
#                   the source. `kill_then_source_*` rows let the source move on between the crash and
#                   the recovery: the run that resumes must deliver the source as it is then, or
#                   refuse. A cell panics unless its run crashed at the point it names.
#   edit_<what>     a config edited between two runs with no reset (destination path, format,
#                   compression), on an incremental export that continues and on an unfinished
#                   range-checkpoint run: the run delivers the source or refuses by code; a delivery
#                   declares every source id once where the config now points.
#
# Elsewhere, and not repeated here (each has an `na:` row that names it): a corrupt CDC checkpoint
# file is the corrupt-checkpoint rows of docs/operator-contract-matrix.yaml; an edited mode, key or
# cursor column, table, schema or source URL is docs/mode-transition-matrix.yaml; a crash at a named
# point with each runner's own assertions is docs/resilience-matrix.yaml, and a CDC stream's is
# docs/cdc-matrix.yaml.

engines: [postgres, mysql, mssql, mongo, oracle]

scenarios:
  - id: refusal_state_cursor_owner_mismatch
    what: "RIVET_STATE_CURSOR_OWNER_MISMATCH: `cursor_column` changed with no reset; both named remedies deliver, `state reset-chunks` (the sibling command) leaves the refusal"
    postgres: { test: a_changed_cursor_column_is_refused_and_walked_out_postgres }
    mysql:    { test: a_changed_cursor_column_is_refused_and_walked_out_mysql }
    mssql:    { test: a_changed_cursor_column_is_refused_and_walked_out_mssql }
    mongo:    { na: "a MongoDB export is `mode: full` or `cdc` only (validate_non_sql_source_modes, RIVET_CONFIG_SOURCE_MODE_UNSUPPORTED), so it has no incremental cursor" }
    oracle:   { test: a_changed_cursor_column_is_refused_and_walked_out_oracle }

  - id: refusal_state_cursor_stream_mismatch
