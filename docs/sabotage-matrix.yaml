    mysql:    { test: a_repointed_incremental_export_is_refused_and_walked_out_mysql }
    mssql:    { test: a_repointed_incremental_export_is_refused_and_walked_out_mssql }
    mongo:    { na: "a MongoDB export is `mode: full` or `cdc` only (validate_non_sql_source_modes, RIVET_CONFIG_SOURCE_MODE_UNSUPPORTED), so it has no incremental cursor" }
    oracle:   { test: a_repointed_incremental_export_is_refused_and_walked_out_oracle }

