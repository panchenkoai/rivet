    postgres: { test: an_unfinished_chunk_run_under_another_mode_is_refused_and_walked_out_postgres }
    mysql:    { test: an_unfinished_chunk_run_under_another_mode_is_refused_and_walked_out_mysql }
    mssql:    { test: an_unfinished_chunk_run_under_another_mode_is_refused_and_walked_out_mssql }
    mongo:    { gap: "an unfinished MongoDB `resume: true` run under another shape is the RESULTS 14 cell (live_operator_contract, an uncoded refusal); the coded refusal needs a MongoDB crash point before the walk can be written" }
    oracle:   { test: an_unfinished_chunk_run_under_another_mode_is_refused_and_walked_out_oracle }

  - id: refusal_state_keyset_sequential_anchor_unfinished
