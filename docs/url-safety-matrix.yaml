# URL & credential-safety matrix — the userinfo handling that has regressed
# THREE times, each invisible to the point tests and caught only by an adversarial
# audit round:
#   * round-1: build_url_from_fields percent-ENCODEd userinfo but MSSQL's
#     hand-rolled parser never DECODEd it → special-char passwords broke auth.
#   * round-3: redact_pg_url bounded the '@' search to the authority, so a raw
#     '/','?','#' in the password truncated it and LEAKED the cleartext secret.
#   * building this matrix: the GENERAL log redactor (redact_secrets →
#     try_redact_at) had the SAME '/'-in-password leak on every logged URL.
#
# The class is now drift-guarded at the infra level (tests/offline/
# chunking_matrix_guard.rs): a redaction/URL change that reopens the leak, or a
# new engine/URL-shape that isn't covered, fails CI — cheaper than an audit round.
#
# A cell is EXACTLY one of:
#   test: <fn>  — a unit/integration test guards it; the guard asserts <fn> exists.
#   na:   <why> — structurally not applicable (a driver crate owns the parse, or
#                 the seam does not exist for this engine).
#   gap:  <why> — a rivet-owned invariant that SHOULD be tested, isn't.
#
# Honest scope: the ROUND-TRIP parse is rivet-owned only for SQL Server (the
# other three drivers percent-decode the URL themselves), so those cells are na.
# REDACTION is engine-agnostic (one redactor per seam handles every scheme), so a
# single data-driven test (`redact_secrets_url_safety_matrix`) covers all four
# scheme columns for the general log seam — the cell references it per engine so a
# dropped scheme is still visible.

engines: [postgres, mysql, mssql, mongo, oracle]

scenarios:
  - id: userinfo_roundtrip
    what: "a structured user/password survives build_url_from_fields -> the engine's URL parser as EXACT plaintext (/ : @ ? # %). Round-1 regressed MSSQL here."
    postgres: { na: "tokio-postgres Client::connect(url) percent-decodes the userinfo per RFC-3986; rivet owns no userinfo parser to regress" }
    mysql:    { na: "mysql Opts::from_url percent-decodes the userinfo; rivet owns no userinfo parser" }
    mssql:    { test: mssql_url_from_fields_roundtrips_through_parse_mssql_url }
    mongo:    { na: "mongodb ClientOptions::parse decodes the userinfo per the connection-string spec; rivet owns no userinfo parser" }
    oracle:   { gap: "rivet owns this parse (parse_oracle_url percent-decodes userinfo); a_full_oracle_url_parses_and_decodes_its_userinfo pins %40/%3A only — no build_url_from_fields -> parse_oracle_url round-trip over / : @ ? # %" }

  - id: encode_userinfo_at_construction
    what: "build_url_from_fields percent-encodes userinfo so a raw / @ : ? # cannot make the URL ambiguous (break the driver) or defeat redaction."
    postgres: { test: build_url_percent_encodes_userinfo_so_delimiters_cant_leak }
    mysql:    { na: "one shared USERINFO percent-encode set for every scheme (config/source.rs::USERINFO); the postgres cell exercises the shared code path" }
    mssql:    { test: mssql_url_from_fields_roundtrips_through_parse_mssql_url }
    mongo:    { na: "shared USERINFO encode; exercised by the postgres cell" }
    oracle:   { na: "shared USERINFO encode; exercised by the postgres cell" }

  - id: redact_delimiter_password_general
    what: "the GENERAL log redactor (redact_secrets — every log line passes through it) masks a password containing a raw / ? # @ : . Regressed while building this matrix."
    postgres: { test: redact_secrets_url_safety_matrix }
    mysql:    { test: redact_secrets_url_safety_matrix }
    mssql:    { test: redact_secrets_url_safety_matrix }
    mongo:    { test: redact_secrets_url_safety_matrix }
    oracle:   { gap: "redact_secrets_url_safety_matrix sweeps postgresql/mysql/sqlserver/mongodb only — oracle:// is not in the sweep" }

  - id: redact_delimiter_password_state_url
    what: "the PG state-backend redactor (redact_pg_url) masks a RIVET_STATE_URL password with a raw / ? # . Round-3 regressed here."
    postgres: { test: redact_pg_url_password_with_raw_delimiters_does_not_leak }
    mysql:    { na: "the state backend is SQLite or PostgreSQL only — there is no mysql state URL / redact_pg_url path" }
    mssql:    { na: "no mssql state URL" }
    mongo:    { na: "no mongo state URL" }
    oracle:   { na: "the state backend is SQLite or PostgreSQL only — there is no oracle state URL" }

  - id: redact_stray_at_in_query
    what: "a stray '@' in the path/query does not extend the userinfo match and echo the password (the RFC-legal ?opt=a@b shape)."
    postgres: { test: redact_pg_url_stray_at_in_query_does_not_leak_password }
    mysql:    { test: redact_secrets_url_safety_matrix }
    mssql:    { test: redact_secrets_url_safety_matrix }
    mongo:    { test: redact_secrets_url_safety_matrix }
    oracle:   { gap: "oracle:// is not in redact_secrets_url_safety_matrix's scheme sweep" }

  # Keyword/value connection strings (2026-10-07). The redactors above know
  # `scheme://user:pass@` and `?key=` only; a libpq DSN (`host=… password=…`), an ADO
  # string (`…;Password=…;` / `PWD=`) and JDBC properties (`;password=`) reached every
  # sink verbatim. Only tokio-postgres ACCEPTS such a string; the other engines refuse
  # it, and the refusal (or the plan artifact) carried the password.
  - id: redact_keyword_value_password_general
    what: "the GENERAL redactor (redact_secrets) masks the password of a keyword/value string in every grammar — whitespace-ended (libpq), `;`-ended (ADO/JDBC), quoted, braced — whatever the password is made of (@ / ? # = & : ; ' \" { ,)."
    postgres: { test: redact_secrets_keyword_value_matrix }
    mysql:    { test: redact_secrets_keyword_value_matrix }
    mssql:    { test: redact_secrets_keyword_value_matrix }
    mongo:    { test: redact_secrets_keyword_value_matrix }
    oracle:   { test: redact_secrets_keyword_value_matrix }

  - id: keyword_value_password_reaches_no_sink
    what: "end to end on a command that fails before a server answers: the password of every keyword/value form is in no sink — stdout, stderr, --json-errors, doctor (text and --json), init, the state DB (export_metrics, run_journal), plan.json, .rivet/runs reports."
    postgres: { test: a_keyword_value_password_reaches_no_sink_on_any_engine }
    mysql:    { test: a_keyword_value_password_reaches_no_sink_on_any_engine }
    mssql:    { test: a_keyword_value_password_reaches_no_sink_on_any_engine }
    mongo:    { test: a_keyword_value_password_reaches_no_sink_on_any_engine }
    oracle:   { test: a_keyword_value_password_reaches_no_sink_on_any_engine }

  - id: keyword_value_string_still_connects
    what: "masking must not change what connects: the form an engine accepts still authenticates and delivers every row (unquoted, and quoted with a space), its succeeding path leaks nothing (plan.json, the export_state scope key), and a form an engine refuses is refused as before."
    postgres: { test: a_libpq_keyword_value_string_authenticates_and_its_password_reaches_no_sink }
    mysql:    { na: "mysql Opts::from_url takes a mysql:// URL only (`URL ParseError { relative URL without a base }` on a keyword/value string); nothing connects, and its refusal is graded by keyword_value_password_reaches_no_sink" }
    mssql:    { test: a_keyword_value_string_is_refused_and_its_error_redacts_the_password }
    mongo:    { na: "the mongodb driver takes mongodb:// / mongodb+srv:// only; nothing connects, and its refusal is graded by keyword_value_password_reaches_no_sink" }
    oracle:   { na: "parse_oracle_url takes oracle://USER@HOST:PORT/SERVICE only and its refusal quotes a template, never the string; the plan artifact is graded by keyword_value_password_reaches_no_sink" }

  - id: keyword_value_state_scope_and_plan
    what: "the state scope key (export_state.prefix) and the plan artifact keep a keyword/value string with its password masked; a cursor stored under the unmasked key by an earlier release is adopted, not orphaned; `apply` refuses the masked plan with the url_env remedy."
    postgres: { test: a_cursor_stored_with_its_password_unmasked_is_adopted_by_the_masked_scope }
    mysql:    { na: "no run from a keyword/value string reaches a state write: only tokio-postgres accepts one" }
    mssql:    { na: "parse_mssql_url refuses the string before any state write" }
    mongo:    { na: "the mongodb driver refuses the string before any state write" }
    oracle:   { na: "parse_oracle_url refuses the string before any state write" }
