# `rivet cdc` — the CLI subcommand's surface, per engine.
#
# WHY THIS EXISTS. The two pre-existing CLI ledgers (cli-surface-matrix,
# cli-flag-matrix) contain ZERO mentions of CDC — measured 2026-08-25 — and the
# first is two rows about `rivet state`. So nothing asked whether the CDC
# subcommand was exercised, and the answer turned out to be "unevenly":
#
#     mysql 11 of 13 flags · mssql 4 · postgres 3 · mongo 0
#
# Uneven coverage is rarely laziness; it is what happens when no ledger asks. The
# repo's own rule — a coverage ledger must grade the CALL SITE, and its enumerated
# dimension must be DERIVED — applies here: the flag list comes from
# docs/reference/cli-reference.md, which is regenerated from clap on every commit,
# so a new flag arrives with a missing row rather than silently uncovered.
#
# STATES
#   test — a live test invokes `rivet cdc` with this flag against THIS engine
#   na   — structurally inapplicable, with the reason written out (length-checked)
#   gap  — applicable, unproven. Shrink-only.
#
# `mode: cdc` in a config is a DIFFERENT surface and is covered by cdc-matrix;
# this ledger is only about the subcommand.

engines: [postgres, mysql, mssql, mongo, oracle]

flags:
  - id: "--source"
    postgres: { test: "pg_cdc_column_types_match_batch_export and siblings" }
    mysql:    { test: "cdc_full_surface_cross_oracle_matches_literals and siblings" }
    mssql:    { test: "mssql_cdc_cli_path_case_only_table_mismatch_must_not_silently_drop_events" }
    mongo:    { test: "mongo_cdc_cli_writes_a_faithful_csv_of_the_document_column" }
    oracle:   { test: "oracle_cdc_cli_resolves_the_source_from_env_and_file_alike" }

  - id: "--source-env"
    postgres: { test: "pg_cdc_cli_resolves_the_source_from_env_and_file_alike — one new change per form, each delivered once through the file sink" }
    mysql:    { test: "mysql_cdc_cli_resolves_the_source_from_env_and_file_alike" }
    mssql:    { test: "mssql_cdc_cli_resolves_the_source_from_env_and_file_alike — one new change per form, each delivered once through the file sink" }
    mongo:    { test: "mongo_cdc_cli_resolves_the_source_from_env_and_file_alike — one new change per form, each delivered once through the file sink" }
    oracle:   { test: "oracle_cdc_cli_resolves_the_source_from_env_and_file_alike — the change captured through --source-env is the same id the inline form captured" }

  - id: "--source-file"
    postgres: { test: "pg_cdc_cli_resolves_the_source_from_env_and_file_alike — one new change per form, each delivered once through the file sink" }
    mysql:    { test: "mysql_cdc_cli_resolves_the_source_from_env_and_file_alike" }
    mssql:    { test: "mssql_cdc_cli_resolves_the_source_from_env_and_file_alike — one new change per form, each delivered once through the file sink" }
    mongo:    { test: "mongo_cdc_cli_resolves_the_source_from_env_and_file_alike — one new change per form, each delivered once through the file sink" }
    oracle:   { test: "oracle_cdc_cli_resolves_the_source_from_env_and_file_alike" }

  - id: "--table"
    postgres: { test: "roast_pg_cdc_ndjson_until_current_terminates_and_emits_backlog drives it" }
    mysql:    { test: "roast_mysql_cdc_cli_max_events_below_a_transaction_still_advances_the_checkpoint
                and five siblings" }
    mssql:    { test: "mssql_cdc_cli_path_case_only_table_mismatch_must_not_silently_drop_events" }
    mongo:    { test: "mongo_cdc_cli_writes_a_faithful_csv_of_the_document_column — RED-proven by pointing
                --table at the neighbouring collection (captures [99] instead of [11,12,13,14]).
                NOTE the flag cannot be dropped on this path at all: the subcommand refuses
                --output without exactly one --table (MEASURED), so the mutant that grades
                this cell is a WRONG selection, not an absent flag" }
    oracle:   { test: "oracle_cdc_cli_resolves_the_source_from_env_and_file_alike and oracle_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit" }

  - id: "--slot"
    postgres: { test: "roast_pg_cdc_ndjson_until_current_terminates_and_emits_backlog passes it" }
    mysql:    { na: "PostgreSQL-only: a logical replication slot is that engine's anchor, and
                the flag is rejected for any other source" }
    mssql:    { na: "PostgreSQL-only: SQL Server anchors on a from-LSN in the checkpoint, and
                the flag is rejected for any other source" }
    mongo:    { na: "PostgreSQL-only: MongoDB anchors on a driver resume token, and the flag is
                rejected for any other source" }
    oracle:   { na: "PostgreSQL-only: Oracle anchors on the SCN pair in its checkpoint file, and the Oracle arm of the CLI dispatch never reads the flag" }

  - id: "--capture-instance"
    postgres: { na: "SQL Server-only: it names a `cdc.<instance>_CT` change table, which no
                other engine has — the flag is rejected for any other source" }
    mysql:    { na: "SQL Server-only: the binlog has no capture instance, and the flag is
                rejected for any other source" }
    mssql:    { test: "mssql_cdc_cli_path_case_only_table_mismatch_must_not_silently_drop_events" }
    mongo:    { na: "SQL Server-only: a change stream has no capture instance, and the flag is
                rejected for any other source" }
    oracle:   { na: "SQL Server-only: LogMiner reads the redo logs directly, there is no change table to name, and the Oracle arm of the CLI dispatch never reads the flag" }

  - id: "--server-id"
    postgres: { na: "MySQL-only: it is the replica identity a binlog dump registers under, and
                the flag is rejected for any other source" }
    mysql:    { test: "mysql_cdc_cli_stream_with_a_cap_terminates_and_accepts_a_server_id" }
    mssql:    { na: "MySQL-only: no binlog, no dump registration — rejected for other sources" }
    mongo:    { na: "MySQL-only: no binlog, no dump registration — rejected for other sources" }
    oracle:   { na: "MySQL-only: LogMiner registers no replica, and the Oracle arm of the CLI dispatch never reads the flag" }

  - id: "--checkpoint"
    postgres: { test: "pg_cdc_cli_checkpoint_file_turns_a_dropped_slot_into_a_refusal — the slot is the anchor; the file is the prior-run evidence that refuses a dropped slot instead of re-anchoring past a change" }
    mysql:    { test: "roast_mysql_cdc_cli_rollover_keeps_transactions_whole_and_two_runs_do_not_clobber
                and four siblings drive resume through it" }
    mssql:    { test: "mssql_cdc_cli_path_case_only_table_mismatch_must_not_silently_drop_events" }
    mongo:    { test: "mongo_cdc_cli_writes_a_faithful_csv_of_the_document_column — RED-proven: with
                --checkpoint dropped, run 2 re-anchors at the source's current position,
                captures zero, and the sink writes no file" }
    oracle:   { test: "oracle_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — the capped-off commit arrives only because the second run resumes from the checkpoint the first wrote" }

  - id: "--output"
    postgres: { test: "pg_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit" }
    mysql:    { test: "mysql_cdc_cli_csv_output_is_wired_and_readable" }
    mssql:    { test: "mssql_cdc_cli_path_case_only_table_mismatch_must_not_silently_drop_events" }
    mongo:    { test: "mongo_cdc_cli_writes_a_faithful_csv_of_the_document_column" }
    oracle:   { test: "oracle_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit" }

  - id: "--format"
    postgres: { test: "pg_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — read back by DuckDB read_csv_auto; no parquet in the directory" }
    mysql:    { test: "mysql_cdc_cli_csv_output_is_wired_and_readable" }
    mssql:    { test: "mssql_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — read back by DuckDB read_csv_auto; no parquet in the directory" }
    mongo:    { test: "mongo_cdc_cli_writes_a_faithful_csv_of_the_document_column — RED-proven with
                --format parquet: the directory then holds no .csv and the DuckDB oracle has
                nothing to open. The document column is JSON, so this is the CSV writer's
                hostile input; the oracle is DuckDB read_csv_auto + hard-coded expected
                values, never the csv crate rivet writes with" }
    oracle:   { test: "oracle_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — read back by DuckDB read_csv_auto, never the csv crate rivet writes with" }

  - id: "--max-events"
    postgres: { test: "pg_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — two of three single-row commits, then the third on the next run" }
    mysql:    { test: "roast_mysql_cdc_cli_max_events_below_a_transaction_still_advances_the_checkpoint" }
    mssql:    { test: "mssql_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — two of three single-row commits, then the third on the next run" }
    mongo:    { test: "mongo_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — two of three single-row commits, then the third on the next run" }
    oracle:   { test: "oracle_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — two of three single-row commits, then the third on the next run" }

  - id: "--rollover"
    postgres: { test: "open_defect_pg_cdc_cli_rollover_1_delivers_the_pending_changes — RED: every `--rollover 1` run exits 0 with zero rows while commits are pending (dev/release_oracle/known_red.py)" }
    mysql:    { test: "roast_mysql_cdc_cli_rollover_keeps_transactions_whole_and_two_runs_do_not_clobber" }
    mssql:    { test: "mssql_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — rollover 1 cuts at least two parts" }
    mongo:    { test: "mongo_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — rollover 1 cuts at least two parts" }
    oracle:   { test: "oracle_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — rollover 1 cuts at least two parts" }

  - id: "--stream"
    postgres: { test: "pg_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — a capped --stream run terminates" }
    mysql:    { test: "mysql_cdc_cli_stream_with_a_cap_terminates_and_accepts_a_server_id" }
    mssql:    { test: "mssql_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — a capped --stream run terminates" }
    mongo:    { test: "mongo_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — a capped --stream run terminates" }
    oracle:   { test: "oracle_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit — a capped --stream run terminates (the Oracle drain is always bounded at the SCN current at open)" }
