# Type capability ledger (ADR-0038 CP9).
#
# forms:   one entry per `TextForm` variant (src/types/delivery.rs), keyed by its label.
#          renderer: the pure fn in src/types/delivery.rs, or `engine-produced`.
#          recover:  the expression each warehouse runs on the text column `x` to get a
#                    native column back; `text` means the column stays text there.
# engines: every `SourceType` × mode (batch, cdc), one row per native type:
#          native_type  the column type as written in CREATE TABLE
#          sample       SQL literals; sample i of every row lands in table row i
#          delivery     the Arrow type (`DataType` display), a canonical extension name
#                       (`arrow.uuid`), a TextForm label from `forms:` above, or `refused`
#                       (the run fails naming the column)
#          override     optional `columns:` override applied in both modes
#          render       optional {source, parquet, canon}: the value as text on the source
#                       and in DuckDB (`{c}` is the column; `parquet: arrow` for a type
#                       DuckDB misreads, CP11), then canonicalised (number, timestamp,
#                       float32, float64) on both sides
#          diverges     on the cdc row only: why its delivery differs from batch (ADR ref)
#          setup:       engine-level DDL run before the table (types the rows name).
#          A row in one mode has its twin, with the same sample, in the other.
#          tests/live/live_cdc_type_parity.rs builds one table per engine from these rows
#          and proves both modes deliver each row as declared, alike and equal to the source.
#
# Guarded by tests/offline/type_capability_matrix_guard.rs.

forms:
  decimal_plain:
    renderer: decimal_plain
    recover:
      bigquery: CAST(x AS BIGNUMERIC)   # rounds past 38 fractional digits
      snowflake: text                   # NUMBER stops at 38 digits
      clickhouse: toDecimal256(x, S)    # no overflow check on arithmetic
      duckdb: text                      # DECIMAL stops at 38 digits
  iso8601_duration:
    renderer: iso8601_duration
    recover:
      bigquery: CAST(x AS INTERVAL)
      snowflake: text
      clickhouse: text
      duckdb: text
  iso_timestamp_nanos:
    renderer: iso_timestamp_nanos
    recover:
      bigquery: text                    # more than 6 fraction digits is an error
      snowflake: CAST(x AS TIMESTAMP_NTZ(9))   # TIMESTAMP_TZ(9) when zoned
      clickhouse: parseDateTime64BestEffort(x, 9)   # holds 1677..2262 only
      duckdb: CAST(x AS TIMESTAMP_NS)
  time_of_day_offset:
    renderer: time_of_day_offset
    recover:
      bigquery: text
      snowflake: text
      clickhouse: text
      duckdb: text                      # TIMETZ drops the offset
  time_beyond_day:
    renderer: time_beyond_day
    recover:
      bigquery: text
      snowflake: text
      clickhouse: text
      duckdb: text
  uuid36:
    renderer: uuid36
    recover:
      bigquery: text                    # STRING is BigQuery's UUID
      snowflake: TO_UUID(x)
      clickhouse: toUUID(x)
      duckdb: CAST(x AS UUID)
  json:
    renderer: engine-produced
    recover:
      bigquery: PARSE_JSON(x)
      snowflake: PARSE_JSON(x)
      clickhouse: CAST(x AS JSON)
      duckdb: CAST(x AS JSON)
  hex_wkb:
    renderer: engine-produced
    recover:
      bigquery: ST_GEOGFROMWKB(x)
      snowflake: TO_GEOMETRY(x)
      clickhouse: readWKB*(unhex(x))    # one reader per geometry kind
      duckdb: ST_GeomFromHEXWKB(x)
  hex_bytes:
    renderer: hex_bytes
    recover:
      bigquery: FROM_HEX(x)
      snowflake: TO_BINARY(x, 'HEX')
      clickhouse: unhex(x)
      duckdb: unhex(x)
  bit_string:
    renderer: bit_string
    recover:
      bigquery: text
      snowflake: text
      clickhouse: text
      duckdb: CAST(x AS BITSTRING)
  inet_text:
    renderer: engine-produced
    recover:
      bigquery: NET.IP_FROM_STRING(x)   # addresses only, no CIDR
      snowflake: PARSE_IP(x, 'INET')
      clickhouse: toIPv6(x)             # addresses only, no CIDR
      duckdb: CAST(x AS INET)
  range_text:
    renderer: engine-produced
    recover:
      bigquery: text                    # RANGE holds date/time bounds only
      snowflake: text
      clickhouse: text
      duckdb: text
  xml_text:
    renderer: engine-produced
    recover:
      bigquery: text
      snowflake: PARSE_XML(x, TRUE)
      clickhouse: text
      duckdb: text
  server_text:
    renderer: engine-produced
    recover:
      bigquery: text
      snowflake: text
      clickhouse: text
      duckdb: text

engines:
  postgres:
    setup:
      - "DO $$ BEGIN CREATE TYPE rivet_status AS ENUM ('active','inactive','pending'); EXCEPTION WHEN duplicate_object THEN NULL; END $$"
      - "DO $$ BEGIN CREATE TYPE rivet_status_typed AS ENUM ('active','shipped','off'); EXCEPTION WHEN duplicate_object THEN NULL; END $$"
    batch:
      - {native_type: "TEXT", sample: ["'üñíçødé ''q'''", "'hello'"], delivery: "Utf8"}
      - {native_type: "NUMERIC(18,2)", sample: ["999999999999.99"], delivery: "Decimal128(18, 2)"}
      - {native_type: "NUMERIC(18,4)", sample: ["12345.6789"], delivery: "Decimal128(18, 4)"}
      - {native_type: "TIMESTAMP", sample: ["'2035-08-07 09:08:07.987654'"], delivery: "Timestamp(µs)"}
      - {native_type: "TIMESTAMPTZ", sample: ["'2019-02-03 08:07:06.554433+05'"], delivery: "Timestamp(µs, \"UTC\")"}
      - {native_type: "BYTEA", sample: ["'\\x00ff01'::bytea", "'\\xDEADBEEF'"], delivery: "Binary", render: {source: "encode({c}, 'hex')", parquet: "lower(hex({c}))"}}
      - {native_type: "UUID", sample: ["'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380011'", "'12345678-1234-1234-1234-123456789012'"], delivery: "arrow.uuid"}
      - {native_type: "JSONB", sample: ["'{\"n\":1}'::jsonb", "'{\"k\": \"v\", \"n\": 42}'"], delivery: "arrow.json"}
      - {native_type: "BOOLEAN", sample: ["TRUE", "true"], delivery: "Boolean"}
      - {native_type: "SMALLINT", sample: ["32767"], delivery: "Int16"}
      - {native_type: "BIGINT", sample: ["9000000000000"], delivery: "Int64"}
      - {native_type: "DOUBLE PRECISION", sample: ["2.5", "1.5"], delivery: "Float64"}
      - {native_type: "DATE", sample: ["'2024-03-15'"], delivery: "Date32"}
      - {native_type: "TIME", sample: ["'14:30:00.123456'"], delivery: "Time64(µs)"}
      - {native_type: "INTERVAL", sample: ["INTERVAL '1 year 2 mons 3 days'"], delivery: "Utf8"}
      - {native_type: "rivet_status", sample: ["'active'"], delivery: "Utf8"}
      - {native_type: "rivet_status_typed", sample: ["'off'"], delivery: "Utf8"}
      - {native_type: "JSON", sample: ["'{\"k\": [1, 2]}'::json"], delivery: "arrow.json"}
      - {native_type: "CHAR(8)", sample: ["'pad'"], delivery: "Utf8", render: {source: "CASE WHEN {c} IS NOT NULL THEN format('%s', {c}) END"}}
      - {native_type: "VARCHAR(50)", sample: ["'plain varchar'"], delivery: "Utf8"}
      - {native_type: "REAL", sample: ["3.14"], delivery: "Float32"}
      - {native_type: "TEXT[]", sample: ["ARRAY['with,comma', 'he said \"hi\"', NULL]", "ARRAY[]::text[]"], delivery: "List(Utf8)", render: {source: "array_to_json({c})::text", parquet: "CAST(to_json({c}) AS VARCHAR)"}}
      - {native_type: "INTEGER[]", sample: ["ARRAY[1, NULL, 3]", "'{}'"], delivery: "List(Int32)", render: {source: "array_to_json({c})::text", parquet: "CAST(to_json({c}) AS VARCHAR)"}}
      - {native_type: "DOUBLE PRECISION[]", sample: ["ARRAY[2.5, -0.5]"], delivery: "List(Float64)", render: {source: "array_to_json({c})::text", parquet: "CAST(to_json({c}) AS VARCHAR)"}}
      - {native_type: "NUMERIC(60,10)", sample: ["123456789012345678901234567890.0123456789"], delivery: "Decimal256(60, 10)", render: {parquet: "arrow"}}
      - {native_type: "NUMERIC", sample: ["1.50", "-0.000001234", "123456789012345678901234567890.123456789012", "'NaN'"], delivery: "refused"}
      - {native_type: "MONEY", sample: ["'12.34'"], delivery: "refused"}
      - {native_type: "INET", sample: ["'192.168.0.1'"], delivery: "refused", render: {source: "CASE WHEN {c} IS NOT NULL THEN format('%s', {c}) END"}}
      - {native_type: "CIDR", sample: ["'10.0.0.0/8'"], delivery: "refused"}
      - {native_type: "DATE[]", sample: ["ARRAY['2024-01-01'::date]"], delivery: "refused"}
      - {native_type: "TIMESTAMP[]", sample: ["ARRAY['2024-01-01 10:00:00'::timestamp]"], delivery: "refused"}
      - {native_type: "TIMESTAMPTZ[]", sample: ["ARRAY['2024-01-01 10:00:00+00'::timestamptz]"], delivery: "refused"}
      - {native_type: "TIME[]", sample: ["ARRAY['10:00:00'::time]"], delivery: "refused"}
      - {native_type: "UUID[]", sample: ["ARRAY['12345678-1234-1234-1234-123456789012'::uuid]"], delivery: "refused"}
      - {native_type: "BYTEA[]", sample: ["ARRAY['\\xDEADBEEF'::bytea]"], delivery: "refused"}
      - {native_type: "NUMERIC[]", sample: ["ARRAY[1.5]::numeric[]"], delivery: "refused"}
    cdc:
      - {native_type: "TEXT", sample: ["'üñíçødé ''q'''", "'hello'"], delivery: "Utf8"}
      - {native_type: "NUMERIC(18,2)", sample: ["999999999999.99"], delivery: "Decimal128(18, 2)"}
      - {native_type: "NUMERIC(18,4)", sample: ["12345.6789"], delivery: "Decimal128(18, 4)"}
      - {native_type: "TIMESTAMP", sample: ["'2035-08-07 09:08:07.987654'"], delivery: "Timestamp(µs)"}
      - {native_type: "TIMESTAMPTZ", sample: ["'2019-02-03 08:07:06.554433+05'"], delivery: "Timestamp(µs, \"UTC\")"}
      - {native_type: "BYTEA", sample: ["'\\x00ff01'::bytea", "'\\xDEADBEEF'"], delivery: "Binary", render: {source: "encode({c}, 'hex')", parquet: "lower(hex({c}))"}}
      - {native_type: "UUID", sample: ["'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380011'", "'12345678-1234-1234-1234-123456789012'"], delivery: "arrow.uuid"}
      - {native_type: "JSONB", sample: ["'{\"n\":1}'::jsonb", "'{\"k\": \"v\", \"n\": 42}'"], delivery: "arrow.json"}
      - {native_type: "BOOLEAN", sample: ["TRUE", "true"], delivery: "Boolean"}
      - {native_type: "SMALLINT", sample: ["32767"], delivery: "Int16"}
      - {native_type: "BIGINT", sample: ["9000000000000"], delivery: "Int64"}
