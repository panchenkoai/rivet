      - {native_type: "BIT(8)", sample: ["b'10101010'"], delivery: "Int64", render: {source: "CAST({c} + 0 AS CHAR)"}}
      - {native_type: "TINYINT", sample: ["127"], delivery: "Int16"}
      - {native_type: "DATE", sample: ["'2024-03-15'"], delivery: "Date32"}
      - {native_type: "TIME(6)", sample: ["'14:30:00.123456'"], delivery: "Time64(µs)"}
