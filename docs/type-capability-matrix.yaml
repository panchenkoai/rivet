# Type capability ledger (ADR-0038 CP9).
#
# forms:   one entry per `TextForm` variant (src/types/delivery.rs), keyed by its label.
#          renderer: the pure fn in src/types/delivery.rs, or `engine-produced`.
#          recover:  the expression each warehouse runs on the text column `x` to get a
#                    native column back; `text` means the column stays text there.
# engines: every `SourceType`, one `rows:` list graded in both modes (batch and CDC deliver
#          alike), one row per native type:
#          native_type  the column type as written in CREATE TABLE
#          sample       SQL literals; sample i of every row lands in table row i
#          delivery     the Arrow type (`DataType` display), a canonical extension name
#                       (`arrow.uuid`), or a TextForm label from `forms:` above; always the
#                       ADR target, never a refusal
#          batch_refuses  on a known_defect row: today the batch run refuses the column by
#                       name (the driver fails once it stops refusing)
#          render       optional, `{c}` standing for the column, over the engine's `renders:`
#                       entry for the row's delivery (what the delivery determines; a row
#                       names only what its native type adds); no render may narrow a value:
#                         duck    the DuckDB projection applied alike to every stage DuckDB
#                                 reads (`arrow` for Decimal256, which DuckDB reads as DOUBLE,
#                                 CP11: Arrow's display grades the parts instead; postgres only)
#                         server  source-side SQL read through DuckDB's passthrough, for a
#                                 column the DuckDB scanner would narrow
#                         source  Oracle only (no DuckDB scanner): the client-side rendering
#                         canon   number, timestamp, float32, float64, interval, round_micros
#          known_defect why rivet misses the declared ADR target today and which step fixes
#                       it. It excuses only its declared class: today_delivery (and the
#                       today_clickhouse it drives) and the samples below; every other check
#                       stays strict, and the driver fails once the class passes
#          today_delivery  required beside known_defect: the delivery rivet ships today
#                       (`server_text` on a batch_refuses row). The driver accepts only the
#                       target (then the marker is stale) or this type; any third is a regression
#          today_render optional, beside known_defect: the render that grades what rivet
#                       delivers today at full precision (e.g. microseconds of a ns target)
#          defect_samples  optional, beside known_defect: sample literals (`NULL` for a NULL
#                       cell) whose delivered value differs from the source today
#          clickhouse   the ClickHouse leg (PostgreSQL, MySQL, SQL Server):
#                         type    the column type `rivet load` builds in ClickHouse
#                         today   required beside a marker: the type it builds today (the
#                                 target or this, nothing else)
#                         defect  like known_defect, for the ClickHouse stage alone
#                         defect_samples  like defect_samples, for the ClickHouse stage alone
#          setup:       engine-level DDL run before the table (types the rows name).
#          renders:     engine-level, delivery -> render, merged under every row's own render.
#          dev/release_oracle/rig_oracle.py reads the same rows: render (after renders:) and
#          today_render (server, source, duck, canon), known_defect, defect_samples and
#          clickhouse (type, defect, defect_samples).
#          tests/live/live_cdc_type_parity.rs builds one table per engine from these rows;
#          one DuckDB session grades the source, the batch parts, the CDC snapshot, stream and
#          final image, both state DBs and the ClickHouse view `rivet load` builds (PostgreSQL,
#          MySQL, SQL Server): type, values, COUNT(*), COUNT(col), COUNT(DISTINCT).
#          A delivery short of its ADR target stays declared at the target, marked known_defect.
#
# Guarded by tests/offline/type_capability_matrix_guard.rs.

forms:
  decimal_plain:
    renderer: decimal_plain
    recover:
      bigquery: CAST(x AS BIGNUMERIC)   # rounds past 38 fractional digits
      snowflake: text                   # NUMBER stops at 38 digits
      clickhouse: toDecimal256(x, S)    # no overflow check on arithmetic
      duckdb: text                      # DECIMAL stops at 38 digits
  iso8601_duration:
    renderer: iso8601_duration
    recover:
      bigquery: CAST(x AS INTERVAL)
      snowflake: text
      clickhouse: text
      duckdb: text
  iso_timestamp_nanos:
    renderer: iso_timestamp_nanos
    recover:
      bigquery: text                    # more than 6 fraction digits is an error
      snowflake: CAST(x AS TIMESTAMP_NTZ(9))   # TIMESTAMP_TZ(9) when zoned
      clickhouse: parseDateTime64BestEffort(x, 9)   # holds 1677..2262 only
      duckdb: CAST(x AS TIMESTAMP_NS)
  time_of_day_offset:
    renderer: time_of_day_offset
    recover:
      bigquery: text
      snowflake: text
      clickhouse: text
      duckdb: text                      # TIMETZ drops the offset
  time_beyond_day:
    renderer: time_beyond_day
    recover:
      bigquery: text
      snowflake: text
      clickhouse: text
      duckdb: text
  uuid36:
    renderer: uuid36
    recover:
      bigquery: text                    # STRING is BigQuery's UUID
      snowflake: TO_UUID(x)
      clickhouse: toUUID(x)
      duckdb: CAST(x AS UUID)
  json:
    renderer: engine-produced
    recover:
      bigquery: PARSE_JSON(x)
      snowflake: PARSE_JSON(x)
      clickhouse: CAST(x AS JSON)
      duckdb: CAST(x AS JSON)
  hex_wkb:
    renderer: engine-produced
    recover:
      bigquery: ST_GEOGFROMWKB(x)
      snowflake: TO_GEOMETRY(x)
      clickhouse: readWKB*(unhex(x))    # one reader per geometry kind
      duckdb: ST_GeomFromHEXWKB(x)
  hex_bytes:
    renderer: hex_bytes
    recover:
      bigquery: FROM_HEX(x)
      snowflake: TO_BINARY(x, 'HEX')
      clickhouse: unhex(x)
      duckdb: unhex(x)
  bit_string:
    renderer: bit_string
    recover:
      bigquery: text
      snowflake: text
      clickhouse: text
      duckdb: CAST(x AS BITSTRING)
  inet_text:
    renderer: engine-produced
    recover:
      bigquery: NET.IP_FROM_STRING(x)   # addresses only, no CIDR
      snowflake: PARSE_IP(x, 'INET')
      clickhouse: toIPv6(x)             # addresses only, no CIDR
      duckdb: CAST(x AS INET)
  range_text:
    renderer: engine-produced
    recover:
      bigquery: text                    # RANGE holds date/time bounds only
      snowflake: text
      clickhouse: text
      duckdb: text
  xml_text:
    renderer: engine-produced
    recover:
      bigquery: text
      snowflake: PARSE_XML(x, TRUE)
      clickhouse: text
      duckdb: text
  server_text:
    renderer: engine-produced
    recover:
      bigquery: text
      snowflake: text
      clickhouse: text
      duckdb: text

engines:
  postgres:
    setup:
      - "DO $$ BEGIN CREATE TYPE rivet_status AS ENUM ('active','inactive','pending'); EXCEPTION WHEN duplicate_object THEN NULL; END $$"
      - "DO $$ BEGIN CREATE TYPE rivet_status_typed AS ENUM ('active','shipped','off'); EXCEPTION WHEN duplicate_object THEN NULL; END $$"
    renders:
      "Binary": {duck: "lower(hex({c}))"}
      "iso8601_duration": {canon: "interval"}
      "List(Utf8)": {duck: "CAST(to_json({c}) AS VARCHAR)"}
      "List(Int32)": {duck: "CAST(to_json({c}) AS VARCHAR)"}
      "List(Float64)": {duck: "CAST(to_json({c}) AS VARCHAR)"}
      "Decimal256(60, 10)": {duck: "arrow"}
    rows:
      - {native_type: "TEXT", sample: ["'üñíçødé ''q'''", "'hello'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "NUMERIC(18,2)", sample: ["999999999999.99"], delivery: "Decimal128(18, 2)", clickhouse: {type: "Nullable(Decimal(18, 2))"}}
      - {native_type: "NUMERIC(18,4)", sample: ["12345.6789"], delivery: "Decimal128(18, 4)", clickhouse: {type: "Nullable(Decimal(18, 4))"}}
      - {native_type: "TIMESTAMP", sample: ["'2035-08-07 09:08:07.987654'"], delivery: "Timestamp(µs)", clickhouse: {type: "Nullable(DateTime64(6))"}}
      - {native_type: "TIMESTAMPTZ", sample: ["'2019-02-03 08:07:06.554433+05'"], delivery: "Timestamp(µs, \"UTC\")", clickhouse: {type: "Nullable(DateTime64(6, 'UTC'))"}}
      - {native_type: "BYTEA", sample: ["'\\x00ff01'::bytea", "'\\xDEADBEEF'"], delivery: "Binary", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "UUID", sample: ["'a0eebc99-9c0b-4ef8-bb6d-6bb9bd380011'", "'12345678-1234-1234-1234-123456789012'"], delivery: "arrow.uuid", clickhouse: {type: "Nullable(UUID)", today: "Nullable(FixedString(16))", defect: "loads as FixedString(16) bytes where ClickHouse has a native UUID (ADR-0038 CP1, ClickHouse load step)"}}
      - {native_type: "JSONB", sample: ["'{\"n\":1}'::jsonb", "'{\"k\": \"v\", \"n\": 42}'"], delivery: "arrow.json", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "BOOLEAN", sample: ["TRUE", "true"], delivery: "Boolean", clickhouse: {type: "Nullable(Bool)"}}
      - {native_type: "SMALLINT", sample: ["32767"], delivery: "Int16", clickhouse: {type: "Nullable(Int16)"}}
      - {native_type: "BIGINT", sample: ["9000000000000"], delivery: "Int64", clickhouse: {type: "Nullable(Int64)"}}
      - {native_type: "DOUBLE PRECISION", sample: ["2.5", "1.5"], delivery: "Float64", clickhouse: {type: "Nullable(Float64)"}}
      - {native_type: "DATE", sample: ["'2024-03-15'"], delivery: "Date32", clickhouse: {type: "Nullable(Date32)"}}
      - {native_type: "TIME", sample: ["'14:30:00.123456'"], delivery: "Time64(µs)", clickhouse: {type: "Nullable(Decimal(18, 6))"}}
      - {native_type: "INTERVAL", sample: ["INTERVAL '1 year 2 mons 3 days'"], delivery: "iso8601_duration", today_delivery: "Utf8", known_defect: "ISO 8601 text without the rivet.text_form label (ADR-0038 CP2/CP5, PostgreSQL engine step)", clickhouse: {type: "Nullable(String)", today: "Nullable(String)"}}
      - {native_type: "rivet_status", sample: ["'active'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "rivet_status_typed", sample: ["'off'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "JSON", sample: ["'{\"k\": [1, 2]}'::json"], delivery: "arrow.json", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "CHAR(8)", sample: ["'pad'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "VARCHAR(50)", sample: ["'plain varchar'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "REAL", sample: ["3.14"], delivery: "Float32", clickhouse: {type: "Nullable(Float32)"}}
      - {native_type: "TEXT[]", sample: ["ARRAY['with,comma', 'he said \"hi\"', NULL]", "ARRAY[]::text[]"], delivery: "List(Utf8)", clickhouse: {type: "Array(Nullable(String))", today: "Array(Nullable(String))", defect: "a NULL array loads as [] (ClickHouse arrays cannot be NULL), so NULL and empty merge (ADR-0038 CP1, ClickHouse load step)", defect_samples: ["NULL"]}}
      - {native_type: "INTEGER[]", sample: ["ARRAY[1, NULL, 3]", "'{}'"], delivery: "List(Int32)", clickhouse: {type: "Array(Nullable(Int32))", today: "Array(Nullable(Int32))", defect: "a NULL array loads as [] (ClickHouse arrays cannot be NULL), so NULL and empty merge (ADR-0038 CP1, ClickHouse load step)", defect_samples: ["NULL"]}}
      - {native_type: "DOUBLE PRECISION[]", sample: ["ARRAY[2.5, -0.5]"], delivery: "List(Float64)", clickhouse: {type: "Array(Nullable(Float64))", today: "Array(Nullable(Float64))", defect: "a NULL array loads as [] (ClickHouse arrays cannot be NULL), so NULL and empty merge (ADR-0038 CP1, ClickHouse load step)", defect_samples: ["NULL"]}}
      - {native_type: "NUMERIC(60,10)", sample: ["123456789012345678901234567890.0123456789"], delivery: "Decimal256(60, 10)", clickhouse: {type: "Nullable(Decimal(60, 10))"}}
      - {native_type: "NUMERIC", sample: ["1.50", "-0.000001234", "123456789012345678901234567890.123456789012", "'NaN'"], delivery: "decimal_plain", today_delivery: "server_text", known_defect: "batch refuses the column; CDC carries the server's own text labelled server_text (ADR-0038 CP1/CP5, PostgreSQL engine step)", batch_refuses: true}
      - {native_type: "MONEY", sample: ["'12.34'"], delivery: "server_text", today_delivery: "server_text", known_defect: "batch refuses the column; CDC carries the server's own text labelled server_text (ADR-0038 CP1/CP5, PostgreSQL engine step)", batch_refuses: true}
      - {native_type: "INET", sample: ["'192.168.0.1'"], delivery: "inet_text", today_delivery: "server_text", known_defect: "batch refuses the column; CDC carries the server's own text labelled server_text (ADR-0038 CP1/CP5, PostgreSQL engine step)", batch_refuses: true}
      - {native_type: "CIDR", sample: ["'10.0.0.0/8'"], delivery: "inet_text", today_delivery: "server_text", known_defect: "batch refuses the column; CDC carries the server's own text labelled server_text (ADR-0038 CP1/CP5, PostgreSQL engine step)", batch_refuses: true}
      - {native_type: "DATE[]", sample: ["ARRAY['2024-01-01'::date]"], delivery: "List(Date32)", today_delivery: "server_text", known_defect: "batch refuses the column; CDC carries the server's own text labelled server_text (ADR-0038 CP1/CP5, PostgreSQL engine step)", batch_refuses: true}
      - {native_type: "TIMESTAMP[]", sample: ["ARRAY['2024-01-01 10:00:00'::timestamp]"], delivery: "List(Timestamp(µs))", today_delivery: "server_text", known_defect: "batch refuses the column; CDC carries the server's own text labelled server_text (ADR-0038 CP1/CP5, PostgreSQL engine step)", batch_refuses: true}
      - {native_type: "TIMESTAMPTZ[]", sample: ["ARRAY['2024-01-01 10:00:00+00'::timestamptz]"], delivery: "List(Timestamp(µs, \"UTC\"))", today_delivery: "server_text", known_defect: "batch refuses the column; CDC carries the server's own text labelled server_text (ADR-0038 CP1/CP5, PostgreSQL engine step)", batch_refuses: true}
      - {native_type: "TIME[]", sample: ["ARRAY['10:00:00'::time]"], delivery: "List(Time64(µs))", today_delivery: "server_text", known_defect: "batch refuses the column; CDC carries the server's own text labelled server_text (ADR-0038 CP1/CP5, PostgreSQL engine step)", batch_refuses: true}
      - {native_type: "UUID[]", sample: ["ARRAY['12345678-1234-1234-1234-123456789012'::uuid]"], delivery: "List(FixedSizeBinary(16))", today_delivery: "server_text", known_defect: "batch refuses the column; CDC carries the server's own text labelled server_text (ADR-0038 CP1/CP5, PostgreSQL engine step)", batch_refuses: true}
      - {native_type: "BYTEA[]", sample: ["ARRAY['\\xDEADBEEF'::bytea]"], delivery: "List(Binary)", today_delivery: "server_text", known_defect: "batch refuses the column; CDC carries the server's own text labelled server_text (ADR-0038 CP1/CP5, PostgreSQL engine step)", batch_refuses: true}
      - {native_type: "NUMERIC[]", sample: ["ARRAY[1.5]::numeric[]"], delivery: "server_text", today_delivery: "server_text", known_defect: "batch refuses the column; CDC carries the server's own text labelled server_text (ADR-0038 CP1/CP5, PostgreSQL engine step)", batch_refuses: true}
  mysql:
    renders:
      "Binary": {duck: "lower(hex({c}))"}
      "Float32": {canon: "float32"}
    rows:
      - {native_type: "VARCHAR(200)", sample: ["'üñíçødé'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "VARCHAR(20)", sample: ["'hello'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "DECIMAL(18,2)", sample: ["999999999999.99"], delivery: "Decimal128(18, 2)", clickhouse: {type: "Nullable(Decimal(18, 2))"}}
      - {native_type: "DECIMAL(18,4)", sample: ["12345.6789"], delivery: "Decimal128(18, 4)", clickhouse: {type: "Nullable(Decimal(18, 4))"}}
      - {native_type: "DATETIME(6)", sample: ["'2035-08-07 09:08:07.987654'"], delivery: "Timestamp(µs)", clickhouse: {type: "Nullable(DateTime64(6))"}}
      - {native_type: "TIMESTAMP(6) NULL", sample: ["'2035-08-07 09:08:07.987654'"], delivery: "Timestamp(µs, \"UTC\")", render: {duck: "strftime({c}, '%Y-%m-%d %H:%M:%S.%f')"}, clickhouse: {type: "Nullable(DateTime64(6, 'UTC'))"}}
      - {native_type: "BINARY(4)", sample: ["UNHEX('00000000')"], delivery: "Binary", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "JSON", sample: ["JSON_OBJECT('tier','gold','n',1)", "'{\"k\": \"v\", \"n\": 42}'"], delivery: "arrow.json", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "BOOLEAN", sample: ["TRUE", "1", "5", "-1"], delivery: "Int8", today_delivery: "Boolean", render: {duck: "CAST(CAST({c} AS TINYINT) AS VARCHAR)"}, known_defect: "TINYINT(1) delivered as Boolean: 5 and -1 arrive as true in batch, CDC and ClickHouse, a silent loss; exact native is Int8 (ADR-0038 CP1, MySQL engine step)", defect_samples: ["5", "-1"], clickhouse: {type: "Nullable(Int8)", today: "Nullable(Bool)"}}
      - {native_type: "BIT(1)", sample: ["b'1'"], delivery: "Boolean", clickhouse: {type: "Nullable(Bool)"}}
      - {native_type: "BIT(8)", sample: ["b'10101010'"], delivery: "Int64", render: {duck: "lpad(hex({c}), 2, '0')"}, clickhouse: {type: "Nullable(Int64)"}}
      - {native_type: "TINYINT", sample: ["127"], delivery: "Int16", clickhouse: {type: "Nullable(Int16)"}}
      - {native_type: "DATE", sample: ["'2024-03-15'"], delivery: "Date32", clickhouse: {type: "Nullable(Date32)"}}
      - {native_type: "TIME(6)", sample: ["'14:30:00.123456'"], delivery: "Time64(µs)", clickhouse: {type: "Nullable(Decimal(18, 6))"}}
      - {native_type: "YEAR", sample: ["2024"], delivery: "Int16", clickhouse: {type: "Nullable(Int16)"}}
      - {native_type: "ENUM('a','b','c')", sample: ["'b'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "ENUM('active','shipped','off')", sample: ["'off'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "VARBINARY(4)", sample: ["0xDEADBEEF"], delivery: "Binary", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "BLOB", sample: ["0x0102"], delivery: "Binary", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "SMALLINT", sample: ["-32768"], delivery: "Int16", clickhouse: {type: "Nullable(Int16)"}}
      - {native_type: "MEDIUMINT", sample: ["-8388608"], delivery: "Int32", clickhouse: {type: "Nullable(Int32)"}}
      - {native_type: "INT", sample: ["-2147483648"], delivery: "Int32", clickhouse: {type: "Nullable(Int32)"}}
      - {native_type: "INT UNSIGNED", sample: ["4294967295"], delivery: "Int64", clickhouse: {type: "Nullable(Int64)"}}
      - {native_type: "BIGINT UNSIGNED", sample: ["18446744073709551615", "18000000000000000000"], delivery: "UInt64", clickhouse: {type: "Nullable(UInt64)"}}
      - {native_type: "FLOAT", sample: ["1.5"], delivery: "Float32", clickhouse: {type: "Nullable(Float32)"}}
      - {native_type: "DOUBLE", sample: ["-2.25", "1.5"], delivery: "Float64", clickhouse: {type: "Nullable(Float64)"}}
      - {native_type: "CHAR(8)", sample: ["'pad'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "CHAR(36)", sample: ["'12345678-1234-1234-1234-123456789012'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "TEXT", sample: ["'long text'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "SET('x','y','z')", sample: ["'x,z'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "SET('a','b','c')", sample: ["'a,b'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
  mssql:
    renders:
      "Binary": {duck: "lower(hex({c}))"}
      "Float64": {canon: "float64"}
      "Timestamp(ns)": {canon: "timestamp"}
    rows:
      - {native_type: "BIGINT", sample: ["9000000000000"], delivery: "Int64", clickhouse: {type: "Nullable(Int64)"}}
      - {native_type: "DECIMAL(18,4)", sample: ["12345.6789"], delivery: "Decimal128(18, 4)", clickhouse: {type: "Nullable(Decimal(18, 4))"}}
      - {native_type: "BIT", sample: ["1"], delivery: "Boolean", clickhouse: {type: "Nullable(Bool)"}}
      - {native_type: "VARCHAR(50)", sample: ["'hello'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "NVARCHAR(50)", sample: ["N'cafe-unicode'"], delivery: "Utf8", clickhouse: {type: "Nullable(String)"}}
      - {native_type: "DATETIME2", sample: ["'2026-06-23 10:00:00.1234567'"], delivery: "Timestamp(ns)", today_delivery: "Timestamp(µs)", today_render: {server: "LEFT(CONVERT(varchar(max), {c}, 121), 26)", canon: "timestamp"}, known_defect: "delivered at microseconds, the 100 ns digit dropped; exact native is Timestamp(ns) (ADR-0038 CP1, SQL Server engine step)", clickhouse: {type: "Nullable(DateTime64(7))", today: "Nullable(DateTime64(6))"}}
