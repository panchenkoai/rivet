      - {native_type: "TEXT[]", sample: ["ARRAY['with,comma', 'he said \"hi\"', NULL]", "ARRAY[]::text[]"], delivery: "List(Utf8)", render: {source: "array_to_json({c})::text", parquet: "CAST(to_json({c}) AS VARCHAR)"}}
      - {native_type: "INTEGER[]", sample: ["ARRAY[1, NULL, 3]", "'{}'"], delivery: "List(Int32)", render: {source: "array_to_json({c})::text", parquet: "CAST(to_json({c}) AS VARCHAR)"}}
      - {native_type: "DOUBLE PRECISION[]", sample: ["ARRAY[2.5, -0.5]"], delivery: "List(Float64)", render: {source: "array_to_json({c})::text", parquet: "CAST(to_json({c}) AS VARCHAR)"}}
      - {native_type: "NUMERIC(60,10)", sample: ["123456789012345678901234567890.0123456789"], delivery: "Decimal256(60, 10)", render: {parquet: "arrow"}}
      - {native_type: "NUMERIC", sample: ["1.50", "-0.000001234", "123456789012345678901234567890.123456789012", "'NaN'"], delivery: "server_text", diverges: "batch has no decoder yet and refuses the column by name; CDC keeps test_decoding's own text (ADR-0038 CP4, CP12)"}
      - {native_type: "MONEY", sample: ["'12.34'"], delivery: "server_text", diverges: "batch has no decoder yet and refuses the column by name; CDC keeps test_decoding's own text (ADR-0038 CP4, CP12)"}
      - {native_type: "INET", sample: ["'192.168.0.1'"], delivery: "server_text", render: {source: "CASE WHEN {c} IS NOT NULL THEN format('%s', {c}) END"}, diverges: "batch has no decoder yet and refuses the column by name; CDC keeps test_decoding's own text (ADR-0038 CP4, CP12)"}
      - {native_type: "CIDR", sample: ["'10.0.0.0/8'"], delivery: "server_text", diverges: "batch has no decoder yet and refuses the column by name; CDC keeps test_decoding's own text (ADR-0038 CP4, CP12)"}
      - {native_type: "DATE[]", sample: ["ARRAY['2024-01-01'::date]"], delivery: "server_text", diverges: "batch has no decoder yet and refuses the column by name; CDC keeps test_decoding's own text (ADR-0038 CP4, CP12)"}
      - {native_type: "TIMESTAMP[]", sample: ["ARRAY['2024-01-01 10:00:00'::timestamp]"], delivery: "server_text", diverges: "batch has no decoder yet and refuses the column by name; CDC keeps test_decoding's own text (ADR-0038 CP4, CP12)"}
