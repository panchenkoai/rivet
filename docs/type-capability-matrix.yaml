      - {native_type: "BLOB", sample: ["0x0102"], delivery: "Binary", render: {source: "LOWER(HEX({c}))", parquet: "lower(hex({c}))"}}
      - {native_type: "SMALLINT", sample: ["-32768"], delivery: "Int16"}
      - {native_type: "MEDIUMINT", sample: ["-8388608"], delivery: "Int32"}
      - {native_type: "INT", sample: ["-2147483648"], delivery: "Int32"}
