      - {native_type: "SMALLMONEY", sample: ["-0.01"], delivery: "Decimal128(19, 4)", clickhouse: {type: "Nullable(Decimal(19, 4))"}}
      - {native_type: "VARBINARY(4)", sample: ["0xDEADBEEF"], delivery: "Binary", clickhouse: {type: "Nullable(String)"}}
