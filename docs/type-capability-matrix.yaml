      - {native_type: "TIME[]", sample: ["ARRAY['10:00:00'::time]"], delivery: "server_text", diverges: "batch has no decoder yet and refuses the column by name; CDC keeps test_decoding's own text (ADR-0038 CP4, CP12)"}
      - {native_type: "UUID[]", sample: ["ARRAY['12345678-1234-1234-1234-123456789012'::uuid]"], delivery: "server_text", diverges: "batch has no decoder yet and refuses the column by name; CDC keeps test_decoding's own text (ADR-0038 CP4, CP12)"}
      - {native_type: "BYTEA[]", sample: ["ARRAY['\\xDEADBEEF'::bytea]"], delivery: "server_text", diverges: "batch has no decoder yet and refuses the column by name; CDC keeps test_decoding's own text (ADR-0038 CP4, CP12)"}
      - {native_type: "NUMERIC[]", sample: ["ARRAY[1.5]::numeric[]"], delivery: "server_text", diverges: "batch has no decoder yet and refuses the column by name; CDC keeps test_decoding's own text (ADR-0038 CP4, CP12)"}
  mysql:
    batch:
      - {native_type: "VARCHAR(200)", sample: ["'üñíçødé'"], delivery: "Utf8"}
      - {native_type: "VARCHAR(20)", sample: ["'hello'"], delivery: "Utf8"}
      - {native_type: "DECIMAL(18,2)", sample: ["999999999999.99"], delivery: "Decimal128(18, 2)"}
      - {native_type: "DECIMAL(18,4)", sample: ["12345.6789"], delivery: "Decimal128(18, 4)"}
      - {native_type: "DATETIME(6)", sample: ["'2035-08-07 09:08:07.987654'"], delivery: "Timestamp(µs)"}
      - {native_type: "TIMESTAMP(6) NULL", sample: ["'2035-08-07 09:08:07.987654'"], delivery: "Timestamp(µs, \"UTC\")", render: {source: "CONCAT(CAST({c} AS CHAR), '+00')"}}
      - {native_type: "BINARY(4)", sample: ["UNHEX('00000000')"], delivery: "Binary", render: {source: "LOWER(HEX({c}))", parquet: "lower(hex({c}))"}}
      - {native_type: "JSON", sample: ["JSON_OBJECT('tier','gold','n',1)", "'{\"k\": \"v\", \"n\": 42}'"], delivery: "arrow.json"}
