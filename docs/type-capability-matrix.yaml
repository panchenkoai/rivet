      - {native_type: "TIME", sample: ["'14:30:00.123456'"], delivery: "Time64(µs)"}
      - {native_type: "INTERVAL", sample: ["INTERVAL '1 year 2 mons 3 days'"], delivery: "Utf8"}
      - {native_type: "rivet_status", sample: ["'active'"], delivery: "Utf8"}
      - {native_type: "rivet_status_typed", sample: ["'off'"], delivery: "Utf8"}
      - {native_type: "JSON", sample: ["'{\"k\": [1, 2]}'::json"], delivery: "arrow.json"}
      - {native_type: "CHAR(8)", sample: ["'pad'"], delivery: "Utf8", render: {source: "CASE WHEN {c} IS NOT NULL THEN format('%s', {c}) END"}}
      - {native_type: "VARCHAR(50)", sample: ["'plain varchar'"], delivery: "Utf8"}
