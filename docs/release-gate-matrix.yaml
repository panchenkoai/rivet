    what: "a CDC drain reads the change log, not the table (docs/reference/cdc.md, 'Why CDC is gentle on the source'): 50,000 rows, anchor, 5 changes, drain — the table's own counters stay at zero (PG pg_stat_user_tables, SQL Server sys.dm_db_index_usage_stats) or far below one scan (MySQL innodb_rows_read, Mongo docs_scanned), and DuckDB reads exactly the 5 captured ids. RED per engine against a probe that reads the whole table."
    status: test        # verify_cdc_harm — tests/live/live_cdc_harm.rs, one row per case
  - id: session_state
    what: "the same exports under a NON-default session: a Postgres role with TimeZone Asia/Tokyo, DateStyle 'German, DMY', IntervalStyle sql_standard and bytea_output escape; an SQL Server login whose language is British (DATEFORMAT dmy); the MySQL server's GLOBAL time_zone at +09:00 (RED: the session's `SET time_zone = '+00:00'` pin removed); an Oracle login whose AFTER LOGON trigger sets TIME_ZONE Asia/Tokyo, day-first NLS date/timestamp masks and a comma decimal separator. The stand is UTC/ISO/us_english everywhere, so a value rendered to text and re-injected as a literal (cursor, keyset bound, date window, check's cursor range) is graded only here. Incremental two-run unions, date windows and parallel keyset incremental per engine, plus the exported instants and dates against the source's own sums. Oracles: DuckDB over declared parts, the source. Added 2026-09-27 after three session-state data-loss bugs in one night."
    status: test        # verify_session_state — tests/live/live_session_state.rs, one row per case
  - id: partition_footer
    what: "every part each batch runner ships — the LAST one included — carries the `rivet.partition_buckets` footer note the loader bounds it by, and its count equals the distinct days DuckDB counts in that part itself (`parquet_kv_metadata` + `count(DISTINCT created_at::date)`, no shared code with the writer). The single runner's fixture crosses the 4,000-partition budget, so it rotates. Written 2026-09-26; its first run found the chunked runners closing parts with a bare `writer.take()` — every chunked part unnoted. The CDC drain (log_view layout) is proven the same way on MySQL, PostgreSQL and SQL Server — one transaction of 5,000 days cut into parts of at most 4,000 — and MongoDB, whose parts carry no date column, must say so. Needs the CDC stand (mysql-cdc, postgres-cdc, mssql-cdc, mongo-rs)."
    status: test        # verify_partition_footer — tests/live/live_partition_footer.rs, one row per case
  - id: pool_e2e
    what: "the pool scheduler's e2e flow (#166): `apply --pool 2` on a multi-export config (one heavy + three parallel_safe) through a toxiproxy BANDWIDTH-CAPPED source — the shared-tunnel field pathology. Oracles: exact per-export rows (independent DuckDB readback), the predicted-vs-actual makespan contract on stdout (the model grades itself), and --resume defer-not-drop. Drives the `pool_apply_*` cases in tests/live/live_pool_toxiproxy.rs; SKIP when toxiproxy :8474 is down."
