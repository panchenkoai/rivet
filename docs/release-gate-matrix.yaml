  - id: pool_split
    what: "the `--pool --split` range sub-export flow (#167): a dominating export is broken into N range sub-exports over its key span — separate scheduler units sharing ONE prefix + folding to ONE family. FOUR independent oracles (`pool_split_*` in tests/live/live_pool_toxiproxy.rs), each a NAMED gate cell: (1) realize — the split fires and the union reads back every row once, no seam gap/dup; (2) manifest coherence — validate does not flag a sibling unit's parts as untracked yet a true orphan still is; (3) per-unit crash resume — `--resume` re-runs ONLY the incomplete units (skip complete, resume crashed), no gap/no dup; (4) a nullable chunk_column refuses before any unit writes (RED without the guard: 200000 of 200002 rows delivered, the NULL-keyed two dropped under a successful run). SKIP when toxiproxy :8474 is down."
