    status: test        # verify_field_symptom_replay (dev/release_oracle/regression.py)
  - id: scale_memory
    what: "the FLAT-RSS guarantee at scale — rivet's headline value prop (the 454M-row, no-OOM field win vs Airbyte). rivet STREAMS, so peak RSS is O(chunk), not O(rows); the gate's data scenarios are ~150K rows, so a buffering regression that scales RSS with the table ships green through every count check. Runs PER ENGINE over TWO EXISTING tables (no seeding — a small + a large already on the stand, default users vs events) and asserts peak RSS on the LARGE table stays FLAT vs the SMALL: RSS(large) <= RSS(small) × tol (RIVET_SCALE_RSS_TOL, default 3× — generous, the tables differ in row width; streaming keeps the ratio near the width ratio, buffering blows it up by the 10× row-count ratio). Measured for the current binary (assertion) AND the downloaded prev release (comparison). Env per engine: RIVET_SCALE_<ENGINE>_URL + _SMALL + _LARGE; SKIP-if-absent."
    backends: [postgres, mysql, mssql, mongo]
    status: test        # verify_scale_memory (dev/release_oracle/regression.py) — per-engine loop
  - id: state_backend_parity
    what: "the SAME export recorded into SQLite AND Postgres must AGREE. The cdc_e2e leg checks each backend POPULATES the expected tables against a golden; that is presence, not parity — a table can be non-empty on both and hold different numbers, and a column can be written on one and silently dropped on the other. It has happened: shape tracking never worked on Postgres AT ALL, the run succeeded, `export_shape` filled on one backend and stayed empty on the other, and nothing compared them. Compares the POPULATED TABLE SET (the check that names the failure class), the per-table row count scoped by export_name, `export_metrics`'s work columns (total_rows / files_committed / status) and `file_log`'s count + summed row_count. Deliberately NOT run ids or timestamps — two runs differ there by construction. NOT compared, and said so in the verdict: tables with no export_name column, because the Postgres store is shared with the rest of the gate while the SQLite one is fresh. RED-proven against a stripped-backend mutant (SQLite-only ['file_log'])."
    backends: [sqlite, postgres]
    status: test        # verify_state_backend_parity (dev/release_oracle/state_parity.py)
  - id: state_parity_independent
    what: "the SAME run's two state backends compared by ONE decoder. Its sibling `state_backend_parity` reads SQLite with python's sqlite3 and Postgres with psql, so a surviving difference can be data OR rendering and nothing tells them apart — today's seed work proved that is not academic, a digest built with each ENGINE's own concatenation disagreed across three engines whose data was byte-identical. Here DuckDB attaches BOTH stores in one session (sqlite + postgres scanners) and every value crosses one decoder. Compares a PER-COLUMN digest of every shared column plus the row count, over every scopable table — 12, against the sibling's 6. Identity and environment are NORMALISED out rather than dropped: run-unique part hashes, wall-clock stamps, each backend's own output path, and the SQLite-has-no-BOOLEAN 0/false split. `run_journal` is compared by event SHAPE because its JSON payload is identity-dense (measured: every byte difference was a microsecond fraction or a part-name hash). `export_harm` is excluded — it records PostgreSQL SERVER counter deltas, which two runs differ on by nature (3094 vs 3062 blks_hit). An EMPTY comparison FAILS: two blank profiles agree perfectly and prove nothing. FOUND: the sibling's UNSCOPED list claimed five tables have no export_name column; three of them do, so it had been silently dropping chunk_run / keyset_range / load_run from the parity claim. RED-proven by incrementing export_metrics.total_rows on the Postgres side alone — the cell names the column."
    backends: [sqlite, postgres]
    status: test        # verify_state_parity_independent (dev/release_oracle/state_parity_duckdb.py)
  - id: concurrent_writers_share_a_prefix
    what: "SEVERAL writers into ONE destination prefix and ONE state backend, started together (not consecutively). Every other cell — and both sweeps — runs a single writer with the prefix to itself, which is not what a shared deployment is. Asserts five things that can each fail alone: the file count on the prefix equals the manifests' summed part_count (a collision shows as a SHORTFALL); DuckDB's row count equals the manifests' summed row_count equals the state DB's; ONE immutable manifest-<run_id>.json per writer survives (the canonical manifest.json is last-writer-wins BY DESIGN, so the copies are what a consumer sums); no duplicate export_metrics row (concurrency is where an UPDATE-or-INSERT becomes two INSERTs); no `running` row left unsuperseded. Runs LOCAL and against a REAL GCS bucket — an object store has no rename and a flat namespace, which is where writers actually race. FOUND: the local destination staged every write under a name derived from the final key alone, so concurrent writers of manifest.json deleted each other's staged file and the loser's rename failed ENOENT — reported by finalize as a non-fatal manifest write failure while the run said success and its parquet sat on the prefix named by no manifest. Measured 3 of 6 rounds losing a copy; 0 of 8 after the fix."
    backends: [postgres, gcs]
    status: test        # verify_concurrent_writers_share_a_prefix (dev/release_oracle/concurrency.py)
  - id: cdc_e2e
    what: "CDC end-to-end per engine (the change-data-capture surface the batch scenarios never exercise): anchor a typed table → INSERT/UPDATE/DELETE → capture (mode:cdc, until_current) to the object store → INDEPENDENT DuckDB readback == 5 events (never rivet) → rivet validate PASSED → state-DB metabase populated (run_status all-success) → at-least-once CRASH recovery (cdc_after_flush_before_ack holds the anchor; the re-run re-reads id=4) → large-transaction ATOMICITY (a >rollover 12-row tx survives a cdc_after_ack mid-flush crash whole, 12/12 — the committed-boundary invariant). PLUS SQLite-vs-Postgres state PARITY vs golden/cdc_state_snapshot.json (the reference snapshot). Each engine's anchor is its own mechanism (PG slot / MySQL binlog / MSSQL from-LSN / Mongo resume token). RED-proven by mutation vs the release binary: a drop-one-event sink mutant reddens the independent readback on all 4 engines (while rivet validate stays green); a committed:true-every-event PG mutant reddens the large-tx leg. PLUS per-engine LIFECYCLE cells (each on its own uniquely named table): resume-exact (after a crash-recovery, an IDLE run's run-scoped manifest-<run_id>.json and DuckDB over its declared parts hold exactly 0 events, then one change → exactly 1 — the at-least-EVERYTHING class a membership check passes); large-tx-atomic on ALL FOUR engines (12-row tx at rollover 5, crash at the engine's anchor hook — cdc_after_ack PG, cdc_after_checkpoint_before_ack MySQL/MSSQL/Mongo — union of declared parts == the source's own rows; the committed flag is set per ADAPTER, so one engine proves nothing about another); PG pg-starvation (200-row uncaptured tx ahead of a 30-row backlog, rollover 5, one bounded run captures the whole backlog, DuckDB over declared parts == source) and pg-ddl-churn (pg_replication_slots.confirmed_flush_lsn advances across a zero-yield DDL-churn run, read from the SERVER). An engine whose CDC service is down (no logical WAL / binlog not ROW / Agent stopped / not a replica set) SKIPs every cell with that reason."
    backends: [sqlite, postgres]
    status: test        # verify_cdc_e2e (dev/release_oracle/cdc.py) — env-driven RIVET_CDC_<ENGINE>_URL, SKIP-if-absent
  - id: partner_shape
    what: "the partner shape as the OPERATOR gets it: the config `rivet init --mode cdc` EMITS over three tables — one keyset recipe per table plus one `tables:` stream with `backfill: auto`, never `initial: snapshot` — with a `load:` appended, driven through the whole cycle on MySQL and PostgreSQL (the engines init consolidates): doctor → check → run 1 (anchor + every table's baseline through its recipe) → load 1 → per table BigQuery COUNT == source == 5 → a delta in every table (3 inserts, 1 update, 1 delete) → run 2 → load 2 → per table the live view (`WHERE NOT __is_deleted`) == source == 7 and `<table>__changes` == baseline + 5. Oracles: the `bq` CLI and a source re-query, never rivet. Every other CDC cell hand-writes its config; a scaffold that parses but cannot complete the cycle is what this catches. RED-proven against the downloaded v0.26.0 (its scaffold is `initial: snapshot` with no recipe: the init stage names every miss); 20/20 rows green on the current binary."
    backends: [sqlite, gcs]
    status: test        # verify_partner_shape (dev/release_oracle/partner_shape.py) — RIVET_CDC_<ENGINE>_URL + BQ_ORACLE_PROJECT + `bq`, SKIP-if-absent
  - id: shared_state_same_name
    what: "FOUR configs with ONE export name (`users`) — MySQL, PostgreSQL, SQL Server, MongoDB — sharing ONE Postgres state DB, run AT THE SAME TIME, each into its own prefix and BigQuery dataset: blessed, then every stream crashed at once (cdc_after_flush_before_ack / after_file_write), then crashed one at a time while the others run clean; the CDC cycle (anchor + backfill → load → delta → load) and the batch cycle (full → load). Grades per engine: warehouse == source (count, distinct key, SUM(id) in the engine's id band), and the state DB: one `cdc_snapshot` row per PREFIX, a per-run load spec for every successful run, the newest `run_status` row per prefix a success. Three shared-state defects were measured before this cell: a live run superseded by another config's success, one baseline row per NAME, the by-name spec retyped by the last writer."
    backends: [postgres, gcs]
    status: test        # verify_shared_state_same_name (dev/release_oracle/shared_state.py) — runs tests/live/live_shared_state_same_name.rs through the Rig against the gate binary; RIVET_CDC_STATE_URL + BQ_ORACLE_PROJECT + `bq` + cargo, SKIP-if-absent
  - id: warehouse_layout
    what: "the layout a `backfill:` CDC stream lands in BigQuery and the cycle the partner runs on it — `run → load → compact`: the base `<table>` is a PHYSICAL table with the source columns plus `__is_deleted` carried as data inside the baseline Parquet (never NULL — LOAD DATA fills an absent column with NULL, not DEFAULT, measured); `<table>__changes` is a per-cycle buffer holding exactly the cycle's changes; `rivet compact` runs ONE MERGE (latest per key; a delete flags the row and keeps its last values; a re-insert un-flags) and DROPs the buffer; a crash between MERGE and DROP re-merges idempotently. Plus the partition budget: 5,000 daily partitions read by keyset land via `__staging` + CLONE in two jobs with DAY partitioning intact, a file no batching splits is refused BY NAME before any job with the ledger saying `refused`, and a CDC baseline over the same history lands in the base in two jobs with no buffer yet. Oracles: the source and `bq` (COUNT, COUNTIF on the flag, SUM(id), the table type, the partitioning), the SQLite ledger — never rivet's report. Measured before the cell: the partner's 317M-row baseline inside `__changes` behind a view, and their first wide-history load refused with no way through."
    backends: [sqlite, gcs]
    status: test        # verify_warehouse_layout (dev/release_oracle/warehouse_layout.py) — runs tests/live/live_cdc_compact.rs + live_load_partition_batches.rs through the Rig against the gate binary; RIVET_CDC_STATE_URL + BQ_ORACLE_PROJECT + `bq` + cargo, SKIP-if-absent
  - id: init_delta
    what: "the guarantee path on configs the PRODUCT wrote: `rivet init --bigquery-project/--bigquery-dataset` scaffolds the `load:` section, and on that file run 1 takes everything and run 2 takes only the delta — batch on PostgreSQL / MySQL / SQL Server (`run → load → compact`: run 1 a BASE TABLE, run 2 a buffered delta that `compact` merges, the UPDATE landed, the buffer gone), an incremental export (every row, then the delta), a single-table CDC scaffold (run 1 the baseline — init writes `cdc.initial: snapshot` — run 2 the changes), a multi-table `backfill: auto` scaffold (every baseline, then the changes). No hand-typed YAML anywhere: init's own decisions (the cursor, the layout, the load block) are what is graded — the SQL Server `datetime2` cursor miss was found this way. Oracles: the source, `bq`, the Parquet on disk — never rivet's report."
    backends: [sqlite, gcs]
    status: test        # verify_init_delta (dev/release_oracle/init_delta.py) — runs tests/live/live_init_delta.rs through the Rig against the gate binary; RIVET_CDC_STATE_URL + BQ_ORACLE_PROJECT + `bq` + cargo, SKIP-if-absent
  - id: nextest_grading
    what: "the harness's own grading of the Rig cells: nextest prints `FAIL + LEAK [` for a test that failed AND left a handle open, and a parser matching `(PASS|LEAK) [` found the `LEAK [` inside it and graded the failure green (found 2026-09-25: 2 of 6 failures in one cell). Checked first in every gate run against nextest's real line shapes — PASS, LEAK, FAIL + LEAK, FAIL, SLOW — so a regressed parser fails the gate before it grades anything."
    backends: [sqlite]
    status: test        # verify_nextest_grading (dev/release_oracle/core.py) — runs at the start of every gate; also `--self-test`
  - id: run_strict
    what: "`rivet run --strict` (ADR-0038 step 2), the one `run` flag the blessed postgres chain cannot carry because it has no lossy column: an Oracle TIMESTAMP(9) export is refused before any part with RIVET_TYPE_UNSAFE_MAPPING naming the column, with the exit class `check --type-report --strict` gives; without --strict the run warns naming the column and the row lands. Oracles: the Parquet on disk read by DuckDB — never rivet's report."
    backends: [sqlite]
    status: test        # verify_run_strict (dev/release_oracle/blessed_flow.py) — runs tests/live/live_type_policy.rs's batch cells through the Rig against the gate binary; needs cargo and the stand's oracle (:1521), SKIP naming it when down
  - id: clickhouse_load
    what: "`rivet load` into ClickHouse (ADR-0035) against the stand's server: a CDC stream from MySQL, PostgreSQL and SQL Server whose `FINAL` view equals the source row for row with the deleted key flagged (the version decodes each engine's position); a load killed after appending re-runs, the log holds every row twice and the view is unchanged; a full load swaps in the current source, and killed at each of its four fault points re-runs to it; a timestamp past DateTime64's range is refused pushed or pulled; an INSERT whose answer a proxy swallows is resent into a CDC log (at most five attempts) and never into a full load's swap table; an incremental export adopts the table behind a latest-cursor view; `rivet init --clickhouse-*` scaffolds the block and its flags require each other; the version orders positions whatever the insert order, an unknown `__pos` shape fails the insert, and a pulled part lands by column name with a NULL key refused. Oracles: the source and ClickHouse read back directly — never rivet's report."
    backends: [postgres, gcs]
    status: test        # verify_clickhouse_load (dev/release_oracle/clickhouse_load.py) — runs tests/live/live_clickhouse_load.rs + live_init_extended.rs through the Rig against the gate binary, plus the three `#[ignore]` live lib tests in src/load/clickhouse.rs (version order, unknown `__pos` shape, pull by name) via `nextest --lib`; needs cargo and the local services (clickhouse :8123, fake-gcs :4443, postgres, the three CDC engines), SKIP naming any that is down — no cloud prerequisite
  - id: cdc_schema_drift
    what: "`on_schema_drift` on a CDC export (found 2026-09-26: the CDC runner never consulted it — a retyped column wrote three differently-typed parts into one prefix, exit 0). Per SQL engine: a column retyped between two runs is refused under `fail` before the stream acknowledges anything (MySQL/SQL Server checkpoint bytes and the PostgreSQL slot's confirmed_flush_lsn unchanged), and after switching to `warn` both deferred changes land with their values (30000000000 needs the widened BIGINT). Oracles: the checkpoint/slot read directly and the Parquet re-read — never rivet's report. MongoDB is n/a: its CDC schema is the fixed document blob. The same cell also runs two shared-tail checks on MySQL (engine-agnostic code in `run_cdc_export`): a failed CDC run POSTs its `failure` notification to a loopback webhook, and a CDC export names the batch-only knobs its drain ignores."
    backends: [sqlite]
    status: test        # verify_cdc_schema_drift (dev/release_oracle/cdc_schema_drift.py) — runs tests/live/live_cdc_schema_drift.rs through the Rig against the gate binary; needs cargo and postgres-cdc :5434, mysql-cdc :3307, mssql-cdc :1434, SKIP naming any that is down

# ── BACKEND-INFRASTRUCTURE dimensions the gate does NOT yet exercise (the audit gaps) ──
# The gate connects DIRECT to every engine; it never routes through the connection-
# mediation layer prod runs (poolers/proxies/replicas/degraded networks) even though the
# compose stack HAS all of it. Each row is a real hole, ratcheted; fill by adding a
# preflight/scenario and flipping status -> test.
infra:
  - id: no_invariant_violations
    status: test
    note: "verify_no_invariant_violations fails the gate when ANY gated command (Proc, the concurrency
      racers, the CDC differential) printed `run-integrity invariant violated` — the release binary only
      warns on a facade bypass (ADR-0018), so without this scan the warning passed silently. Self-test
      RED-proven against a no-scan mutant"
  - id: network_faults
    infra: toxiproxy
    status: test
    note: "verify_network_faults drives export_survives_transient_latency_added_via_toxiproxy +
      export_fails_cleanly_when_toxiproxy_is_disabled_before_run +
      gremlin_cdc_binlog_cut_mid_drain_fails_loud_then_recovers through the release binary;
      probes toxiproxy :8474 itself and SKIPs loudly when down"
  - id: state_upgrade
    status: test
    note: "pg_upgrade_from_v18_lands_keyset_range_as_bigint_and_keeps_data (src/state/migrations.rs) — stages a POPULATED v18 Postgres state db, migrates in place to HEAD, asserts keyset_range is BIGINT + the pre-upgrade cursor survives; run by the state_migrations preflight. RED-proven against the int4 v19."
  - id: state_concurrency
    infra: postgres-state
    status: test
    note: "pg_shared_state_cross_connection_visibility_and_supersession (src/state/run_status_store.rs) — two StateStore connections = two processes on one shared Postgres state: a run begun on A is active-visible to B (the gc_orphans signal), and a newer run supersedes the older clock-free. Run by the state_migrations preflight; RED-proven against a flipped supersession."
  - id: tls_required
    status: partial
    note: "POLICY half gated: verify_tls_required drives sec_remote_plaintext_pg_is_loud +
      sec_loopback_plaintext_pg_is_allowed + sec_enforced_tls_is_not_overridden_by_url_sslmode_disable.
      RESIDUAL: a real TLS handshake against a VERIFIED cert (the vendored-openssl / tiberius
      class) needs a TLS-provisioned service the stand does not have; the gate still runs
      mssql on accept_invalid_certs"
  - id: auth
    infra: mongo-auth
    status: partial
    note: "SCRAM half gated: verify_auth drives mongo_readonly_login_exports_despite_denied_harm_probe
      (least-privilege export, DuckDB-graded) + mongo_wrong_password_fails_loud_and_writes_nothing
