  - id: seeded_recall
    status: partial
    note: "verify_seeded_recall re-introduces every known bug class in dev/seeded/seeds.yaml as a
      source patch in a scratch worktree, builds it, and requires the declared catching cells
      (green on the unpatched tree) to go red; MISSED / STALE / BROKEN / NO-CONTROL rows fail.
      RESIDUAL: opt-in (--with-seeded-recall / RIVET_ORACLE_SEEDED_RECALL=1, or `make seeded-recall`),
      it records a SKIP otherwise; several classes have engines with no catching cell (see the manifest)"
  - id: cdc_standby
    infra: ["pg-cdc-standby"]
    status: test
    note: "the mysql read-REPLICA half is the `replica_read` preflight (verify_replica_read).
      The standby half: verify_cdc_standby probes :5436 ITSELF (the live test self-skips as
      PASSED when the port is down — the vacuous-skip class) and drives
      roast_pg_cdc_bounded_on_a_standby_fails_loud when the `cdc-standby` profile is up"
  - id: live_only_coverage
    status: test
    note: "verify_live_only_coverage runs the offline battery under cargo-llvm-cov and
      dev/pytools/live_only_cov.py classifies every mutants.toml whole-function exclusion:
      confirmed zero-coverage / adjudicated (reason pinned in the tool; deleting an entry
