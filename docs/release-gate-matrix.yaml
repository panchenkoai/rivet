  - id: failed_run_tail
    what: "a run that fails by RETURNING an error (every other gate hook panics, and a panicked run never reaches the finalize code). On the stand PostgreSQL: single incremental (`RIVET_TEST_ERROR_AT=sink_part_write:1`), chunked plain parallel and chunk_checkpoint sequential + parallel (`chunk_export:1`), keyset parallel 4 + keyset_incremental (`keyset_parallel_worker_midrange:1`), an incremental run failed by `on_schema_drift: fail`; plus parallel-4 Mongo (`mongo_parallel_worker:1`). Per case: exit != 0 and no `_SUCCESS`; the run's manifest status is failed; `rivet validate` exits non-zero naming RIVET_VERIFY_RUN_NOT_SUCCESSFUL; the state DB read through DuckDB ATTACH holds the cursor at the newest SUCCESS manifest's cursor_high; `export_metrics.files_committed` == the parquet the failed run left on disk; then a clean re-run (`--resume` where the product prescribes it) after which DuckDB over the SUCCESS-declared parts == the source in count and distinct id. RED-proven against `cursor_may_advance` -> true and the RunNotSuccessful check removed."
