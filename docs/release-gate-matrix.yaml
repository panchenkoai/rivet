  - id: transient_retry_exact
    what: "a transient fault retries to an EXACT result, and stops when a retry would duplicate. (a) `RIVET_TEST_TRANSIENT_ONCE=chunk_write` and `=after_resume_adopt` (after a crash, with --resume): exit 0, export_metrics.retries >= 1, DuckDB over the declared parts == source count and distinct. (b) a toxiproxy `reset_peer` on the stand PG proxy (:15432), timed at the product's own pause point (`RIVET_TEST_PAUSE_AT=pg_after_snapshot_open`): before any part is durable the run retries and succeeds exactly once per row with no undeclared part left; after a part is durable it stops through the duplicate guard (`decide_export_retry`, 'cannot safely retry') with exit != 0 and files_committed == parquet on disk. Takes the live tests' toxiproxy flock. RED-proven against the duplicate guard disabled."
