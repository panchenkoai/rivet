    status: test        # verify_release_regression (dev/release_oracle/regression.py)
  - id: upgrade_continuity
    what: "what the PREVIOUS release left behind, carried on by this binary, per SQL engine (PostgreSQL, MySQL, SQL Server, Oracle — Oracle added 2026-10-01, RIVET_ORACLE_ORACLE_URL) on the downloaded previous binary: the config the previous `rivet init` generated is `check`ed with the same strategy; a previous incremental run is continued (every id once, every latest value right, exactly first pass + delta rows — a re-read reads RED); a previous keyset run crashed mid-page is RESUMED (the pre-crash parts the previous binary wrote are declared — a restart reads RED); a state one schema version ahead is refused with the upgrade message before any part is written; the old config over the used prefix with an EMPTY state loses nothing and reports the rows it re-baselines. Per CDC engine (PostgreSQL, MySQL, SQL Server, MongoDB, Oracle — Oracle LogMiner through the capture user RIVET_UPG_ORACLE_CDC_URL): the previous release anchors a stream and captures a 20,000-change batch; this binary continues its checkpoint and captures exactly the next batch — every id once, none of the first batch re-read (RED-proven 2026-09-27: MySQL ignoring its checkpoint captured 0 of the second batch). CDC into BigQuery (cdc-load, dev/release_oracle/upgrade_cdc_load.py, one leg keyed per engine: MySQL, PostgreSQL, SQL Server, Oracle, MongoDB; PostgreSQL in a database of the cell's own, its logical slot dropped by the cell on success and failure): the previous `init --mode cdc` config on three tables runs run → load → compact three cycles by the previous release and two by this binary, with inserts, updates, a partition-moving update and a delete between cycles; after every compact one DuckDB session (the source + BigQuery attached) grades each base's live rows == the source `id:v:epoch`, the epoch read by the source's own function (`UNIX_TIMESTAMP` / `extract(epoch)` through `mysql_query` / `postgres_query`, never a session-rendered text), every deleted id flagged `__is_deleted`, no key twice, no `__changes` left (and, before each later compact, that the load DID leave a buffer). RED-proven 2026-10-01 at cycle 4 against two mutants in this binary only (compact writes `__is_deleted = FALSE` on a delete; the load plan drops one column); Each engine runs twice: in UTC and with a non-UTC source zone (MySQL GLOBAL time_zone '+09:00', restored by the cell; PostgreSQL database default TimeZone 'Asia/Tokyo'), the zone checked in force before the first row. RED-proven 2026-10-01 (non-UTC cells only; the UTC cells stayed green under the same mutants): MySQL with the snapshot session's `SET time_zone = '+00:00'` removed (base +9h at cycle 1; the mutant ran as both binaries, since the snapshot is the previous release's); PostgreSQL with the reader's `SET TimeZone = 'UTC'` removed AND the timestamptz offset ignored, RED only when BOTH are off (+9h at cycle 4); upgrade[postgres/cdc-load] against compact writing `__is_deleted = FALSE` on a delete. On the previous release's init, SQL Server, Oracle and MongoDB anchor the stream before the seed (0.30.0's init wrote them no baseline); SQL Server's capture job settles after every change; their source epoch is `DATEDIFF_BIG(second, '1970-01-01', SWITCHOFFSET(col, 0))` (sqlcmd), `(CAST(SYS_EXTRACT_UTC(col) AS DATE) - DATE '1970-01-01') * 86400` (python-oracledb: DuckDB has no Oracle scanner) and the BSON date's epoch (mongosh). Non-UTC variants: SQL Server values carry a +09:00 offset (it has no session zone) and rivet runs under TZ=Asia/Tokyo; Oracle's writing session TIME_ZONE is Asia/Tokyo and rivet runs under TZ / ORA_SDTZ = Asia/Tokyo. Every engine also runs `upgrade[<engine>/cdc-load/init=this]`: THIS binary's init config (seeded before init; every CDC scaffold now carries a baseline) through five cycles by this binary, graded the same way; for Oracle it asserts the current contract instead (init writes no `load:` block and names ADR-0037, `check` passes, `run` writes each table's baseline Parquet). The grade reads the warehouse table the load names (`dbo_<table>` on SQL Server) and MongoDB's relaxed-JSON `document`. KNOWN RED (known_red.py, until 2026-10-31): SQL Server (both) and MongoDB stop at the previous release's first compact ('never loaded': 0.30.0's init wrote per-table streams with no baseline under a base_buffer `load:`; fixed in this tree, red until a release carries it); Oracle (both) stops at the anchor run (0.30.0's init wrote a `load:` block every command refuses; Oracle CDC load is the GA work, ADR-0037). Oracle batch and CDC legs RED-proven 2026-10-01 against Oracle-scoped mutants: the incremental cursor predicate `>=` (5351 rows for 5350), the keyset page seek `>=` (250001 rows for 250000), the CDC checkpoint ignored (0 of the second batch); a keyset resume that restarts from the start stays GREEN (it rewrites the same part names, so the crash check cannot tell it from a resume). Wall: the cdc-load lanes run side by side, ~17 min on the stand; the Oracle batch + CDC legs ~2.5 min. SKIP without BQ_ORACLE_PROJECT / BQ_ORACLE_DATASET / BQ_ORACLE_BUCKET. Cursor and crash legs on the SQLite state and on the gate's Postgres state. Oracles: DuckDB over declared parts, the source. RED-proven 2026-09-27 against three product mutants (cursor not read: 10300 rows for 5350; resume anchor ignored: 0/2 pre-crash parts adopted; the newer-schema refusal removed)."
    status: test        # verify_upgrade_continuity — dev/release_oracle/upgrade.py
  - id: perf_regression
    what: "wall, CPU (user+sys), peak RSS and the engine's graded source-harm counters, this binary against the DOWNLOADED previous release, per path and engine, one warm-up then the minimum of three: batch `full`, keyset, an incremental delta and a crash->resume on PostgreSQL, MySQL and SQL Server (configs from the previous release's init); a CDC drain of 20,000 changes (one big insert transaction, updates, deletes) on PostgreSQL, MySQL, SQL Server and MongoDB. Tolerances: wall x1.5+0.1s, CPU x1.3+0.05s, RSS x1.3+16MiB, harm x1.25+200. Before it only a PostgreSQL batch keyset wall time was compared; CDC, the other engines, deltas and resumes were never timed against the previous release. A/A-checked (previous against itself on every path: no false alarm). Off the happy path: full and keyset through a 50 ms toxiproxy link, keyset over a 2,000,000-row table (RSS graded), MongoDB full; CDC drains with the transaction buffer capped (spill) and after a crash between flush and ack. A multiplex CDC stream over twenty PostgreSQL tables as the previous init generates it. PostgreSQL harm is the SOURCE's own pg_stat_database delta over each run, read by the harness: rivet's self-reported harm changed meaning in #312 (0.29.0 reported 1,575 tuples for a drain both binaries measurably cost ~35,000), so it cannot be compared across releases (RED-proven: 20 extra catalog scans per peek read 321,301 vs 34,881). Not graded: chunked-parallel — `rivet init` never emits `parallel`, and a config is not hand-written."
    status: test        # verify_perf_regression — dev/release_oracle/perf.py
  - id: live_modules
    what: "every live_suite module the gate has not already run, through the gate's RELEASE binary, DERIVED from tests/live_suite.rs: the dedicated cells register the tests and modules they run and this cell (last) runs all the rest, so a regression test written for a later defect enters the gate without anyone listing it. Exclusions are named with a reason; the self-test fails on one that names a module live_suite no longer has. Added 2026-09-27 when the tests for five defects found that week were in the suite but not in the gate (keyset anchor shape, split re-run, max_file_size rotation, ClickHouse idle load and adoption hint, Oracle cursors)."
    status: test        # verify_live_modules — dev/release_oracle/live_modules.py
  - id: previous_release_differential
    what: "the same OBSERVABLE SURFACE on both binaries over 8 fixtures (full, chunked-parallel, keyset-parallel, chunk_checkpoint, incremental, csv, crash+resume, error-exit + `plan --format json` purity): exit code, DuckDB row readback, file count, and the manifest INCLUDING per-part content fingerprints and column checksums — same source and encoder settings must give the same digests, so a difference there says the BYTES changed, not the bookkeeping. Where release_regression asks `can the new binary read what the old one wrote, and is it as fast`, this asks `does it still DO the same thing` — the question nothing asked when the 0.24.4 governor regression shipped. Drives dev/pytools/ab_regression.py; one ledger row per scenario plus a count row, and a scenario that graded nothing FAILS rather than reading as agreement."
    backends: [postgres]
    status: test        # verify_previous_release_differential (dev/release_oracle/regression.py)
  - id: field_symptom_replay
    what: "the 2026-08-13 governor regression's own SYMPTOM, replayed on both binaries: a workload shaped like the field run (mostly tiny full exports, a keyset majority at parallel 1/2/4, a few chunked, under a pool), adaptive on and off. Four criteria ordered so the ACTIVATION GUARD comes first: (1) the OLD binary must shed at least once — without it the run reproduces nothing and 2-4 grade air, (2) the NEW binary sheds ZERO on an idle source, (3) new makespan <= old x 1.05, (4) identical rows per export. Each criterion is its own ledger row; criteria that `passed` under a dead fixture are recorded SKIP, never PASS. Needs the MySQL stand. SHELF LIFE: criterion 1 is evidence only while RIVET_PREV_RELEASE_BIN carries the regression — once the fix ships, pin this stage`s baseline to the last regressing release or retire the fixture."
