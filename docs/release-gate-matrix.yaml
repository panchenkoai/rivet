# Release-gate coverage matrix — every gate CHECK × engine × VERSION, plus the
# backend-INFRASTRUCTURE dimensions the go/no-go gate does (or does not yet) exercise.
#
# This is the SINGLE source of truth for what `dev/release-oracle` actually gates, so
# the gate's coverage is reviewable at a glance and its gaps are counted, not silent.
# Same cell vocabulary + shrink-only ratchet discipline as the sibling docs/*-matrix.yaml
# ledgers; drift-guarded against the gate's real config by
# tests/release_gate_matrix_guard.rs:
#   - every `grid.<engine>.gated` version must appear in dev/release-oracle/matrix.yaml
#   - every scenario/preflight function in dev/release_oracle/scenarios.py must have
#     a row here (and vice-versa) — a new gate check with no cell fails the guard
#   - `gap` cells are counted and ratcheted (no NEW gaps; fill one by wiring the check
#     and flipping gap -> test)
#
# Cell vocabulary:
#   test  — the gate RUNS this check for this engine (across its gridded versions) and it is green.
#   na    — not applicable to this engine by design (e.g. SQL keyset on Mongo).
#   gap   — SHOULD be gated, isn't yet (ratcheted; shrink-only).

# ── The engine × VERSION grid the gate brings up (mirrors dev/release-oracle/matrix.yaml) ──
# `gated`   = versions the gate spins up, seeds, and runs every applicable scenario against.
# `gaps`    = versions that EXIST (a compose service / a devbox stand / a public image) but
#             CANNOT be gated today — a real coverage hole, ratcheted (shrink-only).
# `descoped`= versions that CAN be gated and were MEASURED green, left out on cost alone.
#             NOT ratcheted, because it is not debt: re-gating one is a two-line edit
#             (here + dev/release-oracle/matrix.yaml) with nothing to fix first. Keeping
#             these in `gaps` would report permanent debt the product never took on —
#             the exact thing the ratchet comment warns teaches readers to discount it.
grid:
  postgres:
    gated: [14, 16, 18]              # oldest supported, primary target, newest (2026-09-20)
    gaps:  []                        # nothing here is BLOCKED — see `descoped`
    descoped: [12, 13, 15, 17]       # MEASURED, not argued: all seven were green in the
                                     # 2026-09-20 gate (including the cells 13 and 15 failed
                                     # on, which were harness collisions, not version faults).
                                     # Un-gated on COST: seven postgres versions were ~57% of
                                     # the matrix's cells and every one graded the same
                                     # ENGINE-level golden below, so 13/15/17 bought repetition
                                     # rather than coverage. docs/reference/compatibility.md
                                     # names the gated set, so the published "full suite against
                                     # each version" claim stays true.
  mysql:
    gated: ["8.0", "8.4"]
    gaps:  ["5.7"]                   # MEASURED 2026-08-30, not argued: the seed dies with
                                     # `ERROR 1064 at line 111 … near '(ORDER BY id) AS chunk_rownum'`
                                     # — a WINDOW FUNCTION (dev/mysql/init.sql), which is 8.0+.
                                     # The old note blamed a recursive CTE: right family, wrong
                                     # construct, and the CTE had already been removed. Closing this
                                     # means emulating ROW_NUMBER with a session variable in a seed
                                     # every other version shares — a change with its own blast
                                     # radius, deliberately not made on the way to a release.
    # `mariadb-11` was listed as a gap and REMOVED 2026-08-30: MariaDB is not a
    # source engine at all. `SourceType` is Postgres | Mysql | Mssql | Mongo, and
    # the only MariaDB-shaped things in the tree are MaxScale PROXY detection
    # (a front-end for MySQL, src/source/mysql/proxy.rs) and a changelog note
    # that MariaDB spells `max_statement_time` differently. There is no compose
    # service, no doc, no README claim and no test — so the row was a debt that
    # could never be paid, only pretended at: closing it would mean ADDING an
    # engine, which is a product decision and not a coverage gap.
  mssql:
    gated: ["2022"]
    gaps:  ["2019"]                  # MEASURED 2026-08-30. The tools18-path blocker WAS real and is
                                     # fixed (sqlcmd is probed per container now, and 2019 brings up
                                     # and connects). The seed then fails with `Msg 208` (invalid
                                     # object) + two `Msg 195` (not a recognized built-in function) —
                                     # a 2022-only function in the seed, not a harness limit. The
                                     # exact function is one `sqlcmd` away; closing it is a seed
                                     # change, tracked here rather than bundled into a release.
  mongo:
    gated: ["4.4", "5", "6", "7", "8"]   # 5/6/8 added; 4.4 is arm64-flaky on the colima devbox (documented, not a rivet bug)
    gaps:  []
  oracle:
    gated: ["23-free"]               # gvenzl/oracle-free:23-slim-faststart, the compose stand's image,
                                     # brought up by the gate on :55023 and seeded from
                                     # seeds/common/oracle.sql + dev/release-oracle/oracle_tz_probe.sql.
                                     # The gate grades Oracle BATCH only. Oracle CDC ships (#324) as a
                                     # bounded drain to files, tested in tests/live/live_cdc_oracledb.rs;
                                     # continuous CDC and a `load:` over it are refused at config load.
    gaps:  []

# ── Per-(engine, version) DATA / BEHAVIOUR scenarios (run once per gridded version) ──
# Cell is per-ENGINE (uniform across that engine's gridded versions); a version-specific
# divergence would split into its own note.
scenarios:
  - id: bq_cycle
    what: "the full warehouse cycle on real infrastructure: export to a real GCS bucket -> rivet load -> row count verified by `bq query` (Google's parquet reader, which shares no code with rivet's writer) -> table dropped and prefix removed, with the drop VERIFIED by asking afterwards (bq rm -f exits 0 whether it deleted a table or found none, so its exit status cannot answer 'is it gone' — that cell reported a clean cleanup while dropping a table that never existed)."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    test
    oracle:   test
  - id: blessed_path
    what: "COMPLEMENTS docs/scenario-artifact-matrix.yaml, which owns the artifact/meta-DB half more deeply (14 lifecycle scenarios, all engines, canonical seed, chunk_run/chunk_task/load_run snapshots). What is added here and provably absent there: an INDEPENDENT oracle (that driver has zero duckdb calls — it compares rivet's records to rivet's files), the COMMAND CHAIN in one traversal: init -> doctor -> check -> plan -> apply -> validate, one cell per stage, asserting every artifact (config, plan.json, parquet, manifest.json, _SUCCESS, export_metrics/file_log/run_status) with DuckDB as the independent oracle for rows and file count. Per-stage coverage existed everywhere; no test drove three of the five subcommands in one body, and both defects found 2026-08-04 (apply's empty config path, CDC's unexpanded {date}) lived in that handoff gap."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    test
    oracle:   test
  - id: blessed_flow
    what: "The WHOLE journey as ONE declared cross-product, not per-defect additions: pipeline{batch,cdc} x lifecycle{clean,repeat,resume} x store{local,s3,gcs} x state{sqlite,postgres} x engine = 144 cells, 76 runnable, 68 `na` each carrying its reason in the ledger. Where blessed_path walks init->apply for one strategy, this adds what that chain cannot reach: the CDC pipeline (plan/apply REFUSE a cdc export, so those cells run `run`), the crash-then-resume lifecycle (a fault hook kills the first apply, and the probe FAILS the cell if the hook did not stop it — a resume whose first run succeeded is a clean re-run wearing a flag), the repeat lifecycle asserted on the MANIFEST COPIES rather than the parquet (the data surviving is what makes a sidecar clobber invisible), and `load` with load_run/loaded_source_run. Values are read ONLY by DuckDB, and only from parts a manifest DECLARES as committed — counting every parquet under the prefix reads a crashed run's orphans as delivered data. State is scoped per-run (watermark on export_metrics, which has no run_id; run ids from the manifests for file_log/run_status): the first draft counted `export_name='flow'` and read 37 rows of unrelated history on a cell that wrote one."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    test
    oracle:   { gap: "not wired for Oracle: blessed_flow's cells ride the CDC stand in dev/release_oracle/cdc.py, whose _ENGINES has no Oracle entry (Oracle CDC itself ships as a bounded drain to files, #324, but its `load` leg is refused at config load); the batch chain is graded by blessed_path" }
  - id: not_inert
    what: "The chain's own oracles must be able to go RED. Breaks each artifact class and requires the matching stage to fail: every declared part removed (oracle must stop agreeing with the source), no manifest (must report undelivered, not count the parquet lying next to it), a run id that never ran (state must refuse). Carries a NEGATIVE control too — removing ONE redundant copy of a repeated export must NOT move the oracle; the first draft demanded a failure there and went red against a correct oracle."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    test
    oracle:   { gap: "not wired for Oracle: sc_not_inert breaks blessed_flow's artifacts, and blessed_flow does not run on Oracle" }
  - id: verdicts
    what: "init -> the strategy per table matches the golden (keyset/full/range/name-trap), zero phantom heavy-chunk."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    test
    oracle:   test
  - id: integrity_types
    what: "users 150K loss/dup 0 (source count+distinct == DuckDB read) + per-engine DuckDB type/CSV golden (parquet binary path + CSV all-varchar text path)."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    { na: "Mongo is a JSON-blob model (full-scan only) — no per-engine type matrix; the loss/dup arm still runs under integrity_types" }
    oracle:   test
  - id: sentinels
    what: "Boundary values must round-trip EXACTLY or fail loudly, never succeed changed. Per engine, tables created at run time in the gate's own container hold NULL rows, epoch and epoch-1us, the type's min/max, leap days, empty vs 'NULL' text, nil uuids, extreme decimals and floats; one-value tables hold what may be unrepresentable (PG infinity/BC/24:00/NaN, MySQL zero dates and YEAR 0000, SQL Server 100ns datetime2/xml/sql_variant, Oracle BC dates and TIMESTAMP(9)). Each goes through the full and keyset paths and is compared to the SOURCE row by DuckDB. Success with a changed value is the defect (a zero date that became 1970-01-01, a NULL that became epoch)."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    { na: "Mongo is a JSON-blob model (_id + extended-JSON document), so there is no per-column value mapping to degrade; its values are graded under integrity_types and mongo_keyset" }
    oracle:   test
  - id: keyset_parallel
    what: "parallel:4 keyset fan-out: loss/dup 0 (DuckDB oracle) AND >=2 distinct pk_w{ridx} workers (no silent degrade to sequential)."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    { na: "Mongo keyset is page_size (+ parallel -> mongo_parallel), graded by the mongo_keyset row" }
    oracle:   test
  - id: mongo_keyset
    what: "Mongo keyset on ONE version (8): `source.mongo.page_size` sequential AND `parallel: 4` (run_mongo_parallel) must each equal the pymongo source count+distinct via DuckDB over the DECLARED parts, over >=2 range parts; an int+string `_id` collection must be REFUSED on both (exit != 0, zero parts, the ensure_uniform_id_type message) — `$gt` is BSON-type-bracketed, so an unguarded keyset exports one bracket and reports success. RED-proven against the guard disabled and a dropped parallel range."
    postgres: { na: "SQL keyset is the keyset_parallel row" }
    mysql:    { na: "SQL keyset is the keyset_parallel row" }
    mssql:    { na: "SQL keyset is the keyset_parallel row" }
    mongo:    test
    oracle:   { na: "Mongo-only runner" }
  - id: load
    what: "manifested parts -> each object store {s3/minio, gcs/fake-gcs, azure/azurite}, independent readback count == summed manifest row_count + id-set round-trips."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    test
    oracle:   test
  - id: gc_survival
    what: "concurrent-extract bucket-erasure guard: a Running manifest spares an in-flight part; none deletes the orphan; Success parts always kept."
    postgres: test
    mysql:    { na: "store-level property, source-agnostic — one engine's parts exercise it (runs on postgres)" }
    mssql:    { na: "store-level property (see postgres)" }
    mongo:    { na: "store-level property (see postgres)" }
    oracle:   { na: "store-level property (see postgres)" }
  - id: load_pool
    what: "`rivet load --pool 16` at the pool's FULL declared width (MAX_POOL == DEFAULT_POOL == 16): 16 tables seeded alike, config GENERATED by `rivet init --include 'pool_t*' --gcs-bucket --bigquery-project --bigquery-dataset` (exports AND the load: block — not a line written by hand, so the cell also grades what init decides over 16 tables). TWO oracles, because completeness alone is vacuous here: (1) per table, BigQuery's COUNT(*) AND SUM(id) vs a re-query of the SOURCE — identical counts across 16 alike tables cannot see a fan-out that routed one table's rows under another's name, the sums can; (2) NON-VACUITY — BigQuery's own job history must show >=2 LOAD_DATA jobs for these tables OVERLAPPING in time, with touching-but-not-overlapping counted as 1, since a pool that degraded to sequential still loads every row and still passes (1). Sibling of keyset_parallel's '>=2 distinct worker parts'. An activation check fails the cell BEFORE measuring if init emitted fewer than 16 exports, so a narrowed pool can never be reported as the wide one."
    postgres: test
    mysql:    { na: "the load reads Parquet from GCS and talks to BigQuery — the SOURCE engine cannot change how the pool behaves; one engine exercises it (runs on postgres)" }
    mssql:    { na: "source-agnostic load path (see postgres)" }
    mongo:    { na: "source-agnostic load path (see postgres)" }
    oracle:   { na: "source-agnostic load path (see postgres)" }

# ── Source-agnostic PREFLIGHTS (run ONCE before the engine loop, not per engine/version) ──
preflights:
  - id: flag_surface
    what: "Every flag of every command in the chain is carried by some cell or excused BY NAME, with the surface DERIVED from `rivet <cmd> --help` rather than typed in. Found on its first run that init — the first stage of every chain — was being driven with one of its thirteen flags; --mode now tracks the pipeline axis and --s3-bucket/--gcs-bucket the store axis, so init's own scaffold is graded instead of discarded. The rotation that distributes flags across cells is keyed on a DIGEST of the coordinates, not the enumeration index: `% 3` over a nested cross-product aliased with the inner loops and drew --discover for every postgres-backend cell."
    status: test        # verify_flag_surface (blessed_flow.py) — no containers, runs with the file-level guards
  - id: release_build_path
    what: "the RELEASE build/publish path itself, not `cargo build` (the stricter tooling the TAG runs, which failed AFTER publish for 0.16.0/0.16.1): Cargo.lock in sync (`cargo metadata --locked` — publish + Docker cook are `--locked`), the cargo-manifest strict parse (no multi-line inline tables, the cargo_manifest_chef guard) + JSON-schema regen (schema_drift guard), and `cargo chef prepare` (the Dockerfile's actual planner step, cheap — no compile). Full `docker build` opt-in via RIVET_ORACLE_DOCKER=1. Runs FIRST, before any cargo reconciles the working-tree lock."
    status: test        # verify_release_build_path (dev/release_oracle/release_path.py)
  - id: state_migrations
    what: "SQLite state == Postgres state on the state-exercising golden fixtures (parallel-checkpoint, incremental, crash-resume) — the migration arrays are type-parity. CONDITIONAL, and the condition is the point: it needs a Postgres STATE backend named by RIVET_TEST_STATE_URL (the dev stand's persistent `postgres-state`, :5433) and SKIPs — loudly, never a silent pass — without one. That variable was documented NOWHERE until 2026-08-02, so this cell has read `status: test` while skipping in every run that did not happen to set it: a cell claiming coverage that an unset environment variable quietly withheld. A `status: test` whose test is opt-in must name the opt-in here, or the ledger overstates the gate. The scenario also probes the URL's host:port and SKIPs when it is unreachable, so a stopped stand cannot masquerade as a release failure."
    backends: [sqlite, postgres]
    status: test        # verify_state_migrations (commit e83656a), RED-proven int4 -> NOT RELEASABLE
  - id: coverage_matrices
    what: "every docs/*-matrix.yaml drift-guard runs (chunking/behaviour/type-fidelity/... + release_gate + perf) so a rotted coverage ledger blocks the release, not just CI."
    status: test        # verify_coverage_matrices
  - id: gif_currency
    what: "the instructional GIFs still show commands this binary accepts. They are binary assets, so no test reads them and no diff flags them — a GIF demonstrating a rejected flag is documentation that lies, and re-rendering does not fix it (the tape has to change). Ran in the gate since it was written; had NO ledger row until 2026-08-02, when the guard stopped reading a hand-typed module list and started deriving it."
    status: test        # verify_gif_currency (dev/release_oracle/gifs.py)
  - id: corruption_is_detected
    what: "the NEGATIVE half of verification: `rivet validate --depth full` must FAIL when the data on disk is wrong. Added because the answer was NO — a part corrupted in place (one byte in a dictionary page, `x`->`y`, file length unchanged, manifest and _SUCCESS untouched) validated PASSED/exit 0 while DuckDB and rivet's own Arrow reader both read the changed values. Cause: the value-checksum fold combined per-cell hashes with XOR, which ANNIHILATES (`h ^ h == 0`), so a column of duplicated values checksummed to zero whatever it held. Fold is now a wrapping sum, versioned in the manifest as `checksum_render`. The cell asserts four things, because verification can weaken in four ways: a clean export still passes (a check that only ever goes red discriminates nothing), the manifest carries a render marker, the corruption is DETECTED, and it is classified exit 3 data-integrity naming the diverging column — an operator triaging exit 1 hunts a credential, not corrupt data. Byte-level in place on purpose: a DuckDB rewrite changes the file length, so the size check fires first and the value checksum is never reached."
    status: test        # verify_corruption_is_detected (dev/release_oracle/corruption.py), RED by construction — it was written against the live defect
  - id: schema_fingerprint_moves_with_the_schema
    what: "drift detection compares this run's `schema_fingerprint` to the previous run's — BOTH produced by the same function — so a fingerprint blind to some change is blind on both sides and reports `unchanged`. An exact independent digest is not available: the fingerprint hashes `<name>\\t<data_type>` where `data_type` is rivet's OWN rendering of the Arrow type, so a second implementation would reproduce that naming and be a copy, not a witness. What is checkable without rivet's cooperation is the PROPERTY — real DDL is the independent party. Four changes (add / rename / retype / drop a column) must each move the fingerprint, and a control case re-exports an untouched table and requires it to stay put; without that control a fingerprint that changed on every export would pass every other case while being useless. Postgres only: the property is the fingerprint's, not an engine's."
    status: test        # verify_schema_fingerprint_moves_with_the_schema (dev/release_oracle/schema_drift.py)
  - id: reconcile_and_validate_cover_both_sides
    what: "reconcile and validate check DIFFERENT sides: reconcile compares the SOURCE to the recorded per-partition counts, validate compares the DESTINATION to the manifest. Each is asserted on its OWN exact exit code for the fault it owns — the earlier disjunction ('caught by at least one') let a regression in one tool hide behind the other: a source DELETE after export must make reconcile exit 3 while validate stays 0; a deleted part must make validate exit 3 (reconcile's answer is recorded, not asserted — it reads no parts). Then the documented recovery: rows that land inside an exported range after the export make reconcile exit 3, `rivet repair --execute` re-exports the flagged chunks, and afterwards reconcile and validate must both exit 0 and DuckDB over the DECLARED parts (DISTINCT — repair is additive, RR5) must equal the source both ways. Postgres only: the property is command-level, not engine-level."
    status: test        # verify_reconcile_and_validate_cover_both_sides (dev/release_oracle/corruption.py) — each tool on its OWN exit code (2026-09-26), plus the repair leg
  - id: tls_downgrade_refused
    what: "`tls: { mode: verify-full }` against the loopback stand must refuse, never export in plaintext (PG and Mongo serve plaintext; MySQL 8 and SQL Server present self-signed certs that verify-full must reject). Loopback is exempt from the TLS-required policy gate, so only each driver honouring `is_enforced()` stands between the enforced mode and plaintext — a separate connect path per leg: PG CDC run, MySQL batch run, MySQL `check` (the preflight pool), MySQL CDC run, MSSQL batch run, Mongo batch run. Per case: exit != 0, zero parts, and stderr TLS-shaped (tls/ssl/certificate/handshake). The existing sec_enforced_tls_is_not_overridden_by_url_sslmode_disable covers PG batch only. Each case SKIPs when its stand port is down. RED-proven against `is_enforced` bypassed on the MySQL source path."
    status: test        # verify_tls_downgrade_refused (dev/release_oracle/tls_downgrade.py)
  - id: cdc_corruption_is_detected
    what: "the same negative proof for the CDC leg, which needs its own: the CDC sink keeps a SEPARATE per-column accumulator and writes its own manifests, so a green batch cell says nothing about it. The same annihilating XOR fold lived here, and the render marker was briefly left `None` on this path — which alone would have made every CDC prefix read as corrupt. Captures to a LOCAL destination rather than the object store the e2e cell uses, because the corruption must be a byte flip IN PLACE and a download/edit/re-upload round trip rewrites the object. Positive first (a clean capture verifies), then the flip. Opt-in on RIVET_CDC_<ENGINE>_URL like the e2e cell, and SKIPs loudly without it."
    status: test        # verify_cdc_corruption_is_detected (dev/release_oracle/corruption.py)
  - id: cdc_differential
    what: "an INDEPENDENT implementation of the same capture. `cdc_e2e` compares the destination
      to the SOURCE (per-column null profile, distinct counts) and catches loss and
      degrade-to-null; it is structurally blind to rivet and its own oracle agreeing on a wrong
      SPEC. Debezium reads the same window from the same engine and the two captures are
      compared in DuckDB on (op, key, VALUES). The value comparison is load-bearing: without it
      a parquet with 100% of a column NULLed reports AGREE, measured, so a run that compared only
      (op, key) is graded a FAILURE here rather than accepted. `key-update` runs on every engine
      but MongoDB (`_id` cannot change): since ADR-0030 (2026-10-03) rivet writes a key change as
      delete(old)+insert(new), as Debezium does; before, it was update(new) and the cell was
      excluded."
    infra: [docker]
    status: test        # verify_cdc_differential (dev/release_oracle/cdc.py)
  - id: row_hash
    what: "`_rivet_row_hash` recomputed by something that is NOT rivet. The in-tree auditor recomputes with rivet's own `enrich` function — `src/lib.rs` says so deliberately, to avoid a second implementation drifting from the extractor — which is sound for detecting changed DATA and structurally blind to a defect in the SPEC, because both sides share it. Render id v1 shipped non-injective in two independent ways and lived four months. So this cell holds the other side: DuckDB re-reads the exported parquet, a Python implementation rebuilds the canonical image from the spec (presence tag, u32 length, rendered bytes) and hashes it with `xxhash`, and the two are compared. TWO checks, neither implying the other: DIGEST PARITY (catches a drift in rendering or framing) and INJECTIVITY (two rows differing only in where a field boundary falls must hash differently). The probe is exported TWICE because injectivity needs the primary key OUT of the coverage — measured: under v1's rendering the same probe scores 4/4 distinct with the key covered and 3/4 without it, so `row_hash: true` alone would pass against a length-less join. RED-proven on postgres against a v1-shape mutant: both checks fire, the second naming the colliding row pair. SKIPs loudly without the `xxhash` package rather than comparing rivet against itself."
    status: test        # verify_row_hash (dev/release_oracle/rowhash.py)
  # pooler_safety REMOVED from the gate: it re-ran tests/live/live_pool_safety.rs, which
  # CI already runs on every push (ci.yml `--profile pool` exists specifically for it).
  # A CI-owned correctness suite re-run adds no coverage here AND reddened on a missing
  # pool backend (require_alive(Mysql) panics without compose `mysql` :3306), drowning the
  # go/no-go signal. Pooler safety is CI-scope, not a gate gap — the gate does the
  # shipping-artifact + independent-oracle checks CI can't. Not counted as a gap.
  - id: replica_read
    what: "prod topology — rivet reads a read-REPLICA, not the master (the 'we were handed a product, no master access' case). Drives tests/live/live_cdc_replica.rs: the mysql-replica re-logs the primary's replicated changes into its OWN binlog (log_replica_updates) and rivet captures from that. Needs the `replica` compose profile (mysql-primary :3308 → mysql-replica :3309); SKIP when down. Four more rows, one per topology (REPLICA_CELLS in scenarios.py), each SKIPping alone when its services are down: mysql-replica-nolog :3310 (log_replica_updates = OFF, MySQL's default) must be refused at start, since its binlog holds none of the replicated changes (found 2026-09-26: 0.29.0 captured nothing and exited 0); a PostgreSQL 16 standby streams in continuous mode; a SQL Server read-scale availability group's readable secondary (dev/mssql-ag/setup.sh); a MongoDB secondary with readPreference=secondary. Each asserts the changes made on the primary through DuckDB over the declared parts. Three SQL Server checkpoint-identity rows ride the same table (found 2026-09-26: 0.29.0 resumed another server's checkpoint with exit 0 and 0 rows, the other database's change silently skipped): a checkpoint from another database is refused and left untouched; one that predates a RESTORE (new recovery_fork_guid) is refused; one written on the AG primary resumes on the secondary with only the new change (RED against a database_guid mutant, which differs per replica)."
    infra: [mysql-replica]
    status: test        # verify_replica_read — drives cdc_reads_changes_from_a_replica
  - id: batch_resume
    what: "`rivet run --resume` after a crash, per runner and engine — the gate's only real resume, because the blessed chain applies a sealed plan where `apply --resume` is ignored with a warning (asserted there). Runs tests/live/live_chunked_recovery.rs + live_resume.rs through the gate binary, one ledger row per case (29 on 2026-09-26). Added when per-command flag coverage showed `run --resume` carried by nothing: the pooled union had credited it to apply's ignored `--resume`."
    status: test        # verify_batch_resume — live_chunked_recovery + live_resume, per case
  - id: audit_suspects
    what: "the 2026-09-26 contract audit's silent-loss cells, each proven RED on 0.29.0 and GREEN on the fix: cleanup_source never deletes parts an extract committed during the load; a keyset text key's second run takes the new keys (source collation, not byte order); MySQL refuses a statement-logged change and a DROP of a captured table; Mongo refuses a dropped collection; compact carries a source ADD COLUMN into the base; an MSSQL DATETIME cursor takes the next row once — each with an other-table twin RED against an over-refusal mutant. Oracles: BigQuery reads, DuckDB over declared parts, the checkpoint. The BigQuery cells need BIGQUERY_TEST_PROJECT + RIVET_TEST_GCS_BUCKET."
    status: test        # verify_audit_suspects — tests/live/live_audit_suspects.rs, one row per case
  - id: harm_regression
    what: "what one export costs the SOURCE, cur vs the DOWNLOADED previous release, per engine: each binary exports the same table three times from its own env and the per-counter MIN is compared (other activity on a shared server only adds to a global counter). Graded: rows scanned and temp spills (pg_tup_returned/fetched, pg_temp_files; mysql_innodb_rows_read, handler_read_rnd_next, created_tmp_disk_tables; mssql_logical_reads (dm_exec_query_stats, real-time; the buffer-pool performance counters refresh about once a second and are recorded, not graded), worktables/workfiles; mongo_docs/keys_scanned) at ≤ prev×RIVET_HARM_TOL(1.25)+RIVET_HARM_SLACK(200). Cache and lock counters are recorded, not graded. Added 2026-09-26: the gate had graded wall time and RSS only, never what rivet costs the database. A counter the previous release does not record is a SKIP naming it (SQL Server's read counters are new in this release)."
    status: test        # verify_harm_regression — dev/release_oracle/regression.py, one row per engine
