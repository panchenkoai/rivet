# Release-gate coverage matrix — every gate CHECK × engine × VERSION, plus the
# backend-INFRASTRUCTURE dimensions the go/no-go gate does (or does not yet) exercise.
#
# This is the SINGLE source of truth for what `dev/release-oracle` actually gates, so
# the gate's coverage is reviewable at a glance and its gaps are counted, not silent.
# Same cell vocabulary + shrink-only ratchet discipline as the sibling docs/*-matrix.yaml
# ledgers; drift-guarded against the gate's real config by
# tests/release_gate_matrix_guard.rs:
#   - every `grid.<engine>.gated` version must appear in dev/release-oracle/matrix.yaml
#   - every scenario/preflight function in dev/release_oracle/scenarios.py must have
#     a row here (and vice-versa) — a new gate check with no cell fails the guard
#   - `gap` cells are counted and ratcheted (no NEW gaps; fill one by wiring the check
#     and flipping gap -> test)
#
# Cell vocabulary:
#   test  — the gate RUNS this check for this engine (across its gridded versions) and it is green.
#   na    — not applicable to this engine by design (e.g. SQL keyset on Mongo).
#   gap   — SHOULD be gated, isn't yet (ratcheted; shrink-only).

# ── The engine × VERSION grid the gate brings up (mirrors dev/release-oracle/matrix.yaml) ──
# `gated`   = versions the gate spins up, seeds, and runs every applicable scenario against.
# `gaps`    = versions that EXIST (a compose service / a devbox stand / a public image) but
#             are not yet gated — each is a real coverage hole, ratcheted.
grid:
  postgres:
    gated: [13, 14, 16, 18]          # 14/18 verified green on the devbox against the blessed goldens
    gaps:  [12, 15, 17]              # 12/15 are compose services; 17 is a public image
  mysql:
    gated: ["8.0", "8.4"]
    gaps:  ["5.7", "mariadb-11"]     # 5.7 = huge install base, needs a CTE-free seed; MariaDB needs a compose service + driver check
  mssql:
    gated: ["2022"]
    gaps:  ["2019"]                  # 2019 ships mssql-tools (not tools18) — needs an sqlcmd-path fallback in bring_up/seed
  mongo:
    gated: ["4.4", "5", "6", "7", "8"]   # 5/6/8 added; 4.4 is arm64-flaky on the colima devbox (documented, not a rivet bug)
    gaps:  []

# ── Per-(engine, version) DATA / BEHAVIOUR scenarios (run once per gridded version) ──
# Cell is per-ENGINE (uniform across that engine's gridded versions); a version-specific
# divergence would split into its own note.
scenarios:
  - id: bq_cycle
    what: "the full warehouse cycle on real infrastructure: export to a real GCS bucket -> rivet load -> row count verified by `bq query` (Google's parquet reader, which shares no code with rivet's writer) -> table dropped and prefix removed, with the drop VERIFIED by asking afterwards (bq rm -f exits 0 whether it deleted a table or found none, so its exit status cannot answer 'is it gone' — that cell reported a clean cleanup while dropping a table that never existed)."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    test
  - id: blessed_path
    what: "COMPLEMENTS docs/scenario-artifact-matrix.yaml, which owns the artifact/meta-DB half more deeply (14 lifecycle scenarios, all engines, canonical seed, chunk_run/chunk_task/load_run snapshots). What is added here and provably absent there: an INDEPENDENT oracle (that driver has zero duckdb calls — it compares rivet's records to rivet's files), the COMMAND CHAIN in one traversal: init -> doctor -> check -> plan -> apply -> validate, one cell per stage, asserting every artifact (config, plan.json, parquet, manifest.json, _SUCCESS, export_metrics/file_log/run_status) with DuckDB as the independent oracle for rows and file count. Per-stage coverage existed everywhere; no test drove three of the five subcommands in one body, and both defects found 2026-08-04 (apply's empty config path, CDC's unexpanded {date}) lived in that handoff gap."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    test
  - id: blessed_flow
    what: "The WHOLE journey as ONE declared cross-product, not per-defect additions: pipeline{batch,cdc} x lifecycle{clean,repeat,resume} x store{local,s3,gcs} x state{sqlite,postgres} x engine = 144 cells, 76 runnable, 68 `na` each carrying its reason in the ledger. Where blessed_path walks init->apply for one strategy, this adds what that chain cannot reach: the CDC pipeline (plan/apply REFUSE a cdc export, so those cells run `run`), the crash-then-resume lifecycle (a fault hook kills the first apply, and the probe FAILS the cell if the hook did not stop it — a resume whose first run succeeded is a clean re-run wearing a flag), the repeat lifecycle asserted on the MANIFEST COPIES rather than the parquet (the data surviving is what makes a sidecar clobber invisible), and `load` with load_run/loaded_source_run. Values are read ONLY by DuckDB, and only from parts a manifest DECLARES as committed — counting every parquet under the prefix reads a crashed run's orphans as delivered data. State is scoped per-run (watermark on export_metrics, which has no run_id; run ids from the manifests for file_log/run_status): the first draft counted `export_name='flow'` and read 37 rows of unrelated history on a cell that wrote one."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    test
  - id: not_inert
    what: "The chain's own oracles must be able to go RED. Breaks each artifact class and requires the matching stage to fail: every declared part removed (oracle must stop agreeing with the source), no manifest (must report undelivered, not count the parquet lying next to it), a run id that never ran (state must refuse). Carries a NEGATIVE control too — removing ONE redundant copy of a repeated export must NOT move the oracle; the first draft demanded a failure there and went red against a correct oracle."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    test
  - id: verdicts
    what: "init -> the strategy per table matches the golden (keyset/full/range/name-trap), zero phantom heavy-chunk."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    test
  - id: integrity_types
    what: "users 150K loss/dup 0 (source count+distinct == DuckDB read) + per-engine DuckDB type/CSV golden (parquet binary path + CSV all-varchar text path)."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    { na: "Mongo is a JSON-blob model (full-scan only) — no per-engine type matrix; the loss/dup arm still runs under integrity_types" }
  - id: keyset_parallel
    what: "parallel:4 keyset fan-out: loss/dup 0 (DuckDB oracle) AND >=2 distinct pk_w{ridx} workers (no silent degrade to sequential)."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    { na: "Mongo parallel:N is the separate _id-range mongo_parallel reader, not SQL keyset" }
  - id: load
    what: "manifested parts -> each object store {s3/minio, gcs/fake-gcs, azure/azurite}, independent readback count == summed manifest row_count + id-set round-trips."
    postgres: test
    mysql:    test
    mssql:    test
    mongo:    test
  - id: gc_survival
    what: "concurrent-extract bucket-erasure guard: a Running manifest spares an in-flight part; none deletes the orphan; Success parts always kept."
    postgres: test
    mysql:    { na: "store-level property, source-agnostic — one engine's parts exercise it (runs on postgres)" }
    mssql:    { na: "store-level property (see postgres)" }
    mongo:    { na: "store-level property (see postgres)" }

# ── Source-agnostic PREFLIGHTS (run ONCE before the engine loop, not per engine/version) ──
preflights:
  - id: flag_surface
    what: "Every flag of every command in the chain is carried by some cell or excused BY NAME, with the surface DERIVED from `rivet <cmd> --help` rather than typed in. Found on its first run that init — the first stage of every chain — was being driven with one of its thirteen flags; --mode now tracks the pipeline axis and --s3-bucket/--gcs-bucket the store axis, so init's own scaffold is graded instead of discarded. The rotation that distributes flags across cells is keyed on a DIGEST of the coordinates, not the enumeration index: `% 3` over a nested cross-product aliased with the inner loops and drew --discover for every postgres-backend cell."
    status: test        # verify_flag_surface (blessed_flow.py) — no containers, runs with the file-level guards
  - id: release_build_path
    what: "the RELEASE build/publish path itself, not `cargo build` (the stricter tooling the TAG runs, which failed AFTER publish for 0.16.0/0.16.1): Cargo.lock in sync (`cargo metadata --locked` — publish + Docker cook are `--locked`), the cargo-manifest strict parse (no multi-line inline tables, the cargo_manifest_chef guard) + JSON-schema regen (schema_drift guard), and `cargo chef prepare` (the Dockerfile's actual planner step, cheap — no compile). Full `docker build` opt-in via RIVET_ORACLE_DOCKER=1. Runs FIRST, before any cargo reconciles the working-tree lock."
    status: test        # verify_release_build_path (dev/release_oracle/release_path.py)
  - id: state_migrations
    what: "SQLite state == Postgres state on the state-exercising golden fixtures (parallel-checkpoint, incremental, crash-resume) — the migration arrays are type-parity. CONDITIONAL, and the condition is the point: it needs a Postgres STATE backend named by RIVET_TEST_STATE_URL (the dev stand's persistent `postgres-state`, :5433) and SKIPs — loudly, never a silent pass — without one. That variable was documented NOWHERE until 2026-08-02, so this cell has read `status: test` while skipping in every run that did not happen to set it: a cell claiming coverage that an unset environment variable quietly withheld. A `status: test` whose test is opt-in must name the opt-in here, or the ledger overstates the gate. The scenario also probes the URL's host:port and SKIPs when it is unreachable, so a stopped stand cannot masquerade as a release failure."
    backends: [sqlite, postgres]
    status: test        # verify_state_migrations (commit e83656a), RED-proven int4 -> NOT RELEASABLE
  - id: inflight_run_stays_loadable
    what: "a load must NOT record an IN-FLIGHT extraction run as fully consumed. The skip set is keyed on `run_id` alone, but a CDC run's manifest GROWS under one id (the sink rewrites a Success superset at every commit-boundary roll, and list_manifest_keys prefers that copy) — so a load firing mid-cycle recorded the id and every part the run wrote afterwards was skipped FOREVER, while the next load printed `CDC LOAD SKIP: up to date`. Unbounded under `until_current: false`, where the id never rotates. Released since 0.20.0; found 2026-08-01. The fix excludes runs the ledger reports still writing into the prefix (StateStore::active_run_ids_on_prefix); this cell drives that predicate through the RELEASE binary's own schema, both directions — a run wrongly reported active makes every load re-append forever, a run wrongly reported finished restores the silent loss. Deliberately a ledger check, not a timed extract/load race: the race needs sub-second timing against a live stream and a flaky gate is worse than a narrow one; the end-to-end half is the live suite."
    status: test        # verify_inflight_run_stays_loadable (scenarios.py), RED-proven: dropping the status filter yields {run_done, run_live}
  - id: coverage_matrices
    what: "every docs/*-matrix.yaml drift-guard runs (chunking/behaviour/type-fidelity/... + release_gate + perf) so a rotted coverage ledger blocks the release, not just CI."
    status: test        # verify_coverage_matrices
  - id: gif_currency
    what: "the instructional GIFs still show commands this binary accepts. They are binary assets, so no test reads them and no diff flags them — a GIF demonstrating a rejected flag is documentation that lies, and re-rendering does not fix it (the tape has to change). Ran in the gate since it was written; had NO ledger row until 2026-08-02, when the guard stopped reading a hand-typed module list and started deriving it."
    status: test        # verify_gif_currency (dev/release_oracle/gifs.py)
  - id: corruption_is_detected
    what: "the NEGATIVE half of verification: `rivet validate --depth full` must FAIL when the data on disk is wrong. Added because the answer was NO — a part corrupted in place (one byte in a dictionary page, `x`->`y`, file length unchanged, manifest and _SUCCESS untouched) validated PASSED/exit 0 while DuckDB and rivet's own Arrow reader both read the changed values. Cause: the value-checksum fold combined per-cell hashes with XOR, which ANNIHILATES (`h ^ h == 0`), so a column of duplicated values checksummed to zero whatever it held. Fold is now a wrapping sum, versioned in the manifest as `checksum_render`. The cell asserts four things, because verification can weaken in four ways: a clean export still passes (a check that only ever goes red discriminates nothing), the manifest carries a render marker, the corruption is DETECTED, and it is classified exit 3 data-integrity naming the diverging column — an operator triaging exit 1 hunts a credential, not corrupt data. Byte-level in place on purpose: a DuckDB rewrite changes the file length, so the size check fires first and the value checksum is never reached."
    status: test        # verify_corruption_is_detected (dev/release_oracle/corruption.py), RED by construction — it was written against the live defect
  - id: schema_fingerprint_moves_with_the_schema
    what: "drift detection compares this run's `schema_fingerprint` to the previous run's — BOTH produced by the same function — so a fingerprint blind to some change is blind on both sides and reports `unchanged`. An exact independent digest is not available: the fingerprint hashes `<name>\\t<data_type>` where `data_type` is rivet's OWN rendering of the Arrow type, so a second implementation would reproduce that naming and be a copy, not a witness. What is checkable without rivet's cooperation is the PROPERTY — real DDL is the independent party. Four changes (add / rename / retype / drop a column) must each move the fingerprint, and a control case re-exports an untouched table and requires it to stay put; without that control a fingerprint that changed on every export would pass every other case while being useless. Postgres only: the property is the fingerprint's, not an engine's."
    status: test        # verify_schema_fingerprint_moves_with_the_schema (dev/release_oracle/schema_drift.py)
  - id: reconcile_and_validate_cover_both_sides
    what: "reconcile and validate check DIFFERENT sides, and neither alone verifies 'what I can read equals what the source held'. Measured: delete source rows and reconcile exits 3 naming the partition and the diff while validate exits 0 (the destination is intact); delete a destination PART and reconcile exits 0 reporting `all partitions match` while validate exits 3. reconcile compares the SOURCE to the recorded per-partition counts; validate compares the DESTINATION to the manifest. The pair covers both, and nothing makes an operator run both — so this cell asserts the DISJUNCTION: each fault must be caught by at least one command, and the verdict names which. Framed that way an improvement (reconcile learning to read the destination) does not redden it, while a regression — a fault neither notices — does. Postgres only: the property is command-level, not engine-level."
    status: test        # verify_reconcile_and_validate_cover_both_sides (dev/release_oracle/corruption.py)
  - id: cdc_corruption_is_detected
    what: "the same negative proof for the CDC leg, which needs its own: the CDC sink keeps a SEPARATE per-column accumulator and writes its own manifests, so a green batch cell says nothing about it. The same annihilating XOR fold lived here, and the render marker was briefly left `None` on this path — which alone would have made every CDC prefix read as corrupt. Captures to a LOCAL destination rather than the object store the e2e cell uses, because the corruption must be a byte flip IN PLACE and a download/edit/re-upload round trip rewrites the object. Positive first (a clean capture verifies), then the flip. Opt-in on RIVET_CDC_<ENGINE>_URL like the e2e cell, and SKIPs loudly without it."
    status: test        # verify_cdc_corruption_is_detected (dev/release_oracle/corruption.py)
  - id: cdc_differential
    what: "an INDEPENDENT implementation of the same capture. `cdc_e2e` compares the destination
      to the SOURCE (per-column null profile, distinct counts) and catches loss and
      degrade-to-null; it is structurally blind to rivet and its own oracle agreeing on a wrong
      SPEC. Debezium reads the same window from the same engine and the two captures are
      compared in DuckDB on (op, key, VALUES). The value comparison is load-bearing: without it
      a parquet with 100% of a column NULLed reports AGREE, measured, so a run that compared only
      (op, key) is graded a FAILURE here rather than accepted. `key-update` is excluded and the
      reason is written at the call site: rivet emits update(new) where Debezium emits
      delete(old)+insert(new), which is a representation decision, and a cell that EXPECTS a
      difference goes green the day someone fixes it."
    infra: [docker]
    status: test        # verify_cdc_differential (dev/release_oracle/cdc.py)
  - id: row_hash
    what: "`_rivet_row_hash` recomputed by something that is NOT rivet. The in-tree auditor recomputes with rivet's own `enrich` function — `src/lib.rs` says so deliberately, to avoid a second implementation drifting from the extractor — which is sound for detecting changed DATA and structurally blind to a defect in the SPEC, because both sides share it. Render id v1 shipped non-injective in two independent ways and lived four months. So this cell holds the other side: DuckDB re-reads the exported parquet, a Python implementation rebuilds the canonical image from the spec (presence tag, u32 length, rendered bytes) and hashes it with `xxhash`, and the two are compared. TWO checks, neither implying the other: DIGEST PARITY (catches a drift in rendering or framing) and INJECTIVITY (two rows differing only in where a field boundary falls must hash differently). The probe is exported TWICE because injectivity needs the primary key OUT of the coverage — measured: under v1's rendering the same probe scores 4/4 distinct with the key covered and 3/4 without it, so `row_hash: true` alone would pass against a length-less join. RED-proven on postgres against a v1-shape mutant: both checks fire, the second naming the colliding row pair. SKIPs loudly without the `xxhash` package rather than comparing rivet against itself."
    status: test        # verify_row_hash (dev/release_oracle/rowhash.py)
  # pooler_safety REMOVED from the gate: it re-ran tests/live/live_pool_safety.rs, which
  # CI already runs on every push (ci.yml `--profile pool` exists specifically for it).
  # A CI-owned correctness suite re-run adds no coverage here AND reddened on a missing
  # pool backend (require_alive(Mysql) panics without compose `mysql` :3306), drowning the
  # go/no-go signal. Pooler safety is CI-scope, not a gate gap — the gate does the
  # shipping-artifact + independent-oracle checks CI can't. Not counted as a gap.
  - id: replica_read
    what: "prod topology — rivet reads a read-REPLICA, not the master (the 'we were handed a product, no master access' case). Drives tests/live/live_cdc_replica.rs: the mysql-replica re-logs the primary's replicated changes into its OWN binlog (log_replica_updates) and rivet captures from that. Needs the `replica` compose profile (mysql-primary :3308 → mysql-replica :3309); SKIP when down."
    infra: [mysql-replica]
    status: test        # verify_replica_read — drives cdc_reads_changes_from_a_replica
  - id: pool_e2e
    what: "the pool scheduler's e2e flow (#166): `apply --pool 2` on a multi-export config (one heavy + three parallel_safe) through a toxiproxy BANDWIDTH-CAPPED source — the shared-tunnel field pathology. Oracles: exact per-export rows (independent DuckDB readback), the predicted-vs-actual makespan contract on stdout (the model grades itself), and --resume defer-not-drop. Drives the `pool_apply_*` cases in tests/live/live_pool_toxiproxy.rs; SKIP when toxiproxy :8474 is down."
    backends: [postgres]
    status: test        # verify_pool_e2e — drives live_pool_toxiproxy::pool_apply_* (bandwidth / resume / two-heavy)
  - id: pool_split
    what: "the `--pool --split` range sub-export flow (#167): a dominating export is broken into N range sub-exports over its key span — separate scheduler units sharing ONE prefix + folding to ONE family. THREE independent DuckDB oracles (`pool_split_*` in tests/live/live_pool_toxiproxy.rs), each a NAMED gate cell: (1) realize — the split fires and the union reads back every row once, no seam gap/dup; (2) manifest coherence — validate does not flag a sibling unit's parts as untracked yet a true orphan still is; (3) per-unit crash resume — `--resume` re-runs ONLY the incomplete units (skip complete, resume crashed), no gap/no dup. SKIP when toxiproxy :8474 is down."
    backends: [postgres]
    status: test        # verify_pool_split — drives live_pool_toxiproxy::pool_split_* (realize / coherence / resume)
  - id: release_regression
    what: "regression vs the PREVIOUS RELEASE (not a golden, not the gate itself). B-format: the new binary must READ what the prev release WROTE — prev exports a 100K keyset+zstd fixture, cur `validate` re-reads its manifest+parts (PASSED) + DuckDB row-count == source (a format bump that can't read old artifacts silently breaks every existing user on upgrade). B-perf: cur wall <= the DOWNLOADED prev-release binary's wall × tol (default 1.5×; a 3× slowdown / RSS blow-up ships green through every correctness check), benchmarked against the artifact users actually run, never a rebuilt parent. Env: RIVET_PREV_RELEASE_BIN + RIVET_REGRESSION_SOURCE_URL; SKIP-if-absent."
    backends: [postgres]
    status: test        # verify_release_regression (dev/release_oracle/regression.py)
  - id: previous_release_differential
    what: "the same OBSERVABLE SURFACE on both binaries over 8 fixtures (full, chunked-parallel, keyset-parallel, chunk_checkpoint, incremental, csv, crash+resume, error-exit + `plan --format json` purity): exit code, DuckDB row readback, file count, and the manifest INCLUDING per-part content fingerprints and column checksums — same source and encoder settings must give the same digests, so a difference there says the BYTES changed, not the bookkeeping. Where release_regression asks `can the new binary read what the old one wrote, and is it as fast`, this asks `does it still DO the same thing` — the question nothing asked when the 0.24.4 governor regression shipped. Drives dev/pytools/ab_regression.py; one ledger row per scenario plus a count row, and a scenario that graded nothing FAILS rather than reading as agreement."
    backends: [postgres]
    status: test        # verify_previous_release_differential (dev/release_oracle/regression.py)
  - id: field_symptom_replay
    what: "the 2026-08-13 governor regression's own SYMPTOM, replayed on both binaries: a workload shaped like the field run (mostly tiny full exports, a keyset majority at parallel 1/2/4, a few chunked, under a pool), adaptive on and off. Four criteria ordered so the ACTIVATION GUARD comes first: (1) the OLD binary must shed at least once — without it the run reproduces nothing and 2-4 grade air, (2) the NEW binary sheds ZERO on an idle source, (3) new makespan <= old x 1.05, (4) identical rows per export. Each criterion is its own ledger row; criteria that `passed` under a dead fixture are recorded SKIP, never PASS. Needs the MySQL stand. SHELF LIFE: criterion 1 is evidence only while RIVET_PREV_RELEASE_BIN carries the regression — once the fix ships, pin this stage`s baseline to the last regressing release or retire the fixture."
    backends: [mysql]
    status: test        # verify_field_symptom_replay (dev/release_oracle/regression.py)
  - id: scale_memory
    what: "the FLAT-RSS guarantee at scale — rivet's headline value prop (the 454M-row, no-OOM field win vs Airbyte). rivet STREAMS, so peak RSS is O(chunk), not O(rows); the gate's data scenarios are ~150K rows, so a buffering regression that scales RSS with the table ships green through every count check. Runs PER ENGINE over TWO EXISTING tables (no seeding — a small + a large already on the stand, default users vs events) and asserts peak RSS on the LARGE table stays FLAT vs the SMALL: RSS(large) <= RSS(small) × tol (RIVET_SCALE_RSS_TOL, default 3× — generous, the tables differ in row width; streaming keeps the ratio near the width ratio, buffering blows it up by the 10× row-count ratio). Measured for the current binary (assertion) AND the downloaded prev release (comparison). Env per engine: RIVET_SCALE_<ENGINE>_URL + _SMALL + _LARGE; SKIP-if-absent."
    backends: [postgres, mysql, mssql, mongo]
    status: test        # verify_scale_memory (dev/release_oracle/regression.py) — per-engine loop
  - id: state_backend_parity
    what: "the SAME export recorded into SQLite AND Postgres must AGREE. The cdc_e2e leg checks each backend POPULATES the expected tables against a golden; that is presence, not parity — a table can be non-empty on both and hold different numbers, and a column can be written on one and silently dropped on the other. It has happened: shape tracking never worked on Postgres AT ALL, the run succeeded, `export_shape` filled on one backend and stayed empty on the other, and nothing compared them. Compares the POPULATED TABLE SET (the check that names the failure class), the per-table row count scoped by export_name, `export_metrics`'s work columns (total_rows / files_committed / status) and `file_log`'s count + summed row_count. Deliberately NOT run ids or timestamps — two runs differ there by construction. NOT compared, and said so in the verdict: tables with no export_name column, because the Postgres store is shared with the rest of the gate while the SQLite one is fresh. RED-proven against a stripped-backend mutant (SQLite-only ['file_log'])."
    backends: [sqlite, postgres]
    status: test        # verify_state_backend_parity (dev/release_oracle/state_parity.py)
  - id: state_parity_independent
    what: "the SAME run's two state backends compared by ONE decoder. Its sibling `state_backend_parity` reads SQLite with python's sqlite3 and Postgres with psql, so a surviving difference can be data OR rendering and nothing tells them apart — today's seed work proved that is not academic, a digest built with each ENGINE's own concatenation disagreed across three engines whose data was byte-identical. Here DuckDB attaches BOTH stores in one session (sqlite + postgres scanners) and every value crosses one decoder. Compares a PER-COLUMN digest of every shared column plus the row count, over every scopable table — 12, against the sibling's 6. Identity and environment are NORMALISED out rather than dropped: run-unique part hashes, wall-clock stamps, each backend's own output path, and the SQLite-has-no-BOOLEAN 0/false split. `run_journal` is compared by event SHAPE because its JSON payload is identity-dense (measured: every byte difference was a microsecond fraction or a part-name hash). `export_harm` is excluded — it records PostgreSQL SERVER counter deltas, which two runs differ on by nature (3094 vs 3062 blks_hit). An EMPTY comparison FAILS: two blank profiles agree perfectly and prove nothing. FOUND: the sibling's UNSCOPED list claimed five tables have no export_name column; three of them do, so it had been silently dropping chunk_run / keyset_range / load_run from the parity claim. RED-proven by incrementing export_metrics.total_rows on the Postgres side alone — the cell names the column."
    backends: [sqlite, postgres]
    status: test        # verify_state_parity_independent (dev/release_oracle/state_parity_duckdb.py)
  - id: concurrent_writers_share_a_prefix
    what: "SEVERAL writers into ONE destination prefix and ONE state backend, started together (not consecutively). Every other cell — and both sweeps — runs a single writer with the prefix to itself, which is not what a shared deployment is. Asserts five things that can each fail alone: the file count on the prefix equals the manifests' summed part_count (a collision shows as a SHORTFALL); DuckDB's row count equals the manifests' summed row_count equals the state DB's; ONE immutable manifest-<run_id>.json per writer survives (the canonical manifest.json is last-writer-wins BY DESIGN, so the copies are what a consumer sums); no duplicate export_metrics row (concurrency is where an UPDATE-or-INSERT becomes two INSERTs); no `running` row left unsuperseded. Runs LOCAL and against a REAL GCS bucket — an object store has no rename and a flat namespace, which is where writers actually race. FOUND: the local destination staged every write under a name derived from the final key alone, so concurrent writers of manifest.json deleted each other's staged file and the loser's rename failed ENOENT — reported by finalize as a non-fatal manifest write failure while the run said success and its parquet sat on the prefix named by no manifest. Measured 3 of 6 rounds losing a copy; 0 of 8 after the fix."
    backends: [postgres, gcs]
    status: test        # verify_concurrent_writers_share_a_prefix (dev/release_oracle/concurrency.py)
  - id: cdc_e2e
    what: "CDC end-to-end per engine (the change-data-capture surface the batch scenarios never exercise): anchor a typed table → INSERT/UPDATE/DELETE → capture (mode:cdc, until_current) to the object store → INDEPENDENT DuckDB readback == 5 events (never rivet) → rivet validate PASSED → state-DB metabase populated (run_status all-success) → at-least-once CRASH recovery (cdc_after_flush_before_ack holds the anchor; the re-run re-reads id=4) → large-transaction ATOMICITY (a >rollover 12-row PG tx survives a cdc_after_ack mid-flush crash whole, 12/12 — the committed-boundary invariant). PLUS SQLite-vs-Postgres state PARITY vs golden/cdc_state_snapshot.json (the reference snapshot). Each engine's anchor is its own mechanism (PG slot / MySQL binlog / MSSQL from-LSN / Mongo resume token). RED-proven by mutation vs the release binary: a drop-one-event sink mutant reddens the independent readback on all 4 engines (while rivet validate stays green); a committed:true-every-event PG mutant reddens the large-tx leg."
    backends: [sqlite, postgres]
    status: test        # verify_cdc_e2e (dev/release_oracle/cdc.py) — env-driven RIVET_CDC_<ENGINE>_URL, SKIP-if-absent

# ── BACKEND-INFRASTRUCTURE dimensions the gate does NOT yet exercise (the audit gaps) ──
# The gate connects DIRECT to every engine; it never routes through the connection-
# mediation layer prod runs (poolers/proxies/replicas/degraded networks) even though the
# compose stack HAS all of it. Each row is a real hole, ratcheted; fill by adding a
# preflight/scenario and flipping status -> test.
infra:
  - id: network_faults
    infra: toxiproxy
    status: test
    note: "verify_network_faults drives export_survives_transient_latency_added_via_toxiproxy +
      export_fails_cleanly_when_toxiproxy_is_disabled_before_run +
      gremlin_cdc_binlog_cut_mid_drain_fails_loud_then_recovers through the release binary;
      probes toxiproxy :8474 itself and SKIPs loudly when down"
  - id: state_upgrade
    status: test
    note: "pg_upgrade_from_v18_lands_keyset_range_as_bigint_and_keeps_data (src/state/mod.rs) — stages a POPULATED v18 Postgres state db, migrates in place to HEAD, asserts keyset_range is BIGINT + the pre-upgrade cursor survives; run by the state_migrations preflight. RED-proven against the int4 v19."
  - id: state_concurrency
    infra: postgres-state
    status: test
    note: "pg_shared_state_cross_connection_visibility_and_supersession (src/state/run_status_store.rs) — two StateStore connections = two processes on one shared Postgres state: a run begun on A is active-visible to B (the gc_orphans signal), and a newer run supersedes the older clock-free. Run by the state_migrations preflight; RED-proven against a flipped supersession."
  - id: tls_required
