# Mode-transition matrix — ADR-0033. What an export inherits from its PREVIOUS mode when it
# switches to incremental (or keyset_incremental): a full pass (no cursor was stored), a
# continuation (same cursor identity), or a loud refusal (different identity). Each cell runs
# the previous mode over 10 rows, inserts 3 more, restages the same Rig to the new mode and
# re-reads the destination (tests/live/live_mode_transition.rs).

engines: [postgres, mysql, mssql, mongo, oracle]

scenarios:
  - id: full_then_incremental
    what: "MT1 — mode: full stores no cursor; the first incremental run is a full pass"
    postgres: { test: full_then_incremental_postgres }
    mysql:    { test: full_then_incremental_mysql }
    mssql:    { test: full_then_incremental_mssql }
    mongo:    { test: full_then_resume_mongo }
    oracle:   { gap: "no Oracle mode-transition live test (the transition logic is shared; the cursor/keyset state Oracle writes is unproven here)" }

  - id: time_window_then_incremental
    what: "MT1 — time_window stores no cursor; full pass"
    postgres: { test: time_window_then_incremental_postgres }
    mysql:    { test: time_window_then_incremental_mysql }
    mssql:    { test: time_window_then_incremental_mssql }
    mongo:    { na: "a Mongo export accepts only mode: full or cdc (validate_non_sql_source_modes, src/config/mod.rs:543-554), so there is no incremental / chunked mode to switch from or into; the switch Mongo has (into page_size + resume) is graded by the three *_then_resume_mongo cells" }
    oracle:   { gap: "no Oracle mode-transition live test (the transition logic is shared; the cursor/keyset state Oracle writes is unproven here)" }

  - id: range_chunked_then_incremental
    what: "MT1 — range chunking (chunk_column + chunk_checkpoint) keeps chunk_task state, never a cursor; full pass"
    postgres: { test: range_chunked_then_incremental_postgres }
    mysql:    { test: range_chunked_then_incremental_mysql }
    mssql:    { test: range_chunked_then_incremental_mssql }
    mongo:    { na: "a Mongo export accepts only mode: full or cdc (validate_non_sql_source_modes, src/config/mod.rs:543-554), so there is no incremental / chunked mode to switch from or into; the switch Mongo has (into page_size + resume) is graded by the three *_then_resume_mongo cells" }
    oracle:   { gap: "no Oracle mode-transition live test (the transition logic is shared; the cursor/keyset state Oracle writes is unproven here)" }

  - id: keyset_then_incremental_same_key
    what: "MT2 — keyset without chunk_checkpoint still records its final high-water; incremental on the key continues"
    postgres: { test: keyset_then_incremental_same_key_postgres }
    mysql:    { test: keyset_then_incremental_same_key_mysql }
    mssql:    { test: keyset_then_incremental_same_key_mssql }
    mongo:    { test: keyset_then_resume_mongo }
    oracle:   { gap: "no Oracle mode-transition live test (the transition logic is shared; the cursor/keyset state Oracle writes is unproven here)" }

  - id: keyset_checkpoint_then_incremental_same_key
    what: "MT2 — keyset with chunk_checkpoint (the init default); incremental on the key continues"
    postgres: { test: keyset_checkpoint_then_incremental_same_key_postgres }
    mysql:    { test: keyset_checkpoint_then_incremental_same_key_mysql }
    mssql:    { test: keyset_checkpoint_then_incremental_same_key_mssql }
    mongo:    { na: "a Mongo export accepts only mode: full or cdc (validate_non_sql_source_modes, src/config/mod.rs:543-554), so there is no incremental / chunked mode to switch from or into; the switch Mongo has (into page_size + resume) is graded by the three *_then_resume_mongo cells" }
    oracle:   { gap: "no Oracle mode-transition live test (the transition logic is shared; the cursor/keyset state Oracle writes is unproven here)" }

  - id: parallel_keyset_then_incremental_same_key
    what: "MT2 — parallel keyset records the highest range max; incremental on the key continues"
    postgres: { test: parallel_keyset_then_incremental_same_key_postgres }
    mysql:    { test: parallel_keyset_then_incremental_same_key_mysql }
    mssql:    { test: parallel_keyset_then_incremental_same_key_mssql }
    mongo:    { test: parallel_keyset_then_resume_mongo }
    oracle:   { gap: "no Oracle mode-transition live test (the transition logic is shared; the cursor/keyset state Oracle writes is unproven here)" }

  - id: keyset_then_incremental_other_column
    what: "MT3 — keyset on id, then incremental on server_time: refused, nothing exported; full pass after state reset (the field case)"
    postgres: { test: keyset_then_incremental_other_column_postgres }
    mysql:    { test: keyset_then_incremental_other_column_mysql }
    mssql:    { test: keyset_then_incremental_other_column_mssql }
    mongo:    { na: "a Mongo export accepts only mode: full or cdc (validate_non_sql_source_modes, src/config/mod.rs:543-554), so there is no incremental / chunked mode to switch from or into; the switch Mongo has (into page_size + resume) is graded by the three *_then_resume_mongo cells" }
    oracle:   { gap: "no Oracle mode-transition live test (the transition logic is shared; the cursor/keyset state Oracle writes is unproven here)" }

  - id: keyset_incremental_key_change
    what: "MT3 — keyset_incremental on id, then on another unique key: BOTH keyset runners (sequential, and parallel, which reads the anchor in its own call) refuse their own anchor"
    postgres: { test: keyset_incremental_key_change_postgres }
    mysql:    { test: keyset_incremental_key_change_mysql }
    mssql:    { test: keyset_incremental_key_change_mssql }
    mongo:    { na: "the Mongo keyset key is always _id (full_strategy, src/plan/build.rs) and chunk_by_key is refused outside mode: chunked (src/config/mod.rs:1360-1364), so the key cannot change" }
    oracle:   { gap: "no Oracle mode-transition live test (the transition logic is shared; the cursor/keyset state Oracle writes is unproven here)" }

  - id: incremental_then_keyset_incremental_same_key
    what: "MT2 — incremental on id, then keyset_incremental on id: continues from the incremental cursor"
    postgres: { test: incremental_then_keyset_incremental_same_key_postgres }
    mysql:    { test: incremental_then_keyset_incremental_same_key_mysql }
    mssql:    { test: incremental_then_keyset_incremental_same_key_mssql }
    mongo:    { na: "a Mongo export accepts only mode: full or cdc (validate_non_sql_source_modes, src/config/mod.rs:543-554), so there is no incremental / chunked mode to switch from or into; the switch Mongo has (into page_size + resume) is graded by the three *_then_resume_mongo cells" }
    oracle:   { gap: "no Oracle mode-transition live test (the transition logic is shared; the cursor/keyset state Oracle writes is unproven here)" }

  - id: incremental_cursor_change
    what: "MT3 — cursor_column changed without a reset: refused; full pass after state reset"
    postgres: { test: incremental_cursor_change_postgres }
    mysql:    { test: incremental_cursor_change_mysql }
    mssql:    { test: incremental_cursor_change_mssql }
    mongo:    { na: "a Mongo export accepts only mode: full or cdc (validate_non_sql_source_modes, src/config/mod.rs:543-554), so there is no incremental / chunked mode to switch from or into; the switch Mongo has (into page_size + resume) is graded by the three *_then_resume_mongo cells" }
    oracle:   { gap: "no Oracle mode-transition live test (the transition logic is shared; the cursor/keyset state Oracle writes is unproven here)" }

  - id: incremental_single_to_coalesce
    what: "MT3 — single_column → coalesce on the same primary changes the identity: refused (rows with a NULL primary were never exported)"
    postgres: { test: incremental_single_to_coalesce_postgres }
    mysql:    { test: incremental_single_to_coalesce_mysql }
    mssql:    { test: incremental_single_to_coalesce_mssql }
    mongo:    { na: "a Mongo export accepts only mode: full or cdc (validate_non_sql_source_modes, src/config/mod.rs:543-554), so there is no incremental / chunked mode to switch from or into; the switch Mongo has (into page_size + resume) is graded by the three *_then_resume_mongo cells" }
    oracle:   { gap: "no Oracle mode-transition live test (the transition logic is shared; the cursor/keyset state Oracle writes is unproven here)" }

  - id: incremental_adding_settle
    what: "MT2 — adding settle keeps the identity: continues"
    postgres: { test: incremental_adding_settle_postgres }
    mysql:    { test: incremental_adding_settle_mysql }
    mssql:    { test: incremental_adding_settle_mssql }
    mongo:    { na: "a Mongo export accepts only mode: full or cdc (validate_non_sql_source_modes, src/config/mod.rs:543-554), so there is no incremental / chunked mode to switch from or into; the switch Mongo has (into page_size + resume) is graded by the three *_then_resume_mongo cells" }
    oracle:   { gap: "no Oracle mode-transition live test (the transition logic is shared; the cursor/keyset state Oracle writes is unproven here)" }

  - id: legacy_keyset_state_then_other_column
    what: "MT5 — a pre-v26 keyset cursor (no identity) is attributed to the keyset run that wrote it: refused"
    postgres: { test: legacy_keyset_state_then_other_column_postgres }
    mysql:    { test: legacy_keyset_state_then_other_column_mysql }
    mssql:    { test: legacy_keyset_state_then_other_column_mssql }
    mongo:    { na: "a Mongo export accepts only mode: full or cdc (validate_non_sql_source_modes, src/config/mod.rs:543-554), so there is no incremental / chunked mode to switch from or into; the switch Mongo has (into page_size + resume) is graded by the three *_then_resume_mongo cells" }
    oracle:   { gap: "no Oracle mode-transition live test (the transition logic is shared; the cursor/keyset state Oracle writes is unproven here)" }

  - id: legacy_incremental_state_then_other_column
    what: "MT6 — a pre-v26 incremental cursor is attributed to the column the run's key descriptor (export_metrics.key_descriptor_json, v18+) names: refused; a row older than v18 records no identity anywhere — reset when changing the cursor"
    postgres: { test: legacy_incremental_state_then_other_column_postgres }
    mysql:    { test: legacy_incremental_state_then_other_column_mysql }
    mssql:    { test: legacy_incremental_state_then_other_column_mssql }
    mongo:    { na: "a Mongo export accepts only mode: full or cdc (validate_non_sql_source_modes, src/config/mod.rs:543-554), so there is no incremental / chunked mode to switch from or into; the switch Mongo has (into page_size + resume) is graded by the three *_then_resume_mongo cells" }
    oracle:   { gap: "no Oracle mode-transition live test (the transition logic is shared; the cursor/keyset state Oracle writes is unproven here)" }

  # Stream identity: the stored progress names the table / collection it was read from. Each cell
  # exports table A, switches the SAME export name and state to table B without a reset, requires the
  # refusal (exit 5, RIVET_STATE_CURSOR_STREAM_MISMATCH, nothing written) TWICE, then re-reads every
  # row of B after the remedy.

  - id: incremental_repointed_at_another_table
    what: "one config repointed in place (table:): refused twice; full pass of the new table after state reset"
    postgres: { test: incremental_repointed_at_another_table_postgres }
    mysql:    { test: incremental_repointed_at_another_table_mysql }
    mssql:    { test: incremental_repointed_at_another_table_mssql }
    oracle:   { test: incremental_repointed_at_another_table_oracle }
    mongo:    { na: "a Mongo export accepts only mode: full or cdc; its stored-cursor continuation (page_size + resume) is the keyset_incremental_repointed row" }

  - id: incremental_query_repointed_at_another_table
    what: "the rivet init shape (query:): a column added to the SELECT keeps the cursor; another FROM table is refused twice"
    postgres: { test: incremental_query_repointed_at_another_table_postgres }
    mysql:    { test: incremental_query_repointed_at_another_table_mysql }
    mssql:    { test: incremental_query_repointed_at_another_table_mssql }
    oracle:   { test: incremental_query_repointed_at_another_table_oracle }
    mongo:    { na: "a Mongo export names a collection, never a query" }

  - id: keyset_incremental_repointed_at_another_table
    what: "keyset_incremental high-water (Mongo: resume) repointed in place: refused twice"
    postgres: { test: keyset_incremental_repointed_at_another_table_postgres }
    mysql:    { test: keyset_incremental_repointed_at_another_table_mysql }
    mssql:    { test: keyset_incremental_repointed_at_another_table_mssql }
    oracle:   { test: keyset_incremental_repointed_at_another_table_oracle }
    mongo:    { test: resume_repointed_at_another_collection_mongo }

  - id: parallel_keyset_incremental_repointed_at_another_table
    what: "parallel keyset_incremental anchor repointed in place: refused twice"
    postgres: { test: parallel_keyset_incremental_repointed_at_another_table_postgres }
    mysql:    { test: parallel_keyset_incremental_repointed_at_another_table_mysql }
    mssql:    { test: parallel_keyset_incremental_repointed_at_another_table_mssql }
    oracle:   { test: parallel_keyset_incremental_repointed_at_another_table_oracle }
    mongo:    { na: "the parallel _id-range reader records no _id (parallel_keyset_then_resume_mongo), so it has no stored progress to inherit" }

  - id: shared_name_another_table
    what: "two configs, one export name, one Postgres state database, two tables: the second is refused twice until it has its own name (skips without RIVET_GATE_STATE_URL)"
    postgres: { test: incremental_shared_name_another_table_postgres }
    mysql:    { test: incremental_shared_name_another_table_mysql }
    mssql:    { test: incremental_shared_name_another_table_mssql }
    oracle:   { test: incremental_shared_name_another_table_oracle }
    mongo:    { test: resume_shared_name_another_collection_mongo }
