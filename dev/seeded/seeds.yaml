          - crashed_keyset_then_incremental_reset_oracle
      mongo:
        na: "a Mongo export accepts only mode: full or cdc, so no run of another mode can meet its interrupted keyset run"

  - name: unfinished-run-beside-an-uncheckpointed-run
    class: a run of the same mode whose plan keeps no checkpoint finishes beside an unfinished checkpoint run, and a later checkpointed run resumes that older run over data read before the finished one
    history: "2026-10-07 - a range-chunk run with chunk_checkpoint was killed after 6 of 20 chunks, the export ran once without chunk_checkpoint (exit 0), 20 rows changed, and with the checkpoint back the next run resumed the killed one: exit 0, manifest success, 14 of the 20 changed rows (main and v0.31.0; PostgreSQL, MySQL, SQL Server)"
