    history: "P-25 (2026-10-06): PostgreSQL parallel keyset_incremental on a smallint key exported 0 of 3000 rows on every run, exit 0, on main and v0.31.0; the numeric range-bound collapse to BETWEEN 0 AND 0 before it"
