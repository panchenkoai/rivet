  - name: ack-past-unwritten
    class: a CDC source is acknowledged past transactions that were read but not yet written, so a failed later part loses them
    history: "PostgreSQL: a mid-window roll's ack cleared the yielded-data latch, the zero-yield release then advanced the slot to the last READ commit; a failed final part left confirmed_flush_lsn past it and the next run delivered nothing (0.31.0)"
    scope: source
    engines:
      postgres:
        patch: ack-past-unwritten/postgres.patch
        cells:
