      oracle:
        cells: [stdout_survives_child_processes_oracle]
      mongo:
        cells: [stdout_survives_child_processes_mongo]
      lib:
        cells:
          - "lib:child_processes_take_the_declared_exports_unless_one_writes_to_stdout"
