# Seeded-defect recall: known product-bug classes, kept as source patches.
#
# `python -m dev.seeded` (or `make seeded-recall`) applies each patch to a scratch
# worktree of HEAD, builds it, runs ONLY the cells declared to catch it, and records
# CAUGHT (a cell green on the unpatched tree goes red) or MISSED. See docs/seeded-recall.md.
#
# Every seed names every engine of its scope:
#   scope: source  -> postgres, mysql, mssql, mongo, oracle
#   scope: state   -> postgres-state, sqlite-state
# plus, optionally, `lib` (an engine-agnostic unit test of the shared code path).
# An engine entry is either
#   patch: <path under dev/seeded/>   (falls back to the seed's own `patch:`)
#   cells: [test fn names]            (live_suite tests; `lib:<name>` for a unit test)
# or
#   na: <why the code path does not exist on this engine>
# `cells: []` means the code path exists and NO cell catches it: a MISSED row by declaration.

seeds:
  - name: committed-every-event
    class: a CDC adapter marks `committed` on every event instead of only the last event of a source transaction
    history: PG and SQL Server lost 7 of 12 rows at rollover 5 (#158)
    scope: source
    engines:
      postgres:
        patch: committed-every-event/postgres.patch
        cells: [roast_pg_cdc_large_transaction_is_atomic_across_a_mid_flush_crash]
      mysql:
        patch: committed-every-event/mysql.patch
        cells: [roast_mysql_cdc_large_transaction_is_atomic_across_a_mid_flush_crash]
      mssql:
        patch: committed-every-event/mssql.patch
        cells: [roast_mssql_cdc_large_transaction_is_atomic_across_a_mid_flush_crash]
      oracle:
        patch: committed-every-event/oracle.patch
        cells: [roast_oracle_cdc_large_transaction_is_atomic_across_a_mid_flush_crash]
      mongo:
        na: "committed on every event IS the MongoDB contract (TxnFramer::single_event_commit, #158) - its consume-free resume token re-reads a mid-transaction tail, so there is no defect to seed"

  - name: row-lost-at-rotation
    class: the shared batch writer drops the first row written into each part it rotates to (max_file_size)
    history: the rotated-part loss class (roast_part_loss); counters agree with the loss, so only an independent re-read sees it
    scope: source
    patch: row-lost-at-rotation/shared.patch
    engines:
      postgres:
        cells:
          - roast_chunked_split_parts_all_rows_reach_destination
          - max_file_size_holds_under_auto_sized_row_groups
      mysql:
        cells:
          - roast_keyset_split_parts_all_rows_reach_destination
          - roast_keyset_split_parts_parquet_all_rows_reach_destination
      oracle:
        cells:
          - every_single_runner_hook_loses_nothing_on_oracle
          - every_chunked_range_runner_hook_loses_nothing_on_oracle
      mssql:
        cells: [rotated_parts_reach_the_destination_whole_mssql]
      mongo:
        cells: [rotated_parts_reach_the_destination_whole_mongo]

  - name: delta-run-loaded-as-overwrite
    class: a run that continues past its last key (SQL keyset_incremental, Mongo source.mongo.resume) plans its warehouse load as a whole-table overwrite instead of an append
    history: "#399 - BigQuery and ClickHouse held 100, then 20, then 20 rows; 2026-10-03 - a Mongo resume export loaded 500 of 2500 documents into ClickHouse"
    scope: source
    patch: delta-run-loaded-as-overwrite/shared.patch
    engines:
      postgres:
        cells: [a_keyset_incremental_export_into_clickhouse_accumulates_every_run]
      mysql:
        cells: [a_keyset_incremental_export_from_mysql_accumulates_in_clickhouse]
      mssql:
        cells: [a_keyset_incremental_export_from_sql_server_accumulates_in_clickhouse]
      oracle:
        cells: [a_keyset_incremental_export_from_oracle_accumulates_in_clickhouse]
      mongo:
        patch: delta-run-loaded-as-overwrite/mongo.patch
        cells: [a_mongo_resume_export_into_clickhouse_accumulates_every_run]
      lib:
        cells:
          - "lib:load_mode_of_every_mode_with_and_without_keyset_incremental"
          - "lib:a_mongo_resume_export_plans_an_append_ordered_by_its_id"

  - name: pk-move-without-delete
    class: a primary-key-changing UPDATE reaches the destination without the delete of the old key
    history: ADR-0030; the first PostgreSQL split was reverted for writing the old key under the wrong names, and every latest-image-per-key merge kept the old key live beside the new one until the split moved into the shared sink (split_move)
    scope: source
    engines:
      postgres:
        patch: pk-move-without-delete/postgres.patch
        cells:
          - pg_cdc_pk_changing_update_captures_and_does_not_brick
          - a_postgres_cdc_stream_loads_into_clickhouse_and_the_view_matches_the_source
          - a_key_move_leaves_one_live_row_per_key_in_a_partitioned_base_postgres
      mysql:
        patch: pk-move-without-delete/mysql.patch
        cells:
          - mysql_cdc_a_composite_key_move_is_a_delete_then_an_insert
          - a_mysql_cdc_stream_loads_into_clickhouse_and_the_view_matches_the_source
          - a_key_move_leaves_one_live_row_per_key_in_a_partitioned_base_mysql
      mssql:
        patch: pk-move-without-delete/mssql.patch
        cells:
          - a_sql_server_primary_key_move_flags_the_old_key_deleted_in_clickhouse
          - a_sql_server_cdc_stream_loads_into_clickhouse_and_the_view_matches_the_source
      oracle:
        patch: pk-move-without-delete/oracle.patch
        cells: [oracle_cdc_a_primary_key_update_is_a_delete_then_an_insert]
      mongo:
        na: _id is immutable, so a key move cannot be expressed

  - name: renumber-equal-images
    class: a statement that renumbers keys over rows whose images are equal loses a row, because a delete is paired with the wrong moved-in insert
    history: ADR-0030 amendment 2026-10-03 - with images alone, Oracle `UPDATE t SET id = id + 1` over rows that differ only in the key read as one row moved twice; the LogMiner ROW_ID now pairs them
    scope: source
    engines:
      oracle:
        patch: renumber-equal-images/oracle.patch
        cells: [oracle_cdc_a_renumber_over_rows_with_equal_images_keeps_every_row]
      postgres:
        na: no row identity reaches the stream (test_decoding carries no ctid), so there is nothing to drop; an immediate key never logs a delete after a row moved into its key, and the DEFERRABLE-key case is the documented limitation
      mysql:
        na: the binlog carries no row identity, and an immediate unique check never lets a row move onto a key another row still holds, so the ambiguity cannot arise
      mssql:
        na: the change table carries no row identity, so there is nothing to drop; it records a renumber as each key's delete then its insert at one __$seqval (measured 2026-10-03), so no delete follows the row moved into its key
      mongo:
        na: _id is immutable, so no statement renumbers keys

  - name: absent-old-cell-read-as-moved-key
    class: an old image that does not carry a key column is read as if the column changed, so a non-key UPDATE is split into a delete with a NULL key and an insert
    history: ADR-0030 amendment 2026-10-03 - the first cut padded PostgreSQL's key-only old image with NULL; an UPDATE of a replica identity index `email` became delete (id NULL) + insert
    scope: source
    engines:
      postgres:
        patch: absent-old-cell-read-as-moved-key/postgres.patch
        cells:
          - pg_cdc_an_update_of_a_replica_identity_index_that_is_not_the_key_stays_one_update
          - pg_cdc_a_declared_key_absent_from_the_old_key_does_not_split
          - an_update_of_a_replica_identity_index_reaches_the_base_as_one_update_postgres
      mysql:
        # A unit on a fabricated NOBLOB-shaped image (mysql_common pushes only the bitmap's columns); no live
        # NOBLOB cell, because a global NOBLOB/MINIMAL is refused at open and a session-level writer is not staged.
        patch: absent-old-cell-read-as-moved-key/lib.patch
        cells: ["lib:a_key_moves_only_when_a_key_column_differs_between_full_images"]
      mssql:
        na: rivet reads fn_cdc_get_all_changes with N'all', which returns only an UPDATE's new row (op 4; map_op drops op 3), so an UPDATE reaches split_move with no old image and key_moves never reads one. A primary-key UPDATE arrives as the change table's own delete + insert (measured 2026-10-03 on a clustered key and on a nonclustered key over a heap)
      oracle:
        na: a change whose redo lacks any captured column's value is refused in `mined` (image_sides), so an Oracle image never has an absent cell
      mongo:
        na: _id is immutable, so no UPDATE can change a document's key

  - name: empty-page-fails-quality
    class: an empty keyset page / chunk arrives as Schema::empty() and the quality gate reads it as a missing rule column
    history: "#419 - every keyset run under unique_columns whose range ended on an empty page failed"
    scope: source
    patch: empty-page-fails-quality/shared.patch
    engines:
      postgres:
        # Only the parallel-keyset cell reaches an empty page (measured 2026-10-03); the
        # other six fixtures never end a page or chunk empty, so they stay green under
        # this seed and grade the duplicate only.
        cells:
          - quality_gate_fails_a_duplicate_on_the_single_runner
          - quality_gate_fails_a_duplicate_split_across_keyset_pages
          - quality_gate_fails_a_duplicate_split_across_parallel_keyset_ranges
          - quality_gate_fails_a_duplicate_split_across_chunks
          - quality_gate_fails_a_duplicate_split_across_parallel_chunks
          - quality_gate_fails_a_duplicate_split_across_checkpoint_chunks
          - quality_gate_fails_a_duplicate_split_across_parallel_checkpoint_chunks
      mongo:
        na: "no empty schema to seed - the Mongo reader announces its fixed blob schema (_id, document) before it reads, on every page and range (blob_schema() in MongoSource::export), so Schema::empty() never reaches the quality tracker"
      mysql:
        cells: [quality_gate_fails_a_duplicate_across_parallel_keyset_ranges_ending_empty_mysql]
      mssql:
        na: "no empty schema to seed - a zero-row SQL Server page still builds its schema from the result set's column metadata (emit_mssql_batch on the empty final batch), never Schema::empty(); measured 2026-10-03: quality_gate_fails_a_duplicate_across_parallel_keyset_ranges_ending_empty_mssql, whose four ranges each end on an empty page, stayed green under the seed"
      oracle:
        na: "no empty schema to seed - the Oracle reader builds its schema from the statement's column metadata and announces it before the first fetch, so a zero-row page carries its columns; measured 2026-10-03: quality_gate_fails_a_duplicate_across_parallel_keyset_ranges_ending_empty_oracle, whose four ranges each end on an empty page, stayed green under the seed"
      lib:
        cells: ["lib:a_zero_row_empty_schema_binds_nothing_and_is_not_a_ghost_column"]

  - name: refused-run-adopted
    class: a keyset run a post-data gate refused keeps its resume anchor, so the next run adopts its pages, reads nothing and passes the gate over nothing
    history: "night 2026-10-06 P-05 - parallel keyset + chunk_checkpoint and keyset_incremental: run 1 exit 3, run 2 exit 0 with _SUCCESS, on main and on v0.31.0"
    scope: source
    patch: refused-run-adopted/shared.patch
    engines:
      postgres:
        cells:
          - a_refused_parallel_keyset_checkpoint_run_keeps_refusing_a_duplicate_postgres
          - a_refused_parallel_keyset_checkpoint_run_keeps_refusing_a_null_ratio_postgres
          - a_refused_parallel_keyset_checkpoint_run_keeps_refusing_schema_drift_postgres
          - a_refused_keyset_incremental_run_keeps_refusing_a_duplicate_postgres
          - a_refused_keyset_incremental_run_keeps_refusing_a_null_ratio_postgres
          - a_refused_keyset_incremental_run_keeps_refusing_schema_drift_postgres
          - a_refused_parallel_keyset_incremental_run_keeps_refusing_a_duplicate_postgres
          - a_refused_parallel_keyset_incremental_run_keeps_refusing_schema_drift_postgres
      mysql:
        cells:
          - a_refused_parallel_keyset_checkpoint_run_keeps_refusing_mysql
          - a_refused_keyset_incremental_run_keeps_refusing_mysql
      mssql:
        cells:
          - a_refused_parallel_keyset_checkpoint_run_keeps_refusing_mssql
          - a_refused_keyset_incremental_run_keeps_refusing_mssql
      oracle:
        cells:
          - a_refused_parallel_keyset_checkpoint_run_keeps_refusing_oracle
          - a_refused_keyset_incremental_run_keeps_refusing_oracle
      mongo:
        na: "no gate can refuse a Mongo keyset export after its data: the reader's fixed (_id, document) schema never drifts, _id is never duplicated and document is never null, so only row-count rules can fail, and those count adopted rows and refuse again; mongo_parallel persists no anchor at all. By reading (blob_schema() in MongoSource::export, mongo_parallel.rs); no Mongo stand ran on 2026-10-07"
      lib:
        cells:
          - "lib:a_refused_run_releases_its_keyset_anchor_so_the_next_run_is_graded_again"
          - "lib:a_refused_or_finished_run_releases_anchor_and_ranges_and_a_broken_off_one_keeps_both"

  - name: pg-migration-not-idempotent
    class: a PostgreSQL state migration that fails when the ladder replays over tables already in its shape
    history: "#413 - v32 read columns_json from a table that no longer had it; 317 gate cells failed"
    scope: state
    engines:
      postgres-state:
        patch: pg-migration-not-idempotent/postgres-state.patch
        cells: ["lib:pg_v32_replays_over_a_load_spec_table_already_in_its_v32_shape"]
      sqlite-state:
        na: the SQLite ladder never replays over leftovers - its version row lives in the same file and the ladder runs under BEGIN IMMEDIATE, so a migration there is not required to be idempotent

  - name: capped-run-skips-remainder
    class: a `rivet cdc --max-events` run that stops at its cap moves its position past the changes after the cap, so the next run never delivers them
    history: "the rig oracle graded no `rivet cdc` subcommand run until it learned the subcommand and paired a capped run with the next one (#441)"
    scope: source
    engines:
      mysql:
        patch: capped-run-skips-remainder/ndjson.patch
        cells: [mysql_cdc_cli_a_capped_run_leaves_its_remainder_to_the_next_run]
      mongo:
        patch: capped-run-skips-remainder/ndjson.patch
        cells: [mongo_cdc_cli_a_capped_run_leaves_its_remainder_to_the_next_run]
      postgres:
        patch: capped-run-skips-remainder/sink.patch
        cells: [pg_cdc_cli_a_capped_run_leaves_its_remainder_to_the_next_run]
      mssql:
        patch: capped-run-skips-remainder/sink.patch
        cells: [mssql_cdc_cli_a_capped_run_leaves_its_remainder_to_the_next_run]
      oracle:
        patch: capped-run-skips-remainder/sink.patch
        cells: [oracle_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit]

  - name: remedy-does-not-recover
    class: a CDC data-loss message prescribes a re-baseline that cannot be followed from the state that printed it
    history: "the slot-created warning and every re-anchor refusal said `re-snapshot (mode: full)`, which is refused for a CDC export and for a batch export into its destination"
    scope: source
    patch: remedy-does-not-recover/shared.patch
    engines:
      postgres:
        cells:
          - pg_slot_created_warning_remedy_recovers_the_row_written_while_the_slot_was_gone
          - pg_missing_slot_refusal_remedy_recovers_the_row_written_while_the_slot_was_gone
          - pg_multi_table_missing_slot_refusal_remedy_re_reads_every_table
          - pg_truncate_refusal_remedy_leaves_no_removed_row_live_in_the_prefix
          - pg_multi_table_truncate_remedy_recovers_the_other_tables_row_the_advance_skipped
          - rebaseline_remedy_after_a_truncate_leaves_no_removed_key_live_in_bigquery_postgres
      mysql:
        cells:
          - mysql_missing_checkpoint_warning_remedy_recovers_the_row_written_while_it_was_gone
          - mysql_missing_checkpoint_refusal_remedy_recovers_the_row_written_while_it_was_gone
      mssql:
        cells: [mssql_retention_gap_refusal_remedy_recovers_the_rows_the_cleanup_removed]
      mongo:
        cells: [mongo_missing_checkpoint_warning_remedy_recovers_the_document_written_while_it_was_gone]
      oracle:
        cells:
          - oracle_cdc_truncate_refusal_remedy_leaves_no_removed_row_live_in_the_prefix
          - oracle_cdc_resume_past_log_retention_fails_loudly
      lib:
        cells:
          - "lib:the_rebaseline_remedy_names_the_steps_the_product_runs"

  - name: interrupted-run-continued-by-another-mode
    class: an unfinished checkpoint run's stored progress (page cursor, anchor) is continued by a run of another mode as if it were a committed high-water
    history: "2026-10-06 - a keyset run crashed after page 0, the export was switched to mode: incremental without a reset: exit 0 with _SUCCESS and a manifest of 1900 of 2000 rows (v0.31.0)"
    scope: source
    patch: interrupted-run-continued-by-another-mode/shared.patch
    engines:
      postgres:
        cells:
          - crashed_keyset_then_incremental_finish_the_run_postgres
          - crashed_keyset_then_incremental_reset_postgres
          - crashed_range_chunk_then_incremental_reset_postgres
      mysql:
        cells:
          - crashed_keyset_then_incremental_finish_the_run_mysql
          - crashed_keyset_then_incremental_reset_mysql
          - crashed_range_chunk_then_incremental_reset_mysql
      mssql:
