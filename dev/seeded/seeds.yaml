  - name: checkpoint-gone-at-completion
    class: a checkpointed run completes a chunk run whose row is no longer in the state, and publishes a success over the parts it can no longer list
    history: "P-17, 2026-10-06 - the run whose `chunk_run` and `chunk_task` rows were removed under it finished exit 0 with `_SUCCESS` and 0 rows, 16 parts left in no manifest"
