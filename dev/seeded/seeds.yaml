# Seeded-defect recall: known product-bug classes, kept as source patches.
#
# `python -m dev.seeded` (or `make seeded-recall`) applies each patch to a scratch
# worktree of HEAD, builds it, runs ONLY the cells declared to catch it, and records
# CAUGHT (a cell green on the unpatched tree goes red) or MISSED. See docs/seeded-recall.md.
#
# Every seed names every engine of its scope:
#   scope: source  -> postgres, mysql, mssql, mongo, oracle
#   scope: state   -> postgres-state, sqlite-state
# plus, optionally, `lib` (an engine-agnostic unit test of the shared code path).
# An engine entry is either
#   patch: <path under dev/seeded/>   (falls back to the seed's own `patch:`)
#   cells: [test fn names]            (live_suite tests; `lib:<name>` for a unit test)
# or
#   na: <why the code path does not exist on this engine>
# `cells: []` means the code path exists and NO cell catches it: a MISSED row by declaration.

seeds:

  - name: incremental-plan-replay-answered
    class: "`rivet apply` treats an incremental plan (`mode: incremental`, `keyset_incremental`) as a point-in-time snapshot: a replay after its first exit-0 apply answers \"already applied\", so every row that arrived since is never delivered with exit 0, and the plan is refused past 24 h"
    history: "found 2026-10-16 on PR #616 CI (run 38911927276): the first F3 replay answer keyed on plan_id alone; `incremental_keyset_apply_rotates_run_id_across_repeated_applies` read COUNT(*) source 150, delivered 100; owner decision (PR #616 comment 6219074059): an incremental plan is a reusable description"
    scope: source
    patch: incremental-plan-replay-answered/shared.patch
    engines:
      postgres:
        cells:
          - a_replayed_first_incremental_plan_delivers_what_arrived_since_postgres
          - a_replayed_keyset_incremental_plan_delivers_what_arrived_since_postgres
          - a_replayed_incremental_plan_delivers_what_arrived_since_postgres
          - incremental_keyset_apply_rotates_run_id_across_repeated_applies
          - "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"
      mysql:
        cells:
          - a_replayed_first_incremental_plan_delivers_what_arrived_since_mysql
          - a_replayed_keyset_incremental_plan_delivers_what_arrived_since_mysql
          - a_replayed_incremental_plan_delivers_what_arrived_since_mysql
          - "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"
      mssql:
        cells: [a_replayed_incremental_plan_delivers_what_arrived_since_mssql, "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"]
      oracle:
        cells: [a_replayed_incremental_plan_delivers_what_arrived_since_oracle, "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"]
      mongo:
        cells: ["lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"]

  - name: own-apply-cursor-read-as-drift
    class: "`rivet apply` of an incremental plan made after a cursor was stored is refused RIVET_PLAN_ARTIFACT_STALE (exit 5, \"cursor has drifted\") on every apply after its first, because PA4 reads the cursor the plan's own earlier apply moved as drift"
    history: "retry matrix F3, 2026-10-16: measured on main 04c4a712 (PostgreSQL, GCS): the second apply of one incremental plan exit 5 \"cursor has drifted\"; owner decision (PR #616 comment 6219074059): a cursor moved by an earlier apply of the same plan is not drift"
    scope: source
    patch: own-apply-cursor-read-as-drift/shared.patch
    engines:
      postgres:
        cells: [a_replayed_incremental_plan_delivers_what_arrived_since_postgres, "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"]
      mysql:
        cells: [a_replayed_incremental_plan_delivers_what_arrived_since_mysql, "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"]
      mssql:
        cells: [a_replayed_incremental_plan_delivers_what_arrived_since_mssql, "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"]
      oracle:
        cells: [a_replayed_incremental_plan_delivers_what_arrived_since_oracle, "lib:a_reusable_plan_extracts_on_every_replay_from_the_stored_cursor"]
      mongo:
        na: "a MongoDB plan holds no cursor snapshot (keyset `resume` continues the stored key), so PA4 never runs for it"

  - name: applied-plan-replayed
    class: "`rivet apply` of a full, chunked or keyset plan whose apply already exited 0 runs it again: a scheduler retry extracts the whole table a second time"
    history: "retry matrix F3, 2026-10-16: a scheduler retry after the task process died right after a successful apply replayed the same artifact; measured on main 04c4a712 (PostgreSQL, GCS): the retry rc 0 with a second run"
    scope: source
    patch: applied-plan-replayed/shared.patch
    engines:
      postgres:
        cells: [a_replayed_applied_full_plan_answers_with_its_run_postgres, a_replayed_applied_keyset_plan_answers_with_its_run_postgres, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      mysql:
        cells: [a_replayed_applied_full_plan_answers_with_its_run_mysql, a_replayed_applied_keyset_plan_answers_with_its_run_mysql, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      mssql:
        cells: [a_replayed_applied_full_plan_answers_with_its_run_mssql, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      oracle:
        cells: [a_replayed_applied_full_plan_answers_with_its_run_oracle, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      mongo:
        cells: ["lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]

  - name: already-applied-answer-text-only
    class: "`rivet apply` of a full, chunked or keyset plan that already applied answers only in prose on stderr: `--summary-output` writes no file and `--json` prints no document, so a scheduler reads the replay as a success with no result"
    history: "found by the Airflow provider after #616, 2026-10-17, verified on main 74cb6daa: the replay path returned before any summary (`eprintln!` of the report, exit 0), and `rivet apply` had no `--summary-output` / `--json` at all; fixed by one builder (`apply_document`) writing the same document for a run and for the answering run, with `status: already_applied` and `answered_by_run`"
    scope: source
    patch: already-applied-answer-text-only/shared.patch
    engines:
      postgres:
        cells: [a_replayed_applied_plan_answers_in_its_summary_document_postgres, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      mysql:
        cells: [a_replayed_applied_plan_answers_in_its_summary_document_mysql, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      mssql:
        cells: [a_replayed_applied_plan_answers_in_its_summary_document_mssql, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      oracle:
        cells: [a_replayed_applied_plan_answers_in_its_summary_document_oracle, "lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]
      mongo:
        cells: ["lib:a_plan_that_applied_answers_every_replay_with_its_run_and_extracts_nothing"]

  - name: checkpointed-chunk-loses-its-class
    class: a coded failure met by one chunk of a checkpointed export (chunk_checkpoint true, one worker or several) ends the run as the incomplete run RIVET_RUN_UNITS_FAILED with exit 1 and a --resume hint instead of the chunk's own code and class, and the --resume meets it again and ends the same way
    history: the second half of worker-error-loses-its-class, found 2026-10-15 fixing it; both checkpoint runners recorded a failed chunk's cause as text in chunk_task and stopped on the not-completed count; a PostgreSQL `infinity` met by a checkpointed chunk exited [RIVET_RUN_UNITS_FAILED] 1 where the same export without chunk_checkpoint exits [RIVET_SOURCE_VALUE_UNREPRESENTABLE] 5, on main through 0.31.0
    scope: source
    patch: checkpointed-chunk-loses-its-class/shared.patch
    engines:
      postgres:
        cells: [a_refusal_in_a_checkpointed_chunk_exits_by_code_and_so_does_its_resume_postgres]
      mysql:
        cells: [a_refusal_in_a_checkpointed_chunk_exits_by_code_and_so_does_its_resume_mysql]
      mssql:
        cells: [a_refusal_in_a_checkpointed_chunk_exits_by_code_and_so_does_its_resume_mssql]
      oracle:
        cells: [a_refusal_in_a_checkpointed_chunk_exits_by_code_and_so_does_its_resume_oracle]
      mongo:
        na: the range-chunk checkpoint runners (chunk_column + chunk_checkpoint) read SQL ranges; MongoDB fans out through mongo_parallel, which drains through FanIn (worker-error-loses-its-class)
      lib:
        cells:
          - "lib:a_coded_chunk_failure_decides_the_runs_exit_under_the_resume_remedy"

  - name: worker-error-loses-its-class
    class: a coded failure in one parallel worker reaches the run as text only (FanIn kept strings), so the run prints RIVET_RUN_UNITS_FAILED and exits 1 or 2 instead of the worker's own code and class
    history: found 2026-10-15 reading FanIn::fail against the owner's "exit follows code class" rule; a PostgreSQL `infinity` met by a parallel keyset worker exited [RIVET_RUN_UNITS_FAILED] 1 where one worker exits [RIVET_SOURCE_VALUE_UNREPRESENTABLE] 5, on main through 0.31.0
    scope: source
    patch: worker-error-loses-its-class/shared.patch
    engines:
      postgres:
        cells: [a_refusal_in_one_worker_exits_as_with_one_worker_postgres]
      mysql:
        cells: [a_refusal_in_one_worker_exits_as_with_one_worker_mysql]
      mssql:
        cells: [a_refusal_in_one_worker_exits_as_with_one_worker_mssql]
      oracle:
        cells: [a_refusal_in_one_worker_exits_as_with_one_worker_oracle]
      mongo:
        cells: [a_coded_failure_in_one_worker_keeps_its_code_mongo]
      lib:
        cells:
          - "lib:a_coded_refusal_in_one_worker_decides_the_runs_exit_and_code"
          - "lib:the_most_stop_worthy_coded_unit_failure_decides"

  - name: keyset-anchor-kept-without-a-part
    class: a keyset run that stops before its first part keeps its resume anchor, so the run of another mode the refusal names as the remedy is refused as continuing an interrupted run
    history: "Sweep 14, 2026-10-12: a resumed MongoDB keyset run refused for a mixed-type `_id` left its claim on the cursor row; removing `page_size` (the remedy it names) was refused RIVET_STATE_INTERRUPTED_RUN_OWNER_MISMATCH, exit 5 (v0.31.0)"
    scope: source
    patch: keyset-anchor-kept-without-a-part/shared.patch
    engines:
      mongo:
        cells:
          - removing_page_size_runs_after_the_heterogeneous_id_refusal_mongo
          - roast_resume_must_not_bypass_heterogeneous_id_guard
          - "lib:a_run_that_broke_off_before_its_first_part_releases_its_anchor"
      postgres:
        cells: ["lib:a_run_that_broke_off_before_its_first_part_releases_its_anchor"]
      mysql:
        cells: ["lib:a_run_that_broke_off_before_its_first_part_releases_its_anchor"]
      mssql:
        cells: ["lib:a_run_that_broke_off_before_its_first_part_releases_its_anchor"]
      oracle:
        cells: ["lib:a_run_that_broke_off_before_its_first_part_releases_its_anchor"]
  - name: oracle-cdc-log-gap-uncoded
    class: an Oracle CDC data-loss refusal (the retained redo no longer reaches the checkpoint) stops as a plain error with no RIVET_* code and exit 1, so a scheduler retries it as transient
    history: found 2026-10-14 by the log-gap walk cell on the Mac stand (cycle 1 ended with no RIVET_* code, exit 1), on main through 0.31.0
    scope: source
    engines:
      oracle:
        patch: oracle-cdc-log-gap-uncoded/lib.patch
        cells: ["lib:a_start_before_the_oldest_log_or_a_sequence_hole_is_a_data_loss_refusal", "a_checkpoint_past_the_retained_redo_is_refused_by_code_oracle"]
      postgres:
        na: "its log-gap refusal (a dropped slot) goes through checkpoint_identity::log_gap already (a_dropped_slot_after_a_changes_run_is_refused_by_code_postgres)"
      mysql:
        na: "its log-gap refusal (purged binlogs) goes through checkpoint_identity::log_gap already (binlogs_purged_past_the_checkpoint_after_a_changes_run_are_refused_by_code_mysql)"
      mssql:
        na: "its log-gap refusal (a cleaned change table) goes through checkpoint_identity::log_gap already (a_change_table_cleaned_past_the_checkpoint_after_a_changes_run_is_refused_by_code_mssql)"
      mongo:
        na: "a rolled oplog is refused by the server's resume-token check, through checkpoint_identity::log_gap"
  - name: keyset-key-by-catalog-order
    class: the auto-selected keyset key is whichever single-column unique key the server's catalog listed first, so two runs of one export can page different keys
    history: main CI 2026-10-14, a crash-then-resume cell on a MySQL table with unique `id` and `ext_id` and no primary key - the resumed run was refused with RIVET_STATE_CURSOR_OWNER_MISMATCH
    scope: source
    engines:
      mysql:
        patch: keyset-key-by-catalog-order/lib.patch
        cells: ["lib:the_primary_key_comes_first_and_a_column_is_listed_once"]
      postgres:
        patch: keyset-key-by-catalog-order/lib.patch
        cells: ["lib:the_primary_key_comes_first_and_a_column_is_listed_once"]
      mssql:
        na: "its key query orders by is_pk DESC, name in SQL (src/source/mssql/mod.rs); the shared seam is covered under mysql/postgres"
      oracle:
        na: "its key query orders by is_pk DESC, column_name in SQL (src/source/oracle/mod.rs); the shared seam is covered under mysql/postgres"
      mongo:
        na: "no SQL catalog and no keyset key introspection; `_id` is the only key"
  - name: committed-every-event
    class: a CDC adapter marks `committed` on every event instead of only the last event of a source transaction
    history: PG and SQL Server lost 7 of 12 rows at rollover 5 (#158)
    scope: source
    engines:
      postgres:
        patch: committed-every-event/postgres.patch
        cells: [roast_pg_cdc_large_transaction_is_atomic_across_a_mid_flush_crash]
      mysql:
        patch: committed-every-event/mysql.patch
        cells: [roast_mysql_cdc_large_transaction_is_atomic_across_a_mid_flush_crash]
      mssql:
        patch: committed-every-event/mssql.patch
        cells: [roast_mssql_cdc_large_transaction_is_atomic_across_a_mid_flush_crash]
      oracle:
        patch: committed-every-event/oracle.patch
        cells: [roast_oracle_cdc_large_transaction_is_atomic_across_a_mid_flush_crash]
      mongo:
        na: "committed on every event IS the MongoDB contract (TxnFramer::single_event_commit, #158) - its consume-free resume token re-reads a mid-transaction tail, so there is no defect to seed"

  - name: row-lost-at-rotation
    class: the shared batch writer drops the first row written into each part it rotates to (max_file_size)
    history: the rotated-part loss class (roast_part_loss); counters agree with the loss, so only an independent re-read sees it
    scope: source
    patch: row-lost-at-rotation/shared.patch
    engines:
      postgres:
        cells:
          - roast_chunked_split_parts_all_rows_reach_destination
          - max_file_size_holds_under_auto_sized_row_groups
      mysql:
        cells:
          - roast_keyset_split_parts_all_rows_reach_destination
          - roast_keyset_split_parts_parquet_all_rows_reach_destination
      oracle:
        cells:
          - every_single_runner_hook_loses_nothing_on_oracle
          - every_chunked_range_runner_hook_loses_nothing_on_oracle
      mssql:
        cells: [rotated_parts_reach_the_destination_whole_mssql]
      mongo:
        cells: [rotated_parts_reach_the_destination_whole_mongo]

  - name: delta-run-loaded-as-overwrite
    class: a run that continues past its last key (SQL keyset_incremental, Mongo source.mongo.resume) plans its warehouse load as a whole-table overwrite instead of an append
    history: "#399 - BigQuery and ClickHouse held 100, then 20, then 20 rows; 2026-10-03 - a Mongo resume export loaded 500 of 2500 documents into ClickHouse"
    scope: source
    patch: delta-run-loaded-as-overwrite/shared.patch
    engines:
      postgres:
        cells: [a_keyset_incremental_export_into_clickhouse_accumulates_every_run]
      mysql:
        cells: [a_keyset_incremental_export_from_mysql_accumulates_in_clickhouse]
      mssql:
        cells: [a_keyset_incremental_export_from_sql_server_accumulates_in_clickhouse]
      oracle:
        cells: [a_keyset_incremental_export_from_oracle_accumulates_in_clickhouse]
      mongo:
        patch: delta-run-loaded-as-overwrite/mongo.patch
        cells: [a_mongo_resume_export_into_clickhouse_accumulates_every_run]
      lib:
        cells:
          - "lib:load_mode_of_every_mode_with_and_without_keyset_incremental"
          - "lib:a_mongo_resume_export_plans_an_append_ordered_by_its_id"

  - name: pk-move-without-delete
    class: a primary-key-changing UPDATE reaches the destination without the delete of the old key
    history: ADR-0030; the first PostgreSQL split was reverted for writing the old key under the wrong names, and every latest-image-per-key merge kept the old key live beside the new one until the split moved into the shared sink (split_move)
    scope: source
    engines:
      postgres:
        patch: pk-move-without-delete/postgres.patch
        cells:
          - pg_cdc_pk_changing_update_captures_and_does_not_brick
          - a_postgres_cdc_stream_loads_into_clickhouse_and_the_view_matches_the_source
          - a_key_move_leaves_one_live_row_per_key_in_a_partitioned_base_postgres
      mysql:
        patch: pk-move-without-delete/mysql.patch
        cells:
          - mysql_cdc_a_composite_key_move_is_a_delete_then_an_insert
          - a_mysql_cdc_stream_loads_into_clickhouse_and_the_view_matches_the_source
          - a_key_move_leaves_one_live_row_per_key_in_a_partitioned_base_mysql
      mssql:
        patch: pk-move-without-delete/mssql.patch
        cells:
          - a_sql_server_primary_key_move_flags_the_old_key_deleted_in_clickhouse
          - a_sql_server_cdc_stream_loads_into_clickhouse_and_the_view_matches_the_source
      oracle:
        patch: pk-move-without-delete/oracle.patch
        cells: [oracle_cdc_a_primary_key_update_is_a_delete_then_an_insert]
      mongo:
        na: _id is immutable, so a key move cannot be expressed

  - name: renumber-equal-images
    class: a statement that renumbers keys over rows whose images are equal loses a row, because a delete is paired with the wrong moved-in insert
    history: ADR-0030 amendment 2026-10-03 - with images alone, Oracle `UPDATE t SET id = id + 1` over rows that differ only in the key read as one row moved twice; the LogMiner ROW_ID now pairs them
    scope: source
    engines:
      oracle:
        patch: renumber-equal-images/oracle.patch
        cells: [oracle_cdc_a_renumber_over_rows_with_equal_images_keeps_every_row]
      postgres:
        na: no row identity reaches the stream (test_decoding carries no ctid), so there is nothing to drop; an immediate key never logs a delete after a row moved into its key, and the DEFERRABLE-key case is the documented limitation
      mysql:
        na: the binlog carries no row identity, and an immediate unique check never lets a row move onto a key another row still holds, so the ambiguity cannot arise
      mssql:
        na: the change table carries no row identity, so there is nothing to drop; it records a renumber as each key's delete then its insert at one __$seqval (measured 2026-10-03), so no delete follows the row moved into its key
      mongo:
        na: _id is immutable, so no statement renumbers keys

  - name: absent-old-cell-read-as-moved-key
    class: an old image that does not carry a key column is read as if the column changed, so a non-key UPDATE is split into a delete with a NULL key and an insert
    history: ADR-0030 amendment 2026-10-03 - the first cut padded PostgreSQL's key-only old image with NULL; an UPDATE of a replica identity index `email` became delete (id NULL) + insert
    scope: source
    engines:
      postgres:
        patch: absent-old-cell-read-as-moved-key/postgres.patch
        cells:
          - pg_cdc_an_update_of_a_replica_identity_index_that_is_not_the_key_stays_one_update
          - pg_cdc_a_declared_key_absent_from_the_old_key_does_not_split
          - an_update_of_a_replica_identity_index_reaches_the_base_as_one_update_postgres
      mysql:
        # A unit on a fabricated NOBLOB-shaped image (mysql_common pushes only the bitmap's columns); no live
        # NOBLOB cell, because a global NOBLOB/MINIMAL is refused at open and a session-level writer is not staged.
        patch: absent-old-cell-read-as-moved-key/lib.patch
        cells: ["lib:a_key_moves_only_when_a_key_column_differs_between_full_images"]
      mssql:
        na: rivet reads fn_cdc_get_all_changes with N'all', which returns only an UPDATE's new row (op 4; map_op drops op 3), so an UPDATE reaches split_move with no old image and key_moves never reads one. A primary-key UPDATE arrives as the change table's own delete + insert (measured 2026-10-03 on a clustered key and on a nonclustered key over a heap)
      oracle:
        na: a change whose redo lacks any captured column's value is refused in `mined` (image_sides), so an Oracle image never has an absent cell
      mongo:
        na: _id is immutable, so no UPDATE can change a document's key

  - name: empty-page-fails-quality
    class: an empty keyset page / chunk arrives as Schema::empty() and the quality gate reads it as a missing rule column
    history: "#419 - every keyset run under unique_columns whose range ended on an empty page failed"
    scope: source
    patch: empty-page-fails-quality/shared.patch
    engines:
      postgres:
        # Only the parallel-keyset cell reaches an empty page (measured 2026-10-03); the
        # other six fixtures never end a page or chunk empty, so they stay green under
        # this seed and grade the duplicate only.
        cells:
          - quality_gate_fails_a_duplicate_on_the_single_runner
          - quality_gate_fails_a_duplicate_split_across_keyset_pages
          - quality_gate_fails_a_duplicate_split_across_parallel_keyset_ranges
          - quality_gate_fails_a_duplicate_split_across_chunks
          - quality_gate_fails_a_duplicate_split_across_parallel_chunks
          - quality_gate_fails_a_duplicate_split_across_checkpoint_chunks
          - quality_gate_fails_a_duplicate_split_across_parallel_checkpoint_chunks
      mongo:
        na: "no empty schema to seed - the Mongo reader announces its fixed blob schema (_id, document) before it reads, on every page and range (blob_schema() in MongoSource::export), so Schema::empty() never reaches the quality tracker"
      mysql:
        cells: [quality_gate_fails_a_duplicate_across_parallel_keyset_ranges_ending_empty_mysql]
      mssql:
        na: "no empty schema to seed - a zero-row SQL Server page still builds its schema from the result set's column metadata (emit_mssql_batch on the empty final batch), never Schema::empty(); measured 2026-10-03: quality_gate_fails_a_duplicate_across_parallel_keyset_ranges_ending_empty_mssql, whose four ranges each end on an empty page, stayed green under the seed"
      oracle:
        na: "no empty schema to seed - the Oracle reader builds its schema from the statement's column metadata and announces it before the first fetch, so a zero-row page carries its columns; measured 2026-10-03: quality_gate_fails_a_duplicate_across_parallel_keyset_ranges_ending_empty_oracle, whose four ranges each end on an empty page, stayed green under the seed"
      lib:
        cells: ["lib:a_zero_row_empty_schema_binds_nothing_and_is_not_a_ghost_column"]

  - name: refused-run-adopted
    class: a keyset run a post-data gate refused keeps its resume anchor, so the next run adopts its pages, reads nothing and passes the gate over nothing
    history: "night 2026-10-06 P-05 - parallel keyset + chunk_checkpoint and keyset_incremental: run 1 exit 3, run 2 exit 0 with _SUCCESS, on main and on v0.31.0"
    scope: source
    patch: refused-run-adopted/shared.patch
    engines:
      postgres:
        cells:
          - a_refused_parallel_keyset_checkpoint_run_keeps_refusing_a_duplicate_postgres
          - a_refused_parallel_keyset_checkpoint_run_keeps_refusing_a_null_ratio_postgres
          - a_refused_parallel_keyset_checkpoint_run_keeps_refusing_schema_drift_postgres
