          - crashed_keyset_then_checkpoint_removed_reset_postgres
          - crashed_parallel_keyset_then_checkpoint_removed_reset_postgres
      mysql:
        cells:
          - crashed_range_chunk_then_checkpoint_removed_finish_the_run_mysql
          - crashed_range_chunk_then_checkpoint_removed_reset_mysql
          - crashed_keyset_then_checkpoint_removed_reset_mysql
