    history: "found 2026-10-15 while coding the last error sites (#594): a split prefix holding two generations stopped with RIVET_LOAD_SPLIT_GENERATIONS_MIXED and left no load_run row; load_type_reports folded a failed state read into RIVET_LOAD_SPEC_MISSING"
    scope: state
    patch: load-refusal-not-journaled/shared.patch
    engines:
      sqlite-state:
        cells: ["lib:a_mixed_split_generation_is_journaled_refused_and_refuses_again", "lib:a_missing_spec_and_an_unreadable_spec_store_are_two_codes"]
      postgres-state:
        cells: ["lib:pg_a_mixed_split_generation_is_journaled_refused_and_refuses_again"]
  - name: postgres-dial-runtime-unwrapped
    class: "a driver builds its own async runtime inside its connect call and unwraps the build, so a process out of file descriptors aborts with a panic instead of the environment stop the other drivers raise"
    history: "2026-10-08 - the gate's PostgreSQL out-of-descriptors cell (live_sabotage): `rivet run` capped at 8 open files panicked at postgres-0.19 src/config.rs:463 (`Too many open files`), exit 101 with no `Error:` line, while MySQL, SQL Server, Oracle and MongoDB failed loudly through `driver_runtime`, through 0.31.0; fixed by proving a runtime build at the shared PostgreSQL dial (`connect_client`) before the driver builds its own"
    scope: source
    patch: postgres-dial-runtime-unwrapped/shared.patch
    engines:
      postgres:
        cells: [a_run_out_of_file_descriptors_fails_loudly_and_the_next_delivers_postgres]
      mysql:
        na: "the MySQL driver takes rivet's runtime through driver_runtime; the unwrapped build is the PostgreSQL crate's connect call only"
      mssql:
        na: "the SQL Server driver takes rivet's runtime through driver_runtime; the unwrapped build is the PostgreSQL crate's connect call only"
      mongo:
        na: "the MongoDB driver takes rivet's runtime through driver_runtime; the unwrapped build is the PostgreSQL crate's connect call only"
      oracle:
        na: "the Oracle driver is synchronous and builds no runtime; the unwrapped build is the PostgreSQL crate's connect call only"
  - name: missing-container-retried-as-timeout
    class: "a store's final answer is classified by the words in its text, so a header such as `keep-alive: timeout=5` on a 404 reads as a timeout and the chunk is retried for minutes"
    history: "2026-10-08 - the gate's Azure removed-container cell (live_sabotage) ran past its 180 s ceiling: each chunk's upload into the removed container was retried 16 times, 9 min 21 s to exit 1 by hand (Azurite answers its 404 with `keep-alive: timeout=5`, and the classifier's text scan matched `timeout`), through 0.31.0; fixed by classifying an opendal error by its own verdict before any text scan"
    scope: source
    patch: missing-container-retried-as-timeout/shared.patch
    engines:
      postgres:
        cells:
          - "lib:an_object_store_answer_is_classified_by_opendal_s_verdict_not_its_text"
          - a_run_whose_azure_bucket_is_removed_delivers_or_fails_loudly_postgres
      mysql:
        cells: ["lib:an_object_store_answer_is_classified_by_opendal_s_verdict_not_its_text"]
      mssql:
        cells: ["lib:an_object_store_answer_is_classified_by_opendal_s_verdict_not_its_text"]
      mongo:
        cells: ["lib:an_object_store_answer_is_classified_by_opendal_s_verdict_not_its_text"]
      oracle:
        cells: ["lib:an_object_store_answer_is_classified_by_opendal_s_verdict_not_its_text"]
  - name: child-entry-by-name-on-shared-state
    class: "the parent of `--parallel-export-processes` takes a child's run-aggregate entry as the newest `export_metrics` row of the export's name, so on a state shared by two holders of the name a failed child is reported as the other holder's success"
    history: "2026-10-16 - found by the verifier of #604: two holders of one export name on one PostgreSQL state, the PostgreSQL one failed its snapshot leg and exited 1 while its entry read `status: success` with the MySQL holder's run id, on main through 0.31.0; fixed by matching the run id each child reports in its `Finished` event (`collect_child_entries`, `StateStore::get_metric_by_run_id`)"
    scope: state
    patch: child-entry-by-name-on-shared-state/shared.patch
    engines:
      postgres-state:
        cells: [a_failed_holder_of_a_shared_name_is_reported_under_its_own_run_id]
      sqlite-state:
        cells: ["lib:another_holders_row_of_the_same_name_is_not_this_childs_entry", "lib:a_childs_entry_is_the_row_of_the_run_it_reported"]
  - name: relative-destination-path-follows-the-cwd
    class: "a relative local `destination.path` is resolved against the directory rivet is started from while the cursor and state live beside the config, so one config run from two directories delivers each run's rows under a different directory, every run green"
    history: "2026-10-16 - P-27 (live_destination_parity): one config with `path: ./out` run from two working directories delivered ids 1..10 under the first and 11..13 under the second, exit 0 both times, on main through 0.31.0; fixed by anchoring every relative local path to the config file's directory once at config load (`Config::anchor_paths`)"
    scope: source
    patch: relative-destination-path-follows-the-cwd/shared.patch
    engines:
      postgres:
        cells:
          - "lib:a_loaded_config_anchors_its_relative_local_paths_once"
          - a_relative_destination_path_follows_the_config
      mysql:
        cells: ["lib:a_loaded_config_anchors_its_relative_local_paths_once"]
      mssql:
        cells: ["lib:a_loaded_config_anchors_its_relative_local_paths_once"]
      mongo:
        cells: ["lib:a_loaded_config_anchors_its_relative_local_paths_once"]
      oracle:
        cells: ["lib:a_loaded_config_anchors_its_relative_local_paths_once"]
  - name: relative-destination-path-moved-by-the-upgrade
    class: "the transition guard for a relative local `destination.path` does not fire, so the upgrade to the config-anchored path silently moves an export's output: old rows under the working directory, new rows beside the config, exit 0"
    history: "2026-10-16 - the first #617 head: a run of 0.31.0 from directory A with `path: ./out` wrote under A, and this build from A delivered the next rows beside the config, exit 0 (`refusal contract: the invocation ended with success (exit 0), expected [RIVET_DEST_RELATIVE_PATH_MOVED] (exit 5)`); fixed by `destination::relative_path_moved`, the one decision `Config::anchor_paths` makes before any command reads or writes the directory"
    scope: source
    patch: relative-destination-path-moved-by-the-upgrade/shared.patch
    engines:
      postgres:
        cells:
          - "lib:a_relative_path_has_moved_only_when_the_old_place_alone_holds_the_export"
          - a_relative_destination_path_moved_by_the_upgrade_is_refused_until_the_files_follow
      mysql:
        cells: ["lib:a_relative_path_has_moved_only_when_the_old_place_alone_holds_the_export"]
      mssql:
        cells: ["lib:a_relative_path_has_moved_only_when_the_old_place_alone_holds_the_export"]
      mongo:
        cells: ["lib:a_relative_path_has_moved_only_when_the_old_place_alone_holds_the_export"]
      oracle:
        cells: ["lib:a_relative_path_has_moved_only_when_the_old_place_alone_holds_the_export"]
  - name: foreign-lease-taken-before-expiry
    class: "a run lease whose holder names another host is judged by a local pid probe, so a run on a live host loses its lease to a run here before the lease expires"
    history: "2026-10-16 - harness: the dead-owner cells damaged `chunk-run:<export>` after the run lease became `chunk-run:<export>@<source hash>`, so on a PostgreSQL state they failed on `changed 0 row(s)` and on SQLite they were skipped; no cell could catch a takeover rule that ignored the host (fixed by deriving the key through `run_lease_key` and keeping a Postgres state in the cell)"
    scope: state
    patch: foreign-lease-taken-before-expiry/shared.patch
    engines:
      postgres-state:
        cells:
          - a_lease_of_an_owner_on_a_host_that_is_gone_expires_and_the_run_delivers_postgres
          - "lib:a_dead_holder_on_this_host_is_recognised_and_nothing_else_is"
      sqlite-state:
        na: the SQLite lease is an flock on a sidecar file that the kernel drops with its holder; there is no holder row naming a host to misjudge
  - name: repair-under-a-changed-chunk-plan
    class: "`reconcile` and `repair` read the stored chunk run without comparing the chunk plan it was planned under with the config, so after a `chunk_column` edit they re-read the stored windows on the new column and a repair supersedes parts: the manifest lists fewer rows than the source has"
    history: "2026-10-16 - P-21 (live_reconcile_repair): a repair --execute after chunk_column was edited from id to other_id left the manifest listing 39 rows over 39 distinct ids for 40 source ids, exit 0, on main through 0.31.0; fixed by routing reconcile and repair through the check `run --resume` already runs (`chunked::refuse_changed_chunk_plan`, via `reconcile_cmd::latest_chunk_run_under_this_plan`)"
    scope: source
    patch: repair-under-a-changed-chunk-plan/shared.patch
    engines:
      postgres:
        cells:
          - "lib:reconcile_under_a_changed_chunk_plan_is_refused_by_code"
          - repair_after_a_chunk_column_edit_is_refused_by_code_postgres
      mysql:
        cells:
          - "lib:reconcile_under_a_changed_chunk_plan_is_refused_by_code"
          - repair_after_a_chunk_column_edit_is_refused_by_code_mysql
      mssql:
        cells:
          - "lib:reconcile_under_a_changed_chunk_plan_is_refused_by_code"
          - repair_after_a_chunk_column_edit_is_refused_by_code_mssql
      mongo:
        na: "`rivet reconcile` and `rivet repair` take a `mode: chunked` export; MongoDB exports have none"
      oracle:
        cells: ["lib:reconcile_under_a_changed_chunk_plan_is_refused_by_code"]

