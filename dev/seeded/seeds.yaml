      lib:
        cells:
          - "lib:an_interrupted_run_is_refused_for_its_own_mode_without_the_checkpoint_until_finished_or_abandoned"

  - name: chunk-run-resumed-by-another-source
    class: an interrupted range-chunk run is looked up by export name alone and resumed by a same-named export of another source
    history: "2026-10-06 - config A crashed after chunk 0, same-named config B of another database ran: exit 0, 'resuming it', 1000 of 5000 rows (v0.31.0)"
