  - name: apply-skips-partition-expansion
    class: an entry point builds its own export list instead of taking the run set, and runs a `partition_by` export unexpanded
    history: "`rivet apply <config>`, `--pool` and a sealed plan wrote the whole table under a directory literally named `{partition}`, exit 0 (v0.31.0)"
