# ── Rivet Release Oracle — the go/no-go gate ────────────────────────────────
# The automation of the manual dogfood: every ENGINE at every pinned VERSION runs
# every SCENARIO against the local object-store fakes (MinIO=S3, fake-gcs=GCS,
# Azurite=Azure), and a final BigQuery stage. Green everywhere ⇒ releasable.
#
# This file is the declarative source of truth; `python3 -m dev.release_oracle` executes it. Kept in the
# same drift-guarded style as docs/*-matrix.yaml (a new scenario/engine/version is
# a row here, not hidden control flow in the driver).
#
# Verdict contract: a cell is PASS only when its check ran AND matched. A skipped
# cell (service down, cloud creds absent) is reported SKIP — never silently PASS.
# The gate is RED if any non-skipped cell fails.

# ── Engines × pinned versions ───────────────────────────────────────────────
# image = the exact tag the gate pins (reproducible on any docker host, not the
# devbox's ad-hoc stands). port = host port the driver connects on.
engines:
  postgres:
    driver: postgres
    url: "postgresql://rivet:rivet@127.0.0.1:%PORT%/rivet"
    seed: seeds/common/postgres.sql
    # Three versions, not seven: OLDEST supported, primary target, NEWEST. Seven
    # postgres versions were ~57% of the matrix's cells and every one of them
    # graded the same engine-level golden (docs/release-gate-matrix.yaml keys
    # cells by ENGINE, never by version), so versions 13/15/17 bought repetition
    # rather than coverage. NOT a support change — 12..18 stay supported; see
    # docs/reference/compatibility.md, which now says which set the gate runs.
    versions:
      - { tag: "14", image: "postgres:14", port: 55014 }
      - { tag: "16", image: "postgres:16", port: 55016 }
      - { tag: "18", image: "postgres:18", port: 55018 }
  mysql:
    # 5.7 is NOT in the list below — this note claimed it was "IN as of
    # 2026-08-30" and nothing ever added the row (corrected 2026-09-20). What
    # 2026-08-30 actually established is that the BLOCKER is gone: the note used
    # to say the seed needed a recursive CTE and so was 8.0+ only, which
    # seeds/common/mysql.sql contradicts in its own header ("no CTEs / window
    # functions; numbers come from a digits cross-join"). So 5.7 can be added —
    # it is a supported version the gate does not exercise, not an impossible one.
    driver: mysql
    url: "mysql://rivet:rivet@127.0.0.1:%PORT%/rivet"
    seed: seeds/common/mysql.sql
    versions:
      - { tag: "8.0", image: "mysql:8.0", port: 55080 }
      - { tag: "8.4", image: "mysql:8.4", port: 55084 }
  mssql:
    # 2019 is NOT in the list below — this note claimed it was "IN as of
    # 2026-08-30" and nothing ever added the row (corrected 2026-09-20). What
    # 2026-08-30 established is that the BLOCKER is gone: not GENERATE_SERIES as
    # an older note blamed (the seed fills through `ROW_NUMBER() OVER`, which SQL
    # Server has had since 2005) but a hardcoded `/opt/mssql-tools18` path in the
    # harness — 2019 ships plain `mssql-tools` — now probed per container. So
    # 2019 can be added; docs/reference/compatibility.md does not claim it today.
    driver: mssql
    url: "sqlserver://sa:Rivet_Passw0rd!@127.0.0.1:%PORT%/rivet"
    tls: accept_invalid_certs
    seed: seeds/common/mssql.sql
    versions:
      - { tag: "2022", image: "mcr.microsoft.com/mssql/server:2022-latest", port: 55022 }
  mongo:
    driver: mongo
    url: "mongodb://127.0.0.1:%PORT%/rivet"
    seed: seeds/mongo_seed.py
    versions:
      - { tag: "4.4", image: "mongo:4.4", port: 55044 }
      - { tag: "5",   image: "mongo:5",   port: 55005 }
      - { tag: "6",   image: "mongo:6",   port: 55006 }
      - { tag: "7",   image: "mongo:7",   port: 55007 }
      - { tag: "8",   image: "mongo:8",   port: 55008 }

# ── Object-store backends (local fakes) ─────────────────────────────────────
# One CloudDestination impl (src/destination/cloud.rs) serves all three; the gate
# proves each wire protocol end-to-end against its emulator.
stores:
  s3:      { emulator: minio,    endpoint: "http://127.0.0.1:9000",  bucket: rivet-oracle }
  gcs:     { emulator: fake-gcs, endpoint: "http://127.0.0.1:4443",  bucket: rivet-oracle }
  azure:   { emulator: azurite,  endpoint: "http://127.0.0.1:10000/devstoreaccount1", bucket: rivet-oracle }

# ── Preflight (source-agnostic, runs ONCE before the engine loop) ───────────
# state_migrations: INIT (migrate) + RUN the state-exercising golden fixtures on BOTH
# state backends (SQLite default + Postgres via RIVET_TEST_STATE_URL) and compare. The
# state layer has two migration arrays (MIGRATIONS/SQLite, PG_MIGRATIONS/Postgres)
# behind a dialect seam that ASSUMES type-parity; bug #1 shipped an int4 keyset_range
# that aborted every Postgres-state run while SQLite passed. This runs the RED-proven
# tests/live/live_state_backend_parity.rs (parallel-checkpoint, incremental, crash-
# resume) + the keyset_range round-trip through the RELEASE binary; a schema drift
# fails it. SKIP when no Postgres STATE url / cargo / source Postgres is present.
preflight:
  - id: release_build_path
    what: "the RELEASE build/publish path (stricter than `cargo build`, failed post-tag for 0.16.0/0.16.1): `cargo metadata --locked` (lock sync — publish + Docker are --locked), the cargo_manifest_chef (no multi-line inline tables) + schema_drift offline guards, and `cargo chef prepare` (the Dockerfile planner step). Full `docker build` opt-in (RIVET_ORACLE_DOCKER=1). Runs FIRST, before any cargo reconciles the lock."
  - id: state_migrations
    what: "SQLite state == Postgres state on every state-exercising fixture (migrations are type-parity; a keyset_range-style int4/BIGINT drift fails the gate)."
  - id: replica_read
    what: "prod topology — rivet reads a read-REPLICA, not the master. Drives live_cdc_replica.rs (mysql-primary :3308 → mysql-replica :3309); the replica re-logs the primary's changes into its own binlog and rivet captures from that. Needs the `replica` compose profile; SKIP when down."
  - id: release_regression
    what: "regression vs the PREVIOUS RELEASE (downloaded binary, not a rebuild). B-format: cur reads prev-written manifest+parts (validate PASSED + DuckDB rowcount). B-perf: cur wall <= prev × tol (def 1.5×). Env: RIVET_PREV_RELEASE_BIN + RIVET_REGRESSION_SOURCE_URL; SKIP-if-absent."
  - id: previous_release_differential
    what: "the SAME observable surface on BOTH binaries over 8 fixtures (full, chunked-parallel, keyset-parallel, chunk_checkpoint, incremental, csv, crash+resume, error-exit + plan-json JSON purity): exit code, DuckDB row readback, file count, and the manifest's accounting INCLUDING per-part content fingerprints and column checksums — identical source and encoder settings must give identical digests, so a difference there means the BYTES changed. Drives dev/pytools/ab_regression.py. One ledger row per scenario plus a count row; a scenario that graded nothing FAILS rather than reading as agreement. Env: RIVET_PREV_RELEASE_BIN — its ABSENCE FAILS the gate (0.24.4 shipped past a check that skipped itself); the named escape is --without-prev-release-comparison."
  - id: field_symptom_replay
    what: "the 2026-08-13 governor regression's own SYMPTOM, replayed: a workload shaped like the field run (mostly tiny full exports, a keyset majority at parallel 1/2/4, a few chunked, under a pool) run on BOTH binaries with adaptive on and off. Four criteria, ordered so the activation guard comes first: (1) the OLD binary must shed at least once — without it the run reproduces nothing and 2-4 grade air, (2) the NEW binary sheds ZERO on an idle source, (3) new makespan <= old × 1.05, (4) identical rows per export. Drives dev/pytools/field_replay.py; each criterion is its own ledger row, and criteria that 'passed' under a dead fixture are recorded SKIP, never PASS. Needs the MySQL stand. Shelf life: criterion 1 is evidence only while the baseline binary carries the regression — see the README blockquote."
  - id: scale_memory
    what: "the FLAT-RSS guarantee at scale (rivet's headline value prop, the 454M-row no-OOM win), PER ENGINE over TWO EXISTING tables (no seeding, default users vs events): peak RSS on the large table must stay flat vs the small (RSS(large) <= RSS(small) × tol, def 3×) — a buffering regression that scales RSS with the table ships green otherwise. Measured for cur + the downloaded prev. Env per engine: RIVET_SCALE_<ENGINE>_URL + _SMALL + _LARGE; SKIP-if-absent."
  - id: failed_run_tail
    what: "runs failed by a RETURNED error (single, chunked, checkpoint, parallel keyset, schema drift, parallel Mongo): exit/_SUCCESS/manifest/validate/state-cursor/files_committed, then a clean re-run == source. dev/release_oracle/failure.py."
  - id: transient_retry_exact
    what: "one-shot transients and a toxiproxy reset_peer: retry to an exact result before a durable part, duplicate-guard stop after one. dev/release_oracle/failure.py."
  - id: cdc_e2e
    what: "CDC end-to-end per engine (the change-data-capture surface the batch scenarios never exercise). For each engine whose RIVET_CDC_<ENGINE>_URL is set: anchor a typed table → INSERT/UPDATE/DELETE → capture (mode:cdc, until_current) to the object store → INDEPENDENT DuckDB readback == 5 change events (never rivet) → rivet validate PASSED → state-DB metabase populated (run_status all-success) → at-least-once CRASH recovery (a cdc_after_flush_before_ack panic holds the anchor; the re-run re-reads the delta id=4, never loses it). PLUS SQLite-vs-Postgres state PARITY: a PG CDC run against both backends must populate the SAME table set, matching golden/cdc_state_snapshot.json (the эталонный слепок). Each engine's anchor is its own mechanism: PG logical slot (server-side), MySQL binlog checkpoint file, SQL Server from-LSN, Mongo change-stream resume token. SKIP (never a silent pass) when the env URL is absent; the PG state-parity leg additionally needs RIVET_CDC_STATE_URL. dev/release_oracle/cdc.py; regenerate the snapshot golden with python3 -m dev.release_oracle --bless-cdc."
  - id: partner_shape
    what: "the partner shape as the OPERATOR gets it — the config `rivet init --mode cdc` EMITS over three tables (one keyset recipe per table + one `tables:` stream with `backfill: auto`; never `initial: snapshot`), with a `load:` appended, driven through the whole cycle on MySQL and PostgreSQL (the engines init consolidates): doctor → check → run 1 (anchor + every table's baseline through its recipe) → load → per table BigQuery COUNT == source == 5 → a delta in every table → run 2 → load → per table live view == source == 7 and `<table>__changes` == baseline + 5. Oracles: the `bq` CLI and a source re-query, never rivet. Every other CDC cell hand-writes its config; a scaffold that parses but cannot complete the cycle is what this catches. Env: RIVET_CDC_<ENGINE>_URL + BQ_ORACLE_PROJECT (or gcloud's project) + `bq`; SKIP-if-absent. dev/release_oracle/partner_shape.py (verify_partner_shape)."

# ── Scenarios (the manual dogfood, codified) ────────────────────────────────
# Each runs per engine×version. `sql`-only ones skip Mongo where noted.
scenarios:
  - id: verdicts
    what: "init → the strategy per table matches expectation: clean-PK seeds (users/orders/…) → keyset; orders_sparse → full; garbage decimal_key → full-bail, ref_id_history → chunked (non-unique), heap_no_key/no_pk_no_ts → chunked DEGRADED, unindexed_id → NOT keyset (name-trap), ext_bigint_unsigned_pk (mysql) → keyset; zero phantom heavy-chunk."
    applies: [postgres, mysql, mssql, mongo]

  - id: integrity_types
    what: "users 150K loss/dup: source count+distinct == DuckDB read of the parts. PLUS two fidelity arguments per type matrix: <tmt> = the PARQUET readback compared value by value to the SOURCE table (value_diff.compare_rows_to_parquet — decimal precision, uuid, timestamp, enum, arrays, float4; no golden) and <tmt>__csv = a per-engine DuckDB GOLDEN of the CSV readback read ALL-VARCHAR (the text-writer path parquet never exercises — escape/quote/unicode/null fidelity), both via DuckDB's own reader, never rivet's. Mongo has no type matrix (full-scan only), so it runs the loss/dup arm only."
    applies: [postgres, mysql, mssql, mongo]

  - id: keyset_parallel
    what: "the feat/parallel-keyset fan-out end-to-end: users 150K exported with mode:chunked + chunk_by_key:id + parallel:4 must (a) lose/dup ZERO rows vs the DuckDB read of the parts (same independent oracle as integrity_types) AND (b) actually FAN OUT — >=2 distinct pk_w{ridx} worker parts, proving parallel:N engaged and did not silently degrade to sequential keyset (which integrity_types/load already exercise)."
    applies: [postgres, mysql, mssql]   # mongo parallel:N is the separate _id-range reader (mongo_parallel), not SQL keyset
  - id: load
    what: "load the manifested parts into each store {s3/minio, gcs/fake-gcs, azure/azurite} and read them back: the DECLARED parts' row count == the source's, then DuckDB attaches the source and compares every value, source strictly CAST to the parquet type, EXCEPT ALL both ways (Mongo: `document` unpacked into the source columns)."
    applies: [postgres, mysql, mssql, mongo]

  - id: gc_survival
    what: "the concurrent-extract bucket-erasure guard: with a Running manifest present, a load's gc_orphans SPARES an unmanifested in-flight part; with none, it DELETES the true orphan; Success parts always kept. Run once per store."
    applies: [postgres]   # store-level property; one engine's parts suffice to exercise it
  - id: load_pool
    what: "`rivet load --pool 16` at the pool's full declared width (MAX_POOL == DEFAULT_POOL == 16). 16 alike tables; the config is GENERATED by `rivet init --include 'pool_t*' --gcs-bucket --bigquery-project --bigquery-dataset`, which emits the exports AND the load: block — so the cell grades init's own decisions over 16 tables as well as the pool. Two oracles: (1) per-table COUNT(*) + SUM(id) from BigQuery vs a SOURCE re-query (the sums are what can see a cross-table fan-out; 16 alike counts cannot), and (2) NON-VACUITY from BigQuery's job history — >=2 LOAD_DATA jobs for these tables must OVERLAP in time, touching-but-not-overlapping counted as 1. Without (2) the cell passes on a pool that silently degraded to sequential. Fails before measuring if init emitted fewer than 16 exports."
    applies: [postgres]   # the load reads GCS → BigQuery; the source engine cannot change the pool's behaviour

# ── Final stage: real cloud, checked against the SOURCE ─────────────────────
# rivet exports the type-matrix tables → loads to BigQuery → one DuckDB session
# attaches the source and BigQuery and compares every column value
# (dev/release_oracle/value_diff.py). No golden: a golden blessed from rivet's own
# output grades change, not correctness. SKIP (not fail) when creds are absent —
# but a release build MUST run it green.
final:
  bigquery:
    project_env: BQ_ORACLE_PROJECT
    dataset_env: BQ_ORACLE_DATASET
    # rivet_type_matrix is the FULL canonical per-engine type matrix (ports
    # tests/type_roundtrip/fixtures/<eng>_schema.sql): every BQ-loadable type incl.
    # PG arrays (text[]/integer[]) — which `rivet load` now loads as
    # ARRAY<STRUCT<item T>> (== REPEATED RECORD{item}), matching rivet_type_lab.
    # bo_pg_matrix_full — after the target.rs::list / from_files fix.
    tables: [rivet_type_matrix]
    what: "rivet run → real GCS, rivet load → BigQuery, then DuckDB attaches the source AND BigQuery and compares EVERY column value (decimal precision, TIMESTAMP microseconds, BYTES, UUID as 16 bytes, NUMERIC-widened unsigned, JSON, intervals); a STRING holding non-UTF-8 bytes fails outright. Then the CHAIN cell, one DuckDB session for the run just loaded: source count = Success manifests' row_count = parquet FOOTERS of the declared parts read from real GCS = export_metrics = file_log = load_run.rows_loaded = BigQuery count, one run id, no undeclared or missing parts (value_diff.chain_census; each of the 8 points RED-proven by tampering it)."
