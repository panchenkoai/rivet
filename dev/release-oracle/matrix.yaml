# ── Rivet Release Oracle — the go/no-go gate ────────────────────────────────
# The automation of the manual dogfood: every ENGINE at every pinned VERSION runs
# every SCENARIO against the local object-store fakes (MinIO=S3, fake-gcs=GCS,
# Azurite=Azure), and a final BigQuery stage. Green everywhere ⇒ releasable.
#
# This file is the declarative source of truth; `python3 -m dev.release_oracle` executes it. Kept in the
# same drift-guarded style as docs/*-matrix.yaml (a new scenario/engine/version is
# a row here, not hidden control flow in the driver).
#
# Verdict contract: a cell is PASS only when its check ran AND matched. A skipped
# cell (service down, cloud creds absent) is reported SKIP — never silently PASS.
# The gate is RED if any non-skipped cell fails.

# ── Engines × pinned versions ───────────────────────────────────────────────
# image = the exact tag the gate pins (reproducible on any docker host, not the
# devbox's ad-hoc stands). port = host port the driver connects on.
engines:
  postgres:
    driver: postgres
    url: "postgresql://rivet:rivet@127.0.0.1:%PORT%/rivet"
    seed: seeds/common/postgres.sql
    versions:
      - { tag: "13", image: "postgres:13", port: 55013 }
      - { tag: "14", image: "postgres:14", port: 55014 }
      - { tag: "16", image: "postgres:16", port: 55016 }
      - { tag: "18", image: "postgres:18", port: 55018 }
  mysql:
    # The canonical seed uses a recursive CTE (deterministic fast fill) → MySQL 8.0+
    # ONLY. Pre-8.0 (5.7) would need a non-recursive compat seed; out of matrix.
    driver: mysql
    url: "mysql://rivet:rivet@127.0.0.1:%PORT%/rivet"
    seed: seeds/common/mysql.sql
    versions:
      - { tag: "8.0", image: "mysql:8.0", port: 55080 }
      - { tag: "8.4", image: "mysql:8.4", port: 55084 }
  mssql:
    # The canonical seed uses GENERATE_SERIES → SQL Server 2022+ ONLY. Pre-2022
    # (2019) would need a numbers-table compat seed; out of matrix.
    driver: mssql
    url: "sqlserver://sa:Rivet_Passw0rd!@127.0.0.1:%PORT%/rivet"
    tls: accept_invalid_certs
    seed: seeds/common/mssql.sql
    versions:
      - { tag: "2022", image: "mcr.microsoft.com/mssql/server:2022-latest", port: 55022 }
  mongo:
    driver: mongo
    url: "mongodb://127.0.0.1:%PORT%/rivet"
    seed: seeds/mongo_seed.py
    versions:
      - { tag: "4.4", image: "mongo:4.4", port: 55044 }
      - { tag: "5",   image: "mongo:5",   port: 55005 }
      - { tag: "6",   image: "mongo:6",   port: 55006 }
      - { tag: "7",   image: "mongo:7",   port: 55007 }
      - { tag: "8",   image: "mongo:8",   port: 55008 }

# ── Object-store backends (local fakes) ─────────────────────────────────────
# One CloudDestination impl (src/destination/cloud.rs) serves all three; the gate
# proves each wire protocol end-to-end against its emulator.
stores:
  s3:      { emulator: minio,    endpoint: "http://127.0.0.1:9000",  bucket: rivet-oracle }
  gcs:     { emulator: fake-gcs, endpoint: "http://127.0.0.1:4443",  bucket: rivet-oracle }
  azure:   { emulator: azurite,  endpoint: "http://127.0.0.1:10000/devstoreaccount1", bucket: rivet-oracle }

# ── Preflight (source-agnostic, runs ONCE before the engine loop) ───────────
# state_migrations: INIT (migrate) + RUN the state-exercising golden fixtures on BOTH
# state backends (SQLite default + Postgres via RIVET_TEST_STATE_URL) and compare. The
# state layer has two migration arrays (MIGRATIONS/SQLite, PG_MIGRATIONS/Postgres)
# behind a dialect seam that ASSUMES type-parity; bug #1 shipped an int4 keyset_range
# that aborted every Postgres-state run while SQLite passed. This runs the RED-proven
# tests/live/live_state_backend_parity.rs (parallel-checkpoint, incremental, crash-
# resume) + the keyset_range round-trip through the RELEASE binary; a schema drift
# fails it. SKIP when no Postgres STATE url / cargo / source Postgres is present.
preflight:
  - id: release_build_path
    what: "the RELEASE build/publish path (stricter than `cargo build`, failed post-tag for 0.16.0/0.16.1): `cargo metadata --locked` (lock sync — publish + Docker are --locked), the cargo_manifest_chef (no multi-line inline tables) + schema_drift offline guards, and `cargo chef prepare` (the Dockerfile planner step). Full `docker build` opt-in (RIVET_ORACLE_DOCKER=1). Runs FIRST, before any cargo reconciles the lock."
  - id: state_migrations
    what: "SQLite state == Postgres state on every state-exercising fixture (migrations are type-parity; a keyset_range-style int4/BIGINT drift fails the gate)."
  - id: replica_read
    what: "prod topology — rivet reads a read-REPLICA, not the master. Drives live_cdc_replica.rs (mysql-primary :3308 → mysql-replica :3309); the replica re-logs the primary's changes into its own binlog and rivet captures from that. Needs the `replica` compose profile; SKIP when down."
  - id: release_regression
    what: "regression vs the PREVIOUS RELEASE (downloaded binary, not a rebuild). B-format: cur reads prev-written manifest+parts (validate PASSED + DuckDB rowcount). B-perf: cur wall <= prev × tol (def 1.5×). Env: RIVET_PREV_RELEASE_BIN + RIVET_REGRESSION_SOURCE_URL; SKIP-if-absent."
  - id: scale_memory
    what: "the FLAT-RSS guarantee at scale (rivet's headline value prop, the 454M-row no-OOM win), PER ENGINE over TWO EXISTING tables (no seeding, default users vs events): peak RSS on the large table must stay flat vs the small (RSS(large) <= RSS(small) × tol, def 3×) — a buffering regression that scales RSS with the table ships green otherwise. Measured for cur + the downloaded prev. Env per engine: RIVET_SCALE_<ENGINE>_URL + _SMALL + _LARGE; SKIP-if-absent."
  - id: cdc_e2e
    what: "CDC end-to-end per engine (the change-data-capture surface the batch scenarios never exercise). For each engine whose RIVET_CDC_<ENGINE>_URL is set: anchor a typed table → INSERT/UPDATE/DELETE → capture (mode:cdc, until_current) to the object store → INDEPENDENT DuckDB readback == 5 change events (never rivet) → rivet validate PASSED → state-DB metabase populated (run_status all-success) → at-least-once CRASH recovery (a cdc_after_flush_before_ack panic holds the anchor; the re-run re-reads the delta id=4, never loses it). PLUS SQLite-vs-Postgres state PARITY: a PG CDC run against both backends must populate the SAME table set, matching golden/cdc_state_snapshot.json (the эталонный слепок). Each engine's anchor is its own mechanism: PG logical slot (server-side), MySQL binlog checkpoint file, SQL Server from-LSN, Mongo change-stream resume token. SKIP (never a silent pass) when the env URL is absent; the PG state-parity leg additionally needs RIVET_CDC_STATE_URL. dev/release_oracle/cdc.py; regenerate the snapshot golden with python3 -m dev.release_oracle --bless-cdc."

# ── Scenarios (the manual dogfood, codified) ────────────────────────────────
# Each runs per engine×version. `sql`-only ones skip Mongo where noted.
scenarios:
  - id: verdicts
    what: "init → the strategy per table matches expectation: clean-PK seeds (users/orders/…) → keyset; orders_sparse → full; garbage decimal_key → full-bail, ref_id_history → chunked (non-unique), heap_no_key/no_pk_no_ts → chunked DEGRADED, unindexed_id → NOT keyset (name-trap), ext_bigint_unsigned_pk (mysql) → keyset; zero phantom heavy-chunk."
    applies: [postgres, mysql, mssql, mongo]

  - id: integrity_types
    what: "users 150K loss/dup: source count+distinct == DuckDB read of the parts. PLUS a per-engine DuckDB GOLDEN with TWO fidelity arguments per type matrix: <tmt> = PARQUET readback (binary/typed path — decimal precision, uuid, timestamp, enum) and <tmt>__csv = CSV readback read ALL-VARCHAR (the text-writer path parquet never exercises — escape/quote/unicode/null fidelity), both via DuckDB's own reader, never rivet's. Mongo has no type matrix (full-scan only), so it runs the loss/dup arm only."
    applies: [postgres, mysql, mssql, mongo]

  - id: keyset_parallel
    what: "the feat/parallel-keyset fan-out end-to-end: users 150K exported with mode:chunked + chunk_by_key:id + parallel:4 must (a) lose/dup ZERO rows vs the DuckDB read of the parts (same independent oracle as integrity_types) AND (b) actually FAN OUT — >=2 distinct pk_w{ridx} worker parts, proving parallel:N engaged and did not silently degrade to sequential keyset (which integrity_types/load already exercise)."
    applies: [postgres, mysql, mssql]   # mongo parallel:N is the separate _id-range reader (mongo_parallel), not SQL keyset
  - id: load
    what: "load the manifested parts into each store {s3/minio, gcs/fake-gcs, azure/azurite} and read them back: warehouse/reread count == summed manifest row_count (the count gate), and the id-set round-trips."
    applies: [postgres, mysql, mssql, mongo]

  - id: gc_survival
    what: "the concurrent-extract bucket-erasure guard: with a Running manifest present, a load's gc_orphans SPARES an unmanifested in-flight part; with none, it DELETES the true orphan; Success parts always kept. Run once per store."
    applies: [postgres]   # store-level property; one engine's parts suffice to exercise it

# ── Final stage: real cloud, GOLDEN-checked ─────────────────────────────────
# Not an emulator — the BigQuery independent oracle. rivet exports the type-matrix
# tables → loads to BigQuery → reads back with `bq query --format=prettyjson`. The
# read-back is compared to a CHECKED-IN GOLDEN (golden/bigquery_type_matrix.json):
# the warehouse-side representation of every type-matrix value after a full
# rivet→Parquet→BigQuery round-trip. That golden makes the stage DETERMINISTIC —
# a divergence means either rivet's type export changed or BigQuery changed a type
# mapping, and the release must not ship until the golden is re-blessed on purpose.
#
# Requires ADC + a dataset; SKIP (not fail) when creds are absent — but a release
# build MUST run it green against the golden. Regenerate the golden intentionally
# with `python3 -m dev.release_oracle --bless-bigquery-golden` (never silently).
final:
  bigquery:
    project_env: BQ_ORACLE_PROJECT
    dataset_env: BQ_ORACLE_DATASET
    # rivet_type_matrix is the FULL canonical per-engine type matrix (ports
    # tests/type_roundtrip/fixtures/<eng>_schema.sql): every BQ-loadable type incl.
    # PG arrays (text[]/integer[]) — which `rivet load` now loads as
    # ARRAY<STRUCT<item T>> (== REPEATED RECORD{item}), matching rivet_type_lab.
    # bo_pg_matrix_full — after the target.rs::list / from_files fix.
    tables: [rivet_type_matrix]
    golden: golden/bigquery_type_matrix.json
    what: "rivet run → real GCS, rivet load → BigQuery, bq query reads back as JSON and compares EVERY column value to the checked-in golden (decimal precision, TIMESTAMP, BYTES, NUMERIC-widened unsigned, JSON) — deterministic, not a fuzzy count check."
