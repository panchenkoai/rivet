# Merely dropping the length is NOT caught: the 0x01 presence tag still frames an alphabet with no 0x01.
# The mutant restores the v1 shape (tag + length removed, \x1f appended) the RED-proven test names.
- id: row-hash-separator-framing
  class: "Row hash loses its length framing (v1 bare \\x1f separator) -> a value forges a field boundary, two rows share a hash"
  file: src/enrich.rs
  old: |2-
        let _ = write!(buf, "{}", fmt.value(row));
        let len = (buf.len() - len_at - 4) as u32;
        buf[len_at..len_at + 4].copy_from_slice(&len.to_le_bytes());
  new: |2-
        let _ = write!(buf, "{}\x1f", fmt.value(row));
        buf.drain(len_at - 1..len_at + 4);
  detectors:
    - test: a_value_containing_the_old_separator_cannot_forge_a_field_boundary
      suite: lib
      needs: none
    - test: row_hash_is_injective_over_hostile_two_column_rows
      suite: lib
      needs: none

