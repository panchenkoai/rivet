# Canonical product faults for the fault x detection matrix: each entry re-introduces one silent-loss class.
# Runner: dev/pytools/fault_catalog.py (applies `old` -> `new` from a working-tree snapshot, runs the detectors).
# Every `old` must match EXACTLY ONCE in its `file`, byte-for-byte, or the runner reports the entry unviable.

# PG-local on purpose: the shared TxnFramer is graded by lib tests for every engine.
- id: pg-cdc-committed-every-event
  class: "PG CDC marks every event of a transaction `committed` -> sink acks mid-transaction, a crash loses the tail"
  file: src/source/postgres/cdc.rs
  old: |2-
                            for ev in group {
                                self.pending.push_back(ev);
  new: |2-
                            for mut ev in group {
                                ev.committed = true;
                                self.pending.push_back(ev);
  detectors:
    - test: roast_pg_cdc_large_transaction_is_atomic_across_a_mid_flush_crash
      suite: live_suite
      needs: postgres-cdc

