# DEFAULT, not deletion: deleting the line is masked by pin_session_formats' session-level SET TimeZone.
# DEFAULT resets to the role/db/startup-options zone, un-pinning both layers for the read txn.
- id: pg-incremental-cursor-tz
  class: "PG incremental cursor boundary parsed in the session zone -> non-UTC session skips/duplicates the offset window"
  file: src/source/postgres/mod.rs
  old: |2-
            .batch_execute("SET LOCAL TimeZone = 'UTC'")?;
  new: |2-
            .batch_execute("SET LOCAL TimeZone = DEFAULT")?;
  detectors:
    - test: pg_incremental_cursor_survives_a_non_utc_session_timezone
      suite: live_suite
      needs: postgres
    - test: pg_incremental_on_a_timestamptz_cursor_reads_each_row_once_across_runs_in_an_odd_session
      suite: live_suite
      needs: postgres

