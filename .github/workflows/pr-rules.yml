# The PR's own text and declarations, graded by dev/pytools/pr_ready.py (the same rules
# `make pr-ready` and the git hooks run). Its own workflow so an edit of the PR body re-runs
# this job alone, not the whole of CI.
name: PR rules

on:
  pull_request:
    branches: [master, main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: pr-rules-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-rules:
    name: PR rules (text, raised ratchets, CHANGELOG)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Self-tests
        run: |
          python3 dev/pytools/pr_ready.py --self-test
          python3 dev/pytools/live_slot.py --self-test
      - name: Commits, PR title and body, added lines, raised ratchets, CHANGELOG
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 dev/pytools/pr_ready.py ci --base "$BASE_SHA" --event "$GITHUB_EVENT_PATH"
