name: Linux glibc 2.28 build

# The `-glibc2.28` Linux assets. The release calls this workflow (release.yml, job `glibc228`)
# and publishes what it uploads; a pull request that changes this file, release.yml or the
# glibc check runs it too, so the container steps and the arm runner are exercised before a tag.
on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to build"
        required: true
        type: string
      tag:
        description: "Release tag in the asset names"
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/glibc228.yml
      - .github/workflows/release.yml
      - dev/pytools/glibc_floor.py
      - dev/pytools/pypi_wheels.py

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Linux binaries for older glibc: the `build` job links the glibc of ubuntu-latest (2.39),
  # which does not start on Debian 12, RHEL 8/9 or the official Airflow images. These assets
  # (`rivet-<tag>-<target>-glibc2.28.tar.gz`) are built natively inside manylinux_2_28
  # (AlmaLinux 8, glibc 2.28) and run on any glibc >= 2.28; the macOS and default Linux assets
  # are unchanged.
  build:
    name: Build ${{ matrix.target }} (glibc 2.28)
    runs-on: ${{ matrix.runner }}
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    env:
      RELEASE_TAG: ${{ inputs.tag || format('pr-{0}', github.event.number) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      # git before the checkout: without it in the container, actions/checkout downloads the tree
      # with no `.git`, and build.rs stamps `--version` with `(unknown)`. The vendored OpenSSL's
      # Configure needs Perl core modules (IPC::Cmd, Time::Piece, ...) that manylinux_2_28 does
      # not ship; the `perl` package installs all of them.
      - name: Install build tools
        run: dnf -y -q install perl git

      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      # The workspace belongs to the runner's user, not the container's root, so git refuses it
      # ("dubious ownership") unless it is marked safe; build.rs reads the commit through git.
      - name: Let build.rs read the commit
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}-glibc228

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package binary
        shell: bash
        run: |
          dir="rivet-${RELEASE_TAG}-${{ matrix.target }}-glibc2.28"
          mkdir "$dir"
          cp "target/${{ matrix.target }}/release/rivet"     "$dir/"
          cp "target/${{ matrix.target }}/release/rivet-mcp" "$dir/"
          cp README.md LICENSE* CHANGELOG.md "$dir/" 2>/dev/null || true
          tar czf "${dir}.tar.gz" "$dir"
          echo "ASSET=${dir}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rivet-${{ matrix.target }}-glibc2.28
          path: ${{ env.ASSET }}

  # The glibc 2.28 assets are published only when they need nothing newer than GLIBC_2.28
  # and start in the images they exist for; a dependency that pulls a newer symbol fails
  # the release here instead of on a client's server.
  verify:
    name: Verify ${{ matrix.target }} (glibc 2.28)
    needs: build
    runs-on: ${{ matrix.runner }}
    env:
      RELEASE_TAG: ${{ inputs.tag || format('pr-{0}', github.event.number) }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: actions/download-artifact@v8
        with:
          name: rivet-${{ matrix.target }}-glibc2.28
          path: dist

      - name: Unpack
        run: tar xzf dist/*.tar.gz -C dist

      # The other builds print `rivet <version> (<commit>)`; this one printed `(unknown)`.
      - name: --version names the commit it was built from
        run: |
          set -euo pipefail
          got="$(dist/rivet-*/rivet --version)"
          want="($(git rev-parse --short=9 HEAD))"
          echo "${got}"
          case "${got}" in
            *"${want}") ;;
            *) echo "::error::rivet --version is '${got}', not built from ${want}"; exit 1 ;;
          esac

      - name: Needs nothing newer than GLIBC_2.28
        run: python3 -m dev.pytools.glibc_floor --max 2.28 dist/rivet-*/rivet dist/rivet-*/rivet-mcp

      - name: Starts on RHEL 8 and 9, Amazon Linux 2023, Debian 12 and the official Airflow images
        run: |
          set -euo pipefail
          bin="$(ls -d "$PWD"/dist/rivet-*/)rivet"
          for image in rockylinux:8 rockylinux:9 amazonlinux:2023 debian:bookworm apache/airflow:2.10.5 apache/airflow:3.3.2; do
            echo "== ${image}"
            docker run --rm --entrypoint /usr/local/bin/rivet -v "${bin}:/usr/local/bin/rivet:ro" "${image}" --version
          done

      # The `rivet-cli` wheel the release publishes to PyPI is packed from this very tarball:
      # it must install with pip and run from the path `rivet_cli.path()` gives, in both Airflows.
      - name: The rivet-cli wheel installs and runs in the Airflow images
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            x86_64-*)  platform=manylinux_2_28_x86_64 ;;
            aarch64-*) platform=manylinux_2_28_aarch64 ;;
          esac
          python3 -m dev.pytools.pypi_wheels one --tarball dist/*.tar.gz --platform "${platform}" \
            --tag "${RELEASE_TAG}" --out wheels
          for image in apache/airflow:2.10.5 apache/airflow:3.3.2; do
            echo "== ${image}"
            docker run --rm -v "$PWD/wheels:/w:ro" --entrypoint bash "${image}" -c \
              'pip install -q --no-deps /w/*.whl && b="$(python -c "import rivet_cli; print(rivet_cli.path())")" && echo "$b" && "$b" --version && "$(dirname "$b")/rivet-mcp" --version'
          done
