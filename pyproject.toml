[project]
name = "rivet-harness"
version = "0.0.0"
description = "Release-gate harness and independent oracles for rivet (not published)"
requires-python = ">=3.12"
# Pinned, not floated: the oracle's job is to disagree with rivet when rivet is
# wrong, so the reader itself must not move under us between two runs of the
# same gate. `duckdb` carries the postgres/mysql/sqlite scanners and — with
# `INSTALL bigquery FROM community` / `INSTALL snowflake FROM community` — the warehouse readers (see
# dev/release_oracle/duck.py).
dependencies = [
    "duckdb==1.5.5",
    # The third independent Parquet reader (the Rust live tests' rivet-duckdb container installs from this lock).
    "pyarrow==18.1.0",
    # The Oracle source reader (thin mode, no client install). DuckDB has no Oracle
    # scanner, and this shares no code with rivet's Rust `oracledb` driver.
    "oracledb==26.0.1",
    "pymongo>=4,<5",
    "pytz==2025.2",
    "pyyaml>=6,<7",
    # The independent row-hash oracle. Absent, `row_hash` SKIPs rather than
    # comparing rivet against itself — 15 of 23 cells skipped it in the
    # 2026-09-20 gate. Exact-pinned like duckdb: a hash that moves between two
    # runs of the same gate is not an oracle.
    "xxhash==4.0.1",
    # The Snowflake ADBC driver the DuckDB `snowflake` community extension reads through
    # (dev/release_oracle/duck.py); rivet's loader shells out to `snow`, so the two share no code.
    "adbc-driver-snowflake==1.11.0",
]

[tool.uv]
package = false
