# cargo-mutants configuration (docs/mutation-plan.md).
#
# `exclude_re` entries are TRIAGED equivalent mutants — mutations that are
# semantically identical to the original code, so no test can (or should)
# distinguish them. Every entry carries its reason; adding one without a
# reason comment is a review defect. Accepted-but-real behaviours (operator
# UX, log lines) belong in docs/mutants-baseline.txt, not here.

# `src/fuzz.rs` holds the fuzz-only entry points (behind the `fuzzing` feature).
# They are exercised by cargo-fuzz (.github/workflows/fuzz.yml), NOT by the
# `cargo test` suite the mutation gate runs — so a body-stub mutant on them is
# uncatchable HERE by construction (the parsers they call ARE mutation-covered
# via their normal code paths).
# `src/bin/seed/*` is the DEV-ONLY test-fixture generator: `[[bin]] seed` is
# `required-features = ["dev-seed"]`, off by default, so `cargo install
# rivet-cli` never ships it. Mutating a fixture generator grades nothing a user
# can be hurt by, and it is not free — 581 of the corpus's 18,794 mutants (3%)
# lived there, 321 in `insert.rs` alone, at a measured ~90s each in CI.
#
# Named FILE BY FILE, not `src/bin/**`. That wildcard is what the first version
# of this exclusion used, and `no_wildcard_file_exclusion_and_no_narrowing_
# examine_keys` rejected it — correctly, twice over: a `**` silently drops
# FUTURE files as well, and `src/bin/` also holds `rivet-mcp.rs`, which IS a
# shipped binary (`[[bin]] rivet-mcp`, no feature gate). Naming files fails
# toward GRADING: a new binary is in the corpus until someone argues it out.
# `src/main.rs` stays in for the same reason — it is the shipped CLI's entry
# point (2026-08-17).
exclude_globs = [
    "src/fuzz.rs",
    # src/test_hook.rs is TEST INSTRUMENTATION: every primitive is env-gated
    # (RIVET_TEST_PANIC_AT / _ERROR_AT / _PAUSE_AT) and a no-op in production,
    # and the code that READS the env is exercised only by the LIVE
    # fault-injection suites — not by the `--lib --bins` run this gate does, so
    # every mutant here is born MISSED (maybe_pause_at scored 4/4 on PR #246).
    # Live oracle proven by hand before excluding: stubbing maybe_pause_at and
    # flipping its point comparison EACH fail run_reconcile_reports_mismatch_
    # when_source_grows_after_snapshot loudly at the marker wait (the second
    # after first catching a vacuous probe — the identical comparison exists in
    # maybe_panic_at, and a blind replace mutated the wrong fn and passed).
    # The panic/exit/error primitives are guarded the same way by the whole
    # crash-injection suite: a hook that stops firing leaves those tests unable
    # to construct their crash and they fail on "the run succeeded".
    "src/test_hook.rs",
    "src/bin/seed/main.rs",
    "src/bin/seed/args.rs",
    "src/bin/seed/insert.rs",
    "src/bin/seed/fast.rs",
    "src/bin/seed/copy_pg.rs",
    "src/bin/seed/mssql.rs",
]

