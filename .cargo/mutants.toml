# cargo-mutants configuration (docs/mutation-plan.md).
#
# `exclude_re` entries are TRIAGED equivalent mutants — mutations that are
# semantically identical to the original code, so no test can (or should)
# distinguish them. Every entry carries its reason; adding one without a
# reason comment is a review defect. Accepted-but-real behaviours (operator
# UX, log lines) belong in docs/mutants-baseline.txt, not here.

# `src/fuzz.rs` holds the fuzz-only entry points (behind the `fuzzing` feature).
# They are exercised by cargo-fuzz (.github/workflows/fuzz.yml), NOT by the
# `cargo test` suite the mutation gate runs — so a body-stub mutant on them is
# uncatchable HERE by construction (the parsers they call ARE mutation-covered
# via their normal code paths).
exclude_globs = ["src/fuzz.rs"]

exclude_re = [
    # 64*1024 is a streaming READ BUFFER size in compute_part_checksums —
    # any chunking yields byte-identical digests; 64+1024 only changes I/O
    # granularity. Verified by hand (matrix audit, 2026-07-13).
    "replace \\* with \\+ in compute_part_checksums",
    # `scale < 0` vs `scale <= 0` in the decimal str<->scaled converters:
    # at scale == 0 the negative-scale branch (factor = 10^0 = 1) computes
    # exactly what the scale_u == 0 fast path returns — branch parity makes
    # the boundary invisible by construction. The REAL neighbour bug at
    # `value < 0` (signed zero) is covered by scaled_zero_formats_unsigned.
    "replace < with <= in scaled_i128_to_decimal_str",
    "replace < with <= in decimal_str_to_scaled_i128",
    "replace < with <= in decimal_str_to_scaled_i256",
    # The optimistic base's `passed: true` in verify_at_destination is
    # overwritten by recompute_passed() on EVERY exit path (verified by
    # running the whole module against the deleted-field mutant) — the
    # initial value is unobservable.
    "delete field passed from struct ManifestVerification expression in verify_at_destination",
    # scalar_to_string takes a `tiberius::Row`, which cannot be constructed
    # outside the driver — its dispatch stubs are unkillable offline. The
    # value logic was extracted into `numeric_to_display` (unit-tested,
    # RED-proven); the dispatch itself is live-guarded (query_scalar feeds
    # min/max bounds exercised by the live planner suites).
    "replace scalar_to_string -> Option<String>",
    # density_probe (init/mysql.rs, init/postgres.rs) takes a live DB connection
    # (mysql::PooledConn / postgres::Client) to run MIN/MAX + the windowed COUNTs
    # — unkillable OFFLINE (the --in-diff gate has no DB). Its DECISION logic is
    # extracted into pure, unit-tested helpers (stratified_offsets,
    # estimate_from_windows, probe_trustworthy — all RED-proven), and the glue is
    # live-guarded: init_probe_overrules_a_stale_table_rows_on_a_versioned_table
    # (MySQL) + pg_density_probe_corrects_a_never_analyzed_table (PostgreSQL) fail
    # against a stubbed probe or an inverted trustworthy guard on the real stand.
    "replace density_probe with",
    "delete ! in density_probe",
    # refuse_compressed_binlog takes a live `mysql::Conn` to read
    # @@global.binlog_transaction_compression — there is no offline caller, so a
    # body stub is unkillable HERE by construction. The DECISION it makes was
    # split out into `compression_refusal` (both directions unit-tested and
    # RED-proven against `delete !`), and the read itself is live-guarded by
    # mysql_cdc_refuses_a_compressed_binlog_instead_of_capturing_nothing, which
    # flips the server global and asserts the run fails.
    # `hash_value`'s per-DataType arms are a typed FAST PATH, not a behaviour:
    # deleting one falls through to the `_` arm, which hashes the value's
    # rendered TEXT instead of its bytes. The digest is a `HashSet<u64>` key
    # inside one uniqueness check and is never persisted, compared across runs,
    # or shown — so a different-but-injective digest satisfies the same
    # contract. Demonstrated rather than argued: with the `Int64` arm deleted,
    # `uniqueness_fails` (an Int64 column carrying a duplicate) still reports
    # the duplicate, and all 25 quality unit tests plus 12 live uniqueness
    # tests stay green. What WOULD be a real bug — a present value that cannot
    # be hashed at all being silently skipped — is guarded by
    # `uniqueness_refuses_when_a_present_value_cannot_be_hashed`, which does
    # not depend on which arm renders it.
    "delete match arm .* in hash_value",
    "replace refuse_compressed_binlog -> Result<\\(\\)> with Ok\\(\\(\\)\\)",
    # `repack_from_history` converts each run's duration ms→s only to feed
    # `PackItem.predicted_secs`, whose SOLE consumer is `waves::pack`'s
    # duration-DESC sort. Scaling every duration by the same factor (`/`→`*`)
    # is order-preserving, so the packed schedule is byte-identical — the
    # mutant is equivalent by construction. The real neighbour bugs (the pack
    # RSS boundary and the annotate/export refuse-guard) are unit-tested and
    # RED-proven (rss_split_is_strict_*, refuse_annotate_scoped_to_export_*).
    "replace / with \\* in repack_from_history",
    # The DECISION whether an MSSQL TLS posture trusts an unverified cert lives
    # in `mssql_trusts_cert_without_verify`, unit-tested in both directions and
    # RED-proven (Require/VerifyFull/accept_invalid combos). The match GUARD at
    # its call site (`connect_with_tls`) takes a live `tiberius::Config` and only
    # matters against a real TLS handshake — there is no offline caller, so the
    # `guard -> true`/`-> false` mutant is unkillable HERE by construction. It is
    # live-guarded by the blessed-path `init --tls` + MSSQL connect scenarios.
    # run_pool (pipeline/run.rs) is the bounded work-stealing pool executor — it
    # needs a live source, real exports, and spawned worker threads; there is no
    # offline caller, so a body stub / operator-inversion is unkillable HERE by
    # construction (the same live-only class as density_probe). Its DECISIONS are
    # pure and unit-tested + RED-proven: next_eligible (heavy-serialization) and
    # advise_split (floor+shape gate). The executor glue — the HeavyGuard reset,
    # the giant-lookup for the advisory log line — is live-guarded by
    # live_pool_toxiproxy (exact rows + the makespan contract) and
    # pool_apply_two_heavy_exports_both_complete (the HeavyGuard reset between two
    # heavies; a stubbed drop / deleted `!` deadlocks the second heavy).
    "replace run_pool -> Result",
    "replace == with != in run_pool",
    "impl Drop for HeavyGuard",
    "delete ! in run_pool",
    # `check` (preflight/mod.rs) connects to the source and diagnoses every
    # export — no offline caller, so its body stub / the `==` in the overlay
    # export-match loop are unkillable HERE (live-only). It is live-guarded by
    # audit_preflight_table + the check scenarios (cli/blessed-flow). The overlay
    # DECISIONS are unit-tested in overlay_measured_rows.
    "replace check -> Result<bool> with Ok",
    "replace == with != in check",
    # overlay_measured_rows: `est != before && est.is_some()` guards a RECOMPUTE
    # that is IDEMPOTENT when the estimate is unchanged (recomputing verdict/
    # profile from the same number yields the same values). `est` is None only
    # when `before` is also None (choose_row_estimate returns the catalog when
    # there is no measure), so `est != before && est.is_some()` never differs
    # observably from the `||` form — the guard is a skip-redundant-work
    # optimization, and the mutant is equivalent by construction.
    "replace && with || in overlay_measured_rows",
    "replace match guard mssql_trusts_cert_without_verify\\(cfg\\) with (true|false) in MssqlSource::connect_with_tls",
]
