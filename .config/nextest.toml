# cargo-nextest configuration.
#
# Why nextest: it runs every `#[test]` in its OWN PROCESS, whereas cargo's
# built-in harness runs the tests of one binary as threads in one process. That
# per-test process isolation is what lets us consolidate many test files into a
# single binary (one link instead of N — see `tests/offline_suite.rs` / `tests/live_suite.rs`
# and the test-link consolidation) WITHOUT a crash / SIGKILL / global-state test
# poisoning its siblings. It restores the isolation the old
# one-binary-per-file layout provided, at one link instead of N.

[profile.default]
# Don't let a hung test block the whole run forever; terminate after two
# slow-timeout periods and report it as a failure.
slow-timeout = { period = "120s", terminate-after = 2 }
retries = 0

# The heavy live cells run FAR past the default 240s kill. Measured SOLO, on an
# idle 12-core stand, with no contention at all (plain `cargo test`, which has no
# timeout, is how they passed unnoticed for so long):
#   584s  same_named_configs_share_a_postgres_state_cdc_cycle
#   272s  a_cdc_baseline_over_a_wide_history_lands_in_the_base_in_batches
#   258s  a_wide_history_read_by_keyset_loads_daily_partitions_in_batches
#   230s  same_named_configs_share_a_postgres_state_batch_cycle
#   217s  base_and_buffer_cycle_run_load_compact_keeps_deletes_as_flags
# Three of the five are over the cap ALONE, so no amount of concurrency limiting
# saves them.
#
# The SOLO numbers above are a floor, not the operating point. Measured in the
# 2026-09-21 release gate, under the real load (four engines, cells racing on one
# state backend), the same two tests ran CONCURRENTLY and finished between 763s
# and 868s:
#   batch_cycle  230s solo -> ~3.3-3.8x    cdc_cycle  584s solo -> ~1.5x
# So contention is worth multiples, not the ~10% an earlier note here claimed —
# and it is NOT uniform across tests, which is why one test's factor must never
# be extrapolated onto another (doing exactly that mid-run predicted a kill that
# did not happen). The 300s x 4 = 1200s ceiling held with >=330s to spare;
# 300s still WARNS early, and 4 periods kills a true hang at 20 minutes.
[[profile.default.overrides]]
filter = 'test(/same_named_configs_share_a_postgres_state_cdc_cycle$/) or test(/same_named_configs_share_a_postgres_state_batch_cycle$/) or test(/a_cdc_baseline_over_a_wide_history_lands_in_the_base_in_batches$/) or test(/a_wide_history_read_by_keyset_loads_daily_partitions_in_batches$/) or test(/base_and_buffer_cycle_run_load_compact_keeps_deletes_as_flags$/) or test(/^live_cdc_full_cycle::/) or test(/bigquery_hourly_partitions_over_the_job_cap_load_in_budgeted_batches$/) or test(/^live_cdc_multi_table_cycle::/) or test(/^live_pool_ledger::/) or test(/^live_cdc_backfill::repeated_runs_of_one_config_append_only_the_delta_to_the_changelog$/) or test(/^live_load_spec::bigquery_changelog_follows_a_written_cluster_by_and_repartitions_only_on_rebuild$/) or test(/^live_load_spec::bigquery_range_and_load_time_partitions_land_as_declared$/) or test(/^live_cdc_compact::a_key_move_leaves_one_live_row_per_key_in_a_partitioned_base_/) or test(/^live_cdc_compact::an_update_of_a_replica_identity_index_reaches_the_base_as_one_update_postgres$/)'
slow-timeout = { period = "300s", terminate-after = 4 }
# The full CDC cycles measured 153-184 s on their own and grade BigQuery after every
# load and compact (about 8.6 s per read, 2026-10-01); the hourly-partition cell ran past
# 240 s even with the warehouse leg off. Both run with BIGQUERY_TEST_PROJECT set. The
# multi-table cycles and the pooled loads grade every loaded export (13-17 s per BigQuery
# read under the full suite, 2026-10-01): nine and sixteen reads pass 240 s.
# The three BigQuery cells added 2026-10-02 passed 240 s only by the oracle's BigQuery reads
# (14-36 s each; the range/load-time cell alone grades four tables).
# The three BigQuery key-move cells added 2026-10-03 (ADR-0030) took 206-237 s solo (two loads, a
# compact and the oracle's BigQuery grades) and were killed at 240 s in a seeded-recall control run.

# The SQL Server CDC cells queue on one cross-process lock (`cross_process_serial("mssql_cdc")`),
# so a cell's clock includes its wait. The rig oracle images the source before every CDC run
# (about a second each), and the queue reached 224-237 s for cells that passed and 240 s for two
# that were killed while still waiting (2026-10-01 full suites).
[[profile.default.overrides]]
filter = 'test(/^live_cdc_mssql::/) or test(/^live_cdc_harm::a_mssql/)'
slow-timeout = { period = "120s", terminate-after = 4 }

# Oracle Free caps the server at two CPUs, so the Oracle cells share it four at a time;
# the whole-schema export reads ~2M rows and gets the long ceiling. Its oracle read of
# CONTENT_ITEMS (150k rows through python-oracledb) took 130 s and 437 s in two full
# suites (2026-10-01), so the pair gets 300 s x 4.
[test-groups]
oracle = { max-threads = 4 }
# The tests that take `toxiproxy_guard()` (one cross-process flock): queued in nextest, not on the
# flock, so the wait is not counted against a test's timeout. `live_pool_ledger` holds it 185-408 s,
# and three users were killed at 240 s while still waiting (2026-10-02 gate). The list is checked
# against the tests that call the guard by tests/offline/nextest_groups_guard.rs.
toxiproxy = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'test(/^live_oracle::every_seeded_oracle_table_exports_every_row$/) or test(/^live_oracle::wide_clob_rows_stay_within_the_memory_budget$/)'
test-group = 'oracle'
slow-timeout = { period = "300s", terminate-after = 4 }

[[profile.default.overrides]]
filter = 'test(/^live_oracle::/)'
test-group = 'oracle'

[[profile.default.overrides]]
filter = 'test(=gremlin_cdc::gremlin_cdc_binlog_cut_mid_drain_fails_loud_then_recovers) or test(=gremlin_cdc::gremlin_cdc_gcs_upload_cut_fails_loud_then_recovers_without_clobber) or test(=live_chaos::high_latency_does_not_cause_false_positive_transient_classification) or test(=live_chaos::chunked_export_completes_through_temporary_proxy_disable) or test(=live_mongo_retry_and_faults::mongo_export_survives_transient_latency_added_via_toxiproxy) or test(=live_mongo_retry_and_faults::mongo_export_recovers_after_mid_stream_proxy_disable_then_enable_with_retries) or test(=live_mongo_retry_and_faults::mongo_export_fails_cleanly_when_proxy_is_disabled_before_run) or test(=live_mysql_retry_and_faults::mysql_clean_via_toxi_works_as_a_baseline_and_exports_successfully) or test(=live_mysql_retry_and_faults::mysql_export_survives_transient_latency_added_via_toxiproxy) or test(=live_mysql_retry_and_faults::mysql_export_fails_cleanly_when_toxiproxy_is_disabled_before_run) or test(=live_mysql_retry_and_faults::mysql_export_recovers_after_mid_stream_proxy_disable_then_enable_with_retries) or test(=live_pool_ledger::a_pooled_load_through_a_throttled_ledger_loses_no_table) or test(=live_pool_ledger::a_ledger_cut_mid_load_fails_loudly_and_the_next_run_finishes_the_job) or test(=live_pool_toxiproxy::pool_apply_through_a_bandwidth_capped_link_is_exact_and_grades_itself) or test(=live_pool_toxiproxy::pool_apply_resume_skips_complete_exports_and_loses_nothing) or test(=live_pool_toxiproxy::pool_apply_two_heavy_exports_both_complete) or test(=live_retry_and_faults::clean_postgres_via_toxi_works_as_a_baseline_and_exports_successfully) or test(=live_retry_and_faults::export_survives_transient_latency_added_via_toxiproxy) or test(=live_retry_and_faults::export_fails_cleanly_when_toxiproxy_is_disabled_before_run) or test(=live_retry_and_faults::export_recovers_after_mid_stream_proxy_disable_then_enable_with_retries) or test(=live_state_backend::a_state_ledger_lost_mid_run_fails_loudly_and_the_next_run_delivers_every_row_once)'
test-group = 'toxiproxy'

[profile.ci]
# CI tolerates a single flaky retry and reports every failure (no early bail),
# so one flake doesn't mask the rest of the matrix.
retries = 1
fail-fast = false

# The MSSQL spill soak runs in ~15 s alone but queues behind every other SQL Server CDC test
# in a full live_suite run, where it passed 240 s (2026-09-27 gate, live_modules). The same
# long ceiling as the other contended cycles above.
[[profile.default.overrides]]
filter = 'test(/^soak_spill::/)'
slow-timeout = { period = "300s", terminate-after = 4 }
