flags_the_old_key_deleted_in_clickhouse) or test(=live_partition_footer::mssql_cdc_flush_past_the_partition_budget_is_cut_and_every_part_notes_its_partitions) or test(=live_shared_state_same_name::same_named_configs_share_a_postgres_state_cdc_cycle) or test(=live_shared_state_same_name::same_named_configs_share_a_postgres_state_batch_cycle) or test(=soak_spill::soak_spill_mssql)'
test-group = 'mssql_cdc'

[[profile.default.overrides]]
filter = 'test(=live_cdc_oracledb::oracle_cdc_an_int_override_on_a_fractional_number_fails_by_column_not_null) or test(=live_cdc_oracledb::oracle_cdc_a_date_override_refuses_a_time_of_day_not_drops_it) or test(=live_cdc_oracledb::oracle_cdc_resume_captures_only_new_changes) or test(=live_cdc_oracledb::oracle_cdc_idle_first_run_then_change_is_captured) or test(=live_cdc_oracledb::oracle_cdc_transaction_open_across_a_run_keeps_its_early_rows) or test(=live_cdc_oracledb::oracle_cdc_intra_transaction_updates_get_distinct_seq) or test(=live_cdc_oracledb::oracle_cdc_a_primary_key_update_is_a_delete_then_an_insert) or test(=live_cdc_oracledb::oracle_cdc_a_renumber_over_rows_with_equal_images_keeps_every_row) or test(=live_cdc_oracledb::oracle_cdc_a_key_move_of_a_row_wider_than_255_columns_is_captured_not_refused) or test(=live_cdc_oracledb::oracle_cdc_sum_reconciles_across_intra_txn_updates) or test(=live_cdc_oracledb::oracle_cdc_crash_after_flush_before_ack) or test(=live_cdc_oracledb::roast_oracle_cdc_large_transaction_is_atomic_across_a_mid_flush_crash) or test(=live_cdc_oracledb::oracle_cdc_anchor_under_concurrent_commits_never_records_low_water_zero) or test(=live_cdc_oracledb::oracle_cdc_a_0_30_low_water_zero_checkpoint_is_refused_precisely_not_as_lost) or test(=live_cdc_oracledb::oracle_cdc_update_and_delete_carry_full_types) or test(=live_cdc_oracledb::oracle_cdc_non_utc_session_matches_batch) or test(=live_cdc_oracledb::oracle_cdc_initial_snapshot_covers_preexisting_rows) or test(=live_cdc_oracledb::oracle_cdc_mixed_transaction_ending_on_uncaptured_table) or test(=live_cdc_oracledb::oracle_cdc_refuses_a_truncate_of_a_captured_table_on_every_rerun) or test(=live_cdc_oracledb::oracle_cdc_truncate_refusal_remedy_leaves_no_removed_row_live_in_the_prefix) or test(=live_cdc_oracledb::oracle_cdc_truncate_refusal_delivers_the_rows_before_it_once) or test(=live_cdc_oracledb::oracle_cdc_a_truncate_of_an_uncaptured_table_does_not_refuse) or test(=live_cdc_oracledb::oracle_cdc_schema_qualified_table_config_captures_events) or test(=live_cdc_oracledb::oracle_cdc_corrupt_checkpoint_fails_loud_not_silently_absent) or test(=live_cdc_oracledb::oracle_cdc_resume_past_log_retention_fails_loudly) or test(=live_cdc_oracledb::oracle_cdc_checkpoint_from_another_database_is_refused) or test(=live_cdc_oracledb::oracle_cdc_table_without_all_column_logging_is_refused) or test(=live_cdc_oracledb::oracle_cdc_initial_snapshot_is_refused_before_any_write) or test(=live_cdc_oracledb::oracle_cdc_a_lob_column_is_refused_by_name) or test(=live_cdc_oracledb::oracle_cdc_cli_resolves_the_source_from_env_and_file_alike) or test(=live_cdc_oracledb::oracle_cdc_cli_writes_csv_parts_and_stops_at_the_cap_on_a_commit) or test(=live_cdc_oracledb::oracle_cdc_refuses_a_table_it_cannot_resolve_before_the_first_ack) or test(=live_cdc_oracledb::oracle_cdc_byte_cap_counts_the_first_row_and_defers_not_drops) or test(=live_cdc_oracledb::oracle_cdc_a_redo_log_switch_during_mining_is_re_mined_not_failed) or test(=live_cdc_type_parity::oracle_batch_and_cdc_deliver_every_ledger_row_alike) or test(=live_init_delta::a_generated_oracle_cdc_config_has_no_load_block_and_runs_to_parquet) or test(=live_type_policy::oracle_cdc_timestamp9_warns_by_default_and_strict_refuses_before_any_part_or_checkpoint)'
