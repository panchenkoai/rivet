# The PR lane (ci.yml `e2e` legs): the same suite on a DEBUG build, one partition per runner. Every
# test gets the longest ceiling the default profile gives any test, so no ceiling tuned on the
# nightly's release build can kill a test here; the test-groups above still apply.
[profile.pr]
retries = 0
fail-fast = false

[[profile.pr.overrides]]
filter = 'all()'
slow-timeout = { period = "300s", terminate-after = 4 }
